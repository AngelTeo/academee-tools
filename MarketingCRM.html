<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing CRM System v30</title>
<style>
:root{--acc:#185FA5;--acc2:#0f4a8c;--grn:#0F6E56;--grn2:#085041;--red:#A32D2D;--amb:#854F0B;--pur:#5a3e99;--sur:#fff;--sur2:#f5f4f0;--sur3:#eceae4;--bdr:#e0ddd6;--txt:#1a1a1a;--mut:#888;--hint:#bbb;--r:10px;--rs:7px;--sh:0 1px 4px rgba(0,0,0,.07);--shm:0 8px 32px rgba(0,0,0,.18);}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif;}
body{background:var(--sur2);color:var(--txt);font-size:12px;min-height:100vh;}
.nav{background:#1a2332;border-bottom:none;padding:0 16px;display:flex;align-items:center;gap:0;overflow-x:auto;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.nav-brand{font-size:13px;font-weight:800;color:#fff;padding:12px 12px 12px 0;margin-right:8px;white-space:nowrap;border-right:1px solid rgba(255,255,255,.15);flex-shrink:0;letter-spacing:.03em;}
.ntab{border:none;background:none;padding:10px 12px;font-size:11px;cursor:pointer;color:rgba(255,255,255,.65);border-bottom:none;font-family:inherit;white-space:nowrap;flex-shrink:0;border-radius:6px;margin:4px 2px;transition:.15s;font-weight:500;}
.ntab:hover{background:rgba(255,255,255,.12);color:#fff;}
.ntab.on{background:rgba(255,255,255,.18);color:#fff;font-weight:700;}
.page{display:none;padding:14px;max-width:1100px;margin:0 auto;}
.page.on{display:block;}
.card{background:var(--sur);border:.5px solid var(--bdr);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--sh);}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.card-title{font-size:13px;font-weight:600;}
.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px;}
.stat-card{background:var(--sur);border:.5px solid var(--bdr);border-radius:var(--r);padding:12px;text-align:center;box-shadow:var(--sh);}
.stat-num{font-size:24px;font-weight:700;line-height:1.1;}
.stat-lbl{font-size:9px;color:var(--mut);margin-top:2px;}
.btn{border:.5px solid var(--bdr);background:var(--sur);border-radius:var(--rs);padding:5px 10px;font-size:11px;cursor:pointer;color:var(--txt);font-family:inherit;transition:.12s;}
.btn:hover{background:var(--sur2);}
.btn-pri{background:var(--acc);color:#fff;border-color:var(--acc);}
.btn-pri:hover{background:var(--acc2);}
.btn-grn{background:var(--grn);color:#fff;border-color:var(--grn);}
.btn-red{background:var(--red);color:#fff;border-color:var(--red);}
.btn-amb{background:var(--amb);color:#fff;border-color:var(--amb);}
.badge{border-radius:8px;padding:2px 7px;font-size:9px;font-weight:600;white-space:nowrap;display:inline-block;}
.b-red{background:#FCEBEB;color:var(--red);border:.5px solid #F09595;}
.b-amb{background:#FFF8E1;color:var(--amb);border:.5px solid #F9CB42;}
.b-grn{background:#E1F5EE;color:var(--grn);border:.5px solid #9FE1CB;}
.b-blue{background:#EEF2F7;color:var(--acc);border:.5px solid #AABDD4;}
.b-grey{background:#f0f0f0;color:#666;border:.5px solid #ccc;}
.b-pur{background:#f0eaff;color:var(--pur);border:.5px solid #c4a8f0;}
.stage-pill{border-radius:20px;padding:3px 9px;font-size:10px;font-weight:700;white-space:nowrap;display:inline-block;}
.s-enquiry{background:#f0f0f0;color:#555;}
.s-wa_sent{background:#e3f2fd;color:#1565c0;}
.s-no_reply{background:#e8eaf6;color:#3949ab;}
.s-called{background:#fff3e0;color:#e65100;}
.s-trial{background:#f3e5f5;color:#6a1b9a;}
.s-enrolled{background:#E1F5EE;color:var(--grn);}
.s-lost{background:#fcebeb;color:var(--red);}
.prog{border-radius:4px;padding:1px 6px;font-size:9px;font-weight:700;}
.prog-srk{background:#e8f4fd;color:#1565c0;}
.prog-srt{background:#f3e5f5;color:#6a1b9a;}
.prog-gak{background:#e8f5e9;color:#1b5e20;}
.prog-atc{background:#fff3e0;color:#e65100;}
.prog-na{background:#f5f5f5;color:#999;}
/* Search hero */
.search-hero{background:linear-gradient(135deg,var(--acc),var(--acc2));border-radius:var(--r);padding:18px;margin-bottom:12px;color:#fff;}
.search-hero h2{font-size:14px;font-weight:700;margin-bottom:2px;}
.search-hero p{font-size:10px;opacity:.8;margin-bottom:12px;}
.search-hero-row{display:flex;gap:8px;}
.search-hero input{flex:1;border:none;border-radius:var(--rs);padding:10px 13px;font-size:13px;font-family:inherit;color:var(--txt);outline:none;}
.search-hero button{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:var(--rs);padding:9px 16px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;}
.search-results-drop{background:var(--sur);border:.5px solid var(--bdr);border-radius:var(--rs);margin-top:4px;max-height:280px;overflow-y:auto;display:none;box-shadow:var(--shm);}
.sri{padding:11px 13px;border-bottom:.5px solid var(--bdr);cursor:pointer;display:flex;align-items:center;gap:9px;}
.sri:hover{background:var(--sur2);}
.sri:last-child{border-bottom:none;}
.sri-av{width:34px;height:34px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.sri-body{flex:1;min-width:0;}
.sri-name{font-size:11px;font-weight:600;}
.sri-detail{font-size:10px;color:var(--mut);margin-top:1px;}
.no-result{padding:18px;text-align:center;color:var(--hint);font-size:11px;}
/* Alert cards */
.alert-card{border-radius:8px;padding:10px 13px;margin-bottom:8px;display:flex;align-items:flex-start;gap:9px;}
.alert-red{background:#FCEBEB;border:.5px solid #F09595;}
.alert-amb{background:#FFF8E1;border:.5px solid #F9CB42;}
.alert-grn{background:#E1F5EE;border:.5px solid #9FE1CB;}
.alert-blue{background:#EEF2F7;border:.5px solid #AABDD4;}
.alert-pur{background:#f0eaff;border:.5px solid #c4a8f0;}
.alert-icon{font-size:15px;flex-shrink:0;margin-top:1px;}
.alert-body{flex:1;}
.alert-title{font-size:11px;font-weight:600;margin-bottom:2px;}
.alert-sub{font-size:10px;color:var(--mut);}
/* Lead card */
.lead-card{background:var(--sur);border:.5px solid var(--bdr);border-radius:var(--r);padding:13px;margin-bottom:8px;cursor:pointer;transition:.12s;box-shadow:var(--sh);}
.lead-card:hover{border-color:var(--acc);}
.lead-card.flagged{border-left:3px solid var(--red);}
.lead-card.crosssell{border-left:3px solid #25d366;}
.lead-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.lead-name{font-size:12px;font-weight:600;margin-bottom:2px;}
.lead-phone{font-size:13px;font-weight:700;color:var(--acc);font-family:monospace;}
.lead-meta{font-size:10px;color:var(--mut);margin-top:2px;}
.lead-remark{font-size:10px;color:var(--mut);margin-top:6px;padding-top:6px;border-top:.5px solid var(--bdr);}
.days-ago{font-size:9px;color:var(--hint);}
.ph{color:var(--acc);font-weight:700;font-family:monospace;}
/* Profile modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px 0;}
.profile-sheet{background:var(--sur);border-radius:16px;width:100%;max-width:700px;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shm);}
.profile-hdr{padding:14px 18px;border-bottom:.5px solid var(--bdr);flex-shrink:0;}
.profile-hdr-top{display:flex;align-items:flex-start;gap:11px;}
.profile-avatar{width:46px;height:46px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;flex-shrink:0;}
.profile-info{flex:1;}
.profile-name{font-size:15px;font-weight:700;}
.profile-phone{font-size:14px;color:var(--acc);font-weight:700;font-family:monospace;margin-top:2px;}
.profile-close{background:none;border:none;font-size:22px;color:var(--mut);cursor:pointer;padding:0 0 4px 8px;line-height:1;}
.profile-body{flex:1;overflow-y:auto;padding:14px 18px;}
.profile-ftr{padding:10px 18px;border-top:.5px solid var(--bdr);flex-shrink:0;display:flex;gap:6px;flex-wrap:wrap;}
/* Profile tabs */
.ptabs{display:flex;gap:0;margin-bottom:12px;border-bottom:.5px solid var(--bdr);}
.ptab{border:none;background:none;padding:7px 12px;font-size:11px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;font-family:inherit;}
.ptab.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600;}
/* Stage progress */
.stage-progress{display:flex;align-items:center;gap:0;margin-top:10px;overflow-x:auto;}
.stage-step{display:flex;flex-direction:column;align-items:center;flex:1;min-width:50px;position:relative;}
.stage-step::after{content:'';position:absolute;top:13px;left:50%;width:100%;height:2px;background:var(--bdr);z-index:0;}
.stage-step:last-child::after{display:none;}
.stage-dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--bdr);background:var(--sur);display:flex;align-items:center;justify-content:center;font-size:11px;z-index:1;position:relative;cursor:pointer;transition:.12s;}
.stage-dot:hover{border-color:var(--acc);}
.stage-dot.done{background:var(--grn);border-color:var(--grn);color:#fff;}
.stage-dot.current{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 0 0 3px rgba(24,95,165,.2);}
.stage-dot.lost{background:var(--red);border-color:var(--red);color:#fff;}
.stage-lbl{font-size:8px;color:var(--mut);margin-top:3px;text-align:center;white-space:nowrap;}
.stage-lbl.current{color:var(--acc);font-weight:700;}
/* Info grid */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px;}
.info-item label{font-size:9px;color:var(--mut);display:block;margin-bottom:2px;text-transform:uppercase;}
.info-item .info-val{font-size:12px;font-weight:500;}
/* Timeline */
.timeline{padding-left:14px;position:relative;}
.timeline::before{content:'';position:absolute;left:4px;top:4px;bottom:4px;width:2px;background:var(--bdr);}
.tl-item{position:relative;margin-bottom:12px;}
.tl-item::before{content:'';position:absolute;left:-13px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--sur);border:2px solid var(--bdr);z-index:1;}
.tl-item.tl-wa::before{border-color:#25d366;}
.tl-item.tl-call::before{border-color:var(--acc);}
.tl-item.tl-visit::before{border-color:var(--amb);}
.tl-item.tl-note::before{border-color:var(--hint);}
.tl-item.tl-stage::before{background:var(--pur);border-color:var(--pur);}
.tl-date{font-size:9px;color:var(--hint);}
.tl-type{font-size:9px;font-weight:700;margin-bottom:2px;}
.tl-wa .tl-type{color:#25d366;}
.tl-call .tl-type{color:var(--acc);}
.tl-visit .tl-type{color:var(--amb);}
.tl-stage .tl-type{color:var(--pur);}
.tl-note .tl-type{color:var(--mut);}
.tl-notes{font-size:11px;color:var(--txt);line-height:1.5;}
.tl-outcome{font-size:10px;color:var(--mut);font-style:italic;margin-top:2px;}
/* Add log form */
.add-log-form{background:var(--sur2);border:.5px solid var(--bdr);border-radius:var(--rs);padding:12px;margin-bottom:12px;}
.log-type-row{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap;}
.log-type-btn{border:.5px solid var(--bdr);background:var(--sur);border-radius:20px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit;color:var(--mut);}
.log-type-btn.on{background:var(--acc);color:#fff;border-color:var(--acc);}
/* Inputs */
input[type=text],input[type=date],select,textarea{border:.5px solid var(--bdr);border-radius:var(--rs);padding:7px 9px;font-size:11px;font-family:inherit;background:var(--sur);color:var(--txt);width:100%;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);}
textarea{resize:vertical;min-height:65px;}
.form-row{margin-bottom:9px;}
.form-row label{font-size:10px;color:var(--mut);display:block;margin-bottom:3px;font-weight:600;}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
/* Search bar */
.search-bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center;}
.search-bar input{flex:1;min-width:150px;}
/* Table */
.tbl-wrap{overflow-x:auto;border-radius:var(--r);border:.5px solid var(--bdr);}
table{width:100%;border-collapse:collapse;font-size:11px;}
th{padding:7px 10px;text-align:left;border-bottom:.5px solid var(--bdr);font-weight:600;background:var(--sur2);font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
td{padding:8px 10px;border-bottom:.5px solid var(--bdr);vertical-align:top;}
tr:hover td{background:#fafaf8;}
tr:last-child td{border-bottom:none;}
/* WA box */
.wa-box{background:#e8f5e9;border:.5px solid #a5d6a7;border-radius:var(--rs);padding:11px;font-size:11px;line-height:1.6;cursor:pointer;white-space:pre-wrap;font-family:inherit;}
.wa-box:hover{background:#d7eed9;}
.wa-hint{font-size:9px;color:var(--grn);margin-top:3px;}
/* Cross-sell card */
.cross-card{background:var(--sur);border:.5px solid var(--bdr);border-radius:var(--r);padding:12px;margin-bottom:8px;border-left:3px solid #25d366;box-shadow:var(--sh);}
.reason-box{background:#fffef0;border:.5px solid #e8d87a;border-radius:5px;padding:7px 10px;font-size:10px;color:#5a4a00;margin-top:6px;}
/* Promo badge */
.promo-badge{background:#f0eaff;color:var(--pur);border:.5px solid #c4a8f0;border-radius:8px;padding:2px 7px;font-size:9px;font-weight:600;white-space:nowrap;}
/* Settings */
.settings-section{margin-bottom:18px;}
.settings-section h3{font-size:12px;font-weight:700;margin-bottom:10px;padding-bottom:6px;border-bottom:.5px solid var(--bdr);}
.promo-item{background:var(--sur2);border:.5px solid var(--bdr);border-radius:var(--rs);padding:10px 12px;margin-bottom:7px;display:flex;align-items:center;gap:10px;}
.promo-item-body{flex:1;}
.promo-name{font-size:12px;font-weight:600;}
.promo-desc{font-size:10px;color:var(--mut);}
.tag{display:inline-block;background:var(--sur2);border:.5px solid var(--bdr);border-radius:4px;padding:1px 6px;font-size:9px;color:var(--mut);margin:1px;}
.section-hdr{font-size:11px;font-weight:700;margin:12px 0 7px;display:flex;align-items:center;gap:7px;}
.section-hdr span{font-size:10px;font-weight:400;color:var(--mut);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.empty{text-align:center;padding:28px;color:var(--hint);}
.empty div{font-size:26px;margin-bottom:6px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:7px 16px;border-radius:20px;font-size:11px;z-index:9999;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
.pipeline-bar{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto;}
.pipe-stage{flex:1;min-width:80px;background:var(--sur);border:.5px solid var(--bdr);border-radius:var(--rs);padding:9px 7px;text-align:center;cursor:pointer;}
.pipe-stage:hover{border-color:var(--acc);}
.pipe-stage-lbl{font-size:8px;color:var(--mut);margin-top:2px;}
/* ── Number font — consistent across all stat numbers ── */
.num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum';}

/* ── CONTACTS TABLE ── */
.cl-table{width:100%;border-collapse:collapse;}
.cl-thead{background:var(--sur2);border-bottom:2px solid var(--bdr);position:sticky;top:0;z-index:2;}
.cl-thead th{padding:7px 10px;font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;text-align:left;white-space:nowrap;}
.cl-row{border-bottom:.5px solid var(--bdr);cursor:pointer;transition:.1s;}
.cl-row:hover{background:var(--sur2);}
.cl-row td{padding:9px 10px;vertical-align:middle;}
.cl-phone{font-size:13px;font-weight:700;color:var(--acc);font-family:monospace;white-space:nowrap;}
.cl-name{font-size:12px;font-weight:600;color:var(--txt);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cl-name.empty{color:var(--hint);font-style:italic;font-weight:400;}
.cl-snippet{font-size:10px;color:var(--mut);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cl-fu{font-size:10px;color:var(--amb);white-space:nowrap;}
.cl-time{font-size:10px;color:var(--hint);white-space:nowrap;text-align:right;}
.cl-border-l{border-left:3px solid var(--bdr);}
.cal-nav{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.cal-week-hdr{display:grid;gap:4px;margin-bottom:8px;}
.cal-day-col{background:var(--sur);border:.5px solid var(--bdr);border-radius:var(--r);min-height:80px;overflow:hidden;}
.cal-day-col:hover{border-color:var(--acc)!important;}
.cal-day-col.cal-selected{border-color:var(--acc)!important;background:#f5f0ff!important;}
.cal-day-col.cal-today{border-color:var(--acc)!important;background:#eef2f7!important;}
.cal-day-col.cal-other{opacity:.5;}
.cal-day-hdr{padding:7px 10px;border-bottom:.5px solid var(--bdr);display:flex;align-items:baseline;gap:6px;background:var(--sur2);}
.cal-day-num{font-size:15px;font-weight:700;line-height:1;}
.cal-day-label{font-size:9px;color:var(--mut);text-transform:uppercase;}
.cal-day-col.today .cal-day-hdr{background:#eef2f7;}
.cal-day-col.today .cal-day-num{color:var(--acc);}
.cal-event{padding:6px 9px;margin:5px 6px;border-radius:6px;cursor:pointer;transition:.1s;border:.5px solid transparent;}
.cal-event:hover{filter:brightness(.96);}
.cal-event.visit{background:#EEF2F7;border-color:#AABDD4;}
.cal-event.trial{background:#f3e5f5;border-color:#ce93d8;}
.cal-event.attended{background:#E1F5EE;border-color:#9FE1CB;}
.cal-event.no_show{background:#fcebeb;border-color:#F09595;opacity:.7;}
.cal-event.cancelled{background:#f5f5f5;border-color:#ddd;opacity:.6;text-decoration:line-through;}
.cal-event-time{font-size:9px;font-weight:700;color:var(--mut);margin-bottom:1px;}
.cal-event-title{font-size:10px;font-weight:600;line-height:1.3;}
.cal-event-sub{font-size:9px;color:var(--mut);margin-top:1px;}
.cal-add-btn{margin:6px;padding:5px 8px;background:none;border:.5px dashed var(--bdr);border-radius:6px;cursor:pointer;font-size:10px;color:var(--hint);width:calc(100% - 12px);text-align:left;font-family:inherit;}
.cal-add-btn:hover{border-color:var(--acc);color:var(--acc);background:var(--sur2);}
.cal-tabs{display:flex;gap:0;border-bottom:.5px solid var(--bdr);margin-bottom:12px;}
.cal-tab{border:none;background:none;padding:8px 16px;font-size:12px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;font-family:inherit;font-weight:500;}
.cal-tab.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:700;}
.status-dot-sched{color:var(--acc);}
.status-dot-attend{color:var(--grn);}
.status-dot-noshow{color:var(--red);}

/* v12 · 今日 + 家长卡 */
.tq-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.tq-date{font-size:12px;color:var(--mut)}
.tq-title{font-size:24px;font-weight:800;color:var(--txt)}
.tq-sub{font-size:12px;color:var(--grn);font-weight:600}
.tq-search{flex:1;min-width:220px;position:relative}
.tq-search input{width:100%;padding:10px 14px;border:1px solid var(--bdr);border-radius:20px;font-size:13px;font-family:inherit;box-sizing:border-box}
.tq-bar{height:6px;background:var(--sur3);border-radius:3px;overflow:hidden;margin-bottom:12px}.tq-bar i{display:block;height:100%;background:var(--grn)}
.tq-tabs{display:flex;gap:6px;margin-bottom:8px}.tq-tabs button{flex:0 0 auto;border:1px solid var(--bdr);background:#fff;border-radius:20px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.tq-tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}.tq-tabs b{margin-left:4px}
.tq-note{font-size:12px;color:var(--mut);margin:4px 2px 8px}
.tq-grp{font-size:12px;font-weight:700;color:var(--mut);margin:16px 2px 6px}.tq-grp span{background:var(--sur3);border-radius:10px;padding:1px 8px;margin-left:4px}

const STAGES=[

  // Attitude

];

function tagPills(l,max=3){
  const tags=l.tags||[];
  if(!tags.length)return'';
  const show=max?tags.slice(0,max):tags;
  const rest=max&&tags.length>max?tags.length-max:0;
  return show.map(tid=>{
    const t=LEAD_TAGS.find(x=>x.id===tid);
    if(!t)return'';
    return `<span style="background:${t.bg};color:${t.col};border:.5px solid ${t.bdr};border-radius:20px;padding:2px 7px;font-size:9px;font-weight:600;white-space:nowrap">${t.icon} ${t.label}</span>`;
  }).join('')+(rest?`<span style="font-size:9px;color:var(--mut)">+${rest}</span>`:'');
}

const LOG_TYPES=[
  {id:'wa',label:'💬 WhatsApp',cls:'tl-wa'},
  {id:'call',label:'📞 Call',cls:'tl-call'},
  {id:'visit',label:'🚶 Visit',cls:'tl-visit'},

];

const SEED=[];
const SEED_REST={};

const KEY='mktcrm_v3';
const S={leads:[],promos:[],courses:{},events:[],settings:{
  reEngageDays:14,
  stageFollowUp:{
    enquiry:3,
    wa_sent:3,
    no_reply:14,
    called:14,
    trial:7,
  }
}};

function save(){localStorage.setItem(KEY,JSON.stringify(S));}
function exportData(){
  const data=JSON.stringify(S, null, 2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const dateStr=new Date().toISOString().slice(0,10);
  a.href=url; a.download=`CRM_backup_${dateStr}.json`;
  a.click(); URL.revokeObjectURL(url);
  toast('✅ Exported successfully');
}

function importData(){
  const input=document.createElement('input');
  input.type='file'; input.accept='.json';
  input.onchange=e=>{
    const file=e.target.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const imported=JSON.parse(ev.target.result);
        if(!imported.leads||!Array.isArray(imported.leads)){
          alert('Invalid file — no leads data found.');return;
        }
        if(!confirm(`Import ${imported.leads.length} contacts?\n\nThis will REPLACE all current data. Make sure you have exported a backup first.`))return;
        Object.assign(S, imported);
        S.leads = imported.leads;
        S.promos = imported.promos || [];
        S.courses = imported.courses || {};
        S.events = imported.events || [];
        S.settings = imported.settings || {};
        save();
        toast(`✅ Imported ${imported.leads.length} contacts`);
        renderDash();
      }catch(err){
        alert('Failed to read file: '+err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function load(){
  try{
    const p=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(p.leads&&p.leads.length){S.leads=p.leads;}else{S.leads=SEED.map(l=>({...l,logs:[...(l.logs||[])]}));}
    if(p.promos)S.promos=p.promos;
    if(p.courses)S.courses=p.courses;
    if(p.events)S.events=p.events;
    if(p.settings){
      S.settings=Object.assign(S.settings,p.settings);
      if(p.settings.stageFollowUp) S.settings.stageFollowUp=Object.assign(S.settings.stageFollowUp,p.settings.stageFollowUp);
    }
    // Auto-tag no_reply from seed data where result was 'no reply'
    S.leads.forEach(l=>{
      if(!['enquiry','wa_sent','no_reply','called','trial','enrolled','lost'].includes(l.stage)){
        l.stage='enquiry';
      }
    });
    return;
  }catch(e){}
  S.leads=SEED.map(l=>({...l,logs:[...(l.logs||[])]}));
  S.promos=[
    {id:'p1',name:'Free Trial',desc:'Free trial class',active:true},
    {id:'p2',name:'Early Bird 2026',desc:'Early registration discount',active:true},

}

// Add days to a date string
function addDays(ds,n){
  const d=new Date((ds||today())+'T12:00:00');
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}

function toast(msg,dur=2200){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),dur);
}
function today(){return new Date().toISOString().slice(0,10);}
function fmtDate(ds){
  if(!ds||ds==='NaT')return'—';
  try{const d=new Date(ds+'T12:00:00');return d.toLocaleDateString('en-MY',{day:'numeric',month:'short',year:'numeric'});}catch{return ds;}
}
function fmtShort(ds){
  if(!ds)return'';
  try{const d=new Date(ds+'T12:00:00');return d.toLocaleDateString('en-MY',{day:'numeric',month:'short'});}catch{return ds;}
}
function daysAgo(ds){
  if(!ds)return'';
  const diff=Math.floor((new Date()-new Date(ds+'T12:00:00'))/86400000);
  if(diff<0)return'';
  if(diff===0)return'Today';
  if(diff===1)return'Yesterday';
  if(diff<7)return diff+' days ago';
  if(diff<30)return Math.floor(diff/7)+(Math.floor(diff/7)===1?' week ago':' weeks ago');
  return Math.floor(diff/30)+(Math.floor(diff/30)===1?' month ago':' months ago');
}
function initials(name){
  if(!name)return'?';
  const w=name.trim().split(/\s+/);
  return w.length>=2?(w[0][0]+w[w.length-1][0]).toUpperCase():name[0].toUpperCase();
}
function progBadge(p){
  if(!p)return'<span class="prog prog-na">—</span>';
  const m={SRK:'prog-srk',SRT:'prog-srt',GAK:'prog-gak',ATC:'prog-atc'};
  return `<span class="prog ${m[p]||'prog-na'}">${p}</span>`;
}
function stagePill(sid){
  const s=STAGES.find(x=>x.id===sid)||STAGES[0];
  return `<span class="stage-pill ${s.cls}">${s.icon} ${s.label}</span>`;
}
function srcTag(s){
  if(!s)return'';
  const m={FB:'📘 FB',Whatsapp:'💬 WA',AT:'🚶 Visit',HQ:'🏢 HQ',Micron:'📡 Micron',roewe:'🔗 Roewe','Referral':'⭐ Referral','existing parent':'⭐ existing student','er camy':'📋 Camy',fb:'📘 FB',whatsapp:'💬 WA','aaron foo':'👤 Aaron','koh ruo han':'👤 Koh','geoffery lim':'👤 Geoffrey',Jkids:'🎒 Jkids','Jkids FB':'🎒 Jkids FB'};
  return `<span class="tag">${m[s]||s}</span>`;
}
function getLastLog(l){const logs=l.logs||[];return logs.length?logs[logs.length-1]:null;}
function getLastContact(l){
  const logs=l.logs||[];
  const dates=logs.map(x=>x.date).filter(Boolean);
  return dates.sort().pop()||l.createdAt||'';
}
function thisWeekEnd(){
  const d=new Date();d.setHours(23,59,59);
  const day=d.getDay();d.setDate(d.getDate()+(7-day));
  return d.toISOString().slice(0,10);
}

function goPage(p){
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('on'));
  document.querySelectorAll('.ntab').forEach(el=>el.classList.remove('on'));
  document.getElementById('page-'+p).classList.add('on');
  const map={dashboard:0,followup:1,calendar:2,contacts:3,crosssell:4,promos:5,courses:6,settings:7};
  document.querySelectorAll('.ntab')[map[p]].classList.add('on');
  if(p==='dashboard')renderDash();
  if(p==='contacts')renderContacts();
  if(p==='crosssell')renderCrossSell();
  if(p==='calendar')renderCalendar();
  if(p==='followup')renderFollowup();
  if(p==='promos')renderPromos();
  if(p==='courses')renderCourses();
  if(p==='settings')renderSettings();
}

// ── DASHBOARD ──
function renderDash(){
  const tod=today();

  // ── Data ──
  const urgentLeads=S.leads.filter(l=>l.followUpDate===tod&&l.stage!=='enrolled'&&l.stage!=='lost');
  const reEngageToday=urgentLeads.filter(l=>l.stage==='no_reply');
  const mustContact=[...urgentLeads.filter(l=>l.stage!=='no_reply'),...reEngageToday];

  const overdueLeads=S.leads.filter(l=>{
    if(['enrolled','lost','no_reply'].includes(l.stage))return false;
    if(l.followUpDate&&l.followUpDate>=tod)return false;
    const stageDays=(S.settings.stageFollowUp||{})[l.stage]??7;
    const last=getLastContact(l);
    if(!last)return l.stage!=='enquiry';
    return Math.floor((new Date()-new Date(last+'T12:00:00'))/86400000)>=stageDays;
  }).sort((a,b)=>(getLastContact(a)||'').localeCompare(getLastContact(b)||''));

  const flaggedLeads=S.leads.filter(l=>l.flagged&&l.stage!=='enrolled'&&l.stage!=='lost');
  const enrolled=S.leads.filter(l=>l.stage==='enrolled').length;
  const todayEvents=(S.events||[]).filter(e=>e.date===tod&&e.status!=='cancelled');
  const warmGreeting=S.leads.filter(l=>l.stage==='enrolled'&&l.followUpDate&&l.followUpDate<=tod);

  // ── Date string ──
  const dateStr=new Date().toLocaleDateString('en-MY',{weekday:'short',day:'numeric',month:'short',year:'numeric'});

  // ── Mini row helper ──
  function dashRow(l){
    const ll=getLastLog(l);
    const snippet=ll?(ll.outcome||ll.notes||'').slice(0,55):'';
    const children=l.children||[];
    const childName=children.filter(c=>c.name).map(c=>c.name).join(', ')
      ||(l.childName&&!l.childName.includes('Enquiry')?l.childName.replace(/\s*\d{6}-\d{2}-\d{4}/g,'').trim():'');

function dashSelect(key){
  if(key==='cal'){goPage('calendar');return;}

  ['due','flag','fu','cal'].forEach(k=>{
    const el=document.getElementById('dash-card-'+k);
    if(!el)return;
    if(k===key){
      el.style.background='#185FA5';
      el.style.borderColor='#185FA5';
      el.querySelectorAll('div').forEach(d=>{d.style.color='#fff';d.style.opacity='1';});
    } else {
      el.style.background='#fff';
      el.style.borderColor='';
      el.querySelectorAll('div').forEach(d=>{d.style.color='';d.style.opacity='';});
    }
  });

  const tod=today();
  const urgentLeads=S.leads.filter(l=>l.followUpDate===tod&&l.stage!=='enrolled'&&l.stage!=='lost');
  const mustContact=[...urgentLeads.filter(l=>l.stage!=='no_reply'),...urgentLeads.filter(l=>l.stage==='no_reply')];
  const overdueLeads=S.leads.filter(l=>{
    if(['enrolled','lost','no_reply'].includes(l.stage))return false;
    if(l.followUpDate&&l.followUpDate>=tod)return false;
    const stageDays=(S.settings?.stageFollowUp||{})[l.stage]??7;
    const last=getLastContact(l);
    if(!last)return l.stage!=='enquiry';
    return Math.floor((new Date()-new Date(last+'T12:00:00'))/86400000)>=stageDays;
  }).sort((a,b)=>(getLastContact(a)||'').localeCompare(getLastContact(b)||''));
  const flaggedLeads=S.leads.filter(l=>l.flagged&&l.stage!=='enrolled'&&l.stage!=='lost');

  const cfgs={
    due: {title:'Must Contact Today', leads:mustContact,  accent:'#c0392b', empty:'✅ Nothing urgent today'},
    flag:{title:'Flagged Important',  leads:flaggedLeads, accent:'#e6a817', empty:'No flagged contacts'},
    fu:  {title:'Needs Follow-up',    leads:overdueLeads, accent:'#185FA5', empty:'No overdue follow-ups'},
  };
  const cfg=cfgs[key]; if(!cfg)return;

  function mkRow(l){
    const ll=getLastLog(l);
    const snippet=ll?(ll.outcome||ll.notes||'').slice(0,60):'';
    const children=l.children||[];
    const childName=children.filter(c=>c.name).map(c=>c.name).join(', ')
      ||(l.childName&&!l.childName.includes('Enquiry')?l.childName.replace(/\s*\d{6}-\d{2}-\d{4}/g,'').trim():'');
    const progs=children.length?[...new Set(children.map(c=>c.prog).filter(Boolean))]:(l.prog?[l.prog]:[]);
    return `<div onclick="openProfile('${l.id}')" style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:.5px solid var(--bdr);cursor:pointer;background:#fff"
      onmouseover="this.style.background='#f4f6f9'" onmouseout="this.style.background='#fff'">
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:baseline;gap:7px;flex-wrap:wrap">
          <span style="font-size:13px;font-weight:700;color:var(--acc);font-family:monospace">${l.phone}</span>
          ${childName?`<span style="font-size:12px;font-weight:600;color:#222">${childName}</span>`:''}
          ${progs.map(p=>`<span style="font-size:9px;font-weight:700;color:#fff;background:${cfg.accent};border-radius:4px;padding:1px 6px">${p}</span>`).join('')}
        </div>
        ${snippet?`<div style="font-size:10px;color:var(--mut);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${snippet}</div>`:''}
      </div>
      <span style="font-size:10px;color:var(--hint);white-space:nowrap;flex-shrink:0">${daysAgo(getLastContact(l))}</span>
    </div>`;
  }

  const panel=document.getElementById('dash-detail');
  if(!panel)return;
  panel.innerHTML=`
    <div style="padding:12px 16px;background:#f8f9fb;border-bottom:.5px solid var(--bdr);display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:13px;font-weight:700;color:#222">${cfg.title}</span>
      <span style="background:${cfg.accent};color:#fff;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700">${cfg.leads.length}</span>
    </div>
    ${cfg.leads.length
      ?cfg.leads.map(l=>mkRow(l)).join('')
      :`<div style="padding:24px;text-align:center;color:var(--hint);font-size:12px">${cfg.empty}</div>`}`;
}

function heroSearch(){
  const q=(document.getElementById('hero-q').value||'').toLowerCase().replace(/[-\s]/g,'');
  const box=document.getElementById('hero-results');
  if(!q||q.length<2){box.style.display='none';return;}
  const results=S.leads.filter(l=>{
    const phone=(l.phone||'').replace(/[-\s]/g,'').toLowerCase();
    const name=(l.name||'').toLowerCase();
    const child=(l.childName||'').toLowerCase();
    const childNames=(l.children||[]).map(c=>c.name||'').join(' ').toLowerCase();
    return phone.includes(q)||name.includes(q)||child.includes(q)||childNames.includes(q);
  }).slice(0,6);
  if(!results.length){
    box.innerHTML=`<div class="no-result">Not found"${q}"<br><small>Possibly new contact，<a href="#" onclick="openAddLead();return false">Add here</a></small></div>`;
    box.style.display='block';return;
  }
  box.innerHTML=results.map(l=>{
    const ll=getLastLog(l);
    return `<div class="sri" onclick="openProfile('${l.id}');document.getElementById('hero-results').style.display='none'">
      <div class="sri-av">${initials(l.name)}</div>
      <div class="sri-body">
        <div class="sri-name">${l.name} ${l.flagged?'🚩':''} ${l.crossSell?'💡':''}</div>
        <div class="sri-detail"><span class="ph">${l.phone}</span> · ${stagePill(l.stage)} · ${progBadge(l.prog)}</div>
        ${ll?`<div class="sri-detail">Last: ${daysAgo(getLastContact(l))} — ${(ll.outcome||ll.notes||'').slice(0,50)}</div>`:''} 
      </div>
    </div>`;
  }).join('');
  box.style.display='block';
}
function heroSearchGo(){
  const q=(document.getElementById('hero-q').value||'').toLowerCase().replace(/[-\s]/g,'');
  if(!q)return;
  const r=S.leads.filter(l=>(l.phone||'').replace(/[-\s]/g,'').toLowerCase().includes(q)||(l.name||'').toLowerCase().includes(q));

function renderContacts(){
  const q=(document.getElementById('c-search').value||'').toLowerCase().replace(/[-\s]/g,'');
  const fs=document.getElementById('c-stage')?.value||'';
  const fp=document.getElementById('c-prog')?.value||'';
  const fy=document.getElementById('c-year')?.value||'';
  const ftag=document.getElementById('c-tag')?.value||'';

  // ── Stage pills with counts ──
  const stageBar=document.getElementById('stage-filter-bar');
  if(stageBar){
    const allStages=[{id:'',label:'전부',icon:''},...STAGES];
    const stageCounts={};S.leads.forEach(l=>{stageCounts[l.stage]=(stageCounts[l.stage]||0)+1;});
    stageBar.innerHTML=[{id:'',label:'All',icon:''},...STAGES].map(s=>{
      const count=s.id?stageCounts[s.id]||0:S.leads.length;
      const active=fs===s.id;
      const stageColors={'s-enquiry':'#555','s-wa_sent':'#1565c0','s-no_reply':'#3949ab',
        's-called':'#e65100','s-trial':'#6a1b9a','s-enrolled':'#0F6E56','s-lost':'#A32D2D'};
      const activeBg=s.cls?stageColors[s.cls]||'var(--acc)':'var(--acc)';
      return `<button onclick="setStageFilter('${s.id}')"
        style="border:.5px solid ${active?activeBg:'var(--bdr)'};background:${active?activeBg:'var(--sur)'};
               color:${active?'#fff':'var(--txt)'};border-radius:20px;padding:4px 10px;
               font-size:11px;cursor:pointer;font-family:inherit;white-space:nowrap;font-weight:${active?700:400};
               display:inline-flex;align-items:center;gap:4px">
        ${s.icon?s.icon+' ':''}${s.label}
        <span style="background:${active?'rgba(255,255,255,.2)':'var(--sur2)'};border-radius:10px;
                     padding:0 5px;font-size:10px;font-weight:700;color:${active?'#fff':'var(--mut)'}">
          ${count}
        </span>
      </button>`;
    }).join('');
  }

  // ── Prog pills with counts ──
  const progBar=document.getElementById('prog-filter-pills');
  if(progBar){
    const progCounts={};
    S.leads.forEach(l=>{
      const progs=l.children&&l.children.length?[...new Set(l.children.map(c=>c.prog).filter(Boolean))]:(l.prog?[l.prog]:[]);
      progs.forEach(p=>{progCounts[p]=(progCounts[p]||0)+1;});
    });
    progBar.innerHTML=['','SRK','SRT','GAK','ATC'].map(p=>{
      const active=fp===p;
      const cnt=p?progCounts[p]||0:S.leads.length;
      const label=p||'All Programmes';
      return `<button onclick="setProgFilter('${p}')"
        style="border:.5px solid ${active?'var(--acc)':'var(--bdr)'};background:${active?'var(--acc)':'var(--sur)'};
               color:${active?'#fff':'var(--txt)'};border-radius:20px;padding:4px 10px;
               font-size:11px;cursor:pointer;font-family:inherit;font-weight:${active?700:400};
               display:inline-flex;align-items:center;gap:4px">
        ${label}
        <span style="background:${active?'rgba(255,255,255,.2)':'var(--sur2)'};border-radius:10px;
                     padding:0 5px;font-size:10px;font-weight:700;color:${active?'#fff':'var(--mut)'}">
          ${cnt}
        </span>
      </button>`;
    }).join('');
  }

  // ── Tag dropdown ──
  const tagSel=document.getElementById('c-tag');
  if(tagSel&&tagSel.options.length<=1){
    LEAD_TAGS.forEach(t=>{
      const opt=document.createElement('option');
      opt.value=t.id; opt.textContent=t.icon+' '+t.label;
      tagSel.appendChild(opt);
    });
    if(ftag)tagSel.value=ftag;
  }

  // ── Filter ──
  let leads=S.leads.filter(l=>{
    if(fs&&l.stage!==fs)return false;
    if(fp){
      const progs=l.children&&l.children.length?[...new Set(l.children.map(c=>c.prog).filter(Boolean))]:(l.prog?[l.prog]:[]);
      if(!progs.includes(fp))return false;
    }
    if(fy&&String(l.year)!==fy)return false;
    if(ftag&&!(l.tags||[]).includes(ftag))return false;
    if(q){
      const childTxt=(l.children||[]).map(c=>[c.name,c.prog].join(' ')).join(' ');
      const tagTxt=(l.tags||[]).map(tid=>LEAD_TAGS.find(t=>t.id===tid)?.label||'').join(' ');
      const txt=[l.phone,l.name,l.childName,l.prog,l.remark,childTxt,tagTxt].join(' ').toLowerCase().replace(/[-\s]/g,'');
      if(!txt.includes(q))return false;
    }
    return true;
  }).sort((a,b)=>(getLastContact(b)||'').localeCompare(getLastContact(a)||''));

  document.getElementById('c-count').textContent=`${leads.length}  `;
  if(!leads.length){
    document.getElementById('contacts-content').innerHTML='<div class="empty"><div>🔍</div>No contacts found</div>';
    return;
  }
  document.getElementById('contacts-content').innerHTML=`
    <table class="cl-table">
      <thead class="cl-thead">
        <tr>
          <th>Phone</th>
          <th>Child Name</th>
          <th>Stage</th>
          <th>Programme</th>
          <th>Last Note</th>
          <th>Follow-up</th>
          <th style="text-align:right">Time</th>
        </tr>
      </thead>
      <tbody>${leads.map(l=>renderLeadCard(l)).join('')}</tbody>
    </table>`;
}

function renderLeadCard(l){
  const ll=getLastLog(l);
  const lastDate=getLastContact(l);
  const stage=derivedStage(l);
  const children=l.children||[];

  // Display name: children names → childName field → empty
  const rawName=children.filter(c=>c.name).map(c=>c.name).join(' · ')
    || (l.childName&&l.childName!==l.name&&!l.childName.includes('Enquiry')?l.childName:'');
  // Strip IC numbers (pattern: 6+ digits with dashes)
  const displayName=rawName.replace(/\s*\d{6}-\d{2}-\d{4}/g,'').replace(/\s*\d{12}/g,'').trim();

  // Prog: from children or lead.prog
  const progs=children.length
    ?[...new Set(children.map(c=>c.prog).filter(Boolean))]
    :(l.prog?[l.prog]:[]);
  const progStr=progs.join(' · ')||'—';

  // Stage pill (compact)
  const s=STAGES.find(x=>x.id===stage)||STAGES[0];
  const stageCols={enquiry:'#888',wa_sent:'#1565c0',no_reply:'#3949ab',called:'#e65100',trial:'#6a1b9a',enrolled:'var(--grn)',lost:'var(--red)'};
  const stageCol=stageCols[stage]||'#888';

  // Last note
  const snippet=ll?(ll.outcome||ll.notes||'').trim().slice(0,60):'';

  // Time / followup
  const timeStr=daysAgo(lastDate);
  const fuStr=l.followUpDate?`📅 ${fmtShort(l.followUpDate)}`:'';

  const borderColor=l.flagged?'var(--red)':l.crossSell?'var(--grn)':stageCols[stage]||'#ddd';

  return `<tr class="cl-row" onclick="openProfile('${l.id}')" style="border-left:3px solid ${borderColor}">
    <td class="cl-phone" style="padding-left:8px">${l.phone||'—'}</td>
    <td><span class="${displayName?'cl-name':'cl-name empty'}">${displayName||'No name yet'}</span></td>
    <td><span style="background:${stageCol}18;color:${stageCol};border:.5px solid ${stageCol}44;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700;white-space:nowrap">${s.icon} ${s.label}</span></td>
    <td style="font-size:11px;font-weight:600;color:var(--txt);white-space:nowrap">${progStr}</td>
    <td class="cl-snippet">${snippet?`💬 ${snippet}`:''}</td>
    <td>${fuStr?`<span class="cl-fu">${fuStr}</span>`:''}</td>
    <td class="cl-time">${timeStr}</td>
  </tr>`;
}

function stageBorderColor(stage){
  const map={enquiry:'#ccc',wa_sent:'#90caf9',no_reply:'#9fa8da',called:'#ffcc80',trial:'#ce93d8',enrolled:'var(--grn)',lost:'#F09595'};
  return map[stage]||'var(--bdr)';
}

function toggleLogForm(){
  const body=document.getElementById('log-form-body');
  const arrow=document.getElementById('log-form-arrow');
  const toggle=document.getElementById('log-form-toggle');
  if(!body)return;
  const open=body.style.display==='none';
  body.style.display=open?'block':'none';
  if(arrow)arrow.textContent=open?'▴':'▾';
  if(toggle)toggle.style.borderRadius=open?'var(--r) var(--r) 0 0':'var(--r)';
  if(open){
    const notes=document.getElementById('log-notes');
    if(notes)setTimeout(()=>notes.focus(),50);
  }
}

function openBookTrial(leadId){
  const lead=S.leads.find(x=>x.id===leadId);
  if(!lead)return;
  const children=lead.children||[];
  document.querySelector('.overlay')?.remove();
  calTab='trial';
  if(children.length){
    // Open add event modal with this lead's children
    openAddEvent(today(),'trial',leadId,lead.phone,'','','');
  } else {
    openAddEvent(today(),'trial',leadId,lead.phone,'','',lead.prog||'');
  }
  goPage('calendar');
}

function switchPTab(btn,pId){
  btn.closest('.profile-body').querySelectorAll('.ptab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  ['pane-tl','pane-info','pane-wa','pane-edit'].forEach(id=>{
    const el=btn.closest('.profile-body').querySelector('#'+id);
    if(el)el.style.display=id===pId?'block':'none';
  });
}

// Open a tab by pane ID (called from outside tab buttons, e.g. from header)
function switchPTabById(pId){
  const body=document.querySelector('.profile-body');
  if(!body)return;
  body.querySelectorAll('.ptab').forEach(b=>{
    const onclick=b.getAttribute('onclick')||'';
    b.classList.toggle('on',onclick.includes("'"+pId+"'"));
  });
  ['pane-tl','pane-info','pane-wa','pane-edit'].forEach(id=>{
    const el=body.querySelector('#'+id);
    if(el)el.style.display=id===pId?'block':'none';
  });
}
function setLogType(t){
  addLogType=t;
  document.querySelectorAll('.log-type-btn').forEach(b=>b.classList.toggle('on',b.textContent.includes(LOG_TYPES.find(x=>x.id===t).label.replace(/[📱📞🚶📝]/,'').trim())));
}
function saveLog(id){
  const l=S.leads.find(x=>x.id===id);if(!l)return;
  const notes=(document.getElementById('log-notes').value||'').trim();
  if(!notes){alert('Please enterNotes');return;}
  const outcome=(document.getElementById('log-outcome').value||'').trim();
  const date=document.getElementById('log-date').value||today();
  const nextFu=document.getElementById('log-nextfu').value;
  if(!l.logs)l.logs=[];
  l.logs.push({id:'l'+Date.now(),type:addLogType,date,notes,outcome});
  if(nextFu)l.followUpDate=nextFu;
  // Auto-advance stage
  if(addLogType==='wa'&&l.stage==='enquiry') l.stage='wa_sent';
  else if(['call','visit'].includes(addLogType)&&['enquiry','wa_sent','no_reply'].includes(l.stage)) l.stage='called';
  // If was no_reply and got a response, clear follow-up date (will be reset by next action)
  if(l.stage==='no_reply'&&(outcome.toLowerCase().includes('reply')&&!outcome.toLowerCase().includes('no reply'))) l.stage='wa_sent';
  save();toast('✅ Logged');openProfile(id);renderDash();
}
function saveEdit(id){
  const l=S.leads.find(x=>x.id===id);if(!l)return;
  const nameEl=document.getElementById('e-name');
  const phoneEl=document.getElementById('e-phone');
  if(nameEl) l.name=nameEl.value||l.name;
  if(phoneEl) l.phone=phoneEl.value||l.phone;
  l.src=document.getElementById('e-src')?.value||l.src;
  l.promoId=document.getElementById('e-promo')?.value||null;
  l.remark=document.getElementById('e-remark')?.value||'';
  l.crossSell=document.getElementById('e-crosssell')?.value==='1';
  l.crossNote=document.getElementById('e-crossnote')?.value||'';
  save();toast('✅ already Save');openProfile(id);renderContacts();
}

// One-tap course setter from edit tab
function quickSetProg(id,prog){
  const l=S.leads.find(x=>x.id===id);if(!l)return;
  l.prog=prog;
  // Also update children if they have no prog
  (l.children||[]).forEach(c=>{if(!c.prog)c.prog=prog;});
  save();
  toast(prog?`✅ ProgrammeSetfor ${prog}`:'ProgrammeCleared');

function toggleFlag(id){
  const l=S.leads.find(x=>x.id===id);if(!l)return;
  l.flagged=!l.flagged;save();toast(l.flagged?'🚩 Flagged':'Unflag');openProfile(id);renderDash();
}
function setFollowUp(id){
  const d=prompt('SetFollow-up Date (YYYY-MM-DD):',today());
  if(!d)return;
  const l=S.leads.find(x=>x.id===id);
  if(l){l.followUpDate=d;save();toast('📅 already Set');openProfile(id);renderDash();}
}
function setStage(id,stage){
  const l=S.leads.find(x=>x.id===id);if(!l)return;
  if(stage==='lost'){
    const r=prompt('Lost Reason:\n'+LOST_REASONS.map((r,i)=>`${i+1}. ${r}`).join('\n')+'\n\nEnter number or reason:','');
    if(r===null)return;
    const idx=parseInt(r)-1;
    l.lostReason=(idx>=0&&idx<LOST_REASONS.length)?LOST_REASONS[idx]:r;
    if(!l.logs)l.logs=[];
    l.logs.push({id:'l'+Date.now(),type:'note',date:today(),notes:'Marked as lost',outcome:`Reason: ${l.lostReason}`});
    l.followUpDate='';

    // ── Auto cross-sell logic ──
    autoTagCrossSell(l);
  }
  if(stage==='no_reply'){
    const days=S.settings.reEngageDays||14;
    const nextDate=addDays(today(),days);
    l.followUpDate=nextDate;
    if(!l.logs)l.logs=[];
    l.logs.push({id:'l'+Date.now(),type:'note',date:today(),notes:'FlagNo Reply',outcome:`Booked ${days}  days (${fmtShort(nextDate)}）re-Contact`});
    toast(`❄️ No Reply — Booked ${days}  days from now`);
  } else {
    toast('→ '+STAGES.find(s=>s.id===stage)?.label);
  }
  l.stage=stage;save();
  openProfile(id);renderDash();
}

// ── Lost laterAuto cross-sellFlag ──
function autoTagCrossSell(l){
  const reason=l.lostReason||'';
  const progs=getLeadProgs(l);
  const children=l.children||[];

  // Chose competitor → recommend ATC extra tuition (no school transfer needed)
  if(reason.includes('competitor')||reason.includes('another school')){
    l.crossSell=true;
    l.crossNote='Chose another school — recommend ATC (no transfer needed)!';
    return;
  }
  // Temporarily not joining / too young → set re-contact later
  if(reason.includes('temporarily')||reason.includes('too young/old')){
    l.crossSell=true;
    const futureDate=addDays(today(),90); // 3 months later
    l.followUpDate=futureDate;
    l.crossNote=`Not the right time — ${fmtShort(futureDate)}re-contact when child is the right age`;
    return;
  }
  // Enquired SRT but child too young → recommend SRK
  if(progs.includes('SRT')&&children.some(c=>{
    const age=c.birthYear?new Date().getFullYear()-parseInt(c.birthYear):0;
    return age>0&&age<7;
  })){
    l.crossSell=true;
    l.crossNote='Child too young for SRT — recommend SRK early childhood programme';
    return;
  }
  // Other lost reason → stay in touch, re-contact in 6 months
  if(reason&&!reason.includes('distance')){
    l.crossSell=true;
    const futureDate=addDays(today(),180);
    l.followUpDate=futureDate;
    l.crossNote=`Lost but worth re-trying — ${fmtShort(futureDate)}re-contact and try again`;
  }
}

let calTab='visit';

function calMonthDates(){
  // Returns array of date strings for the grid (including padding from prev/next month)
  const first=new Date(calYear,calMonth,1);
  const last=new Date(calYear,calMonth+1,0);
  // Start from Monday
  let startDay=first.getDay();  // 0=Sun
  startDay=startDay===0?6:startDay-1; // convert to Mon=0
  const grid=[];
  for(let i=0;i<startDay;i++){
    const d=new Date(first);d.setDate(d.getDate()-startDay+i);
    grid.push({ds:d.toISOString().slice(0,10),curr:false});
  }
  for(let d=1;d<=last.getDate();d++){
    const dt=new Date(calYear,calMonth,d);
    grid.push({ds:dt.toISOString().slice(0,10),curr:true});
  }
  // Fill to complete weeks
  while(grid.length%7!==0){
    const d=new Date(last);d.setDate(last.getDate()+(grid.length-last.getDate()-startDay+1));
    grid.push({ds:d.toISOString().slice(0,10),curr:false});
  }
  return grid;
}

function fmtMonthLabel(){
  return new Date(calYear,calMonth,1).toLocaleDateString('en-MY',{year:'numeric',month:'long'});
}

function eventsOnDay(date,type){
  return (S.events||[]).filter(e=>e.date===date&&e.type===type)

function eventsOnDayAll(date){

const SRT_SLOTS={
  5:[{id:'FRI.PM',label:'FRI.PM',time:'14:00'}],   // Friday → FRI.PM only
  6:[{id:'SAT.AM',label:'SAT.AM',time:'09:00'},{id:'SAT.NN',label:'SAT.NN',time:'12:00'},{id:'SAT.PM',label:'SAT.PM',time:'14:00'}],  // Saturday

function getSRTSlots(ds){
  if(!ds)return[];

function openAddEvent(date,type,leadId,leadPhone,childId,childName,prog){
  const lead=leadId?S.leads.find(l=>l.id===leadId):null;
  const children=lead?.children||[];
  const initDate=date||today();

  // Infer initial prog FIRST (used by initSlots below)
  let initProg=prog||'';
  if(!initProg&&children.length){initProg=children.find(c=>c.id===childId)?.prog||children[0]?.prog||'';}
  if(!initProg&&lead)initProg=lead.prog||'';

  const initSlots=initProg==='SRT'?getSRTSlots(initDate):[];

  // Infer initial child name/age
  let initChildName=childName||'';
  let initChildAge='';
  if(childId&&children.length){
    const c=children.find(x=>x.id===childId);
    if(c){initChildName=c.name||initChildName;if(c.birthYear)initChildAge=String(new Date().getFullYear()-parseInt(c.birthYear));}
  }

  const ov=document.createElement('div');
  ov.className='overlay';
  ov.onclick=e=>{if(e.target===ov)ov.remove();};

  ov.innerHTML=buildAddEventHTML(type,leadId,leadPhone,childId,initChildName,initChildAge,initProg,initDate,initSlots,'',children);
  document.body.appendChild(ov);
  bindAddEventListeners(type,leadId,leadPhone,childId,children);
}

function removeTrialDateRow(btn){

function refreshSRTSlots(){

  const noteEl=document.getElementById('srt-slot-note');
  if(!slots.length){
    container.innerHTML='<span style="font-size:11px;color:var(--amb)">⚠️ SRT trials: Friday (FRI.PM) or Saturday (SAT.AM/NN/PM) only</span>';

function onChildSelect(){

  if(!sel||!sel.value)return;

  const ageEl=document.getElementById('evt-childage');

function saveCalEvent(type,leadId,childId,leadPhone,_unused){
  const isTrial=type==='trial';
  const prog=document.getElementById('evt-prog')?.value||'';
  const isSRT=prog==='SRT';

  // Get dates — multi for trial, single for visit
  let dates=[];
  if(isTrial){
    const dateInputs=document.querySelectorAll('.trial-date-input');
    dates=[...dateInputs].map(i=>i.value).filter(Boolean);
    if(!dates.length){alert('Please selectTrialDate');return;}
    // Validate SRT slots match dates
    if(isSRT){
      for(const d of dates){
        const slots=getSRTSlots(d);
        if(!slots.length){
          const dd=new Date(d+'T12:00:00').toLocaleDateString('en-MY',{day:'numeric',month:'short',weekday:'short'});
          alert(`${dd} notYesSRTTrial day（must be Friday or Saturday）`);return;
        }
      }
    }
  } else {
    const d=document.getElementById('evt-date')?.value;
    if(!d){alert('Please selectDate');return;}
    dates=[d];
  }

  // Slot / time — SRT only
  const slotId=document.getElementById('evt-slot-id')?.value||'';
  const time=document.getElementById('evt-time')?.value||'';
  if(isTrial&&isSRT&&!slotId){alert('Please selectSRTTrialTime Slot');return;}

  // Phone
  let phone=leadPhone;
  const phoneEl=document.getElementById('evt-phone');
  if(phoneEl)phone=(phoneEl.value||'').trim();
  if(!phone&&!leadId){alert('Please enterCallNumber');return;}

  // Student info
  const childName=isTrial?(document.getElementById('evt-childname')?.value||'').trim():'';
  if(isTrial&&!childName){alert('Please enterStudent Name');return;}
  const childAge=isTrial?(document.getElementById('evt-childage')?.value||''):'';
  const level=document.getElementById('evt-level')?.value||'';
  const notes=(document.getElementById('evt-notes')?.value||'').trim();

  // Find lead by phone
  let lid=leadId;
  if(!lid&&phone){
    const found=S.leads.find(l=>(l.phone||'').replace(/[-\s]/g,'')===(phone||'').replace(/[-\s]/g,''));
    if(found)lid=found.id;
  }

  if(!S.events)S.events=[];

  // Create one event per date
  dates.forEach(date=>{
    // For SRT multi-date: use same slot for all dates
    // (each date must be FRI or SAT per validation above)
    const slotForDate=isSRT?slotId:'';
    const timeForDate=isSRT?time:(document.getElementById('evt-time')?.value||'');
    const ev={
      id:'evt_'+Date.now()+Math.random().toString(36).slice(2,5),
      type,
      leadId:lid||'',
      leadPhone:phone||leadPhone||'',
      childId:childId||'',
      childName,
      childAge,
      prog,
      level,
      slotLabel:slotForDate,
      date,
      time:timeForDate,
      status:'scheduled',
      notes,
    };
    S.events.push(ev);
  });

  // Update child stage
  if(lid&&isTrial){
    const lead=S.leads.find(l=>l.id===lid);
    if(lead&&childId&&lead.children){
      const c=lead.children.find(x=>x.id===childId);
      if(c&&c.stage==='considering')c.stage='trial';
    }
  }

  save();
  const msg=dates.length>1?`✅ Booked ${dates.length} trial day(s)!`:'✅ Booked!';
  toast(msg);
  document.querySelector('.overlay')?.remove();
  renderCalendar();
}

function renderFollowup(){

  document.getElementById('followup-content').innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div class="card-title">📅 Follow-up</div>

    <div id="fu-cal-container"></div>
    <div id="fu-day-list" style="margin-top:14px"></div>`;
  buildFollowupCal(new Date().getFullYear(), new Date().getMonth(), tod);

function buildFollowupCal(yr, mo, selectedDate){
  const tod=today();
  const sel=selectedDate||tod;
  const first=new Date(yr,mo,1);
  const last=new Date(yr,mo+1,0);
  const monthLabel=first.toLocaleDateString('en-MY',{month:'long',year:'numeric'});
  const isThisMonth=yr===new Date().getFullYear()&&mo===new Date().getMonth();

  // Map follow-up dates → leads
  const fuMap={};
  S.leads.filter(l=>l.followUpDate&&!['enrolled','lost'].includes(l.stage)).forEach(l=>{
    if(!fuMap[l.followUpDate])fuMap[l.followUpDate]=[];
    fuMap[l.followUpDate].push(l);
  });

  // Grid
  let startDay=first.getDay(); startDay=startDay===0?6:startDay-1;
  const grid=[];
  for(let i=0;i<startDay;i++){const d=new Date(first);d.setDate(d.getDate()-startDay+i);grid.push({ds:d.toISOString().slice(0,10),curr:false});}
  for(let d=1;d<=last.getDate();d++)grid.push({ds:new Date(yr,mo,d).toISOString().slice(0,10),curr:true});
  while(grid.length%7!==0){const d=new Date(last);d.setDate(last.getDate()+(grid.length-last.getDate()-startDay+1));grid.push({ds:d.toISOString().slice(0,10),curr:false});}

  let h=`<div style="background:#fff;border:.5px solid var(--bdr);border-radius:var(--r);overflow:hidden">
    <div style="padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:.5px solid var(--bdr)">
      <span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)">📅 FOLLOW UP CALENDAR</span>
      <div style="display:flex;align-items:center;gap:8px">
        <button onclick="buildFollowupCal(${mo===0?yr-1:yr},${mo===0?11:mo-1},'${sel}')" style="width:28px;height:28px;border-radius:50%;border:.5px solid var(--bdr);background:var(--sur);cursor:pointer;font-size:14px">‹</button>
        <span style="font-size:15px;font-weight:700;color:#1a2332;min-width:110px;text-align:center">${monthLabel}</span>
        <button onclick="buildFollowupCal(${mo===11?yr+1:yr},${mo===11?0:mo+1},'${sel}')" style="width:28px;height:28px;border-radius:50%;border:.5px solid var(--bdr);background:var(--sur);cursor:pointer;font-size:14px">›</button>
        ${!isThisMonth?`<button onclick="buildFollowupCal(${new Date().getFullYear()},${new Date().getMonth()},'${tod}')" style="padding:3px 10px;border:.5px solid var(--bdr);border-radius:20px;background:var(--sur);cursor:pointer;font-size:11px;font-weight:600">Today</button>`:''}
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);background:#f8f9fb;border-bottom:.5px solid var(--bdr)">
      ${['MON','TUE','WED','THU','FRI','SAT','SUN'].map(d=>`<div style="padding:7px;text-align:center;font-size:10px;font-weight:700;color:var(--mut);letter-spacing:.05em">${d}</div>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr)">`;

  grid.forEach(({ds,curr})=>{
    const isToday=ds===tod;
    const isSel=ds===sel;
    const leads=fuMap[ds]||[];
    const dayNum=new Date(ds+'T12:00:00').getDate();
    const hasDots=leads.length>0;
    h+=`<div onclick="buildFollowupCal(${yr},${mo},'${ds}')"
      style="border-right:.5px solid #f0f0f0;border-bottom:.5px solid #f0f0f0;min-height:74px;padding:5px;
             background:${isSel?'#e8f0fb':'#fff'};cursor:pointer;transition:.1s"
      onmouseover="this.style.background='${isSel?'#dce8f7':'#f8f9fb'}'"
      onmouseout="this.style.background='${isSel?'#e8f0fb':'#fff'}'">
      <div style="text-align:center;margin-bottom:3px">
        <span style="${isToday
          ?'background:#185FA5;color:#fff;border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700'
          :isSel
          ?'background:#185FA520;color:#185FA5;border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700'
          :`font-size:12px;font-weight:${curr?'500':'300'};color:${curr?'#1a2332':'#ccc'}`}">${dayNum}</span>
      </div>
      ${leads.slice(0,2).map(l=>{
        const children=l.children||[];
        const name=children.filter(c=>c.name).map(c=>c.name).join('/')
          ||(l.childName&&!l.childName.includes('Enquiry')?l.childName.replace(/\s*\d{6}-\d{2}-\d{4}/g,'').trim():'');
        const stage=derivedStage(l);
        const dot={enquiry:'#888',wa_sent:'#1565c0',no_reply:'#3949ab',called:'#e65100',trial:'#6a1b9a',enrolled:'var(--grn)',lost:'var(--red)'}[stage]||'#888';
        return `<div style="background:${dot}18;border-left:2px solid ${dot};border-radius:3px;padding:2px 4px;margin-bottom:2px">
          <div style="font-size:9px;font-weight:600;color:${dot};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${name||l.phone.slice(-8)}</div>
        </div>`;
      }).join('')}
      ${leads.length>2?`<div style="font-size:8px;color:var(--mut);text-align:right">+${leads.length-2}</div>`:''}
    </div>`;
  });

  h+=`</div></div>`;
  const el=document.getElementById('fu-cal-container');
  if(el)el.innerHTML=h;

  // Show selected day's list below
  renderFuDayList(sel, fuMap[sel]||[]);
}

function renderFuDayList(ds, leads){
  const tod=today();
  const panel=document.getElementById('fu-day-list');
  if(!panel)return;

  const d=new Date(ds+'T12:00:00');
  const label=ds===tod?'Due Today':d.toLocaleDateString('en-MY',{weekday:'long',day:'numeric',month:'long'});
  const isOverdue=ds<tod;

  if(!leads.length){
    panel.innerHTML=`<div style="padding:20px;text-align:center;color:var(--hint);font-size:12px;background:#fff;border:.5px solid var(--bdr);border-radius:var(--r)">
      No follow-ups on ${d.toLocaleDateString('en-MY',{day:'numeric',month:'short'})}
    </div>`;
    return;
  }

  const accentColor=isOverdue?'var(--red)':ds===tod?'#c0392b':'var(--acc)';

  panel.innerHTML=`
    <div style="font-size:12px;font-weight:700;color:${accentColor};margin-bottom:8px;display:flex;align-items:center;gap:8px">
      ${isOverdue?'⚠️':ds===tod?'🔴':'📅'} ${label}
      <span style="background:${accentColor}22;color:${accentColor};border-radius:10px;padding:1px 8px;font-size:11px">${leads.length}</span>
    </div>

const CHILD_STAGES=[
  {id:'considering',label:'Considering',icon:'💬',color:'var(--mut)'},
  {id:'trial',      label:'Trial',icon:'🎓',color:'var(--pur)'},
  {id:'enrolled',   label:'Enrolled',icon:'✅',color:'var(--grn)'},
  {id:'not_joining',label:'Not Joining',icon:'✕', color:'var(--red)'},
];
function childStageBadge(s){
  const cs=CHILD_STAGES.find(x=>x.id===s)||CHILD_STAGES[0];
  return `<span style="font-size:9px;font-weight:700;color:${cs.color}">${cs.icon} ${cs.label}</span>`;
}
// Get prog from children or fallback to lead.prog
function getLeadProgs(l){
  if(l.children&&l.children.length) return [...new Set(l.children.map(c=>c.prog).filter(Boolean))];
  return l.prog?[l.prog]:[];
}
// Derive overall stage from lead + children
function derivedStage(l){
  const children=l.children||[];
  if(children.some(c=>c.stage==='enrolled')) return 'enrolled';
  if(children.some(c=>c.stage==='trial')) return 'trial';
  if(children.some(c=>c.stage==='considering')&&['called','trial'].includes(l.stage)) return l.stage;
  return l.stage||'enquiry';
}
// Render child pills for lead card
function childPills(l){
  const children=l.children||[];
  if(!children.length){
    if(l.prog) return progBadge(l.prog);
    // No prog set - show a subtle hint
    return `<span style="font-size:9px;color:var(--hint);border:.5px dashed var(--hint);border-radius:4px;padding:1px 6px">📚 not setProgramme</span>`;
  }
  return children.map(c=>`<span style="display:inline-flex;align-items:center;gap:3px;background:var(--sur2);border:.5px solid var(--bdr);border-radius:5px;padding:2px 6px;font-size:9px;margin:1px">
    ${c.prog?progBadge(c.prog):'<span style="font-size:9px;color:var(--hint)">?</span>'} <span style="color:var(--txt)">${c.name||'Child'}</span> ${childStageBadge(c.stage||'considering')}
  </span>`).join('');
}

      outcome:`already Set ${fmtShort(greetDate)} Warm Greeting Reminder`});

function getTimeSlot(time, dayOfWeek, ev){
  // Use stored slotLabel if available (new events)
  if(ev&&ev.slotLabel){
    const parts=ev.slotLabel.split('.');
    return parts[1]||'AM';
  }
  if(!time) return 'AM';
  const h=parseInt(time.split(':')[0])||0;
  if(h<12) return 'AM';
  if(h<14) return 'NN';
  return 'PM';
}
function getDayPrefix(ds){
  const d=new Date(ds+'T12:00:00');
  const day=d.getDay();
  const names=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  return names[day];
}
function getChildAge(ev){
  // Try to get age from lead's children
  const lead=getEventLead(ev);
  if(!lead) return '';
  if(ev.childId&&lead.children){
    const c=lead.children.find(x=>x.id===ev.childId);
    if(c&&c.birthYear) return new Date().getFullYear()-parseInt(c.birthYear);
  }
  return '';
}

function generateSchedulePreview(){
  const prog=document.getElementById('sched-prog')?.value||'ALL';
  const title=(document.getElementById('sched-title')?.value||'TRIAL CLASS').toUpperCase();

  const monthStart=`${calYear}-${String(calMonth+1).padStart(2,'0')}-01`;
  const monthEnd=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${new Date(calYear,calMonth+1,0).getDate()}`;

  let trials=(S.events||[]).filter(e=>
    e.type==='trial'&&e.status!=='cancelled'&&
    e.date>=monthStart&&e.date<=monthEnd&&
    (prog==='ALL'||e.prog===prog)
  ).sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));

  const dates=[...new Set(trials.map(e=>e.date))].sort();

  if(!dates.length){
    document.getElementById('sched-preview').innerHTML=
      `<div class="empty" style="padding:20px"><div>📅</div>This MonthNone yet${prog==='ALL'?'':''+prog+''}trials this month<br><small>pleaseinCalendarClick + Book Trial EnterStudentInfo</small></div>`;
    return;
  }

  // Check if events have student data
  const hasStudentData=trials.some(e=>e.childName&&e.childName.trim());
  if(!hasStudentData){
    document.getElementById('sched-preview').innerHTML=
      `<div style="text-align:center;padding:30px;background:#FFF8E1;border:.5px solid #F9CB42;border-radius:8px">
        <div style="font-size:24px;margin-bottom:8px">⚠️</div>
        <div style="font-size:13px;font-weight:700;margin-bottom:8px">theseCalendarRecordNoneStudent Name</div>
        <div style="font-size:11px;color:var(--mut);line-height:1.8">
          Found  <b>${trials.length}</b>  TrialRecord，but allNoneStudentInfo。<br>
          These may be old test entries.<br><br>
          <b>Please:</b><br>
          1️⃣ Close this window<br>
          2️⃣ Click  <b>🗑 clearAllRecord</b><br>
          3️⃣ Re-enter using  <b>+ Book Trial</b> Enter correctStudentInfo
        </div>
      </div>`;
    return;
  }

  // Time slot rows — use slotLabel when available, fallback to time
  const usedSlots=new Set();
  trials.forEach(ev=>{
    const slotKey=ev.slotLabel||getDayPrefix(ev.date)+'.'+getTimeSlot(ev.time,null,ev);
    usedSlots.add(slotKey);
  });
  // Sort slots: AM < NN < PM, Mon-Fri < Sat < Sun
  const dayOrder={MON:1,TUE:2,WED:3,THU:4,FRI:5,SAT:6,SUN:7};
  const slotOrder={AM:1,NN:2,PM:3};
  const sortedSlots=[...usedSlots].sort((a,b)=>{
    const [da,sa]=a.split('.');const [db,sb]=b.split('.');
    return (dayOrder[da]||9)-(dayOrder[db]||9)||slotOrder[sa]-slotOrder[sb];
  });

  // Map events to date+slot
  const cellMap={};
  trials.forEach(ev=>{
    const key=`${ev.date}__${ev.slotLabel||getDayPrefix(ev.date)+'.'+getTimeSlot(ev.time,null,ev)}`;
    if(!cellMap[key])cellMap[key]=[];
    cellMap[key].push(ev);
  });

  // Build the table HTML
  const progLabel=prog==='ALL'?'':prog+' ';
  const tableHTML=`
  <div id="print-schedule-content" style="font-family:Arial,sans-serif;">
    <h2 style="text-align:center;font-size:14px;font-weight:900;letter-spacing:1px;margin-bottom:8px;text-transform:uppercase">

    <table style="width:100%;border-collapse:collapse;font-size:11px;table-layout:auto;min-width:600px">
      <colgroup>
        <col style="width:72px;min-width:72px">
        ${dates.map(()=>`<col style="min-width:90px"><col style="width:36px;min-width:36px"><col style="width:30px;min-width:30px">`).join('')}
      </colgroup>
      <thead>
        <tr style="background:#000;color:#fff">
          <th style="border:1px solid #000;padding:6px 10px;text-align:left;white-space:nowrap">Date</th>
          ${dates.map(ds=>{
            const d=new Date(ds+'T12:00:00');
            const dayStr=d.toLocaleDateString('en-MY',{day:'numeric',month:'short'}).toUpperCase();
            const dayName=getDayPrefix(ds);
            return `<th colspan="3" style="border:1px solid #000;padding:6px 10px;text-align:center;white-space:nowrap">${dayStr} (${dayName})</th>`;
          }).join('')}
        </tr>
        <tr style="background:#555;color:#fff">
          <th style="border:1px solid #000;padding:4px 10px"></th>
          ${dates.map(()=>`
            <th style="border:1px solid #000;padding:4px 8px;font-size:10px;white-space:nowrap">Child Name</th>
            <th style="border:1px solid #000;padding:4px 6px;font-size:10px;white-space:nowrap">Age</th>
            <th style="border:1px solid #000;padding:4px 6px;font-size:10px;white-space:nowrap">LV</th>
          `).join('')}
        </tr>
      </thead>
      <tbody>
        ${sortedSlots.map(slot=>{
          const [dayPfx]=slot.split('.');
          return `<tr>
            <td style="border:1px solid #000;padding:8px 10px;font-weight:700;background:#f5f5f5;white-space:nowrap">${slot}</td>
            ${dates.map(ds=>{
              const thisDayPfx=getDayPrefix(ds);
              // Black cell if this slot doesn't belong to this day
              if(thisDayPfx!==dayPfx){
                return `<td colspan="3" class="black-cell" style="background:#000;border:1px solid #000"></td>`;
              }
              const key=`${ds}__${slot}`;
              const evts=cellMap[key]||[];
              if(!evts.length){
                return `<td style="border:1px solid #000;padding:5px 8px"></td>
                         <td style="border:1px solid #000"></td>
                         <td style="border:1px solid #000"></td>`;
              }
              // Multiple students in same slot — show each
              return `<td style="border:1px solid #000;padding:4px 8px">
                ${evts.map(ev=>`<div style="padding:2px 0;border-bottom:1px solid #eee;font-size:10px;font-weight:600">${(ev.childName||'—').toUpperCase()}</div>`).join('')}
              </td>
              <td style="border:1px solid #000;padding:4px 6px;text-align:center">
                ${evts.map(ev=>`<div style="padding:2px 0;border-bottom:1px solid #eee;font-size:10px">${ev.childAge||getChildAge(ev)||''}</div>`).join('')}

              </td>`;
            }).join('')}
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    <div style="font-size:9px;color:#999;text-align:right;margin-top:6px">Generated ${new Date().toLocaleDateString('en-MY')}</div>
  </div>`;

  document.getElementById('sched-preview').innerHTML=tableHTML;
}

function catsOf(G){
  const call = x => x.ch === 'call';
  const C = {
    events: [].concat(G.evT, G.evM, G.after.filter(x => !call(x))),
    new: G.fresh.filter(x => !call(x)),
    follow: G.due.filter(x => !call(x)),
    calls: [].concat(G.after, G.fresh, G.due, G.care, G.revive).filter(call),
    care: G.care.filter(x => !call(x)),
    old: G.revive.filter(x => !call(x))
  };
  C.xsell = xsList(new Set(G.done.map(l => l.id)));

  if (/^wh?a?t?s?a?pp?|^whasapp|^wa$/.test(x)) return 'WhatsApp';

// 找出可能重复的已有家长：完全相同的电话、或家长名/孩子名有相符
function dupMatches(ph, nm, excludeId){
  const d = (ph || '').replace(/\D/g, ''); const q = (nm || '').trim().toLowerCase();
  const out = [], seen = {};
  (S.leads || []).forEach(l => {
    if (!l || l.id === excludeId || l.invalid) return;
    const lp = (l.phone || '').replace(/\D/g, '');
    let hit = false, why = '';
    if (d.length >= 7 && lp && lp === d) { hit = true; why = 'same phone'; }
    if (!hit && q.length >= 2) {
      const dn = (displayName(l) || '').toLowerCase();
      const rawn = (l.name || '').toLowerCase();
      const kidHit = (l.children || []).some(c => (c.name || '').toLowerCase().includes(q));
      if ((dn && dn.includes(q)) || (!isPhoneLike(l.name) && rawn && rawn.includes(q))) { hit = true; why = 'same name'; }
      else if (kidHit) { hit = true; why = 'same child'; }
    }
    if (hit && !seen[l.id]) { seen[l.id] = 1; out.push({ l, why }); }
  });
  return out.slice(0, 6);
}
function dupBoxHtml(matches){
  if (!matches.length) return '';
  return '<div class="dupw"><div class="dupw-t">⚠️ 可能已经记录过 · Already in records?</div>'
    + matches.map(({ l, why }) => '<div class="dupw-row"><div class="dupw-m"><b>' + (esc(displayName(l)) || esc(fmtPhone(l.phone))) + '</b> '
      + progsOf(l).map(progChip).join('') + '<div class="dupw-p">' + esc(fmtPhone(l.phone)) + (l.children && l.children.length ? ' · ' + esc((l.children.map(c => c.name).filter(Boolean)[0]) || '') : '') + ' <span class="dupw-why">' + why + '</span></div></div>'
      + '<button onclick="shClose();openCard(\'' + l.id + '\')">Open →</button></div>').join('')
    + '</div>';
}

  try {
    const [L, E, M] = await Promise.all([pageAll('crm_leads', 'id,updated_at'), pageAll('crm_events', 'id,updated_at'), pageAll('crm_meta', 'key,updated_at')]);
    const changed = (rows, kind) => rows.filter(r => !SEEN[kind][r.id || r.key] || SEEN[kind][r.id || r.key] !== r.updated_at).map(r => r.id || r.key);
    const cL = changed(L, 'leads'), cE = changed(E, 'events'), cM = changed(M, 'meta');
    const idsL = new Set(L.map(r => r.id)), idsE = new Set(E.map(r => r.id));
    let touched = 0;
    const take = async (table, ids, key) => ids.length ? (await Promise.all(chunk(ids, 80).map(c => api(table + '?select=' + key + ',data,updated_at&' + key + '=in.(' + c.map(x => '"' + String(x).replace(/"/g, '') + '"').join(',') + ')')))).flat() : [];
    const rl = await take('crm_leads', cL, 'id'), re = await take('crm_events', cE, 'id'), rm = await take('crm_meta', cM, 'key');
    const merge = (arr, kind, rows) => { rows.forEach(r => { SEEN[kind][r.id] = r.updated_at; const i = arr.findIndex(x => x.id === r.id), mine = i >= 0 ? JSON.stringify(arr[i]) : null;
        if (mine !== null && mine !== SYNCED[kind][r.id]) return; // 我这边有没送出的修改：保留我的
        if (i >= 0) arr[i] = r.data; else arr.push(r.data); SYNCED[kind][r.id] = JSON.stringify(r.data); touched++; }); };
    merge(S.leads, 'leads', rl); merge(S.events, 'events', re);
    rm.forEach(r => { SEEN.meta[r.key] = r.updated_at; const cur = JSON.stringify(r.key === 'settings' ? S.settings : r.key === 'courses' ? S.courses : S.promos); if (cur !== SYNCED.meta[r.key]) return; if (r.key === 'settings') S.settings = r.data; else if (r.key === 'courses') S.courses = r.data; else S.promos = r.data; SYNCED.meta[r.key] = JSON.stringify(r.data); touched++; });
    // 别人删掉的
    const del = (arr, kind, ids) => { for (let i = arr.length - 1; i >= 0; i--) { const id = arr[i].id; if (SYNCED[kind][id] !== undefined && !ids.has(id) && JSON.stringify(arr[i]) === SYNCED[kind][id]) { arr.splice(i, 1); delete SYNCED[kind][id]; touched++; } } };
    del(S.leads, 'leads', idsL); del(S.events, 'events', idsE);
    lastPullAt = Date.now();
    if (touched) { cacheSave(); if (force || touched) rerenderCurrent(); }
    if (cloudState === 'off' && !cloudDirty) cloudPill('ok');
  } catch (e) { if (e.status !== 401) cloudPill('off', String(e.message || e)); }
}
const SEEN = { leads: {}, events: {}, meta: {} };
function chunk(a, n){ const o = []; for (let i = 0; i < a.length; i += n) o.push(a.slice(i, i + n)); return o; }

// ---------- 写 ----------
save = function(){ delete S._seed; S._seed = false; cacheSave(); cloudDirty = true; clearTimeout(cloudTimer); cloudTimer = setTimeout(cloudPush, 500); if (cloudState !== 'off') cloudPill('saving'); };
async function cloudPush(){
  if (!SESS || !ME) return; if (cloudBusy) { clearTimeout(cloudTimer); cloudTimer = setTimeout(cloudPush, 400); return; }
  cloudBusy = true;
  try {
    for (;;) {
      const upL = [], upE = [], upM = [], delL = [], delE = [];
      const curL = {}; S.leads.forEach(l => { if (!l || !l.id) return; const j = JSON.stringify(l); curL[l.id] = j; if (SYNCED.leads[l.id] !== j) upL.push({ id: l.id, data: l }); });
      Object.keys(SYNCED.leads).forEach(id => { if (curL[id] === undefined) delL.push(id); });
      const curE = {}; (S.events || []).forEach(e => { if (!e || !e.id) return; const j = JSON.stringify(e); curE[e.id] = j; if (SYNCED.events[e.id] !== j) upE.push({ id: e.id, data: e }); });
      Object.keys(SYNCED.events).forEach(id => { if (curE[id] === undefined) delE.push(id); });
      const metaNow = { settings: S.settings || {}, courses: S.courses || {}, promos: S.promos || [] };
      Object.entries(metaNow).forEach(([k, v]) => { if (SYNCED.meta[k] !== JSON.stringify(v)) upM.push({ key: k, data: v }); });
      if (!upL.length && !upE.length && !upM.length && !delL.length && !delE.length) break;
      const up = (t, rows, kc) => Promise.all(chunk(rows, 200).map(c => api(t + '?on_conflict=' + kc + '&select=' + kc + ',updated_at', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=representation' }, body: JSON.stringify(c) })));
      const dl = (t, ids) => Promise.all(chunk(ids, 80).map(c => api(t + '?id=in.(' + c.map(x => '"' + String(x).replace(/"/g, '') + '"').join(',') + ')', { method: 'DELETE' })));
      const res = await Promise.all([up('crm_leads', upL, 'id'), up('crm_events', upE, 'id'), up('crm_meta', upM, 'key'), dl('crm_leads', delL), dl('crm_events', delE)]);
      res[0].flat().forEach(r => SEEN.leads[r.id] = r.updated_at); res[1].flat().forEach(r => SEEN.events[r.id] = r.updated_at); res[2].flat().forEach(r => SEEN.meta[r.key] = r.updated_at);
      upL.forEach(r => SYNCED.leads[r.id] = JSON.stringify(r.data)); upE.forEach(r => SYNCED.events[r.id] = JSON.stringify(r.data)); upM.forEach(r => SYNCED.meta[r.key] = JSON.stringify(r.data));
      delL.forEach(id => delete SYNCED.leads[id]); delE.forEach(id => delete SYNCED.events[id]);
    }
    cloudDirty = false; cacheSave(); cloudPill('ok');
  } catch (e) {
    cloudPill(e.status === 403 || e.status === 401 ? 'err' : 'off', String(e.message || e));
    clearTimeout(cloudTimer); cloudTimer = setTimeout(cloudPush, 10000);
  } finally { cloudBusy = false; }
}
window.addEventListener('beforeunload', ev => { if (cloudDirty) { ev.preventDefault(); ev.returnValue = 'Changes are still saving to the cloud.'; } });
window.addEventListener('focus', () => cloudPull(false));
window.addEventListener('online', () => { cloudPush(); cloudPull(false); });

// ---------- 载入：先用这台电脑上次的快取（马上看得到），再跟云端对齐 ----------
load = function(){
  sessLoad();
  let c = null; try { c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch (e) {}
  if (c && SESS && c.email === SESS.email && c.S) { Object.assign(S, c.S); SYNCED = c.SYNCED || SYNCED; } else { S.leads = []; S.events = []; S.promos = []; S.courses = {}; }
  S._seed = false; S._seedInfo = false;
};
// Import（搬资料）：只有 owner 可以；整份取代云端
const _importData23 = importData;
importData = function(){
  if (!ME || (ME.role !== 'owner' && ME.role !== 'admin')) { toast('Only owner or admin can import a backup'); return; }
  const i = document.createElement('input'); i.type = 'file'; i.accept = '.json';
  i.onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = ev => { let d; try { d = JSON.parse(ev.target.result); } catch (x) { alert('Not a backup file'); return; } if (!d.leads || !Array.isArray(d.leads)) { alert('Not a backup file'); return; }
      const ans = prompt('This REPLACES all cloud data with ' + d.leads.length + ' parents and ' + (d.events || []).length + ' bookings from this file.\nEveryone will see the new data.\n\nType IMPORT to continue:'); if (ans !== 'IMPORT') { toast('Cancelled'); return; }
      S.leads = d.leads; S.events = d.events || []; S.promos = d.promos || []; S.courses = d.courses || {}; S.settings = Object.assign(S.settings || {}, d.settings || {});
      save(); toast('☁ Uploading ' + d.leads.length + ' parents…'); rerenderCurrent(); }; r.readAsText(f); };
  i.click();
};
// Settings：显示谁登入、登出
const _renderSettings23 = renderSettings;
renderSettings = function(){ _renderSettings23(); const c = document.querySelector('#settings-content .h13'); if (!c || !ME) return; const d = document.createElement('div'); d.className = 'card13'; d.innerHTML = '<div class="c13-h">👤 Signed in</div><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><div style="flex:1"><b>' + esc(ME.name) + '</b> · ' + esc(ME.email) + ' · <span class="tg tg-blu">' + esc(ME.role) + '</span><div class="mut sm">Data is saved to the cloud automatically. Everyone on the staff list sees the same data.</div></div><button class="ghost" onclick="cloudLogout()">Sign out</button></div>'; const top = c.querySelector('.ins-top'); top.after(d);
  if (ME.role !== 'owner' && ME.role !== 'admin') c.querySelectorAll('button').forEach(b => { if (/Import backup/.test(b.textContent)) b.style.display = 'none'; }); };
// 开机
function cloudBoot(){ if (SESS) { cloudPill('load'); cloudStart().catch(e => { if (!document.getElementById('cloud-login')) { cloudPill('off', String(e.message || e)); } }); } else showLogin(); }

load();renderDash();cloudBoot();
</script>
