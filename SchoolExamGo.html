<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SchoolExamGo — ATC 学校考试 v2</title>
<style>
:root{
  /* ══ LAYER ══ RPT */
  --layer:#5A6470;
  --d-srk:#C45C5C; --d-gak:#E8A04E; --d-atc:#7AB05A; --d-srt:#8B6CAE;
  --sur:#ffffff; --sur2:#f7f6f2; --bdr:#e0ddd6;
  --txt:#1a1a1a; --mut:#888888; --hint:#bbbbbb;
  --ok:#0F6E56; --warn:#854F0B; --danger:#A32D2D; --info:#236FAD;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--sur2);color:var(--txt);font-size:13px;line-height:1.4}

/* ══════ NAV (TOPBAR) ══════ */
.nav{background:var(--layer);border-bottom:.5px solid rgba(0,0,0,.2);
  display:flex;align-items:center;padding:0 16px;position:sticky;top:0;z-index:50;
  overflow-x:auto;gap:0}
.nav-home{background:none;border:none;color:rgba(255,255,255,.6);font-size:15px;
  cursor:pointer;padding:0 10px 0 0;flex-shrink:0;min-height:44px;min-width:32px}
.nav-home:hover{color:#fff}
.nav-logo{font-size:13px;font-weight:600;padding:12px 14px 12px 0;
  border-right:.5px solid rgba(255,255,255,.2);margin-right:4px;white-space:nowrap;
  flex-shrink:0;color:#fff}
.ver{background:#F9CB42;color:var(--layer);border-radius:4px;padding:1px 6px;
  font-size:10px;font-weight:700;margin-left:4px;vertical-align:middle}
.ntab{padding:0 14px;font-size:12px;color:rgba(255,255,255,.75);cursor:pointer;
  border:none;background:transparent;border-bottom:2.5px solid transparent;
  transition:all .15s;white-space:nowrap;flex-shrink:0;font-family:inherit;min-height:44px}
.ntab:hover{color:#fff}
.ntab.on{color:#fff;border-bottom-color:#fff;font-weight:600}
.nav-r{margin-left:auto;display:flex;gap:5px;align-items:center;padding-left:10px;flex-shrink:0}
.saved{font-size:10px;color:rgba(255,255,255,.7);white-space:nowrap}
.btn-nav{padding:0 12px;border-radius:6px;border:.5px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.12);color:#fff;font-size:11px;cursor:pointer;
  font-family:inherit;transition:opacity .15s;white-space:nowrap;min-height:44px}
.btn-nav:hover{opacity:.85}

/* ══════ PAGES ══════ */
.page{display:none;padding:16px;max-width:1200px;margin:0 auto}
.page.on{display:block}

/* ══════ BUTTONS ══════ */
.btn{padding:5px 12px;border-radius:6px;border:.5px solid var(--bdr);
  background:var(--sur);color:var(--txt);font-size:12px;cursor:pointer;
  font-family:inherit;transition:background .15s;white-space:nowrap;min-height:36px}
.btn:hover{background:var(--sur2)}
.btn-pri{background:var(--layer);color:#fff;border-color:var(--layer);font-weight:600}
.btn-pri:hover{opacity:.85;background:var(--layer)}
.btn-dng{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-sm{padding:3px 8px;font-size:11px;min-height:30px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ══════ CARDS ══════ */
.card{background:var(--sur);border:.5px solid var(--bdr);border-radius:10px;
  padding:16px;margin-bottom:12px}
.card-hdr{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;flex-wrap:wrap;gap:8px}
.card-title{font-size:11px;font-weight:500;color:var(--mut);
  letter-spacing:.05em;text-transform:uppercase}

/* ══════ STAT CARDS ══════ */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat-card{background:var(--sur);border:.5px solid var(--bdr);border-radius:10px;padding:14px 16px}
.stat-n{font-size:26px;font-weight:700}
.stat-l{font-size:10px;color:var(--mut);margin-top:2px;text-transform:uppercase;letter-spacing:.05em}
.stat-sub{font-size:10px;color:var(--hint);margin-top:2px}

/* ══════ TABLES ══════ */
.tw{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:12px}
table.data thead th{background:#2d2d2d;color:#fff;padding:9px 12px;text-align:left;
  font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  white-space:nowrap;position:sticky;top:0}
table.data tbody td{padding:8px 12px;border-bottom:.5px solid var(--bdr);vertical-align:middle}
table.data tbody tr:nth-child(even){background:var(--sur2)}
table.data tbody tr:hover{background:#FFF9E6}

/* ══════ LOADING ══════ */
.loading{text-align:center;padding:40px;color:var(--hint);font-size:12px}
.loading::before{content:'';display:block;width:24px;height:24px;border:2px solid var(--bdr);border-top-color:var(--layer);border-radius:50%;margin:0 auto 10px;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══════ INPUTS ══════ */
input[type=text],input[type=number],input[type=date],select,textarea{
  border:.5px solid var(--bdr);border-radius:6px;padding:6px 10px;
  font-size:12px;font-family:inherit;background:var(--sur);color:var(--txt);
  min-width:120px;box-sizing:border-box}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--layer)}
input.err,select.err,textarea.err{border-color:var(--danger)}
.err-msg{font-size:10px;color:var(--danger);margin-top:2px}

/* ══════ BADGES / TAGS ══════ */
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;white-space:nowrap}
.b-atc{background:rgba(122,176,90,.12);color:var(--d-atc)}
.b-active{background:#E1F5EE;color:var(--ok)}
.b-inactive{background:#FCEBEB;color:var(--danger)}
.b-warn{background:#FFF3CD;color:var(--warn)}

/* ══════ TOOLBAR / PILLS ══════ */
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.dept-row{display:flex;gap:4px;flex-wrap:wrap}
.dept-tag{padding:0 14px;border-radius:16px;border:.5px solid var(--bdr);
  cursor:pointer;font-size:12px;background:var(--sur);color:var(--mut);font-family:inherit;min-height:36px}
.dept-tag:hover{border-color:var(--layer);color:var(--layer)}
.dept-tag.on{background:var(--layer);border-color:var(--layer);color:#fff}

/* ══════ MODAL ══════ */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--sur);border-radius:10px;width:560px;max-width:100%;
  max-height:88vh;overflow-y:auto;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.modal-hdr{padding:14px 20px;border-bottom:.5px solid var(--bdr);display:flex;
  align-items:center;position:sticky;top:0;background:var(--sur);
  border-radius:10px 10px 0 0;z-index:2}
.modal-title{font-size:14px;font-weight:600;flex:1}
.modal-body{padding:16px 20px}
.modal-foot{padding:12px 20px;border-top:.5px solid var(--bdr);display:flex;
  justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--sur);
  border-radius:0 0 10px 10px}
.x-btn{background:none;border:none;font-size:18px;color:var(--mut);cursor:pointer;min-width:36px;min-height:36px}

/* ══════ TOAST ══════ */
.toast{position:fixed;bottom:20px;right:20px;background:var(--txt);color:#fff;
  padding:8px 16px;border-radius:6px;font-size:12px;opacity:0;
  transition:opacity .25s;pointer-events:none;z-index:9999;max-width:80vw}
.toast.show{opacity:1}

/* ══════ MISC ══════ */
.empty{text-align:center;padding:40px 20px;color:var(--hint);font-size:12px}
.tip{font-size:11px;color:var(--mut);margin:8px 0}
.alert{padding:10px 14px;border-radius:6px;font-size:12px;margin-bottom:10px;display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.alert-info{background:#E8F0F7;color:#236FAD;border-left:3px solid #236FAD}
.alert-warn{background:#FFF3CD;color:var(--warn);border-left:3px solid var(--warn)}
.alert-danger{background:#FCEBEB;color:var(--danger);border-left:3px solid var(--danger)}
.alert-ok{background:#E1F5EE;color:var(--ok);border-left:3px solid var(--ok)}
.chip{display:inline-block;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:500;cursor:default;margin:2px;white-space:nowrap}
.chip-layer{background:rgba(90,100,112,.10);color:var(--layer)}
.chip-ok{background:#E1F5EE;color:var(--ok)}
.chip-warn{background:#FFF3CD;color:var(--warn)}
.chip-danger{background:#FCEBEB;color:var(--danger)}
.chip-info{background:#E8F0F7;color:var(--info)}
.chip-muted{background:var(--sur2);color:var(--mut)}
.acc{border:.5px solid var(--bdr);border-radius:8px;margin-bottom:8px;overflow:hidden}
.acc-hdr{padding:10px 14px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:space-between;background:var(--sur);user-select:none;min-height:44px}
.acc-hdr:hover{background:var(--sur2)}
.acc-arrow{font-size:10px;color:var(--mut);transition:transform .2s}
.acc.open .acc-arrow{transform:rotate(180deg)}
.acc-body{display:none;padding:12px 14px;border-top:.5px solid var(--bdr);font-size:12px}
.acc.open .acc-body{display:block}
.progress{height:6px;background:var(--bdr);border-radius:3px;overflow:hidden;margin:4px 0}
.progress-fill{height:100%;border-radius:3px;transition:width .3s}
.progress-ok .progress-fill{background:var(--ok)}
.progress-layer .progress-fill{background:var(--layer)}
.form-row{margin-bottom:12px}
.form-label{font-size:11px;color:var(--mut);display:block;margin-bottom:4px}

/* ══════ 本系统：班级卡 ══════ */
.cls-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.cls-card{background:var(--sur);border:.5px solid var(--bdr);border-radius:10px;padding:10px 12px;text-align:left;
  cursor:pointer;font-family:inherit;color:var(--txt);min-height:44px}
.cls-card:hover{border-color:var(--layer)}
.cls-card.sel{outline:2px solid var(--layer);border-color:var(--layer)}
.cls-card .cn{font-size:14px;font-weight:600}
.cls-card .cs{font-size:10px;color:var(--mut)}
@media(max-width:720px){.cls-row{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* ══════ 本系统：一班一张表 ══════ */
.sheet-hd{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;flex-wrap:wrap;padding:14px 16px 10px}
.sheet-wrap{overflow:auto;max-height:calc(100vh - 120px)}
table.sheet{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
table.sheet thead th{background:#2d2d2d;color:#fff;padding:6px 6px;font-size:12px;font-weight:600;text-align:center;
  position:sticky;top:0;z-index:2;white-space:nowrap}
table.sheet thead th.stk{text-align:left;z-index:3;left:0}
.th-sub{font-size:10px;font-weight:400;opacity:.75}
.mx-btn{background:rgba(255,255,255,.12);border:.5px solid rgba(255,255,255,.3);color:#fff;border-radius:4px;
  font-size:10px;padding:2px 6px;margin-top:2px;cursor:pointer;font-family:inherit;min-height:24px}
table.sheet td{border-bottom:.5px solid var(--bdr);padding:6px 6px;vertical-align:top;background:var(--sur)}
table.sheet tbody tr:nth-child(even) td{background:#fbfaf7}
td.stk{position:sticky;left:0;z-index:1;min-width:170px;max-width:220px;border-right:.5px solid var(--bdr)}
td.nm b{font-weight:600}
td.nm .no{color:var(--hint);font-size:10px;margin-right:6px}
td.nm .sub{font-size:10px;color:var(--mut);margin-top:2px}
td.sc-td{min-width:92px;text-align:center}
td.sc-td.pend{box-shadow:inset 3px 0 0 var(--warn)}
.sc-in{width:100%;min-width:0;font-size:16px;font-weight:600;text-align:center;min-height:40px;padding:4px}
.st-chip{width:100%;min-height:40px;border:.5px dashed var(--bdr);background:var(--sur2);color:var(--mut);
  border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit}
.mx{font-size:10px;color:var(--mut)}
.sc-tools{display:flex;gap:3px;justify-content:center;margin-top:4px}
.mini{min-width:28px;min-height:28px;border:.5px solid var(--bdr);background:var(--sur);border-radius:6px;
  font-size:12px;cursor:pointer;padding:0 4px;font-family:inherit;color:var(--mut)}
.mini.on{background:#E8F0F7;border-color:#c9dcee}
.mini.ok{background:#E1F5EE;color:var(--ok);border-color:#bfe3d4;font-weight:700}
.mini[disabled],.st-chip[disabled]{opacity:.5;cursor:not-allowed}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:720px){td.stk{min-width:120px;max-width:140px}td.nm .sub{display:none}td.sc-td{min-width:78px}}

/* ══════ 本系统：总览格 ══════ */
.ov td.c{text-align:center;cursor:pointer;white-space:nowrap}
.ov td.c:hover{background:#FFF3CD}
.ov .sm{font-size:10px;color:var(--mut);display:block}

/* ══════ 登入闸门 ══════ */
#authgate{display:none;position:fixed;inset:0;z-index:9990;background:rgba(28,31,35,.93);
  align-items:center;justify-content:center;padding:20px}
#authgate .box{background:#fff;border-radius:10px;max-width:460px;width:100%;padding:26px 28px;text-align:center}

/* ══════ RESPONSIVE ══════ */
@media(max-width:768px){.stat-grid{grid-template-columns:repeat(2,1fr)}.modal{width:100%;margin:10px}}
@media(max-width:480px){.ntab{padding:0 10px;font-size:11px}.nav-logo{font-size:12px}
  .nav-sub{display:none}
  .page{padding:12px}.card{padding:12px}}

/* ══════ PRINT ══════ */
@media print{
  @page{margin:12mm 14mm;size:A4 landscape}
  .nav,.btn,.toast,.toolbar,.no-print,#authgate{display:none!important}
  body{font-size:10pt;background:#fff}
  .page{display:none!important}
  #page-overview{display:block!important;padding:0}
  .card{border:none;padding:0;page-break-inside:avoid}
  table.data thead th{background:#333!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.data th,table.data td{border:1px solid #999}
  .print-foot{display:block!important}
}
.print-foot{display:none;font-size:9pt;color:#555;margin-top:8px}
</style>
</head>
<body>

<div id="authgate"><div class="box">
  <div id="ag-icon" style="font-size:34px;line-height:1;margin-bottom:12px">🔒</div>
  <h2 id="ag-title" style="margin:0 0 8px;font-size:18px">请先登入平台</h2>
  <p id="ag-msg" style="margin:0 0 18px;font-size:13px;line-height:1.6;color:#4d545c"></p>
  <button id="ag-btn" class="btn btn-pri" style="width:100%;min-height:44px;font-size:14px"></button>
</div></div>

<!-- ══════ NAV (TOPBAR) ══════ -->
<div class="nav">
  <button class="nav-home" onclick="goPlatform()" title="回平台首页">←</button>
  <div class="nav-logo">SchoolExamGo <span class="nav-sub" style="font-weight:400;opacity:.8">· ATC 学校考试</span> <span class="ver" id="ver-badge">v2</span></div>
  <button class="ntab on" id="ntab-enter" onclick="goPage('enter')">填写</button>
  <button class="ntab" id="ntab-overview" onclick="goPage('overview')">总览</button>
  <button class="ntab" id="ntab-files" onclick="goPage('files')">考卷档案</button>
  <button class="ntab" id="ntab-manage" onclick="goPage('manage')" style="display:none">管理</button>
  <div class="nav-r">
    <span class="saved" id="last-saved"></span>
    <button class="btn-nav" onclick="exportData()">↓ Export</button>
    <button class="btn-nav" onclick="printOverview()">🖨 Print</button>
  </div>
</div>

<!-- ══════ PAGE: 填写 ══════ -->
<div class="page on" id="page-enter">
  <div id="enter-alerts"></div>
  <div class="toolbar">
    <select id="exam-sel" onchange="setExam(this.value)" style="min-height:36px"></select>
    <span class="tip" id="enter-sub" style="margin:0"></span>
  </div>
  <div class="card">
    <div class="card-hdr"><span class="card-title">选一班</span>
      <span class="tip" style="margin:0">📄 考卷 · ✓ 已修正</span></div>
    <div class="cls-row" id="pg"></div>
  </div>
  <div class="card" id="entry-card" style="padding:0;overflow:hidden">
    <div id="entry"></div>
  </div>
</div>

<!-- ══════ PAGE: 总览 ══════ -->
<div class="page" id="page-overview">
  <div class="toolbar no-print">
    <select id="exam-sel2" onchange="setExam(this.value)" style="min-height:36px"></select>
    <div class="dept-row" id="ov-cls"></div>
  </div>
  <div class="stat-grid" id="ov-stats"></div>
  <div id="ov-body"></div>
  <div class="print-foot" id="print-foot"></div>
</div>

<!-- ══════ PAGE: 考卷档案 ══════ -->
<div class="page" id="page-files">
  <div id="files-body"></div>
</div>

<!-- ══════ PAGE: 管理 ══════ -->
<div class="page" id="page-manage">
  <div id="manage-body"></div>
</div>

<!-- ══════ MODAL ══════ -->
<div class="modal-bg" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-hdr"><span class="modal-title" id="modal-title"></span>
      <button class="x-btn" onclick="closeModal()">×</button></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>
<input type="file" id="pdf-input" accept="application/pdf,.pdf" style="display:none" onchange="pdfChosen(event)">

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>

function saveLocal(){

  catch(e){ toast('✕ 这台装置的空间满了 —— 先按 ↓ Export 备份', 4000); }
}
function loadLocal(){

/* ══ 小工具 ══ */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, ms){
  const el=document.getElementById('toast'); el.textContent=msg;
  el.classList.add('show'); clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.remove('show'), ms||2000);
}
function csvCell(v){ const s=String(v==null?'':v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function stamp(){ const d=new Date(), p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes()); }
function fmtSize(b){ if(!b && b!==0) return ''; return b>1048576 ? (b/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(b/1024))+' KB'; }
function plainErr(e){
  const m = String((e && (e.message||e.error_description||e.error)) || e || '');
  if(/Failed to fetch|NetworkError|network/i.test(m)) return '网路连不上';
  if(/row-level security|permission denied|not authorized|403/i.test(m)) return '这个帐号没有权限';
  if(/JWT|expired/i.test(m)) return '登入过期了，请重新整理';
  if(/score_le_max/.test(m)) return '分数比满分还大';
  if(/too large|exceeded|Payload/i.test(m)) return '档案太大（最多 30 MB）';
  if(/mime|content type/i.test(m)) return '只能上传 PDF';
  return '系统暂时出错';
}
function classNo(cid){ const c=CLOUD.classes.find(x=>x.id===cid); const n=c?String(c.class_name||'').replace(/\D/g,''):''; return n?+n:0; }
function className(cid){ const c=CLOUD.classes.find(x=>x.id===cid); return c ? (c.class_name||c.label||cid) : cid; }
function subjOf(c){ return SUBJ.find(s=>s.c===c); }
function subjForClass(cid){ const y=classNo(cid); return SUBJ.filter(s=>!s.minYear || y>=s.minYear); }
function examById(id){ return CLOUD.exams.find(e=>e.id===id)||null; }
function curExam(){ return examById(S.ui.examId); }
function rosterOf(cid){ return CLOUD.roster.filter(r=>r.class_id===cid).sort((a,b)=>(a.num||999)-(b.num||999)||String(a.name).localeCompare(String(b.name))); }
function cuid(examId, sid, subj){ return examId+'|'+sid+'|'+subj; }
function rowOf(sid, subj, examId){
  const k=cuid(examId||S.ui.examId, sid, subj);
  const base=CLOUD.rows[k]||null, p=S.pend[k]||null;
  if(!base && !p) return null;
  return Object.assign({}, base||{}, p?p.f:{});
}
function canEdit(){ return !!(CLOUD.perm && CLOUD.perm.can_edit); }
function canManage(){ return MANAGE_ROLES.indexOf(CLOUD.role)>=0; }
function isFilled(r){ return !!r && ((r.result_state||'SCORED')!=='SCORED' || (r.score!==null && r.score!==undefined && r.score!=='')); }
function pendCount(){ return Object.keys(S.pend).length; }

/* ══ 登入 ══ */
function safeReturnUrl(raw){ try{ const u=new URL(raw, ALLOWED_ORIGIN); return u.origin===ALLOWED_ORIGIN?u.href:null; }catch(e){ return null; } }
function goPlatform(){ location.href=PLATFORM; }
function redirectToPlatformLogin(){
  const url=new URL(PLATFORM); const back=safeReturnUrl(location.href);
  if(back) url.searchParams.set('returnTo', back);
  try{ sessionStorage.setItem('schoolexam_login_bounce','1'); }catch(e){}
  location.replace(url.toString());
}
function shouldAutoLogin(){
  if(location.protocol==='file:') return false;
  if(navigator.onLine===false) return false;
  try{ if(sessionStorage.getItem('schoolexam_login_bounce')==='1') return false; }catch(e){}

}
function authGate(){
  const el=document.getElementById('authgate');
  const T=document.getElementById('ag-title'), M=document.getElementById('ag-msg'),
        B=document.getElementById('ag-btn'), I=document.getElementById('ag-icon');

    B.textContent='去平台登入'; B.onclick=()=>{ location.href=PLATFORM+'?returnTo='+encodeURIComponent(location.href); };

/* ══ 云端：读 ══ */
async function boot(){
  CLOUD.err='';
  if(!window.supabase || !window.supabase.createClient){ CLOUD.checked=true; authGate(); renderAll(); return; }
  try{
    if(!_sb) _sb=window.supabase.createClient(SB_URL, SB_KEY);
    const {data:{session}, error}=await _sb.auth.getSession();
    if(error) throw error;
    CLOUD.session=session||null;
    if(!session){ CLOUD.checked=true; authGate(); renderAll(); return; }
    try{ sessionStorage.removeItem('schoolexam_login_bounce'); }catch(e){}
    const [pr, me, ex, cl, ro] = await Promise.all([
      _sb.rpc('can_access', {p_system:SYS_CODE}),
      _sb.from('users_meta').select('user_id,display_name,role').eq('user_id', session.user.id).maybeSingle(),
      _sb.from('schoolexam_exam').select('*').is('voided_at', null).order('school_year',{ascending:false}).order('created_at',{ascending:false}),
      _sb.from('hub_classes').select('id,class_name,label,status,sort_order').eq('dept','ATC').order('sort_order',{ascending:true}),
      _sb.from('hub_student_memberships').select('student_id,class_id,num,status,end_date,hub_students(id,name,name_cn,school,status)').eq('dept','ATC').eq('status','Enrolled')
    ]);
    if(pr.error) throw pr.error;
    CLOUD.perm = Array.isArray(pr.data)?pr.data[0]:pr.data;
    CLOUD.checked=true;
    if(!CLOUD.perm || CLOUD.perm.can_see!==true){ authGate(); renderAll(); return; }
    if(me.data){ CLOUD.role=me.data.role||''; CLOUD.me=String(me.data.display_name||'').trim().toUpperCase(); }
    if(ex.error) throw ex.error; if(cl.error) throw cl.error; if(ro.error) throw ro.error;
    CLOUD.exams = ex.data||[];
    CLOUD.classes = (cl.data||[]).filter(c=>c.status!=='inactive' && /^ATC_A\d$/.test(c.id));
    const today=new Date().toISOString().slice(0,10);
    CLOUD.roster = (ro.data||[]).filter(m=>m.hub_students && (!m.end_date || m.end_date>=today) && /^ATC_A\d$/.test(m.class_id))
      .map(m=>({ sid:m.student_id, class_id:m.class_id, num:m.num, name:m.hub_students.name||'', name_cn:m.hub_students.name_cn||'', school:m.hub_students.school||'' }));
    CLOUD.rosterAt = new Date();
    if(!examById(S.ui.examId)){ const a=CLOUD.exams.find(e=>e.status==='active')||CLOUD.exams[0]; S.ui.examId=a?a.id:''; }
    if(!CLOUD.classes.find(c=>c.id===S.ui.cls)) S.ui.cls='';
    await loadRows();
    CLOUD.online=true;
    authGate();
    document.getElementById('ntab-manage').style.display = canManage()?'':'none';
    renderAll();
    pushPending();
    autoFileInbox();
  }catch(e){
    console.warn('[SchoolExamGo] boot', e);
    CLOUD.checked=true; CLOUD.err=plainErr(e); CLOUD.online=false;
    authGate(); renderAll();
  }
}
async function loadRows(){
  CLOUD.rows={};
  if(!S.ui.examId){ CLOUD.loadedAt=new Date(); return; }
  let from=0; const size=1000;
  for(;;){
    const r=await _sb.from('schoolexam_result').select('*').eq('exam_id', S.ui.examId).is('voided_at', null).range(from, from+size-1);
    if(r.error) throw r.error;
    (r.data||[]).forEach(x=>{ CLOUD.rows[x.client_uid]=x; });
    if(!r.data || r.data.length<size) break;
    from+=size;
  }
  CLOUD.loadedAt=new Date();
}
async function setExam(id){
  S.ui.examId=id; saveLocal();
  try{ await loadRows(); }catch(e){ toast('✕ 读不到这次考试的资料：'+plainErr(e), 4000); }
  renderAll();
}

/* ══ 云端：写（一格一格存；断线先排队，回来自动送）══ */
let _pushTimer=null, _pushing=false;
function patchRow(sid, subj, fields){
  const ex=curExam(); if(!ex) return;
  const st=CLOUD.roster.find(r=>r.sid===sid); if(!st) return;
  const k=cuid(ex.id, sid, subj);
  const p=S.pend[k]||{ id:{ exam_id:ex.id, student_id:sid, class_id:st.class_id, subject:subj, client_uid:k }, f:{} };
  p.id.class_id = st.class_id;
  Object.assign(p.f, fields, { entered_by: CLOUD.me||null });
  p.at=Date.now();
  S.pend[k]=p; saveLocal(); paintStatus();
  clearTimeout(_pushTimer); _pushTimer=setTimeout(pushPending, 700);
}
async function pushPending(){
  if(_pushing || !_sb || !CLOUD.session) { paintStatus(); return; }
  const keys=Object.keys(S.pend); if(!keys.length){ paintStatus(); return; }
  _pushing=true; paintStatus();
  let ok=0, fail=0, lastErr='';
  for(const k of keys){
    const p=S.pend[k]; if(!p) continue;
    const at=p.at;
    try{
      const body=Object.assign({}, p.id, p.f);
      const r=await _sb.from('schoolexam_result').upsert(body, {onConflict:'client_uid'}).select('*').single();
      if(r.error) throw r.error;
      CLOUD.rows[k]=r.data;
      if(S.pend[k] && S.pend[k].at===at) delete S.pend[k];   /* 送的时候没有再被改过才清掉 */
      ok++;
    }catch(e){
      fail++; lastErr=plainErr(e); console.warn('[SchoolExamGo] push', k, e);
      if(/没有权限|分数比满分/.test(lastErr)){ delete S.pend[k]; }   /* 永远送不上去的不留着卡住 */
    }
  }
  _pushing=false; saveLocal();
  if(fail){ CLOUD.err=lastErr; toast('✕ 有 '+fail+' 笔没存进系统：'+lastErr, 4000); renderEntryStatusOnly(); }
  else if(ok){ CLOUD.err=''; toast('✓ 已存'); if(S.ui.page==='enter') renderEnterAlerts(); }
  paintStatus();
  if(Object.keys(S.pend).length && !fail) setTimeout(pushPending, 500);
  renderProgress();
}
function paintStatus(){
  const el=document.getElementById('last-saved'); if(!el) return;
  const n=pendCount();
  if(!CLOUD.session){ el.textContent=''; return; }
  if(_pushing) el.textContent='正在存 '+n+' 笔…';
  else if(n) el.textContent='待上传 '+n+' 笔';
  else el.textContent=CLOUD.err ? '⚠ '+CLOUD.err : '全部已存 '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}
window.addEventListener('online', ()=>pushPending());

/* ══ 填写页 ══ */
function renderEnterAlerts(){
  const box=document.getElementById('enter-alerts'); const a=[];
  if(CLOUD.checked && !CLOUD.online && CLOUD.session) a.push(`<div class="alert alert-danger">⚠ 读不到系统资料（${esc(CLOUD.err||'网路连不上')}）。没有任何资料被改动。<button class="btn btn-sm" onclick="boot()">↻ 重新读取</button></div>`);
  if(pendCount()) a.push(`<div class="alert alert-warn">还有 ${pendCount()} 笔修改没送进系统 —— 资料先留在这台装置，连上网路会自动送出。<button class="btn btn-sm" onclick="pushPending()">☁ 立刻上传</button></div>`);
  if(CLOUD.online && !canEdit()) a.push(`<div class="alert alert-info">这个帐号只能看，不能填。</div>`);
  box.innerHTML=a.join('');
  const ex=curExam();
  document.getElementById('enter-sub').textContent = ex ? `ATC 1–6 · ${CLOUD.roster.length} 位学生` : '';
}
function cellStats(cid, subj){
  const ros=rosterOf(cid); let filled=0, pdf=0, cor=0;
  ros.forEach(st=>{ const r=rowOf(st.sid, subj); if(isFilled(r)) filled++;
    if(r && r.pdf_state && r.pdf_state!=='NONE') pdf++;
    if(r && r.correction_state==='DONE') cor++; });
  return {n:ros.length, filled, pdf, cor};
}
function classStats(cid){
  let need=0, filled=0, pdf=0, cor=0;
  subjForClass(cid).forEach(s=>{ const st=cellStats(cid, s.c); need+=st.n; filled+=st.filled; pdf+=st.pdf; cor+=st.cor; });
  return {need, filled, pdf, cor};
}
/* ══ v2 · Owner 2026-11-03：「一整页都是同一班学生，左边学生名字，右边一格一科」══
   上面一排班级卡（看得到每班填到哪），点一班 → 下面整班一张表：
   一行一位学生，一格一科，直接在格子里打分数；格子下面两颗小钮：考卷 📎/📄、修正 ✎/✓；
   「⋯」改成 没考这科 / 缺考 / 卷没拿回。Enter 往下一位（同一科），Tab 往右一科。 */
function renderProgress(){
  const box=document.getElementById('pg'); if(!box) return;
  if(!CLOUD.classes.length){ box.innerHTML=`<div class="empty">${CLOUD.checked?'读不到 ATC 班级':'载入中…'}</div>`; return; }
  if(!S.ui.cls || !CLOUD.classes.find(c=>c.id===S.ui.cls)) S.ui.cls=CLOUD.classes[0].id;
  box.innerHTML=CLOUD.classes.map(c=>{
    const st=classStats(c.id); const pct=st.need?Math.round(st.filled/st.need*100):0;
    return `<button class="cls-card${S.ui.cls===c.id?' sel':''}${st.need&&st.filled===st.need?' done':''}" onclick="pickClass('${c.id}')">
      <div class="cn">${esc(c.class_name||c.id)}</div>
      <div class="cs">${rosterOf(c.id).length} 位 · 已填 ${pct}%</div>
      <div class="progress progress-ok"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="cs">📄 ${st.pdf} · ✓ ${st.cor}</div></button>`;
  }).join('');
}
function pickClass(cid){ S.ui.cls=cid; saveLocal(); renderProgress(); renderEntry(); }
function pickCell(cid, subj){ S.ui.cls=cid; S.ui.focusSubj=subj; saveLocal(); renderProgress(); renderEntry();
  const el=document.querySelector(`#entry input[data-subj="${subj}"]`); if(el && !el.disabled) el.focus(); }
function commonMax(cid, subj){
  const vals=rosterOf(cid).map(st=>{ const r=rowOf(st.sid, subj); return r&&r.max_score!=null?+r.max_score:100; });
  const u=[...new Set(vals)]; return u.length===1?u[0]:null;
}
function cellHTML(st, s, ed){
  const r=rowOf(st.sid, s.c)||{}; const state=r.result_state||'SCORED';
  const pend=!!S.pend[cuid(S.ui.examId, st.sid, s.c)];
  const mx=r.max_score!=null?+r.max_score:100;
  const hasPdf=r.pdf_state && r.pdf_state!=='NONE';
  const box = state==='SCORED'
    ? `<input type="text" inputmode="decimal" class="sc-in" id="sc-${esc(st.sid)}-${s.c}" data-sid="${esc(st.sid)}" data-subj="${s.c}"
        value="${r.score==null?'':Number(r.score)}" ${ed?'':'disabled'} placeholder="—"
        onchange="setScore('${st.sid}','${s.c}',this)" onkeydown="scoreKey(event,'${st.sid}','${s.c}')">`
    : `<button class="st-chip" ${ed?'':'disabled'} onclick="openCellMenu('${st.sid}','${s.c}')">${RSTATE[state]}</button>`;
  return `<td class="sc-td${pend?' pend':''}">
    ${box}${mx!==100&&state==='SCORED'?`<div class="mx">/ ${mx}</div>`:''}
    <div class="sc-tools">
      <button class="mini${hasPdf?' on':''}" title="${hasPdf?(r.pdf_state==='INBOX'?'看考卷（待收进 P 槽）':'看考卷'):'上传考卷'}" onclick="pdfAction('${st.sid}','${s.c}')">${hasPdf?(r.pdf_state==='INBOX'?'📄…':'📄'):'📎'}</button>
      <button class="mini${r.correction_state==='DONE'?' ok':''}" title="${r.correction_state==='DONE'?'已修正':'未修正'}" ${ed?'':'disabled'} onclick="toggleCor('${st.sid}','${s.c}')">${r.correction_state==='DONE'?'✓':'✎'}</button>
      <button class="mini" title="没考 / 缺考 / 卷没拿回 / 换考卷" ${ed?'':'disabled'} onclick="openCellMenu('${st.sid}','${s.c}')">⋯</button>
    </div></td>`;
}
function renderEntry(){
  const box=document.getElementById('entry'); const ex=curExam();

    </div>

      return `<th><div>${s.zh}</div><div class="th-sub">${st.filled}/${st.n}</div>

    </tr></thead><tbody>`;

function renderEntryStatusOnly(){ if(S.ui.page==='enter') renderEntry(); renderEnterAlerts(); }
function refreshCell(sid, subj){

/* ══ 考卷 PDF ══
   电脑（Chrome / Edge）：连接一次 P 槽资料夹，之后原档直接写进去，资料库只记档名。
   手机 / 没连接：先放云端「待收」区；电脑打开时自动搬进 P 槽，再从云端删掉。 */
const FS_OK = typeof window.showDirectoryPicker==='function';
let PROOT=null, PROOT_OK=false;
function idb(){ return new Promise((res,rej)=>{ const q=indexedDB.open('schoolexamgo',1);
  q.onupgradeneeded=()=>q.result.createObjectStore('kv'); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
async function kvGet(k){ try{ const d=await idb(); return await new Promise(r=>{ const t=d.transaction('kv').objectStore('kv').get(k); t.onsuccess=()=>r(t.result); t.onerror=()=>r(null); }); }catch(e){ return null; } }
async function kvSet(k,v){ try{ const d=await idb(); await new Promise(r=>{ const t=d.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=r; t.onerror=r; }); }catch(e){} }
async function loadPRoot(){
  if(!FS_OK) return;
  PROOT = await kvGet('proot');
  if(PROOT && PROOT.queryPermission){
    try{ PROOT_OK = (await PROOT.queryPermission({mode:'readwrite'}))==='granted'; }catch(e){ PROOT_OK=false; }
  }
}
async function ensurePRoot(interactive){
  if(!FS_OK) return false;
  if(PROOT && PROOT_OK) return true;
  if(PROOT && interactive){
    try{ PROOT_OK = (await PROOT.requestPermission({mode:'readwrite'}))==='granted'; }catch(e){ PROOT_OK=false; }
    if(PROOT_OK) return true;
  }
  return false;
}
async function connectP(){
  if(!FS_OK){ toast('✕ 这台装置不能连接 P 槽（要用电脑的 Chrome 或 Edge）', 3500); return; }
  try{
    const h=await window.showDirectoryPicker({id:'schoolexamgo', mode:'readwrite'});
    PROOT=h; PROOT_OK=true; await kvSet('proot', h);
    toast('✓ 已连接资料夹「'+h.name+'」'); renderPage(); autoFileInbox();
  }catch(e){ if(e && e.name!=='AbortError') toast('✕ 没连上：'+(e.message||e), 3500); }
}
function safeName(s){ return String(s||'').replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim(); }
function pdfParts(ex, classId, st, subj){
  const n=classNo(classId); const sj=subjOf(subj);
  return { dirs:[`${ex.school_year}_Exam Papers`, safeName(ex.label), `ATC ${n}`],
           file: safeName(`A${n} ${st.name} ${sj?sj.zh:subj} ${ex.label}`)+'.pdf' };
}
async function writeToP(parts, blob){
  let d=PROOT;
  for(const x of parts.dirs) d=await d.getDirectoryHandle(x, {create:true});
  /* 已经有同名档 → 旧的先另存一份（名字后面加「旧 时间」），不盖掉 */
  try{
    const old=await d.getFileHandle(parts.file, {create:false});
    const of=await old.getFile();
    const bak=await d.getFileHandle(parts.file.replace(/\.pdf$/i, ` (旧 ${stamp()}).pdf`), {create:true});
    const w0=await bak.createWritable(); await w0.write(of); await w0.close();
  }catch(e){ /* 没有旧档 */ }
  const fh=await d.getFileHandle(parts.file, {create:true});
  const w=await fh.createWritable(); await w.write(blob); await w.close();
  return parts.dirs.concat([parts.file]).join('\\');
}
async function readFromP(rel){
  const seg=String(rel).split(/[\\/]/); let d=PROOT;
  for(let i=0;i<seg.length-1;i++) d=await d.getDirectoryHandle(seg[i]);
  const fh=await d.getFileHandle(seg[seg.length-1]); return await fh.getFile();
}
let _pdfFor=null;
function pdfPick(sid, subj){
  if(!canEdit()){ toast('✕ 这个帐号不能上传'); return; }
  _pdfFor={sid, subj}; const el=document.getElementById('pdf-input'); el.value=''; el.click();
}
async function pdfAction(sid, subj){
  const r=rowOf(sid, subj)||{};
  if(!r.pdf_state || r.pdf_state==='NONE'){ pdfPick(sid, subj); return; }
  const w=window.open('', '_blank');   /* 先开分页（不会被挡），档案准备好再放进去 */
  try{
    let blob=null;
    if(r.pdf_state==='FILED'){
      if(!(await ensurePRoot(true))){ if(w) w.close();
        toast(FS_OK?'✕ 这份考卷在 P 槽 —— 先到「考卷档案」连接 P 槽资料夹':'这份考卷已经收进 P 槽，要在办公室电脑上看', 4000); return; }
      blob=await readFromP(r.pdf_file);
    }else{
      const s=await _sb.storage.from(BUCKET).createSignedUrl(r.pdf_inbox_path, 600);
      if(s.error) throw s.error;
      if(w){ w.location=s.data.signedUrl; return; } else { location.href=s.data.signedUrl; return; }
    }
    const url=URL.createObjectURL(new Blob([blob],{type:'application/pdf'}));
    if(w) w.location=url; else window.open(url,'_blank');
  }catch(e){ if(w) w.close(); console.warn('[SchoolExamGo] open pdf', e); toast('✕ 打不开：'+(e&&e.name==='NotFoundError'?'P 槽里找不到这个档（被搬走或改名了？）':plainErr(e)), 4000); }
}
async function pdfChosen(ev){
  const f=ev.target.files && ev.target.files[0]; const pf=_pdfFor; _pdfFor=null;
  if(!f || !pf) return; const sid=pf.sid, subj=pf.subj;
  if(!/pdf$/i.test(f.type) && !/\.pdf$/i.test(f.name)){ toast('✕ 只能上传 PDF', 3000); return; }
  if(f.size>MAX_PDF){ toast('✕ 档案太大（'+fmtSize(f.size)+'），最多 30 MB', 3500); return; }
  const ex=curExam(); const st=CLOUD.roster.find(x=>x.sid===sid);
  if(!ex || !st) return;
  const before=rowOf(sid, subj)||{};
  toast('上传中…', 10000);
  try{
    if(await ensurePRoot(false)){
      const rel=await writeToP(pdfParts(ex, st.class_id, st, subj), f);
      patchRow(sid, subj, {pdf_state:'FILED', pdf_file:rel, pdf_inbox_path:null, pdf_bytes:f.size, pdf_by:CLOUD.me||null, pdf_at:new Date().toISOString()});
      if(before.pdf_state==='INBOX' && before.pdf_inbox_path){ try{ await _sb.storage.from(BUCKET).remove([before.pdf_inbox_path]); }catch(e){} }
      toast('✓ 已存进 P 槽：'+rel.split('\\').pop(), 3000);
    }else{
      if(!_sb || !CLOUD.session) throw new Error('Failed to fetch');
      const path=`${ex.id}/${st.class_id}/${sid}_${subj}.pdf`;
      const up=await _sb.storage.from(BUCKET).upload(path, f, {upsert:true, contentType:'application/pdf'});
      if(up.error) throw up.error;
      patchRow(sid, subj, {pdf_state:'INBOX', pdf_inbox_path:path, pdf_bytes:f.size, pdf_by:CLOUD.me||null, pdf_at:new Date().toISOString()});
      toast('✓ 已上传（办公室电脑打开时会自动收进 P 槽）', 3500);
    }
  }catch(e){ console.warn('[SchoolExamGo] upload', e); toast('✕ 没上传成功：'+plainErr(e), 4000); }
  if(S.ui.page==='enter'){ refreshCell(sid, subj); refreshSheetCounts(); }
}
/* 待收 → P 槽 */
let _filing=false;
async function loadInbox(){
  if(!_sb || !CLOUD.session) return [];
  const r=await _sb.from('schoolexam_result').select('*').eq('pdf_state','INBOX').is('voided_at', null).limit(1000);
  if(r.error) throw r.error; CLOUD.inbox=r.data||[]; return CLOUD.inbox;
}
let _inboxBusy=false;
async function refreshInbox(){
  if(_inboxBusy || !_sb || !CLOUD.session) return;
  _inboxBusy=true;
  try{ await loadInbox(); }catch(e){ console.warn('[SchoolExamGo] inbox', e); }
  _inboxBusy=false;
  if(S.ui.page==='files') renderFiles();
}
async function autoFileInbox(){ if(FS_OK && PROOT_OK && canEdit()) fileInbox(false); else { try{ await loadInbox(); }catch(e){} if(S.ui.page==='files') renderFiles(); } }
async function fileInbox(interactive){
  if(_filing) return;
  if(!(await ensurePRoot(!!interactive))){ if(interactive) toast('✕ 先连接 P 槽资料夹'); return; }
  _filing=true; let ok=0, fail=0;
  try{
    const list=await loadInbox();
    for(const r of list){
      const ex=examById(r.exam_id); const st=CLOUD.roster.find(x=>x.sid===r.student_id) || {name:r.student_id};
      if(!ex){ fail++; continue; }
      try{
        const dl=await _sb.storage.from(BUCKET).download(r.pdf_inbox_path); if(dl.error) throw dl.error;
        const rel=await writeToP(pdfParts(ex, r.class_id, st, r.subject), dl.data);
        const up=await _sb.from('schoolexam_result').update({pdf_state:'FILED', pdf_file:rel, pdf_inbox_path:null})
          .eq('id', r.id).eq('pdf_state','INBOX').select('*');
        if(up.error) throw up.error;
        if(up.data && up.data[0]){ CLOUD.rows[up.data[0].client_uid]=up.data[0];
          const pk=S.pend[up.data[0].client_uid]; if(pk && pk.f){ delete pk.f.pdf_state; delete pk.f.pdf_inbox_path; delete pk.f.pdf_file; } }
        await _sb.storage.from(BUCKET).remove([r.pdf_inbox_path]);
        ok++;
      }catch(e){ fail++; console.warn('[SchoolExamGo] file inbox', r.id, e); }
    }
    await loadInbox();
  }catch(e){ fail++; console.warn('[SchoolExamGo] inbox', e); }
  _filing=false;
  if(ok) toast('✓ 已收进 P 槽 '+ok+' 份'+(fail?' · '+fail+' 份没成功':''), 3500);
  else if(fail) toast('✕ 有 '+fail+' 份没收进 P 槽', 3500);
  renderPage();
}

  h+='</div>';
  /* 有分数、没考卷 */
  if(ex){
    const miss={};
    CLOUD.classes.forEach(c=>subjForClass(c.id).forEach(s=>rosterOf(c.id).forEach(st=>{
      const r=rowOf(st.sid, s.c);
      if(r && (r.result_state||'SCORED')==='SCORED' && r.score!=null && (!r.pdf_state || r.pdf_state==='NONE')) (miss[c.id]=miss[c.id]||[]).push(`${st.name} · ${s.zh}`);
    })));
    const n=Object.values(miss).reduce((a,x)=>a+x.length,0);
    h+=`<div class="card"><div class="card-hdr"><span class="card-title">有分数、还没上传考卷 · ${n}</span></div>`;
    if(!n) h+='<div class="empty">没有</div>';
    else h+=Object.keys(miss).map(cid=>`<div style="margin-bottom:8px"><b>${esc(className(cid))}</b> <span class="chip chip-warn">${miss[cid].length}</span><div class="tip" style="margin:4px 0 0">${miss[cid].map(esc).join('、')}</div></div>`).join('');
    h+='</div>';
  }
  box.innerHTML=h;
}

/* ══ 管理页（院长 / 管理员）══ */
function renderManage(){
  if(!canManage()){ document.getElementById('manage-body').innerHTML=''; return; }
  const P=CLOUD.perm||{}; const yn=b=>b?'✓':'✗';
  const nRows=Object.keys(CLOUD.rows).length;
  let h=`<div class="card"><div class="card-hdr"><span class="card-title">① 我的身份</span></div>
    <div style="font-size:12px;line-height:2">${esc(CLOUD.me||'—')} · ${esc(CLOUD.role||'—')} · 查看 ${yn(P.can_see)} · 填写 ${yn(P.can_edit)} · 删除 / 覆盖 ${yn(P.can_approve)}</div></div>
  <div class="card"><div class="card-hdr"><span class="card-title">② 系统资讯</span></div>
    <div style="font-size:12px;line-height:2">系统：<b>${SYS_NAME}</b><br>版本：<b>v${APP_VERSION}</b><br>层：<b>RPT</b> · 权限沿用 EvalGo_ATC<br>这次考试资料：<b>${nRows}</b> 笔</div></div>
  <div class="card"><div class="card-hdr"><span class="card-title">③ 云端连线</span></div>
    <div style="font-size:12px;line-height:2">${CLOUD.online?'✓ 已连线':'✗ 没连上'}${CLOUD.err?' · 最近错误：'+esc(CLOUD.err):''}<br>待上传：<b>${pendCount()}</b> 笔<br>
    学生名单：MasterHub · ATC ${CLOUD.roster.length} 位 · 读取于 ${CLOUD.rosterAt?CLOUD.rosterAt.toLocaleTimeString('en-GB'):'—'}</div>
    <div class="toolbar" style="margin:8px 0 0"><button class="btn" onclick="pushPending()">☁ 立刻上传</button><button class="btn" onclick="boot()">↻ 重新读取</button></div></div>
  <div class="card"><div class="card-hdr"><span class="card-title">④ 考试设定</span>
      <button class="btn btn-pri" ${P.can_approve?'':'disabled'} onclick="openAddExam()">+ 新增考试</button></div>
    ${CLOUD.exams.length?`<div class="tw"><table class="data"><thead><tr><th>考试</th><th>年份</th><th>年头 / 年尾</th><th>状态</th><th></th></tr></thead><tbody>
    ${CLOUD.exams.map(e=>`<tr><td><b>${esc(e.label)}</b></td><td>${e.school_year}</td><td>${TERM[e.term]||e.term}</td>
      <td>${e.status==='active'?'<span class="badge b-active">进行中</span>':'<span class="badge b-warn">已结束</span>'}</td>
      <td><button class="btn btn-sm" ${P.can_approve?'':'disabled'} onclick="toggleExam('${e.id}')">${e.status==='active'?'设为已结束':'重新开放'}</button></td></tr>`).join('')}
    </tbody></table></div>`:'<div class="empty">还没有考试</div>'}</div>
  <div class="card"><div class="card-hdr"><span class="card-title">⑤ 资料备份</span></div>
    <div class="toolbar" style="margin:0"><button class="btn" onclick="exportData()">↓ 下载备份档</button><button class="btn" onclick="exportCSV()">↓ 下载表格（Excel 可开）</button><button class="btn" onclick="printOverview()">🖨 列印总览</button></div></div>
  <div class="acc${S.ui.advOpen?' open':''}" id="adv"><div class="acc-hdr" onclick="S.ui.advOpen=!S.ui.advOpen;saveLocal();document.getElementById('adv').classList.toggle('open')">⑥ 进阶 · 管理员用 <span class="acc-arrow">▼</span></div>
    <div class="acc-body" style="line-height:1.9">
      资料表：schoolexam_exam · schoolexam_result（不能删；作废要写原因）<br>
      手机上传的待收区：${BUCKET}（私有、只收 PDF、最多 30 MB；收进 P 槽后会删掉）<br>
      P 槽档名：&lt;资料夹&gt;\\&lt;年&gt;_Exam Papers\\&lt;考试&gt;\\ATC n\\An 名字 科目 考试.pdf · 同名的旧档会另存「(旧 时间)」不会被盖掉<br>
      本机暂存：${STORAGE_KEY}</div></div>`;
  document.getElementById('manage-body').innerHTML=h;
}
function openAddExam(){
  const y=new Date().getFullYear();
  document.getElementById('modal-title').textContent='新增考试';
  document.getElementById('modal-body').innerHTML=`
    <div class="form-row"><label class="form-label">年份 <span style="color:var(--danger)">*</span></label><input type="text" inputmode="numeric" id="ne-year" value="${y}" style="width:100%"></div>
    <div class="form-row"><label class="form-label">年头 / 年尾 <span style="color:var(--danger)">*</span></label>
      <select id="ne-term" style="width:100%" onchange="neLabel()"><option value="MID">年头</option><option value="END" selected>年尾</option><option value="OTHER">其他</option></select></div>
    <div class="form-row"><label class="form-label">名称 <span style="color:var(--danger)">*</span></label><input type="text" id="ne-label" style="width:100%"></div>
    <div class="tip">名称也是 P 槽里的资料夹名，例：「${y} 年尾 UASA」</div>`;
  document.getElementById('modal-foot').innerHTML=`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-pri" onclick="saveExam()">Save</button>`;
  document.getElementById('modal').style.display='flex'; neLabel();
  document.getElementById('ne-year').oninput=neLabel;
}
function neLabel(){ const y=document.getElementById('ne-year').value.trim(), t=document.getElementById('ne-term').value;
  document.getElementById('ne-label').value = t==='OTHER' ? '' : `${y} ${TERM[t]} UASA`; }
async function saveExam(){
  const y=+document.getElementById('ne-year').value, t=document.getElementById('ne-term').value, l=document.getElementById('ne-label').value.trim();
  if(!(y>=2024 && y<=2100) || !l){ toast('✕ 年份与名称都要填'); return; }
  try{
    const code=`ATC-${y}-${t}-${Date.now().toString(36).toUpperCase()}`;
    const r=await _sb.from('schoolexam_exam').insert({code, label:l, school_year:y, term:t, client_uid:'ui-'+code}).select('*').single();
    if(r.error) throw r.error;
    CLOUD.exams.unshift(r.data); S.ui.examId=r.data.id; saveLocal(); closeModal(); await loadRows();
    toast('✓ 已新增「'+l+'」'); renderAll();
  }catch(e){ toast('✕ 没存：'+plainErr(e), 3500); }
}
async function toggleExam(id){
  const e=examById(id); if(!e) return; const to=e.status==='active'?'completed':'active';
  if(to==='completed' && !confirm(`把「${e.label}」设为已结束？\n\n资料都留着，之后还能重新开放。`)) return;
  try{ const r=await _sb.from('schoolexam_exam').update({status:to}).eq('id', id).select('*').single();
    if(r.error) throw r.error; Object.assign(e, r.data); toast('✓ 已更新'); renderAll();
  }catch(err){ toast('✕ 没改成：'+plainErr(err), 3500); }
}
function closeModal(){ document.getElementById('modal').style.display='none'; }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

/* ══ Export ══ */
function flatRows(){
  const ex=curExam(); const out=[];
  if(!ex) return out;
  CLOUD.classes.forEach(c=>subjForClass(c.id).forEach(s=>rosterOf(c.id).forEach(st=>{
    const r=rowOf(st.sid, s.c)||{};
    out.push({ 班:className(c.id), 学生编号:st.sid, 英文名:st.name, 中文名:st.name_cn, 学校:st.school, 科目:s.zh,
      分数: r.score==null?'':Number(r.score), 满分: r.max_score==null?100:Number(r.max_score),
      状况: RSTATE[r.result_state||'SCORED'] + (((r.result_state||'SCORED')==='SCORED' && r.score==null)?'（未填）':''),
      修正: r.correction_state==='DONE'?'已修正':'未修正',
      考卷: r.pdf_state==='FILED'?('P 槽：'+r.pdf_file):(r.pdf_state==='INBOX'?'待收':'没有') });
  })));
  return out;
}
function download(name, data, type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type}));
  a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000); }
function exportData(){
  const ex=curExam();
  const data={ meta:{ system:SYS_NAME, version:APP_VERSION, exported_at:new Date().toISOString(), exam:ex?ex.label:'' },
    exam:ex, rows:Object.values(CLOUD.rows), pending:S.pend };
  download(`${SYS_NAME}_${stamp()}.json`, JSON.stringify(data,null,2), 'application/json'); toast('✓ 已下载备份档');
}
function exportCSV(){
  const rows=flatRows(); if(!rows.length){ toast('没有资料'); return; }
  const cols=Object.keys(rows[0]);
  const csv='\ufeff'+[cols.join(',')].concat(rows.map(r=>cols.map(c=>csvCell(r[c])).join(','))).join('\n');
  download(`${SYS_NAME}_${stamp()}.csv`, csv, 'text/csv;charset=utf-8'); toast('✓ 已下载表格');
}

/* ══ 开始 ══ */
loadLocal();
document.getElementById('ver-badge').textContent='v'+APP_VERSION;
document.title='SchoolExamGo — ATC 学校考试 v'+APP_VERSION;
(async()=>{ await loadPRoot(); goPage(S.ui.page==='manage'?'enter':(S.ui.page||'enter')); await boot(); })();
</script>
