<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ObsGo — Workspace</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f7f6f2;color:#1a1a1a}
#boot{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{max-width:520px;background:#fff;border:1px solid #e0ddd6;border-radius:16px;padding:24px;box-shadow:0 10px 28px rgba(42,36,26,.07)}small{color:#6f7785}
</style>
</head>
<body>
<div id="boot"><div class="card"><b>ObsGo Workspace</b><br><small>正在载入日常巡班工作区…</small></div></div>
<script>
(async function(){
  const FAIL=(m)=>{document.getElementById('boot').innerHTML='<div class="card"><b>Workspace 无法安全载入</b><br><small>'+String(m).replace(/[&<>]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[s]))+'</small></div>';};
  try{
    let h=await fetch('./ObsGo.html?workspace=v8',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('ObsGo source HTTP '+r.status);return r.text();});
    const required=['<div id="team-panel"></div>',"function canSeeManage(){","if(canSeeManage()) refreshTeam();","管理层要看的是<strong>全班</strong>"];
    const miss=required.filter(x=>!h.includes(x));
    if(miss.length) throw new Error('Source contract changed; workspace patch fail-closed ('+miss.length+' marker missing)');
    h=h.replace('<title>ObsGo — 巡班观察 v7</title>','<title>ObsGo — Workspace v8</title>');
    h=h.replace('<div id="team-panel"></div>','');
    h=h.replace("function canSeeManage(){\n  const r=(CLOUD.who&&CLOUD.who.role)||'';\n  return MANAGE_ROLES.indexOf(r)>=0;   /* MGMT / TEACHER / MARKETING 一律挡 */\n}","function canSeeManage(){ return false; }");
    h=h.replace("if(canSeeManage()) refreshTeam();","/* Workspace v8: Management data intentionally not loaded here. */");
    h=h.replace("who={initials:(m.data.display_name||'').toUpperCase(), role:m.data.role||''};","who={uid:uidNow, initials:(m.data.display_name||'').toUpperCase(), role:m.data.role||''};");
    h=h.replace(".eq('created_by', me);",".eq('created_by_uid', (CLOUD.who&&CLOUD.who.uid)||'');");
    h=h.replace("created_by:(CLOUD.who&&CLOUD.who.initials)||null,","created_by:(CLOUD.who&&CLOUD.who.initials)||null,\n            created_by_uid:(CLOUD.who&&CLOUD.who.uid)||null,");
    h=h.replace('管理层要看的是<strong>全班</strong>。看到谁就加入谁，分几次巡完也可以。<strong>没被加入 ≠ 低分。</strong>','这次巡班目标是<strong>覆盖全班</strong>；可以分几次完成。<strong>没被加入 ≠ 低分。</strong>');
    h=h.replace("if(canSeeManage()){\n      sc.style.display='';","if(false){\n      sc.style.display='';");
    h=h.replace("if(canSeeManage() && UIH.scope==='team'){","if(false && UIH.scope==='team'){");
    h=h.replace("<button class=\"ntab\" id=\"nt-manage\" data-nt=\"manage\" onclick=\"goScreen('manage')\" style=\"display:none\">设定</button>","");
    h=h.replace("<button class=\"sync\" id=\"sync-chip\" onclick=\"goScreen('manage')\" title=\"同步状态\">","<button class=\"sync\" id=\"sync-chip\" onclick=\"cloudPush(false)\" title=\"同步状态\">");
    document.open();document.write(h);document.close();
  }catch(e){FAIL(e&&e.message?e.message:e);}
})();
</script>
</body>
</html>
