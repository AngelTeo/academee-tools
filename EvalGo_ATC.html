<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EvalGo_ATC · Multi-Paper</title>
<style>
:root{
  /* ══ LAYER ══ RPT = 文档灰 */
  --layer:#5A6470;

  /* ══ 部门色 (永不改) ══ */
  --d-srk:#C45C5C; --d-gak:#E8A04E; --d-atc:#7AB05A; --d-srt:#8B6CAE;

  /* ══ 中性色 ══ */
  --sur:#ffffff; --sur2:#f7f6f2; --bdr:#e0ddd6;
  --txt:#1a1a1a; --mut:#888888; --hint:#bbbbbb;

  /* ══ 语义色 ══ */
  --ok:#0F6E56; --warn:#854F0B; --danger:#A32D2D; --info:#236FAD;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
  background:var(--sur2);color:var(--txt);font-size:13px;line-height:1.4}

/* ══════ NAV (TOPBAR) ══════ */
.nav{background:var(--layer);border-bottom:.5px solid rgba(0,0,0,.2);
  display:flex;align-items:center;padding:0 16px;position:sticky;top:0;z-index:50;
  overflow-x:auto;gap:0}
.nav-logo{font-size:13px;font-weight:600;padding:12px 14px 12px 0;
  border-right:.5px solid rgba(255,255,255,.2);margin-right:4px;white-space:nowrap;
  flex-shrink:0;color:#fff}
.ver{background:#F9CB42;color:var(--layer);border-radius:4px;padding:1px 6px;
  font-size:10px;font-weight:700;margin-left:4px;vertical-align:middle}
.ntab{padding:11px 14px;font-size:11px;color:rgba(255,255,255,.7);cursor:pointer;
  border:none;background:transparent;border-bottom:2.5px solid transparent;
  transition:all .15s;white-space:nowrap;flex-shrink:0;font-family:inherit}
.ntab:hover{color:#fff}
.ntab.on{color:#fff;border-bottom-color:#fff;font-weight:600}
.nav-r{margin-left:auto;display:flex;gap:5px;align-items:center;padding-left:10px;flex-shrink:0}
.saved{font-size:10px;color:rgba(255,255,255,.55);white-space:nowrap}
.btn-nav{padding:5px 12px;border-radius:6px;border:.5px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.12);color:#fff;font-size:11px;cursor:pointer;
  font-family:inherit;transition:opacity .15s;white-space:nowrap}
.btn-nav:hover{opacity:.85}

/* ══════ SUB NAV ══════ */
.sub-nav{background:var(--sur);border-bottom:.5px solid var(--bdr);
  padding:0 16px;gap:2px;position:sticky;top:56px;z-index:49;
  display:flex;overflow-x:auto;align-items:center;min-height:38px}
.sub-ntab{padding:9px 14px;font-size:11px;color:var(--mut);cursor:pointer;
  border:none;background:transparent;border-bottom:2px solid transparent;
  transition:all .15s;white-space:nowrap;flex-shrink:0;font-family:inherit}
.sub-ntab:hover{color:var(--txt)}
.sub-ntab.on{color:var(--layer);border-bottom-color:var(--layer);font-weight:600}
/* v28 · 对齐 ObsGo：每一页顶端一个标题区（eyebrow + h1）。数值照抄 ObsGo，不自己调。 */
.hero{padding:18px 4px 14px}
.hero .eyebrow{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--layer)}
.hero h1{font-size:26px;line-height:1.18;margin:8px 0 6px;font-weight:700}
.hero .sub{font-size:12.5px;color:var(--mut);margin-top:2px;line-height:1.5}
@media(max-width:480px){.hero h1{font-size:22px}}
/* v28：唯读遮罩已移除（Owner 裁定：选了就能填）。
   .ro-keep 这个 class 还留在几张卡上，没有任何样式，无害；下一版顺手清。 */

/* ══════ PAGES ══════ */
.page{display:none;padding:16px;max-width:1200px;margin:0 auto}
.page.on{display:block}

/* ══════ BUTTONS ══════ */
.btn{padding:5px 12px;border-radius:6px;border:.5px solid var(--bdr);
  background:var(--sur);color:var(--txt);font-size:11px;cursor:pointer;
  font-family:inherit;transition:background .15s;white-space:nowrap}
.btn:hover{background:var(--sur2)}
.btn-pri{background:var(--layer);color:#fff;border-color:var(--layer);font-weight:600}
.btn-pri:hover{opacity:.85}
.btn-dng{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-sm{padding:3px 8px;font-size:10px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ══════ CARDS ══════ */
.card{background:var(--sur);border:.5px solid var(--bdr);border-radius:10px;
  padding:16px;margin-bottom:12px}
.card-hdr{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;flex-wrap:wrap;gap:8px}
.card-title{font-size:11px;font-weight:500;color:var(--mut);
  letter-spacing:.05em;text-transform:uppercase}

/* ══════ STAT CARDS ══════ */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat-card{background:var(--sur);border:.5px solid var(--bdr);border-radius:10px;padding:14px 16px}
.stat-n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.stat-l{font-size:10px;color:var(--mut);margin-top:2px;text-transform:uppercase;letter-spacing:.05em}
.stat-sub{font-size:10px;color:var(--hint);margin-top:2px}

/* ══════ TABLES ══════ */
table.data{width:100%;border-collapse:collapse;font-size:12px}
table.data thead th{background:#2d2d2d;color:#fff;padding:9px 12px;text-align:left;
  font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
table.data tbody td{padding:8px 12px;border-bottom:.5px solid var(--bdr);vertical-align:middle}
table.data tbody tr:nth-child(even){background:var(--sur2)}
table.data tbody tr:hover{background:#FFF9E6}
.tw{overflow-x:auto}

/* ══ v40 · 四方形任课老师 Stamp ══
   Owner 2026-09-15：「只在左边加入一个四方形的 Stamp，里面是真正负责老师的字母」。
   灰框 = 这位有学生资料；红框 = 一笔都没有；虚线 = 这一格还没排人。 */
.tstamp{display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:5px;border:2px solid var(--layer);
  font-weight:800;color:var(--layer);background:#fff;letter-spacing:.3px;flex-shrink:0}
.tstamp.s3{font-size:10px} .tstamp.s2{font-size:12px}
.tstamp.miss{border-color:var(--danger);color:var(--danger);background:#fdf1f1}
.tstamp.none{border-style:dashed;border-color:#ccc;color:#ccc;font-size:9px;font-weight:700;
  width:auto;padding:0 7px}
.stampcol{display:flex;flex-direction:column;gap:3px;align-items:center;flex-shrink:0}
label.fl{font-size:11px;font-weight:700;letter-spacing:.5px;display:block;margin-bottom:4px}
/* ══ v42 · 考卷分析三段式 ══ */
.must{border:2px solid var(--warn);border-radius:12px;background:#fffdf7;padding:14px 15px;margin-bottom:10px}
.must.done{border-color:var(--ok);background:#f4faf7}
.must-hd{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.must-hd .cnt{font-size:12px;font-weight:700;color:var(--warn);background:#f6eddd;border-radius:999px;padding:3px 10px}
.must.done .must-hd .cnt{color:var(--ok);background:#e4f0eb}
.must-row{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid #eee6d4;flex-wrap:wrap}
.must-row:first-of-type{border-top:0}
.must-num{width:22px;height:22px;border-radius:50%;background:var(--warn);color:#fff;font-size:12px;
  font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.must-num.ok{background:var(--ok)}
.must-lab{min-width:104px;font-weight:700;font-size:13.5px}
.must-note{width:100%;font-size:11.5px;color:var(--mut);margin-top:2px}
.big-toggle{font-size:14px;font-weight:700;padding:11px 20px;border-radius:10px;min-height:44px;
  background:#f6eddd;color:var(--warn);border:2px solid #e6d2ab;cursor:pointer;font-family:inherit}
.big-toggle.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.fold{background:#fff;border:1px solid var(--bdr);border-radius:12px;margin-bottom:10px;overflow:hidden}
.fold-hd{padding:13px 15px;font-size:14px;font-weight:700;cursor:pointer;display:flex;
  align-items:center;gap:8px;min-height:44px}
.fold-hd .sub{font-weight:400;font-size:11.5px;color:var(--mut)}
.fold-hd .car{margin-left:auto;color:var(--mut)}
.fold-bd{padding:0 15px 14px;border-top:1px solid var(--bdr);display:none}
.fold.open .fold-bd{display:block}
.sub-sec{padding:11px 0;border-top:1px dashed var(--bdr)}
.sub-sec:first-child{border-top:0}
.sub-sec h4{margin:0 0 6px;font-size:13px;font-weight:700}
.sub-sec h4 span{font-weight:400;font-size:11px;color:var(--mut);margin-left:6px}

.cellrow{display:flex;gap:9px;align-items:center}
.cellnum{text-align:left;flex:1;min-width:0}

/* ══════ INPUTS ══════ */
input[type=text],input[type=number],input[type=date],select,textarea{
  border:.5px solid var(--bdr);border-radius:6px;padding:6px 10px;
  font-size:12px;font-family:inherit;background:var(--sur);color:var(--txt);
  min-width:120px;box-sizing:border-box}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--layer)}
textarea{width:100%;resize:vertical}

/* ══════ BADGES ══════ */
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;white-space:nowrap}
.b-atc{background:rgba(122,176,90,.12);color:var(--d-atc)}
.b-active{background:#E1F5EE;color:var(--ok)}
.b-warn{background:#FFF3CD;color:var(--warn)}
.b-inactive{background:#FCEBEB;color:var(--danger)}

/* ══════ TOOLBAR ══════ */
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar input[type=text]{flex:1;min-width:180px}
.dept-row{display:flex;gap:4px;flex-wrap:wrap}
.dept-tag{padding:4px 12px;border-radius:14px;border:.5px solid var(--bdr);
  cursor:pointer;font-size:10px;background:var(--sur);color:var(--mut);font-family:inherit}
.dept-tag:hover{border-color:var(--layer);color:var(--layer)}
.dept-tag.on{background:var(--layer);border-color:var(--layer);color:#fff}

/* ══════ MODAL ══════ */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--sur);border-radius:10px;width:560px;max-width:100%;
  max-height:88vh;overflow-y:auto;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.modal-hdr{padding:14px 20px;border-bottom:.5px solid var(--bdr);display:flex;
  align-items:center;position:sticky;top:0;background:var(--sur);
  border-radius:10px 10px 0 0;z-index:2}
.modal-title{font-size:14px;font-weight:600;flex:1}
.modal-body{padding:16px 20px}
.modal-foot{padding:12px 20px;border-top:.5px solid var(--bdr);display:flex;
  justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--sur);
  border-radius:0 0 10px 10px}
.x-btn{background:none;border:none;font-size:18px;color:var(--mut);cursor:pointer}

/* ══════ TOAST ══════ */
.toast{position:fixed;bottom:20px;right:20px;background:var(--txt);color:#fff;
  padding:8px 16px;border-radius:6px;font-size:12px;opacity:0;
  transition:opacity .25s;pointer-events:none;z-index:9999}
.toast.show{opacity:1}

/* ══════ MISC ══════ */
.empty{text-align:center;padding:40px 20px;color:var(--hint);font-size:12px}
/* ══ FORM 02 逐题格子 ══ */
.qgrid{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 2px}
/* 连续学生导航条 —— 钉在 modal 顶端，老师不必关掉再找名字 */
.stunav{display:flex;align-items:center;gap:8px;padding:8px 10px;margin:-2px 0 12px;
  background:var(--sur2);border:1px solid var(--bdr);border-radius:8px;position:sticky;top:0;z-index:3}
.stunav-mid{flex:1;text-align:center;font-size:14px;line-height:1.25}
.stunav-mid span{display:block;font-size:11.5px;color:var(--mut);font-weight:400}
.stunav .btn{white-space:nowrap}
.qbtn{width:38px;height:36px;border:1px solid var(--bdr);border-radius:6px;background:var(--sur);
  cursor:pointer;font-size:12px;font-weight:600;color:var(--mut);
  display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit}
.qbtn:hover{border-color:var(--mut)}
.qbtn.q-star{background:#E1F5EE;border-color:var(--ok);color:var(--ok)}
.qbtn.q-dk{background:#FCEBEB;border-color:var(--danger);color:var(--danger)}
.qbtn.q-cl{background:#FFF3CD;border-color:var(--warn);color:var(--warn)}
.qbtn.q-nr{background:#FFF3CD;border-color:var(--warn);color:var(--warn)}
.qbtn.q-sos{background:#E8F0F7;border-color:var(--info);color:var(--info)}
.qbtn.q-blank{background:#FCEBEB;border-color:var(--danger);color:var(--danger);
  background-image:repeating-linear-gradient(45deg,transparent,transparent 3px,rgba(163,45,45,.13) 3px,rgba(163,45,45,.13) 6px)}
/* 题号格必须带文字 —— 颜色不能是唯一编码（手机没有 hover，两分钟後分不出 CL 还是 NR） */
.qbtn{flex-direction:column;line-height:1.05;gap:0}
.qbtn .qn{font-size:12px;font-weight:700}
.qbtn .qm{font-size:8px;font-weight:700;letter-spacing:.02em;opacity:.9}
.qbtn .qs{font-size:8px;font-weight:700;opacity:.85}
.qpick{background:var(--sur2);border:2px solid var(--txt);border-radius:8px;padding:10px 12px;margin:2px 0 10px}
.qpick-t{font-size:12px;font-weight:800;color:var(--txt);margin-bottom:6px}
.qbtn.picking{outline:3px solid var(--txt);outline-offset:1px}
.secbox{border:1px solid var(--bdr);border-radius:8px;padding:10px;margin-bottom:10px;background:var(--sur)}
.sechd{font-size:14px;font-weight:800;letter-spacing:0;color:var(--txt);margin:0 0 8px;
  padding-bottom:6px;border-bottom:2px solid var(--txt)}
.sechd .sub{font-size:11px;font-weight:500;color:var(--mut);letter-spacing:0;margin-left:6px}
.secbox{padding:14px}
.tip{font-size:11px;color:var(--mut);margin:8px 0}

/* ══════ ALERT ══════ */
.alert{padding:10px 14px;border-radius:6px;font-size:12px;margin-bottom:10px;
  display:flex;align-items:flex-start;gap:8px}
.alert-info{background:#E8F0F7;color:#236FAD;border-left:3px solid #236FAD}
.alert-warn{background:#FFF3CD;color:var(--warn);border-left:3px solid var(--warn)}
.alert-danger{background:#FCEBEB;color:var(--danger);border-left:3px solid var(--danger)}
.alert-ok{background:#E1F5EE;color:var(--ok);border-left:3px solid var(--ok)}

/* ══════ CHIP ══════ */
.chip{display:inline-block;padding:3px 10px;border-radius:12px;font-size:10px;
  font-weight:500;margin:2px;border:none;font-family:inherit}
.chip-layer{background:rgba(90,100,112,.10);color:var(--layer)}
.chip-ok{background:#E1F5EE;color:var(--ok)}
.chip-warn{background:#FFF3CD;color:var(--warn)}
.chip-danger{background:#FCEBEB;color:var(--danger)}
.chip-info{background:#E8F0F7;color:var(--info)}
.chip-muted{background:var(--sur2);color:var(--mut)}
/* 🔴 任教登记的勾选钮不能用 .chip-muted：它的底色就是 --sur2，
   跟 table.data 偶数行的斑马纹底色一模一样，在 ATC2/4/6 那三行上完全隐形。
   改成「空框 / 打勾框」，靠边框与文字辨识，不靠底色。 */
.asg-box{display:inline-block;min-width:56px;padding:5px 10px;border-radius:8px;
  border:1.5px solid #8a8279;background:#fff;color:#5c554d;
  font-size:12px;font-weight:700;cursor:pointer;line-height:1.2;transition:.12s}
.asg-box:hover{border-color:var(--layer);color:var(--layer);background:#fff}
.asg-box.on{background:var(--layer);border-color:var(--layer);color:#fff}
.chips-row{display:flex;flex-wrap:wrap;gap:4px}
button.chip{cursor:pointer;border:.5px solid transparent}
button.chip.sel{background:var(--layer);color:#fff}
button.chip.sel-w{background:var(--warn);color:#fff}

/* ══════ DOT ══════ */
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:4px}
.dot-ok{background:var(--ok)}.dot-warn{background:var(--warn)}
.dot-danger{background:var(--danger)}.dot-info{background:var(--info)}.dot-muted{background:var(--hint)}

/* ══════ PROGRESS ══════ */
.progress{height:6px;background:var(--bdr);border-radius:3px;overflow:hidden;margin:4px 0}
.progress-fill{height:100%;border-radius:3px;transition:width .3s}
.progress-ok .progress-fill{background:var(--ok)}
.progress-warn .progress-fill{background:var(--warn)}
.progress-danger .progress-fill{background:var(--danger)}
.progress-layer .progress-fill{background:var(--layer)}
.pct{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}

/* ══════ FORM GRID ══════ */
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.form-row{margin-bottom:12px}
.form-label{font-size:11px;color:var(--mut);display:block;margin-bottom:4px}
@media(max-width:480px){.form-grid-2,.form-grid-3{grid-template-columns:1fr}}

/* ══════ STEPPER ══════ */
.stepper{display:flex;align-items:center;gap:0;margin-bottom:16px;overflow-x:auto}
.step{display:flex;align-items:center;gap:6px;padding:8px 14px;font-size:11px;color:var(--mut);white-space:nowrap}
.step-num{width:22px;height:22px;border-radius:50%;background:var(--bdr);color:var(--mut);
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.step.active{color:var(--txt);font-weight:600}
.step.active .step-num{background:var(--layer);color:#fff}
.step.done .step-num{background:var(--ok);color:#fff}
.step-line{width:24px;height:1.5px;background:var(--bdr);flex-shrink:0}
.step-line.done{background:var(--ok)}

/* ══════ TAB PILLS / SEGMENTED ══════ */
.pills{display:inline-flex;border:.5px solid var(--bdr);border-radius:8px;overflow:hidden;background:var(--sur2)}
.pill{padding:6px 14px;font-size:11px;cursor:pointer;border:none;background:transparent;
  color:var(--mut);font-family:inherit;transition:all .15s;min-width:44px}
.pill.on{background:var(--layer);color:#fff;font-weight:600}
.pills-ind .pill.on{background:var(--info);color:#fff}

/* ══════ QUICK ACTIONS ══════ */
.quick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.quick-card{background:var(--sur);border:.5px solid var(--bdr);border-radius:10px;padding:16px;
  text-align:center;cursor:pointer;transition:all .15s}
.quick-card:hover{border-color:var(--layer);box-shadow:0 2px 8px rgba(0,0,0,.06)}
/* 选中的卡片 —— 与 ObsGo 同一套颜色逻辑：绿 = 班级，褐 = 科目。 */
.quick-card.on{border-width:2px;position:relative;transform:translateY(-1px)}
.quick-card.on .quick-label{color:#fff;font-weight:800}
.quick-card.on .stat-sub{color:rgba(255,255,255,.8)}
.quick-card.on::after{content:'✓';position:absolute;top:4px;right:8px;
  color:#fff;font-size:13px;font-weight:800;line-height:1}
.pick-cls.on {background:#7AB05A;border-color:#5E8F42;box-shadow:0 3px 12px rgba(94,143,66,.3)}
.pick-subj.on{background:#8B6C2A;border-color:#6B5220;box-shadow:0 3px 12px rgba(107,82,32,.3)}
.quick-icon{font-size:24px;margin-bottom:6px}
.quick-label{font-size:11px;color:var(--txt);font-weight:500}

/* v33：小题格（6a / 6b / 6c）要跟整题格一眼分得出来 */
.qbtn-sub{border-style:dashed}
.qbtn-sub .qn{letter-spacing:.5px}

.paper-card{display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  border:1.5px solid var(--bdr);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:var(--sur)}
.paper-card.mine{border-color:var(--d-atc);box-shadow:0 2px 10px rgba(122,176,90,.15)}
.chip-me{background:var(--d-atc);color:#fff}
.newpaper{width:100%;min-height:52px;border:2px dashed var(--bdr);border-radius:12px;

<script>
/* ══════════════════════════════════════════════════════════════════
   EvalGo_ATC — ATC 部 考况记录
   Academee Universal Standard v2 · Layer RPT (#5A6470)
   FORM 01 = PROVE 课后现场观察 · FORM 02 = FIX 课后考卷分析
   资料来源：Owner 考试 SOP 三图 + ATC Exam Prep_Eng Chi.xlsx
   字典：ATC_Report_v19.html OPTS_BY_YEAR
         sha256 6a074645cc1eb390bf9de5e32aff43c16084fbe9bcdebe947090fe84f95f2c9c
   权限码：RPT-EvalGo-ATC
   ══════════════════════════════════════════════════════════════════ */

const APP_VERSION = 47;

/* ══ v46 · 旧版本守门 ══════════════════════════════════
   MiscGo 那边抓到实例：网址对、程式旧（手机快取把旧 HTML 钉住）。
   EvalGo 出这个问题后果更重：旧版的本机 key 不带卷号后缀、
   逐题不分 6a/6b/6c —— 一写上去就是脏资料，而且老师看不出来。

   向伺服器要一份本档正本（带 cache-buster）比 APP_VERSION，
   落后就换到 ?v=N（**换网址**才真的重拿；reload() 往往又拿快取）。

   两条红线：
   ① 老师已经动过画面就**绝不自己跳** —— 正在填的考卷分析会没；
      只出一条横幅，写「做完这一位再按」，由她决定什么时候换。
   ② 同一次会话最多跳 2 次，绝不无限转。 */
let _egTouched=false;
['pointerdown','keydown','input'].forEach(function(ev){
  document.addEventListener(ev,function(){_egTouched=true;},{once:true,capture:true});
});
let _egNewVer=null;
function egApplyUpdate(){
  try{
    const u=new URL(location.href);
    u.searchParams.set('v', String(_egNewVer||Date.now()));
    location.replace(u.toString());
  }catch(e){ location.reload(); }
}
(function egVersionGuard(){
  const TRY='eg_vtry', LAST='eg_vchk', GAP=60*60*1000;
  let tries=0;
  try{ tries=+(sessionStorage.getItem(TRY)||0); }catch(e){}
  if(tries>=2) return;
  try{ if(Date.now()-(+localStorage.getItem(LAST)||0) < GAP) return; }catch(e){}
  setTimeout(async function(){
    try{
      try{ localStorage.setItem(LAST,String(Date.now())); }catch(e){}
      const r=await fetch(location.pathname+'?vchk='+Date.now(),{cache:'no-store'});
      if(!r.ok) return;
      const m=(await r.text()).match(/const APP_VERSION\s*=\s*(\d+)/);
      if(!m) return;
      const server=+m[1];
      if(!(server>APP_VERSION)) return;
      _egNewVer=server;
      try{ sessionStorage.setItem(TRY,String(tries+1)); }catch(e){}
      if(_egTouched){
        const bar=document.getElementById('eg-stale-bar');
        const lab=document.getElementById('eg-stale-ver');
        if(lab) lab.textContent='（你的 v'+APP_VERSION+' → 最新 v'+server+'）';
        if(bar) bar.style.display='block';
        return;
      }
      egApplyUpdate();
    }catch(e){ console.warn('[EvalGo] version check failed',e); }
  }, 3000);
})();
const STORAGE_KEY = 'evalgo_atc_v1';   /* 沿用 v1 key，旧资料不掉 */
const SYS_CODE    = 'RPT-EvalGo-ATC';
const SB_URL      = 'https://qnpvqsvvsgsantekgfbz.supabase.co';
const SB_KEY      = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFucHZxc3Z2c2dzYW50ZWtnZmJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNzg4MzIsImV4cCI6MjA5MTc1NDgzMn0.8rfv0BQpWNNSD8yrhHNwCOkcG9q5_uMD7B7z_Y324a0';
const PLATFORM    = 'https://angelteo.github.io/';
/* v28：对齐平台既有做法。ObsGo（硬闸 R1）与 MiscGo 都是同一套函式名与流程 ——
   没有登入状态就**直接跳去平台登入**，不停在自己的画面上要人再按一次。
   EvalGo 到 v27 为止是唯一会停下来的系统，Owner 2026-09-15 指出这个不一致。 */
const ALLOWED_ORIGIN = 'https://angelteo.github.io';
function safeReturnUrl(raw){
  try{ const u=new URL(raw, ALLOWED_ORIGIN); return u.origin===ALLOWED_ORIGIN ? u.href : null; }
  catch(e){ return null; }
}
function redirectToPlatformLogin(){
  const url=new URL(PLATFORM);
  const back=safeReturnUrl(window.location.href);
  if(back) url.searchParams.set('returnTo', back);
  window.location.replace(url.toString());   /* replace：不把这一页留在上一页，Back 不会弹回死画面 */
}
/* 三个不自动跳的例外。都不是「去登入就好」的情况，硬跳只会把人锁在外面。
   ObsGo / MiscGo 目前没有这三条 —— 我认为它们也该有，已列进交件报告的建议。 */
function shouldAutoLogin(){
  if(location.protocol==='file:') return false;        /* ① 本机开档：跳过去也拿不到状态，而且没办法本机验版 */
  if(navigator.onLine===false)   return false;         /* ② 离线：平台一样载不出来，而本机可能还有没送出的草稿 */
  try{                                                  /* ③ 防回圈：跳过一次还是没有状态 → 停下来给按钮 */
    if(sessionStorage.getItem('evalgo_login_bounce')==='1') return false;
    sessionStorage.setItem('evalgo_login_bounce','1');
  }catch(e){}
  return true;
}

const SUBJECTS = ['数学','华文','英文','马来文','科学'];
const CLASSES  = ['ATC1','ATC2','ATC3','ATC4','ATC5','ATC6'];

/* FORM 01 七个维度 —— 照纸本 B5/B24 逐字 */
const DIMS = [
  {id:'read',        zh:'读题',en:'READ',        hint:'看清题目',        scale:'YSN'},
  {id:'think',       zh:'思考',en:'THINK',       hint:'先想再做',        scale:'YSN'},
  {id:'answer',      zh:'作答',en:'ANSWER',      hint:'按要求作答',      scale:'YSN'},
  {id:'check',       zh:'检查',en:'CHECK',       hint:'主动检查',        scale:'YSN'},
  {id:'speed',       zh:'时间',en:'SPEED',       hint:'是否在规定时间完成',scale:'YSN'},
  {id:'handwriting', zh:'书写',en:'HANDWRITING', hint:'是否清楚整齐',    scale:'YSN'},
  {id:'ind',         zh:'独立',en:'IND',         hint:'是否独立',        scale:'IRH'}
];
const YSN=[{v:'Y',lab:'✓',t:'做得到'},{v:'S',lab:'△',t:'不稳定'},{v:'N',lab:'✗',t:'做不到'}];
const IRH=[{v:'I',lab:'I',t:'独立 Independent'},{v:'R',lab:'R',t:'提醒 Reminder'},{v:'H',lab:'H',t:'帮助 Help'}];

/* FORM 02 五个标记码 —— 照纸本 A5 逐字 */
/* 六记码，与 evalgo_mark_code 一致。outcome 是【卷面看得见的事实】，
   记码本身（DK/CL/NR/SOS）是【老师对原因的推断】—— 两层，老师点击数不变。 */
const MARKS=[
  {id:'star', lab:'★',  zh:'答对',    outcome:'CORRECT', good:true, chip:'chip-ok'},
  {id:'dk',   lab:'DK', zh:'不会',    outcome:'WRONG',   chip:'chip-danger'},
  {id:'cl',   lab:'CL', zh:'粗心',    outcome:'WRONG',   chip:'chip-warn'},
  {id:'nr',   lab:'NR', zh:'没看清',  outcome:'WRONG',   chip:'chip-warn'},
  {id:'sos',  lab:'SOS',zh:'需要帮助',outcome:'WRONG',   chip:'chip-info'},
  {id:'blank',lab:'空', zh:'漏答',    outcome:'BLANK',   chip:'chip-danger'}
];
/* CL 第二层 —— 只有点了 CL 才出现，选填。不进主 marker bar。 */
const CL_SUB=[
  {v:'CALC',      zh:'算错'},
  {v:'COPY',      zh:'抄错'},
  {v:'INCOMPLETE',zh:'没写完'}
];
/* ══ 评量状态 ══ Owner 2026-09-06
   「没有资料」以前同时代表三件事：老师还没做 / 学生缺席 / 证据不足。
   混在一起，管理层就分不出「系统缺口」与「现实状况」。
   🔴 ABSENT 与 NOT_ASSESSED **绝不等於**弱、0 分、未掌握 ——
      它们是「没有资料」的两种已知原因，不是一种表现。
   工作台：三者都算「已处理」，不再催老师。
   报告  ：只有 ASSESSED 算数（DB 端由 v_evalgo_assessed 守着）。 */
const ASTAT={
  ASSESSED     : {lab:'已完成',   short:'✓',  cls:'b-active'},
  ABSENT       : {lab:'缺席',     short:'缺', cls:'b-inactive'},
  NOT_ASSESSED : {lab:'本轮未评', short:'—',  cls:'b-inactive'}
};
function aStat(r){ return (r&&r.assess_status)||'ASSESSED'; }
function isHandled(r){ return !!r && (aStat(r)!=='ASSESSED' || f2State(r)==='done'); }
function setAStat(sid, v){
  const r=f2Draft(sid);
  r.assess_status=v; r.synced=false;
  if(v!=='ASSESSED'){ r.savedAt=new Date().toLocaleString('en-GB'); stampF2(r,sid); }
  saveData(true); closeModal(); renderF2(); renderHome();   /* v25 R-H4：缺席／本轮未评不走 debounce */
  toast(v==='ASSESSED'?'✓ 改回已评量':('✓ 记为「'+ASTAT[v].lab+'」'));
  autoPush();
}
/* ══ 连续学生导航 ══ Owner 2026-09-06
   旧流程：填完一位 → 关 modal → 回名单 → 找下一个名字 → 再点。
   一班 18 位就是 18 次「关掉再找」。改成 modal 里直接走。
   「完成并到下一位」只跳还没处理的；缺席／本轮未评的会跳过。 */
/* ══════════════════════════════════════════════════════════════════
   三个状态，永远不准合併（Owner Work Order P0-2 / P0-3）
     ① Operational Resolved  老师今天不用再追这个学生了
     ② Assessment Complete   这个学生这一科的证据齐了
     ③ Report Ready          可以进家长/考前报告
   ABSENT 与 NOT_ASSESSED 只满足 ①。它们不是弱、不是 0 分、不是证据。
   全系统（工作台 / 覆盖追踪 / 报告 / 连续导航）一律消费这三支，不准各写各的。
   ══════════════════════════════════════════════════════════════════ */
function stResolved(sid){ return aStat(S.f2[f2Key(sid)])!=='ASSESSED'; }   /* ① 缺席 / 本轮未评 */
function opResolved(sid,kind){                                            /* ① 已处理 */
  if(stResolved(sid)) return true;
  return kind==='f1' ? f1Complete(sid).length>0
                     : f2State(S.f2[f2Key(sid)])==='done';
}
function assessComplete(sid){                                             /* ② 证据齐 */
  const r=S.f2[f2Key(sid)];
  return aStat(r)==='ASSESSED' && f2State(r)==='done';
}
function reportReady(sid){                                                /* ③ 可进报告 */
  const r=S.f2[f2Key(sid)];
  if(!r) return false;
  if(aStat(r)!=='ASSESSED') return false;      /* 缺席 / 本轮未评 永不进报告 */
  return !!(r.paper_checked && r.tp);          /* 老师亲自核对 + 掌握程度 */
}

function navList(){ return inCls(S.cls); }
function navIdx(sid){ return navList().findIndex(r=>r.sid===sid); }
function navStep(sid,d){ const L=navList(), i=navIdx(sid), j=i+d;
  return (i<0||j<0||j>=L.length)?null:L[j].sid; }
function navResolved(sid){ return stResolved(sid); }        /* 同一支真相 */
function navDone(sid,kind){ return opResolved(sid,kind); }  /* 同一支真相 */
function navTodo(sid,kind){          /* 从当前往後绕一圈，找第一个还没处理的 */
  const L=navList(), i=navIdx(sid);
  for(let k=1;k<=L.length;k++){ const r=L[(i+k)%L.length];
    if(!navDone(r.sid,kind)) return r.sid; }
  return null;

function navLeft(kind){ return navList().filter(r=>!navDone(r.sid,kind)).length; }
function navGo(sid,kind){
  if(!sid) return;
  if(saveData(true)===false){ alert(saveFailMsg()); return; }
  if(kind==='f1'){ renderF1(); f1Open(sid); } else { renderF2(); f2Open(sid); }
}
function navBar(sid,kind){
  const L=navList(), i=navIdx(sid), p=navStep(sid,-1), n=navStep(sid,1), left=navLeft(kind);
  return `<div class="stunav">
    <button class="btn btn-sm" ${p?`onclick="navGo('${p}','${kind}')"`:'disabled style="opacity:.35"'}>← 上一位</button>
    <div class="stunav-mid"><b>${esc(nameOf(L[i]))}</b>
      <span>第 ${i+1} / ${L.length} 位${left?` · 还剩 ${left} 位没处理`:' · 全班处理完了'}</span></div>
    <button class="btn btn-sm" ${n?`onclick="navGo('${n}','${kind}')"`:'disabled style="opacity:.35"'}>下一位 →</button>

      onclick="aStatMenu('${sid}')">⋯</button></div>`;
}

/* ══ weak_manual 的词汇（vocabulary）══ Owner 2026-09-06
   这一栏的内容【依年份不同】，不是单一来源，写死成任何一个都是错的：
     v16 – v19.0  chips 来源是 KPM DSKP 学习领域 → 存的是字典 id（DSKP-ENG-Y2-D1）
     v19.1 起     chips 来源是这份考卷 evalgo_paper_section.topic → 存的是考点原文（文法）
   老师浏览器里此刻可能还留着 v16–v19.0 时期的草稿，v9 上线后会一起送上去。
   所以不推断、不假设：逐值检查它认不认得是字典 id，把结论明写成一栏送上云端。 */
const WEAK_VOCAB={NONE:'NONE',DSKP:'DSKP_DOMAIN',PAPER:'PAPER_TOPIC',MIX:'MIXED'};
function isDictId(x){
  return DSKP_DOM.some(o=>o.id===x) || KSSR.some(o=>o.id===x);
}
function weakVocabOf(r){
  const v=(r&&r.weak_manual)||[];
  if(!v.length) return WEAK_VOCAB.NONE;
  const n=v.filter(isDictId).length;
  if(n===v.length) return WEAK_VOCAB.DSKP;
  if(n>0)          return WEAK_VOCAB.MIX;
  return WEAK_VOCAB.PAPER;
}
function optText(id){
  const d=DSKP_DOM.find(o=>o.id===id); if(d) return d.zh;
  const k=KSSR.find(o=>o.id===id);     if(k) return k.zh;
  /* v19.1 起「较弱项目」直接存这份考卷的考点原文（不是字典 id）——
     认不得就原样送出，绝不吞成空字串。 */
  return String(id||'');
}

/* ══ 这份考卷的考点 ══ Owner 2026-09-06
   v16 这里挂的是 KPM DSKP「学习领域」（Listening / Speaking / Reading / Writing…）。
   Owner 指出那一层跟「这份考卷」没有关系 —— 考卷考的是文法、连接词、写作这些具体考点。
   他说对了：学习领域是「整年教什么」，考卷分析要回答的是「这张卷他弱在哪」。
   唯一诚实的来源是考卷结构里负责人自己填的「文法 / 主题」，不是我另外发明一套分类。
   一个项目可以填多个考点，用 、 ， / ； 分开，这里会拆成多颗。 */
function paperWeakOpts(){
  const out=[], seen={};
  sections().forEach(sec=>{
    const raw=String(sec.topic||'').trim();
    const parts = raw ? raw.split(/[、,，\/／;；]+/).map(x=>x.trim()).filter(Boolean) : [];
    if(!parts.length) parts.push(String(sec.code||'').trim());
    parts.forEach(t=>{ if(!t||seen[t]) return; seen[t]=1; out.push(t); });
  });
  return out;
}

function saveData(now){
  const go=()=>{

      S.meta.save_failed=true;

}

   「无法证明 provenance 的旧记录 → UNRESOLVED，禁止猜配」。

   v11 只迁移【本次浏览器 session、离线时产生】的资料（有 ses 戳记且等于本次）。
   其余一律不动，计入 unresolved 由管理层处理。 */
const SESSION_ID='ses_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
function stampSes(o){ if(o&&typeof o==='object'&&!o.ses) o.ses=SESSION_ID; return o; }
function migrateExamKeys(toEx){
  if(!toEx) return {moved:0,unresolved:0};
  let moved=0, unresolved=0;
  const move=bag=>{
    Object.keys(bag).forEach(k=>{
      const parts=k.split('|');
      if(parts[0]===toEx) return;                     /* 已经是本轮 */
      const rec=bag[k];
      const provable = parts[0]==='NOEXAM' && rec && rec.ses===SESSION_ID;
      if(!provable){ unresolved++; return; }           /* 不猜 */
      const nk=[toEx].concat(parts.slice(1)).join('|');
      if(bag[nk]) return;
      bag[nk]=rec; delete bag[k];
      rec.exam=toEx; rec.synced=false; moved++;
    });
  };
  move(S.f1); move(S.f2); move(S.wi); move(S.es);
  Object.keys(S.sections||{}).forEach(k=>{
    const parts=k.split('|');
    if(parts[0]===toEx) return;
    if(parts[0]!=='NOEXAM'){ unresolved++; return; }
    const arr=S.sections[k]||[];
    if(!arr.length || !arr.every(x=>x.ses===SESSION_ID)){ unresolved++; return; }
    const nk=[toEx].concat(parts.slice(1)).join('|');
    if(S.sections[nk]) return;
    S.sections[nk]=arr; delete S.sections[k];
    arr.forEach(x=>{ x.synced=false; x.cloud_id=null; });
    moved++;
  });
  S.meta.unresolved=unresolved;
  if(moved||unresolved) saveData(true);
  return {moved,unresolved};
}

async function loadPapers(){

        .eq('class_id',cid)

        .eq('evalgo_paper_instance.subject',S.subject)
        .eq('evalgo_paper_instance.status','active');

      let papers=(r.data||[]).map(x=>x.evalgo_paper_instance).filter(Boolean);

         routing 只认 paper_teacher（含 LEGACY_SEED）；teacher_assign 不参与、不覆盖 EXPLICIT。 */
      /* ══ v28 · Owner 2026-09-15：老师选了班级和科目就能填，中间不再有门。 ══
         P0-2 原本是「老师只见自己被分配的卷」—— 那一条**在此被 Owner 推翻**。

          .select('paper_instance_id').eq('class_id',cid).eq('teacher_id',S.me);
        if(tr.error) throw tr.error;                  /* v27：查失败不可默默变成零份 */
        const mine=new Set((tr.data||[]).map(x=>x.paper_instance_id));

      }

/* 考卷结构（Paper Blueprint）：项目 / 文法 / 作答方式 */
/* ══ Exam scoping ══
   v7 以前 key 是 sid|subject|... 没有考试。9 月这一轮和 10 月下一轮
   同一个学生同一科同一题，key 完全一样 → 本机资料会互相覆盖，
   而且上传时会用「当前 active exam」把旧证据送进新考试。
   v8 起所有本机 key 一律以 exam 开头。 */
function EXK(){ return S.examCode||'NOEXAM'; }
/* v26 Multi-Paper：只在能力在线且已选卷时，key 才带卷后缀。
   Legacy（hasPI=false）或未选卷 → 后缀为空 → key 与 v25 逐字节相同，保护现有本机草稿。 */
function piSuffix(){ return (CLOUD.hasPI && S.paperInstance) ? '|'+S.paperInstance : ''; }
function piSuf(pi){ return (CLOUD.hasPI && pi) ? '|'+pi : ''; }
function piReady(){ return !CLOUD.hasPI || !!S.paperInstance; }
function bpKey(){ return EXK()+'|'+S.subject+'|'+yearOf(S.cls)+piSuffix(); }
function sections(){ return (S.sections[bpKey()]||[]); }
/* v27：工作台卡片问的是「这一格有没有登记考卷项目」，不是「哪一份卷的项目」。
   v26 起项目的 key 带卷号后缀（见 piSuffix），卡片却用不带后缀的 key 去读，
   永远读到空 —— 於是每一张卡都印「考卷项目还没登记」，全是假的。
   卡片只要回答有／没有，不必知道是哪一卷，所以扫整格（含 Legacy 的无后缀旧 key）。
   ⚠️ 只可用於「有没有」的判断。**不可当分母** —— 多卷时这是跨卷加总，会把题数灌水。 */
function secsCountFor(subject,year){
  const pre=EXK()+'|'+subject+'|'+year;
  let n=0;
  Object.keys(S.sections||{}).forEach(k=>{
    if(k===pre || k.indexOf(pre+'|')===0) n+=(S.sections[k]||[]).length;
  });
  return n;
}
/* ⚠️ v9 用 hidden 属性 + inline display —— inline style 会盖掉 hidden，
   所以「满分」栏在选择题时也一直看得到。改成直接控制 display。 */
function bpTypeChg(){
  /* 满分**每一种题型都要填**，不是只有写作文。
     v14 以前只在写作文时显示满分栏，选择题／填写题填了也会被丢掉。 */
  const t=(document.getElementById('bpType')||{}).value||'MCQ';
  const r=document.getElementById('bpRange'), sc=document.getElementById('bpScore');
  if(r)  r.style.display  = (t==='ESSAY')?'none':'inline-flex';
  if(sc) sc.style.display = 'inline-flex';
}
/* ⚠️ v20 起不再有呼叫点 —— 表格底下那排 inline 输入已换成 bpModal()。
   留着不删：旧版页面若还开在某台装置上，函式消失会直接报错。 */
function addSection(){
  const g=id=>String(((document.getElementById(id)||{}).value)||'').trim();
  const code=g('bpCode'), topic=g('bpTopic'), fmt=g('bpFmt');
  const type=g('bpType')||'MCQ';
  const qf=parseInt(g('bpQf'),10), qt=parseInt(g('bpQt'),10), mx=parseFloat(g('bpMax'));
  const even=g('bpEven');
  if(!code){ toast('✕ 项目不能空'); return; }
  const arr=S.sections[bpKey()]||(S.sections[bpKey()]=[]);
  if(arr.some(x=>x.code===code)){ toast('✕ 这个项目已经有了'); return; }
  if(!(mx>0)){ toast('✕ 请填这个项目共几分'); return; }
  if(type!=='ESSAY'){
    if(!(qf>=1)||!(qt>=qf)){ toast('✕ 题号范围不对（例：1 到 10）'); return; }
    const clash=arr.filter(x=>QTYPES.indexOf(x.type||'MCQ')>=0 && +x.qf>=1)
                   .find(x=>!(qt<(+x.qf)||qf>(+x.qt)));
    if(clash){ toast(`✕ 题号 ${qf}-${qt} 与「${clash.code}」(${clash.qf}-${clash.qt}) 重叠`); return; }
  }
  arr.push({id:uid(),client_uid:uid(),ses:SESSION_ID,code,topic,fmt,type,
    qf:type==='ESSAY'?null:qf, qt:type==='ESSAY'?null:qt,
    max:mx,                       /* 每一种题型都存满分，不再只存写作文 */
    even:(type==='ESSAY'?'':even), /* 每题同分？未声明就不算分（fail-closed）*/
    sort:arr.length, by:S.me, synced:false, cloud_id:null});
  ['bpCode','bpTopic','bpFmt','bpQf','bpQt','bpMax','bpEven'].forEach(i=>{const e=document.getElementById(i);if(e)e.value='';});
  if(saveThen('✓ 已加入')){ bpRefresh(); autoPush(); }
}
/* 声明「每题同分」—— 不锁：改这个不会让旧证据漂移，

/* ══ v29 · 小题结构 q_marks ══════════════════════════════════════════
   Owner 2026-09-15：老师手上已经有实体考卷，必须能登记「第 10 题有 a/b/c」。
   今天只做【登记】—— 算分核心与报告层一个字都不动（排 v31）。
   资料形状（只记例外，不记全部；没列出来的题 = 平均分）：
     {"per_q":{"3":4}, "subs":{"10":{"a":1,"b":2,"c":3}}}
   分数可以是 null —— Owner 裁定「分数可留空，先登记结构」。
   ⚠️ 下游（v31 算分）读到 null 必须当作「没声明」，不可当 0 分。 */
function qmEmpty(qm){
  if(!qm||typeof qm!=='object') return true;
  return !Object.keys(qm.per_q||{}).length && !Object.keys(qm.subs||{}).length;
}
/* 例外题一共几题（per_q 与 subs 的题号联集，同一题不重复算） */
function qmExcQs(qm){
  if(qmEmpty(qm)) return [];
  const set={};
  Object.keys(qm.per_q||{}).forEach(q=>set[q]=1);
  Object.keys(qm.subs ||{}).forEach(q=>set[q]=1);
  return Object.keys(set).sort((a,b)=>(+a)-(+b));
}
/* 例外题的分数总和。只要有一个分数还没填 → 回 null（= 算不出，不要硬算） */
function qmExcSum(qm){
  if(qmEmpty(qm)) return null;
  let t=0, ok=true;
  Object.keys(qm.per_q||{}).forEach(q=>{ const v=qm.per_q[q];
    if(v==null||!(+v>=0)) ok=false; else t+=(+v); });
  Object.keys(qm.subs||{}).forEach(q=>{ const o=qm.subs[q]||{};
    Object.keys(o).forEach(l=>{ const v=o[l];
      if(v==null||!(+v>=0)) ok=false; else t+=(+v); }); });
  return ok?t:null;
}
/* 考卷项目表格里那一行小字 */
function qmChips(sec){
  const qm=sec&&sec.qm;
  if(qmEmpty(qm)) return '';
  const out=[];
  Object.keys(qm.subs||{}).sort((a,b)=>(+a)-(+b)).forEach(q=>{
    const o=qm.subs[q]||{};
    out.push('<span class="chip chip-layer" title="这一题有小题">第'+esc(q)+'题 '
      +Object.keys(o).map(l=>l+(o[l]==null?'':'·'+o[l])).join(' ')+'</span>');
  });
  Object.keys(qm.per_q||{}).sort((a,b)=>(+a)-(+b)).forEach(q=>{
    const m=qm.per_q[q];
    out.push('<span class="chip chip-warn" title="整题，但分数跟其他题不一样">第'+esc(q)+'题 '
      +(m==null?'分数待填':m+' 分')+'</span>');
  });
  return '<div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:3px">'+out.join('')+'</div>';
}
/* ── 弹窗暂存。关掉弹窗就没了，真相永远在 sec.qm ── */
let BPQM=[];
function qmToRows(qm){
  const rows=[];
  if(qmEmpty(qm)) return rows;
  Object.keys(qm.subs||{}).sort((a,b)=>(+a)-(+b)).forEach(q=>{
    const o=qm.subs[q]||{};
    rows.push({q:String(q), mode:'S', m:'',
      subs:SUBQ.filter(l=>o[l]!==undefined).map(l=>(o[l]==null?'':String(o[l])))});
  });
  Object.keys(qm.per_q||{}).sort((a,b)=>(+a)-(+b)).forEach(q=>{
    if(qm.subs&&qm.subs[q]!==undefined) return;   /* 同一题两边都有 → 以小题为准 */
    rows.push({q:String(q), mode:'Q',
      m:(qm.per_q[q]==null?'':String(qm.per_q[q])), subs:['','']});
  });
  return rows;
}
function qmFromRows(rows){
  const per_q={}, subs={};
  (rows||[]).forEach(r=>{
    const n=parseInt(r.q,10); if(!(n>=1)) return;   /* 没填题号的那一行直接丢掉 */
    const q=String(n);
    if(r.mode==='S'){
      const o={};
      (r.subs||[]).forEach((m,j)=>{ const lab=SUBQ[j]; if(!lab) return;
        o[lab]=(m===''||m==null)?null:(+m); });
      if(Object.keys(o).length) subs[q]=o;
    }else{
      per_q[q]=(r.m===''||r.m==null)?null:(+r.m);
    }
  });
  const out={};
  if(Object.keys(per_q).length) out.per_q=per_q;
  if(Object.keys(subs ).length) out.subs =subs;
  return Object.keys(out).length?out:null;
}
/* DOM → BPQM。每次重画前先收回来，否则老师打到一半的字会被洗掉。 */
function bpQmSync(){
  const g=id=>{const e=document.getElementById(id); return e?String(e.value||'').trim():null;};
  BPQM.forEach((r,i)=>{
    const q=g('qm_q_'+i); if(q!==null) r.q=q;
    const m=g('qm_m_'+i); if(m!==null) r.m=m;
    (r.subs||[]).forEach((_,j)=>{ const v=g('qm_s_'+i+'_'+j); if(v!==null) r.subs[j]=v; });
  });
}
function bpQmAddQ(){ bpQmSync();
  BPQM.push({q:'',mode:'S',m:'',subs:['','','']}); bpQmRender(); }
function bpQmDel(i){ bpQmSync(); BPQM.splice(i,1); bpQmRender(); }
function bpQmMode(i,mode){ bpQmSync(); if(BPQM[i]) BPQM[i].mode=mode; bpQmRender(); }
function bpQmAddSub(i){ bpQmSync();
  const r=BPQM[i]; if(!r) return;
  if(r.subs.length>=SUBQ.length){ toast('✕ 小题最多到 '+SUBQ[SUBQ.length-1]); return; }
  r.subs.push(''); bpQmRender(); }
function bpQmDelSub(i){ bpQmSync();
  const r=BPQM[i]; if(!r) return;
  if(r.subs.length<=2){ toast('✕ 有小题的题目至少要两个小题'); return; }
  r.subs.pop(); bpQmRender(); }
/* 其余题平均分 —— 即时算给老师看。算不出就说算不出，不要猜。 */
function bpQmHint(){
  const g=id=>{const e=document.getElementById(id); return e?String(e.value||'').trim():'';};
  const qf=parseInt(g('mQf'),10), qt=parseInt(g('mQt'),10), mx=parseFloat(g('mMax'));
  const qm=qmFromRows(BPQM), exQ=qmExcQs(qm), exN=exQ.length, sum=qmExcSum(qm);
  if(!exN) return '';
  if(!(qf>=1)||!(qt>=qf)||!(mx>0))
    return '<span style="color:var(--warn,#b45309)">先填题号与满分</span>';
  const totQ=qt-qf+1, rest=totQ-exN;
  if(rest<0) return '<span style="color:var(--dng,#b91c1c)">例外题比整个项目的题数还多，检查一下题号。</span>';
  if(sum==null) return '其余 '+rest+' 题：分数填完才算得出来';
  if(sum>mx) return '<span style="color:var(--dng,#b91c1c)">加起来 '+sum+' 分 > 满分 '+mx+' 分</span>';
  if(!rest) return sum===mx?'刚好 '+mx+' 分 ✓'
    :'<span style="color:var(--dng,#b91c1c)">加起来 '+sum+' 分 ≠ '+mx+' 分</span>';
  const per=(mx-sum)/rest;
  return '其余 '+rest+' 题，每题 <b>'+(Math.round(per*100)/100)+'</b> 分';
}

/* ══ v26 F7 Controlled Delete ══
   删除铁则：云端先删且逐笔验 affected rows；0 列 = 失败（不显示成功、不删本机）。
   有 evidence（含【只有 live_obs】的情形）→ 影响评估 → 警告 → 完整 JSON 备份 → 下载闸 →
   子资料逐张验删（子先父后、不靠 CASCADE）→ 最后删 section → 最终不存在检查。 */
function delAudit(what,n,extra){ if(!Array.isArray(S.audit))S.audit=[]; S.audit.unshift({at:new Date().toISOString(),by:S.me||'',what,n,extra:extra||''}); S.audit=S.audit.slice(0,80); }
function secScopeMatch(k){ return k.endsWith(piSuffix()); }
function secImpact(s){
  const su=S.subject, code=s.code;
  const qin=(w)=> (s.qf!=null&&s.qt!=null&&+w.q>=+s.qf&&+w.q<=+s.qt);
  const f1=Object.entries(S.f1).filter(([k,r])=>r&&r.subject===su&&r.bahagian===code&&secScopeMatch(k));
  const wi=Object.entries(S.wi).filter(([k,w])=>w&&w.subject===su&&(w.sec_code===code||qin(w))&&secScopeMatch(k));
  const es=Object.entries(S.es).filter(([k,e])=>e&&e.subject===su&&e.sec_code===code&&secScopeMatch(k));
  return {f1,wi,es,total:f1.length+wi.length+es.length};
}
async function cloudDelById(table,idv){

  catch(e){ return {ok:false,n:0,error:(e&&e.message)||String(e)}; }
}

async function delSection(id){
  /* v28 · Owner 2026-09-15 裁定：**没有学生资料就可以改可以删；有学生资料只能删，不能改。**
     所以删除不再走 bpGuard（那支是挡「改」的）。把关交给下面本来就有的两段流程：
     无证据 → 确认一次即删；有证据 → 管理层权限 + 列出影响 + 强制备份 + 二次确认。 */
  if(!bpCanEditPaper()){ toast('✕ 这份考卷不是你开的 —— 只能填学生资料，不能改它的考卷项目',3200); return; }
  const arr=S.sections[bpKey()]||[];
  const s=arr.find(x=>x.id===id); if(!s) return;
  const imp=secImpact(s);

  /* ---- 无 student evidence ---- */
  if(imp.total===0){
    if(!confirm(`删除项目「${s.code}」？目前没有任何 student evidence。`)) return;
    if(s.cloud_id && _sb && CLOUD.exam){
      if(!(CLOUD.perm&&CLOUD.perm.can_approve)){ alert('云端删除需要管理层权限（can_approve）。本机未删。'); return; }
      const r=await cloudDelById('evalgo_paper_section',s.cloud_id);
      if(!r.ok || r.n<1){ alert('删除没有成功（云端返回 '+(r.n||0)+' 列）。资料仍保留，本机也不删。\n'+(r.error||'')); return; }
    }
    S.sections[bpKey()]=arr.filter(x=>x.id!==id);
    delAudit('删除项目·无证据',1,S.subject+'|'+s.code);
    if(saveThen('✓ 已删除')){ closeModal(true); bpRefresh(); }
    return;
  }

  /* ---- 有 evidence：受控永久删除 ---- */
  if(!(CLOUD.perm&&CLOUD.perm.can_approve)){
    alert('这个项目已关联 '+imp.total+' 笔资料，删除需要管理层（can_approve）。'); return; }
  if(!confirm(`项目「${s.code}」已关联：\n考前观察 ${imp.f1.length} · 逐题 ${imp.wi.length} · 作文 ${imp.es.length}（共 ${imp.total} 笔）\n\n删除会永久删除这些资料，无法复原。确定继续？`)) return;

  /* Step A + B：完整备份 + 下载闸（未成功启动 → BLOCK） */
  const backup={when:new Date().toISOString(),exam:CLOUD.exam.code,paper:S.paperInstance||'(legacy)',
    section:s, live_obs:imp.f1.map(x=>x[1]), wrong_item:imp.wi.map(x=>x[1]), essay_result:imp.es.map(x=>x[1])};
  try{ dl(`EvalGo_delete_backup_${s.code}_${stamp()}.json`, JSON.stringify(backup,null,2)); }
  catch(e){ alert('备份下载没有启动 —— 为安全起见取消删除。'); return; }
  if(!confirm('备份档已开始下载。确认你已收到备份档，再继续永久删除。\n[确定]=继续　[取消]=中止')) return;

  /* Step C：子资料逐张验删（子先父后、不 CASCADE、affected rows 不符即停） */
  if(s.cloud_id && _sb && CLOUD.exam){
    const steps=[
      {t:'evalgo_live_obs',   col:'bahagian',   val:s.code,     expect:imp.f1.length},
      {t:'evalgo_wrong_item', col:'section_id', val:s.cloud_id, expect:imp.wi.length},
      {t:'evalgo_essay_result',col:'section_id',val:s.cloud_id, expect:imp.es.length}
    ];
    for(const st of steps){
      const r=await cloudDelBy(st.t,st.col,st.val);
      if(!r.ok){ alert('删除中止：'+st.t+' 删除失败（'+(r.error||'')+'）。section 未删，请找管理层。'); return; }
      if(st.expect>0 && r.n<1){ alert('删除中止：'+st.t+' 预期删 '+st.expect+' 笔、云端删了 0 笔（权限或范围不符）。section 不删。'); return; }
    }
    const rp=await cloudDelById('evalgo_paper_section',s.cloud_id);
    if(!rp.ok || rp.n<1){ alert('子资料已删，但 section 本身删除返回 0 列。请找管理层核对，勿重复操作。'); return; }
  }
  /* 云端确认后才动本机（子 + section） */
  imp.f1.forEach(([k])=>delete S.f1[k]);
  imp.wi.forEach(([k])=>delete S.wi[k]);
  imp.es.forEach(([k])=>delete S.es[k]);
  S.sections[bpKey()]=arr.filter(x=>x.id!==id);
  delAudit('受控删除项目·含证据',imp.total,S.subject+'|'+s.code);
  if(saveThen('✓ 已永久删除项目与其证据')){ closeModal(true); bpRefresh(); }
}

             : sts.indexOf('absent')>=0      ? 'absent'
             : sts.indexOf('notassessed')>=0 ? 'notassessed' : 'none';
    /* 考前观察先数 —— 缺席与否都算（洞 3） */
    const hasObs=f1Complete(r.sid,subj).length>0;
    if(hasObs) obsDone++;
    /* ① Operational Resolved —— 不再催，但绝不等於有证据（见 reportReady） */
    if(st==='absent'||st==='notassessed'){
      if(st==='absent') absent++; else na++;
      return;                      /* 不进 obsLeft / papLeft：不催 */
    }
    if(!hasObs) obsLeft.push(r);
    if(st==='done'){ papStarted++; papFull++; }
    else { papLeft.push(r); if(st==='progress'){ papStarted++; prog++; } }
  });
  return {n:list.length, obsDone, papStarted, papFull, obsLeft, papLeft, absent, na, prog,
          papDone:papFull,                 /* 旧名保留：还有别处在读 */
          secs:secsCountFor(subj,yearOf(cls))};   /* v27：改扫整格，见 secsCountFor */
}

function enterCell(cls,subj,page){

  S.cls=cls; S.subject=subj;

  S._enterPage = page || 'papers';

  if(CLOUD.hasPI && S._papersScope!==paperScopeKey()){

function f1Key(sid,bah){ return EXK()+'|'+sid+'|'+S.subject+'|'+bah+piSuffix(); }
/* 🔴 v10：老师点一个评分就建立了 S.f1[k]，关掉不按「完成」也算已观察。
   FORM 02 已经分了 progress / done，FORM 01 却还留着同样的问题。
   统一：存在 = DRAFT；有 savedAt = COMPLETE。所有统计只认 COMPLETE。 */
function f1Complete(sid,subject,exam){
  const pre=(exam||EXK())+'|'+sid+'|'+(subject||S.subject)+'|';
  return Object.keys(S.f1).filter(k=>k.indexOf(pre)===0&&S.f1[k]&&S.f1[k].savedAt).map(k=>S.f1[k]);
}

  /* v20：这里原本是一整排 inline 输入框（项目/题型/题号/满分/同分/主题/作答方式）。

     改成一颗按钮开弹窗 —— 跟第一次设定考卷时走**同一个**表单，

   「这份卷有几个项目、第几题到第几题、各几分」是一份卷设定一次的事，

   v19.4 把它整个锁给管理层，那是错的 —— **每份考卷都不一样，只有科任知道
   自己那份卷子有几个项目、第几题到第几题、考什么文法**。管理层填不了 30 份

   P0-5 真正要保护的不是「谁来填」，是「有证据之后不准改」。两件事分开：
     · 谁能填  → 教这个班这一科的科任（她自己的卷），加上管理层
     · 能不能改 → 由 bpLocked() 管，对【所有人】一视同仁，包括管理层
   建立一份还不存在的结构永远是安全的（那时候还不可能有证据）；
   危险的是「已经有证据了还去删项目 / 改题号」—— 那一段照旧锁死。 */

   若还用它当条件，**所有老师都改不了考卷项目**，那 5 格永远填不起来。
   改成只看填写权限：能填资料的人就能登记这份卷的项目。 */
function bpCanEdit(){ return isAdmin() || !!(CLOUD.perm && CLOUD.perm.can_edit); }
/* 考卷项目能不能动 —— 卷是谁开的谁说了算。
   别人开的卷，你可以填学生资料，但不能动她的考卷项目。

const BP_UNLOCK={};
function bpEvidLocal(){
  const ex=EXK(), su=S.subject, yr=yearOf(S.cls); let n=0;
  Object.keys(S.wi).forEach(k=>{const w=S.wi[k];
    if(w&&w.exam===ex&&w.subject===su&&(+w.year||0)===yr) n++;});
  Object.keys(S.es).forEach(k=>{const e=S.es[k];
    if(e&&e.exam===ex&&e.subject===su&&(+e.year||0)===yr) n++;});
  Object.keys(S.f2).forEach(k=>{const r=S.f2[k];

function bpAdd(editId){
  const g=id=>String(((document.getElementById(id)||{}).value)||'').trim();
  const code=g('mCode'), type=g('mType')||'MCQ', topic=g('mTopic'), fmt=g('mFmt');
  const even=g('mEven');
  const qf=parseInt(g('mQf'),10), qt=parseInt(g('mQt'),10), mx=parseFloat(g('mMax'));
  if(!code){ toast('✕ 项目名称不能空'); return; }
  const arr=S.sections[bpKey()]||(S.sections[bpKey()]=[]);
  const me=editId?arr.find(x=>x.id===editId):null;
  if(editId && !me){ toast('✕ 找不到这个项目'); return; }
  if(me && bpLocked()){ bpGuard('修改项目'); return; }   /* 有学生资料 → 只能删，不能改 */
  if(arr.some(x=>x.code===code && x!==me)){ toast('✕ 这个项目已经有了'); return; }
  if(!(mx>0)){ toast('✕ 请填这个项目共几分'); return; }
  if(type!=='ESSAY'){
    if(!(qf>=1)||!(qt>=qf)){ toast('✕ 题号范围不对（例：1 到 10）'); return; }
    const clash=arr.filter(x=>x!==me&&QTYPES.indexOf(x.type||'MCQ')>=0&&+x.qf>=1)
                   .find(x=>!(qt<(+x.qf)||qf>(+x.qt)));
    if(clash){ toast(`✕ 题号 ${qf}-${qt} 与「${clash.code}」重叠`); return; }
  }
  /* v29 · 小题结构。分数可留空 —— 只挡「明显不可能」的填法，不挡「还没填完」。 */
  bpQmSync();
  const qm = (type==='ESSAY') ? null : qmFromRows(BPQM);
  if(qm){
    const exQ=qmExcQs(qm);
    for(const q of exQ){
      if(!(+q>=qf && +q<=qt)){
        toast(`✕ 第 ${q} 题不在这个项目的题号范围（${qf}–${qt}）内`); return; }
    }
    for(const q of Object.keys(qm.subs||{})){
      if(Object.keys(qm.subs[q]).length<2){
        toast(`✕ 第 ${q} 题只有一个小题 —— 至少要两个（a、b）`); return; }
    }
    const sum=qmExcSum(qm), totQ=qt-qf+1, rest=totQ-exQ.length;
    if(sum!=null){
      if(sum>mx){ toast(`✕ 例外题加起来 ${sum} 分，超过这个项目的 ${mx} 分`); return; }
      if(rest>0 && sum===mx){
        toast(`✕ 例外题就用掉全部 ${mx} 分，其余 ${rest} 题会变成 0 分`); return; }
      if(rest===0 && sum!==mx){
        toast(`✕ 全部题目都列出来了，但加起来 ${sum} 分 ≠ ${mx} 分`); return; }
    }
  }
  const patch={code,topic,fmt,type,
    qm:qm,
    qf:type==='ESSAY'?null:qf, qt:type==='ESSAY'?null:qt, max:mx,
    even:(type==='ESSAY'?'':even),   /* 未声明就不算分（fail-closed），与 addSection 同规矩 */
    by:S.me, synced:false};
  if(me) Object.assign(me,patch);    /* 修改：client_uid / cloud_id 保留，上传时 upsert 覆盖同一列 */
  else arr.push(Object.assign({id:uid(),client_uid:uid(),ses:SESSION_ID,
    sort:arr.length, cloud_id:null}, patch));
  /* 弹窗重画（可以接着加下一个）+ 背后的表格也要同步，
     否则关掉弹窗才看得到刚加的那一列。 */
  if(saveThen(editId?'✓ 已修改':'✓ 已加入')){ closeModal(true); bpRefresh(); autoPush(); }
}

function f1Save(k,sid,goNext){
  const r=f1Draft(k);

  /* 🔴 v10 BUG：加了 exam 前缀後索引没跟着改，

     → subject 被写成 student_id、bahagian 被写成 subject。资料污染级。
     改用具名解构，之後再改 key 结构也不会再错位。 */
  const [kEx,kSid,kSubj,kBah]=k.split('|');
  const st=stuOf(sid)||{};
  const sec=secOf(kBah);
  r.sid=sid||kSid; r.subject=kSubj; r.bahagian=kBah; r.cls=st.cls||S.cls;
  r.topic=sec?sec.topic:''; r.fmt=sec?sec.fmt:'';
  r.year=st.year||yearOf(r.cls); r.class_id=st.class_id||null;
  r.obs_date=(document.getElementById('f1date')||{}).value||today();
  r.by=S.me; r.exam=S.examCode; r.savedAt=new Date().toLocaleString('en-GB'); r.synced=false;
  /* ⚠️ 存档成功才报喜。v7 是无条件 toast('✓ Saved')，
     会把 saveData 内部的「✕ 储存失败」用同一个元素盖掉，老师永远看不到失败。 */
  if(saveData(true)===false){
    alert(saveFailMsg());
    return;
  }
  if(goNext){
    const nx=navTodo(sid,'f1');
    if(nx && nx!==sid){ renderF1(); toast('✓ 已完成 · '+kBah); autoPush(); f1Open(nx); return; }
    closeModal(); renderF1(); autoPush();

    return;
  }

}

/* ══════════════════════════════════════════════════════════════════
   卷面题号 vs 内部流水号（v20 · 刀一）

/* 改「卷面起始号」**不锁**：它不动 q，没有任何一笔证据会挂到别题去。
   （对照 setSecRange 改 qf/qt \u2014 那个会漂移，所以要 bpGuard。） */
function setPaperFrom(id){

function qsubHas(w,x){ return String((w&&w.qsub)||'').split(',').indexOf(x)>=0; }

/* ⚠️ 只有「有合法题号范围」的项目才算题。

function qSections(){ return sections().filter(x=>QTYPES.indexOf(x.type||'MCQ')>=0 && hasRange(x)); }
function legacySections(){ return sections().filter(x=>QTYPES.indexOf(x.type||'MCQ')>=0 && !hasRange(x)); }
function setSecRange(id){

function essaySections(){ return sections().filter(x=>x.type==='ESSAY'); }

/* ══ 得分 ══ Owner 2026-09-07 拍板（方案 D）
   「自动算分」= 项目满分 ÷ 题数 = 每题分数。这个算法只在
   【同一个项目内每题同分】时成立，而那是关于这份卷的事实 ——
   只有看过卷的老师知道。所以不推断：她在考卷结构里声明一次（sec.even），
   之后全班自动算。未声明 / 声明不同分 → 该项目不算分，且总分一定标涵盖率。
   ⚠️ 分数只给老师与管理层参考，不进家长报告。 */
function secPerQ(sec){
  if(!sec || sec.even!=='Y') return null;          /* 没声明 = 不算，fail-closed */
  if((sec.type||'MCQ')==='ESSAY') return null;     /* 写作用老师亲填的实得分 */
  const n=(+sec.qt||0)-(+sec.qf||0)+1;
  if(!(n>0) || !(+sec.max>0)) return null;
  return (+sec.max)/n;
}
function paperScore(sid){
  const rec=S.f2[f2Key(sid)];
  if(!rec || aStat(rec)!=='ASSESSED' || !rec.paper_checked) return null;
  const wi=wiOf(sid);
  let got=0, max=0, covered=0; const secs=sections(), missing=[];
  secs.forEach(sec=>{
    if((sec.type||'MCQ')==='ESSAY'){
      const er=S.es[esKey(sid,sec.code)];
      if(er && er.score!=null && er.score!=='' && +sec.max>0){
        got+=+er.score; max+=+sec.max; covered++;
      } else missing.push(esc(sec.code)+'（写作还没填得分）');
      return;
    }
    /* v43：改走共用核心 —— 旧版 wrong × 平均分，不认 q_marks，
       6b 值 2 分也只扣平均分。现在每一格照它自己的分数扣。 */
    const r2=secScoreOf(sec, wi.filter(w=>+w.q>=+sec.qf && +w.q<=+sec.qt));
    if(!r2){
      missing.push(esc(sec.code)+(sec.even==='N'?'（每题不同分，还没填 q_marks）':'（还没声明每题几分）'));
      return;
    }
    got += r2.got; max += r2.max; covered++;
  });
  if(!covered) return {got:null,max:0,covered:0,total:secs.length,missing};
  return {got:Math.round(got*10)/10, max:Math.round(max*10)/10,
          covered, total:secs.length, missing};
}
/* 显示用：永远把涵盖率讲出来，绝不给一个偷偷漏掉项目的总分 */
function scoreLine(sid,small){
  const r=paperScore(sid);
  if(!r) return '';
  const full = r.covered===r.total && !r.missing.length;
  if(r.got==null) return `<div class="tip" style="margin:${small?'4px 0 0':'6px 0 0'}">
    得分：<b>算不出来</b> —— ${esc(r.missing.join('、'))}</div>`;
  const pct = r.max? Math.round(r.got/r.max*100) : null;
  return `<div class="tip" style="margin:${small?'4px 0 0':'6px 0 0'}">
    得分 <b style="font-size:14px">${r.got} / ${r.max}</b>${pct!=null?` · ${pct}%`:''}
    ${full ? '<span class="chip chip-ok">涵盖全部项目</span>'
           : `<span class="chip chip-warn">只涵盖 ${r.covered} / ${r.total} 个项目</span>
              <div style="font-size:11.5px;color:var(--mut);margin-top:2px">
                没算进去：${esc(r.missing.join('、'))}</div>`}
    <div style="font-size:11px;color:var(--hint);margin-top:2px">
      这个分数只给老师与管理层参考，不会进家长报告。</div></div>`;
}
function totalQ(){ return qSections().reduce((a,x)=>a+((+x.qt||0)-(+x.qf||0)+1),0); }
function secOfQ(q){ return qSections().find(x=>q>=+x.qf&&q<=+x.qt)||null; }

/* ══ 考卷项目声明的小题 ══
   ⚠️ 题号一律用内部流水号 q（与 qf/qt、q_marks 的 key 同一套）；
      画面上印的是卷面号 toPaper(sec,q)。两者不可混用。 */
function qmSubsOfQ(q){
  const sec=secOfQ(q);
  if(!sec||qmEmpty(sec.qm)) return null;
  const o=(sec.qm.subs||{})[String(q)];
  return (o&&Object.keys(o).length)?o:null;
}
function qmSubLabs(q){ const o=qmSubsOfQ(q); return o?Object.keys(o).sort():null; }
function qHasSubs(q){ return !!qmSubsOfQ(q); }

/* ══ v33 · 记录单位 = 一题，或一个小题 ══════════════════════════════
   Owner 2026-09-15（图4/图5）：「第 6 题有 a,b,c —— 你没有让老师根据
   第6题a、第6题b、第6题c 来填写」。

   v31/v32 我做成「先选第 6 题怎么了，再勾是哪个小题」—— 那是**一题一笔**，
   不是 Owner 要的**一个小题一笔**。三次都做错，这一版改对：
     没声明小题 → 第 6 题一颗按钮（与 v32 之前逐字相同）
     声明了 a/b/c → 变成 6a / 6b / 6c 三颗按钮，各自选 ★/DK/CL/NR/SOS/空

   ⚠️ 本机 key 加上 '@小题'。旧纪录没有 '@'，呼叫端不传 sub 时产生的 key
      与 v32 逐字相同 —— 旧资料一笔都不会失联。
   ⚠️ 云端 evalgo_wrong_item 的 q_sub 栏 delta v12 就有了，不必新增栏位；
      但唯一索引 evalgo_wrong_item_pi_key 目前是 (exam,student,subject,q_no,paper_instance)
      —— 6a/6b/6c 的 q_no 都是 6，会撞。必须把 q_sub 加进那支索引（delta v14）。
      索引还没改之前，第二笔以後会被云端挡下 —— 见 cloudPush 的 needV14 处理，
      资料留在本机，不会掉，也不会把顶栏卡成永远红的。 */
function uKey(q,sub){ return String(q)+(sub?'@'+sub:''); }
function uParse(k){ const p=String(k).split('@'); return {q:+p[0], sub:p[1]||null}; }
/* 一个项目底下所有「可以点」的单位 */
/* v43：小题标签改成直接读 sec.qm —— 旧版走 qmSubLabs(q) → secOfQ(q) → qSections()，
   那是**当下选到的格**。老师端结果一样，但报告层要跨科跨年段跑，
   偷读环境变数会算到别人的卷上去。现在这支只吃参数。 */
function qUnits(sec){
  const out=[], subs=(sec&&sec.qm&&sec.qm.subs)||{};
  for(let q=+sec.qf;q<=+sec.qt;q++){
    const o=subs[String(q)];
    const labs=(o&&Object.keys(o).length)?Object.keys(o).sort():null;
    if(labs) labs.forEach(l=>out.push({q:q,sub:l}));
    else out.push({q:q,sub:null});
  }
  return out;
}

/* ══════════════════════════════════════════════════════════════════
   v43 · 算分核心 —— 老师端与报告层共用这一支，不准各写各的
   ------------------------------------------------------------------
   Owner 2026-09-15 裁决 3：「空 · 漏答」= 0 分，跟做错一样扣满。
     报告上分开讲（不会做 / 没时间写完），但扣分一样。
   分数来源优先序：
     ① q_marks 明写（第 6 题 a 1 分 b 2 分 c 3 分）
     ② 其余题平均分 =（项目满分 − 例外题总分）÷ 其余题数
     ③ 只声明「每题同分」→ 满分 ÷ 题数
     ④ 都没有 → null。**null 不是 0 分**，是「还没声明」，整个项目不进总分并标出来。
   ⚠️ 云端现况：84 个项目里 even_marks='Y' 的是 0 个、有 q_marks 的 1 个
      —— 所以现在几乎每一格都会走到 ④。这是资料还没填，不是程式坏。
   ══════════════════════════════════════════════════════════════════ */
function qmRest(sec){
  const qm=sec&&sec.qm, mx=+sec.max;
  if(!(mx>0)||!(+sec.qt>=+sec.qf)) return null;
  const totQ=(+sec.qt)-(+sec.qf)+1;
  if(qmEmpty(qm)) return sec.even==='Y' ? mx/totQ : null;
  const exQ=qmExcQs(qm), sum=qmExcSum(qm);
  if(sum==null) return null;                 /* 例外题还有分数没填 → 不硬算 */
  const rest=totQ-exQ.length;
  if(rest<0) return null;
  if(rest===0) return 0;                     /* 全部题都列出来了，没有「其余题」 */
  return (mx-sum)/rest;
}
function qMarkOf(sec,q,sub){
  const qm=sec&&sec.qm;
  if(qm){
    const o=(qm.subs||{})[String(q)];
    if(sub!=null){
      if(o) return (o[sub]==null)?null:(+o[sub]);
    }else if(o){
      let t=0, ok=true;
      Object.keys(o).forEach(l=>{ const v=o[l]; if(v==null) ok=false; else t+=(+v); });
      return ok?t:null;                      /* 整题分 = 小题总和 */
    }else if((qm.per_q||{})[String(q)]!=null){
      return +qm.per_q[String(q)];
    }
  }
  return qmRest(sec);
}
/* 这个项目学生拿几分。回 {got,max}，或 null = 算不出（分数还没声明）。
   前提：呼叫端已确认老师按过「整份都看过了」—— 没点的格才算答对。 */
function secScoreOf(sec, wiList){
  if(!sec || (sec.type||'MCQ')==='ESSAY') return null;
  const mx=+sec.max; if(!(mx>0)) return null;
  let lost=0;
  for(const u of qUnits(sec)){
    /* 🔴 先确认这一格声明了分数，再看学生对不对。
       顺序反过来的话，「全对」的学生一格都不会被检查 ——
       一个分数还没声明的项目会**静静地给满分**。fail-closed 必须在前面。 */
    const m=qMarkOf(sec,u.q,u.sub);
    if(m==null) return null;                  /* 这一格还没声明分数 → 整个项目算不出 */
    const w=(wiList||[]).find(x=>+x.q===u.q && ((x.qsub||null)===(u.sub||null)));
    if(!w || w.code==='star') continue;       /* 没点 = 答对 */
    lost+=m;                                  /* 裁决 3：漏答与做错同样扣满 */
  }
  return {got:Math.max(0, mx-lost), max:mx};
}
function allUnits(){ const o=[]; qSections().forEach(sec=>{ qUnits(sec).forEach(u=>o.push(u)); }); return o; }
function totalUnits(){ return allUnits().length; }
function wiKey(sid,q,sub){ return EXK()+'|'+sid+'|'+S.subject+'|'+uKey(q,sub)+piSuffix(); }
function wiGet(sid,q,sub){ return S.wi[wiKey(sid,q,sub)]||null; }
function wiOf(sid){
  const pre=EXK()+'|'+sid+'|'+S.subject+'|';
  return Object.keys(S.wi).filter(k=>k.indexOf(pre)===0).map(k=>S.wi[k]);
}
function wiSet(sid,q,code,diag,sub){
  const k=wiKey(sid,q,sub), cur=S.wi[k];
  if(code===null){ if(cur) delete S.wi[k]; }
  else{
    const sec=secOfQ(q)||{}, st=stuOf(sid)||{};

      /* v33：这一笔就是「第 6 题 a」本身，qsub 是它的身分，不再是附注 */
      qsub: sub || (cur?cur.qsub:null) || null,
      diag:(diag!==undefined?diag:(cur?cur.diag:''))||'',
      topic:sec.topic||'', fmt:sec.fmt||'', sec_code:sec.code||'', sec_type:sec.type||'MCQ',
      cls:st.cls||S.cls, class_id:st.class_id||null, year:st.year||yearOf(S.cls),
      by:S.me, exam:S.examCode,
      savedAt:new Date().toLocaleString('en-GB'), synced:false,
      cloud_id:(cur&&cur.cloud_id)||null };
  }
  const r=f2Draft(sid); r.synced=false; stampF2(r,sid); saveData();
}
function wiDiag(sid,q,v){
  const w=wiGet(sid,q); if(!w) return;
  w.diag=v; w.synced=false; w.savedAt=new Date().toLocaleString('en-GB');
  const r=f2Draft(sid); r.synced=false; saveData();
}
function markCounts(sid){
  const o={star:0,dk:0,cl:0,nr:0,sos:0,blank:0};
  wiOf(sid).forEach(w=>{ if(o[w.code]!=null) o[w.code]++; });
  o.wrong  = o.dk+o.cl+o.nr+o.sos+o.blank;   /* 漏答本来就没得分，算错 */
  o.marked = o.wrong+o.star;
  /* v33：老师看到几颗按钮，分母就是几 —— 第 6 题拆成 6a/6b/6c 就是 3 格。
     ⚠️ 上云的 total_q 仍然是 totalQFor()（题数），本次**刻意不动**，
        因为那是报告层的分母，动它就踩 L-1。两者在有小题的格子会不一致，
        必须在 v34 报告层一起对齐 —— 已写进交付报告。 */
  o.total  = totalUnits();
  o.checked= !!(S.f2[f2Key(sid)]||{}).paper_checked;
  /* ⚠️ 未核对整份考卷之前，没标记的题是 UNKNOWN，不是答对。
     所以答对数与答对率【只有核对後才存在】。这是 Owner 的 Evidence Truth 要求。 */
  o.right = o.checked ? Math.max(0,o.total-o.wrong) : null;
  o.rate  = (o.checked && o.total) ? Math.round(o.right/o.total*100) : null;
  return o;
}
function mainIssue(m){
  const cand=[{k:'dk',lab:'知识缺口'},{k:'cl',lab:'粗心'},{k:'nr',lab:'审题'},
              {k:'sos',lab:'依赖'},{k:'blank',lab:'漏答'}];
  let best=null,bv=0; cand.forEach(c=>{const v=+m[c.k]||0; if(v>bv){bv=v;best=c;}});
  if(!best||!bv) return null;
  return {lab:best.lab,n:bv,tie:cand.filter(c=>(+m[c.k]||0)===bv).length>1};
}
function topicDiag(sid){
  const per={};
  const touch=t=>{ if(!per[t]) per[t]={topic:t,total:0,wrong:0,star:0,dk:0,cl:0,nr:0,sos:0,blank:0}; return per[t]; };
  /* v33：跟著改成算格数，否则主题分析的分母跟画面对不上 */
  qSections().forEach(x=>{ touch(x.topic||x.code).total += qUnits(x).length; });
  wiOf(sid).forEach(w=>{ const t=touch(w.topic||w.sec_code||'—');
    if(w.code==='star') t.star++; else { t.wrong++; if(t[w.code]!=null) t[w.code]++; } });
  const chk=!!(S.f2[f2Key(sid)]||{}).paper_checked;
  return Object.keys(per).map(k=>{const x=per[k];
      x.rate = (chk && x.total)? Math.round((x.total-x.wrong)/x.total*100) : null; return x;})
    .sort((a,b)=>(b.wrong-a.wrong)||((a.rate==null?101:a.rate)-(b.rate==null?101:b.rate)));
}
/* ⚠️ v8 移除「建议 TP」。
   Owner 确认 TP 由老师自己判，教务没有对照标准。
   先前 90/80/65/50/35 → TP6..TP1 的映射是 Claude 自行发明，无学术依据，已撤销。
   系统只呈现事实（答对率），不代替老师下判断。 */
function autoWeak(sid){ return topicDiag(sid).filter(t=>t.wrong>0); }
function autoStrong(sid){
  /* 「全对」这个结论只有核对过整份卷才成立 */
  if(!(S.f2[f2Key(sid)]||{}).paper_checked) return [];
  return topicDiag(sid).filter(t=>t.total>0&&t.wrong===0);
}

/* ══ 写作结果：一篇一列（Owner 确认一份卷可能两篇）══ */
function esKey(sid,code){ return EXK()+'|'+sid+'|'+S.subject+'|'+code+piSuffix(); }
function esDraft(sid,code){
  const k=esKey(sid,code);
  if(!S.es[k]) S.es[k]={client_uid:uid(),ses:SESSION_ID,weak:[],star:false,score:null};
  return S.es[k];
}
function esOf(sid){
  const pre=EXK()+'|'+sid+'|'+S.subject+'|';
  return Object.keys(S.es).filter(k=>k.indexOf(pre)===0).map(k=>S.es[k]);
}
function esStamp(sid,code,sec){
  const r=esDraft(sid,code), st=stuOf(sid)||{};
  r.sid=sid; r.subject=S.subject; r.sec_code=code;
  r.sec_cloud_id=(sec&&sec.cloud_id)||null;
  r.max=sec?(+sec.max||null):r.max;
  r.cls=st.cls||S.cls; r.class_id=st.class_id||null; r.year=st.year||yearOf(S.cls);
  r.by=S.me; r.exam=S.examCode;
  r.savedAt=new Date().toLocaleString('en-GB'); r.synced=false;
  return r;
}

function paintPick(sid){

           :`<button class="chip chip-muted" onclick="qPick('${sid}','${PICKQ}','__close')">收起</button>`}</div>

function clSub(sid,q,v){

/* ══ 完成状态：三态。追踪只认「已完成」 ══ */
function f2State(p){
  if(!p) return 'none';
  const a=aStat(p);
  if(a==='ABSENT')       return 'absent';
  if(a==='NOT_ASSESSED') return 'notassessed';
  /* v42：纯作文卷不要求 paper_checked —— 跟 f2Missing 同一支判断，
     否则会出现「弹窗说可以完成、进度矩阵说还没完成」这种自相矛盾。 */
  if(p.tp && (p.paper_checked || !f2NeedsCheck(p))) return 'done';
  if(f2Started(p)) return 'progress';
  return 'none';
}
const F2STATE={ none:{lab:'未开始',cls:''}, progress:{lab:'进行中',cls:'b-warn'},
                done:{lab:'已完成',cls:'b-active'},
                absent:{lab:'缺席',cls:'b-inactive'}, notassessed:{lab:'本轮未评',cls:'b-inactive'} };
/* 还差什么 —— 老师要看得到自己离「完成」还有多远，才不会填一半就走 */
/* ══ v42 · Owner 2026-09-15 ══
   「整份都看过了」的意思是「没点到的题算答对」。
   纯作文卷一道题都没有（已点 0 / 0 题），这句话讲不通 ——
   ATC3 华文「写日记」14 位有考前观察、0 位完成，就是卡在这个讲不通的要求上。
   → 有逐题才要求；纯作文卷只要求 TP。 */
/* 这一格（科目 + 年段）登记了哪几种项目。
   ⚠️ 跟 secsCountFor 一样扫整格（跨卷）—— 只回答「有没有」，绝不可当分母。 */
function secKindsFor(subject,year){
  const pre=EXK()+'|'+subject+'|'+year; let q=false, e=false;
  Object.keys(S.sections||{}).forEach(k=>{
    if(!(k===pre||k.indexOf(pre+'|')===0)) return;
    (S.sections[k]||[]).forEach(x=>{
      if(!x) return;
      if(x.type==='ESSAY') e=true;
      else if(QTYPES.indexOf(x.type||'MCQ')>=0 && hasRange(x)) q=true; });
  });
  return {q,e};
}
/* 要不要老师按「整份都看过了」。
   有逐题 → 要。纯作文 → 不要（没有「没点的题」可以算答对）。
   ⚠️ 什麽都还没登记 → **照旧要求**（fail-closed）。不然一个没有结构的格子
      只要点一下 TP 就会变成「已完成」，那是凭空造出完成状态。 */
function f2NeedsCheck(p){
  /* ⚠️ f2Draft() 新建的纪录只有 client_uid，还没有 subject / year ——
     老师一打开弹窗就是这种纪录，所以必须退回「当下这一格」，
     否则作文卷第一次打开照样被要求按那个钮（这个洞害我第一版没修到）。
     退回只在科目对得上时才做，免得跨格误判。 */
  const subj=(p&&p.subject)||S.subject;
  if(!subj) return true;
  const st=(p&&p.sid)?stuOf(p.sid):null;
  let yr=(p&&p.year)||(st?yearOf(st.cls):null);
  if(!yr && subj===S.subject && S.cls) yr=yearOf(S.cls);
  if(!yr) return true;
  const k=secKindsFor(subj,yr);
  if(k.q) return true;
  if(k.e) return false;
  return true;
}
function f2Missing(sid){
  const r=f2Draft(sid), out=[];
  if(f2NeedsCheck(r) && !r.paper_checked) out.push('整份看完了');
  if(!r.tp)            out.push('掌握程度');
  /* v31 这里曾经有一条「有小题的题目标了错就必须说是哪个小题」。
     v33 起小题本身就是一格（6a / 6b / 6c 各自要点），
     「只标整题错、不标小题」这个模糊情况**在结构上就不存在了**，
     不需要再用提示去挡。条文作废，规矩由资料模型保证。 */
  return out;
}

function f2Open(sid){
  const r=stuOf(sid); if(!r) return;
  if(window._f2cur!==sid) PICKQ=null;
  window._f2cur=sid;
  const rec=f2Draft(sid), y=r.year||yearOf(r.cls);
  const qs=qSections(), es=essaySections(), lg=legacySections();
  /* ══ v42 · Owner 2026-09-15：「这个太复杂了！老师不需要填的应该删除」 ══
     旧版 13 个区块，必做的 2 件夹在第 5 与第 9，跟可不做的长得一模一样 ——
     全校 16 位卡在「整份都看过了」没按，根因在这里。
     新版三段：【必做】最上面 → 【这份卷】→ 【其他 · 折叠】。
     ⚠️ 选填栏位一个都没删 —— 它们全部印在家长报告上，删了报告会空白。 */
  let b=navBar(sid,'f2')+`<div id="f2must"></div>`;

  if(!qs.length && !es.length){
    b+=`<div class="alert alert-danger"><div><b>这份考卷还没办法逐题记录。</b><br>
      ${lg.length?`已登记的 ${lg.length} 个项目（${lg.map(x=>esc(x.code)).join('、')}）
        <b>没有填题号范围</b>，系统不知道第几题属於哪个项目。`
       :`这个科目 / 年级还没有登记任何项目。`}<br><br>
      ${bpCanEdit()
        ? `请到<b>考前观察</b>最上方，把每个项目补上「第 __ 到 __ 题」（写作文填满分），回来这里题号格就会出现。`
        : `<b>请教这一科的科任</b>补上考卷结构 —— 只有她看过那份卷子。`}</div></div>`;
  }
  if(qs.length){
    b+=`<div class="secbox"><div class="sechd">逐题记录
      <span class="sub">点题号 → 选这题怎么了 · 没点的题先当「还没看」</span></div>`;
    qs.forEach(sec=>{
      b+=`<div style="margin-bottom:12px">
        <div style="font-weight:700;margin-bottom:4px">${esc(sec.code)}
          <span class="chip chip-muted">${esc(typeLab(sec.type||'MCQ'))}</span>
          ${sec.topic?`<span class="chip chip-layer">${esc(sec.topic)}</span>`:''}
          ${sec.fmt?`<span class="chip chip-muted">${esc(sec.fmt)}</span>`:''}
          <span style="color:var(--mut);font-size:11px">${rangeLabel(sec)}</span></div>
        <div class="qgrid">`;
      /* v33：有声明小题的题 → 一个小题一颗按钮（6a / 6b / 6c） */
      qUnits(sec).forEach(u=>{
        const w=wiGet(sid,u.q,u.sub), k=uKey(u.q,u.sub);
        b+=`<button class="qbtn${w?(' q-'+w.code):''}${u.sub?' qbtn-sub':''}" id="q_${k}"
              title="${w?esc(markLab(w.code)):'还没点'}"
              onclick="qClick('${sid}','${k}')">${qBtnHTML(sid,u.q,u.sub)}</button>`;
      });
      b+=`</div></div>`;
    });
    b+=`</div>`;
  }

  es.forEach(sec=>{
    const er=esDraft(sid,sec.code), sel=er.weak||[];
    b+=`<div class="secbox"><div class="sechd">写作文 · ${esc(sec.code)}
      <span class="sub">不逐题 · 三个面向 + 得分</span></div>
      <label class="form-label">弱在哪（可多选）</label>
      <div class="chips-row" id="esw_${esc(sec.id)}">
        ${ESSAY_ASPECTS.map(a=>`<button class="chip ${sel.indexOf(a.id)>=0?'sel-w':'chip-warn'}"
          data-asp="${a.id}" onclick="esTog('${sid}','${esc(sec.code)}','${sec.id}','${a.id}')">${esc(a.zh)}</button>`).join('')}
        <button class="chip ${er.star?'sel':'chip-ok'}" id="ess_${esc(sec.id)}"
          onclick="esStar('${sid}','${esc(sec.code)}','${sec.id}')">★ 写得特别好</button></div>
      <div class="form-row" style="margin-top:8px"><label class="form-label">得分</label>
        <div style="display:flex;align-items:center;gap:6px">
          <input type="number" min="0" step="0.5" max="${sec.max}" style="width:90px"
            value="${er.score!=null?er.score:''}"
            oninput="esScore('${sid}','${esc(sec.code)}','${sec.id}',this.value,${sec.max})">
          <span style="color:var(--mut)">/ ${sec.max}</span></div></div></div>`;
  });

  b+=`<div id="f2opt"></div>`;

  openModal(`${esc(nameOf(r))} · Year ${y} · ${esc(S.subject)}`, b,
    `<span id="f2foot" class="tip" style="margin:0;flex:1"></span>
     <button class="btn btn-sm" onclick="closeModal()">关闭</button>
     <button class="btn btn-sm" id="f2done1" onclick="f2Finish('${sid}')">完成</button>
     <button class="btn btn-pri" id="f2done" onclick="f2Finish('${sid}',1)">完成 → 下一位</button>`);
  paintLive(sid); paintTail(sid); paintFoot(sid);
}

/* ══ v42 · 【必做】—— 这一页唯一非做不可的两件事，放最上面 ══
   旧版这里是「整份考卷看完了吗」+「系统算出来的」+「粗心」+「理解文」+「TP」五块。
   「系统算出来的」整块删掉：它是纯显示，上传时 n_star…n_sos 与 total_q
   由 f2Payload 自己从逐题资料重算（见该函式），删画面不丢任何资料、报告照印。
   其余搬进【其他】折叠区。 */
function paintLive(sid){
  const el=document.getElementById('f2must'); if(!el) return;
  const rec=f2Draft(sid), m=markCounts(sid);
  const needChk=f2NeedsCheck(rec);
  const miss=f2Missing(sid);
  let n=0;
  const num=ok=>`<span class="must-num${ok?' ok':''}">${++n}</span>`;

  let h=`<div class="must${miss.length?'':' done'}">
    <div class="must-hd">必做
      <span class="cnt">${miss.length?('还差 '+miss.length+' 件'):'✓ 都做好了'}</span></div>`;

  if(needChk){
    h+=`<div class="must-row${rec.paper_checked?' ok':''}">
      ${num(rec.paper_checked)}<span class="must-lab">整份看完了</span>
      <button class="big-toggle${rec.paper_checked?' on':''}"
        onclick="f2Checked('${sid}')">${rec.paper_checked
          ? '✓ 整份都看过了' : '○ 按这里：整份都看过了'}</button>
      <div class="must-note">${rec.paper_checked
        ? `没点到的 <b>${Math.max(0,m.total-m.marked)}</b> 题 = <b>答对</b>`
        : '没点到的题，按了才算<b>答对</b> · 答对率、报告分数都要靠这一下'}</div></div>`;
  }

  h+=`<div class="must-row${rec.tp?' ok':''}">
    ${num(!!rec.tp)}<span class="must-lab">掌握程度</span>
    <span class="chips-row" id="chipsTP" style="margin:0">
      ${TPS.map(t=>`<button class="chip ${rec.tp===t.v?'sel':'chip-layer'}"
        data-v="${t.v}" onclick="f2TPL(this,'${sid}','${t.v}')">${t.v} ${t.zh}</button>`).join('')}
      ${rec.tp?`<button class="chip chip-muted" onclick="f2TPL(null,'${sid}',null)">✕ 清除</button>`:''}
    </span>
    <div class="must-note">${m.rate==null
      ? (needChk ? '按了上面那一下，这里会出现答对率' : '老师判断 · 系统不代替你判')
      : `这份卷答对率 <b>${m.rate}%</b>`}</div></div>`;

  if(!needChk)
    h+=`<div class="tip" style="margin-top:8px">这是作文卷，不逐题，所以没有「整份都看过了」这一项。</div>`;

  h+=`</div>`;
  el.innerHTML=h;
  paintFoot(sid);
}

/* ══ v42 · 【其他】—— 全部选填，收进一个折叠，预设关起来 ══
   ⚠️ 这里每一个栏位都印在**家长报告**上（学生的话 / 家长配合 / 已做什麽 /
      学生现在怎样 / 还需要做什麽 / 弱在哪 / 粗心哪一种 / 理解文诊断）。
      删掉它们 = 家长报告那几段变空白。所以只收起来，一个都不删。
   旧版的三层小折叠（NEXT / 补充资料）拿掉 —— 折叠里再折叠，老师更找不到。 */
function paintTail(sid){

  let inner='';
  if(clQ.length) inner+=sub('粗心是哪一种','算错 / 抄错 / 没写完，教法完全不同',
    clQ.map(w=>`<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px">
