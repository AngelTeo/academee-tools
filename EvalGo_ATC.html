<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EvalGo_ATC — ATC 部 考况 v19.4</title>
<style>
:root{
  /* ══ LAYER ══ RPT = 文档灰 */
  --layer:#5A6470;

  /* ══ 部门色 (永不改) ══ */
  --d-srk:#C45C5C; --d-gak:#E8A04E; --d-atc:#7AB05A; --d-srt:#8B6CAE;

  /* ══ 中性色 ══ */
  --sur:#ffffff; --sur2:#f7f6f2; --bdr:#e0ddd6;
  --txt:#1a1a1a; --mut:#888888; --hint:#bbbbbb;

  /* ══ 语义色 ══ */
  --ok:#0F6E56; --warn:#854F0B; --danger:#A32D2D; --info:#236FAD;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
  background:var(--sur2);color:var(--txt);font-size:13px;line-height:1.4}

/* ══════ NAV (TOPBAR) ══════ */
.nav{background:var(--layer);border-bottom:.5px solid rgba(0,0,0,.2);
  display:flex;align-items:center;padding:0 16px;position:sticky;top:0;z-index:50;
  overflow-x:auto;gap:0}
.nav-logo{font-size:13px;font-weight:600;padding:12px 14px 12px 0;
  border-right:.5px solid rgba(255,255,255,.2);margin-right:4px;white-space:nowrap;
  flex-shrink:0;color:#fff}
.ver{background:#F9CB42;color:var(--layer);border-radius:4px;padding:1px 6px;
  font-size:10px;font-weight:700;margin-left:4px;vertical-align:middle}
.ntab{padding:11px 14px;font-size:11px;color:rgba(255,255,255,.7);cursor:pointer;
  border:none;background:transparent;border-bottom:2.5px solid transparent;
  transition:all .15s;white-space:nowrap;flex-shrink:0;font-family:inherit}
.ntab:hover{color:#fff}
.ntab.on{color:#fff;border-bottom-color:#fff;font-weight:600}
.nav-r{margin-left:auto;display:flex;gap:5px;align-items:center;padding-left:10px;flex-shrink:0}
.saved{font-size:10px;color:rgba(255,255,255,.55);white-space:nowrap}
.btn-nav{padding:5px 12px;border-radius:6px;border:.5px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.12);color:#fff;font-size:11px;cursor:pointer;
  font-family:inherit;transition:opacity .15s;white-space:nowrap}
.btn-nav:hover{opacity:.85}

/* ══════ SUB NAV ══════ */
.sub-nav{background:var(--sur);border-bottom:.5px solid var(--bdr);
  padding:0 16px;gap:2px;position:sticky;top:44px;z-index:49;
  display:flex;overflow-x:auto;align-items:center;min-height:38px}
.sub-ntab{padding:9px 14px;font-size:11px;color:var(--mut);cursor:pointer;
  border:none;background:transparent;border-bottom:2px solid transparent;
  transition:all .15s;white-space:nowrap;flex-shrink:0;font-family:inherit}
.sub-ntab:hover{color:var(--txt)}
.sub-ntab.on{color:var(--layer);border-bottom-color:var(--layer);font-weight:600}

/* ══════ PAGES ══════ */
.page{display:none;padding:16px;max-width:1200px;margin:0 auto}
.page.on{display:block}

/* ══════ BUTTONS ══════ */
.btn{padding:5px 12px;border-radius:6px;border:.5px solid var(--bdr);
  background:var(--sur);color:var(--txt);font-size:11px;cursor:pointer;
  font-family:inherit;transition:background .15s;white-space:nowrap}
.btn:hover{background:var(--sur2)}
.btn-pri{background:var(--layer);color:#fff;border-color:var(--layer);font-weight:600}
.btn-pri:hover{opacity:.85}
.btn-dng{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-sm{padding:3px 8px;font-size:10px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ══════ CARDS ══════ */
.card{background:var(--sur);border:.5px solid var(--bdr);border-radius:10px;
  padding:16px;margin-bottom:12px}
.card-hdr{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;flex-wrap:wrap;gap:8px}
.card-title{font-size:11px;font-weight:500;color:var(--mut);
  letter-spacing:.05em;text-transform:uppercase}

/* ══════ STAT CARDS ══════ */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat-card{background:var(--sur);border:.5px solid var(--bdr);border-radius:10px;padding:14px 16px}
.stat-n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.stat-l{font-size:10px;color:var(--mut);margin-top:2px;text-transform:uppercase;letter-spacing:.05em}
.stat-sub{font-size:10px;color:var(--hint);margin-top:2px}

/* ══════ TABLES ══════ */
table.data{width:100%;border-collapse:collapse;font-size:12px}
table.data thead th{background:#2d2d2d;color:#fff;padding:9px 12px;text-align:left;
  font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
table.data tbody td{padding:8px 12px;border-bottom:.5px solid var(--bdr);vertical-align:middle}
table.data tbody tr:nth-child(even){background:var(--sur2)}
table.data tbody tr:hover{background:#FFF9E6}
.tw{overflow-x:auto}

/* ══════ INPUTS ══════ */
input[type=text],input[type=number],input[type=date],select,textarea{
  border:.5px solid var(--bdr);border-radius:6px;padding:6px 10px;
  font-size:12px;font-family:inherit;background:var(--sur);color:var(--txt);
  min-width:120px;box-sizing:border-box}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--layer)}
textarea{width:100%;resize:vertical}

/* ══════ BADGES ══════ */
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;white-space:nowrap}
.b-atc{background:rgba(122,176,90,.12);color:var(--d-atc)}
.b-active{background:#E1F5EE;color:var(--ok)}
.b-warn{background:#FFF3CD;color:var(--warn)}
.b-inactive{background:#FCEBEB;color:var(--danger)}

/* ══════ TOOLBAR ══════ */
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar input[type=text]{flex:1;min-width:180px}
.dept-row{display:flex;gap:4px;flex-wrap:wrap}
.dept-tag{padding:4px 12px;border-radius:14px;border:.5px solid var(--bdr);
  cursor:pointer;font-size:10px;background:var(--sur);color:var(--mut);font-family:inherit}
.dept-tag:hover{border-color:var(--layer);color:var(--layer)}
.dept-tag.on{background:var(--layer);border-color:var(--layer);color:#fff}

/* ══════ MODAL ══════ */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--sur);border-radius:10px;width:560px;max-width:100%;
  max-height:88vh;overflow-y:auto;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.modal-hdr{padding:14px 20px;border-bottom:.5px solid var(--bdr);display:flex;
  align-items:center;position:sticky;top:0;background:var(--sur);
  border-radius:10px 10px 0 0;z-index:2}
.modal-title{font-size:14px;font-weight:600;flex:1}
.modal-body{padding:16px 20px}
.modal-foot{padding:12px 20px;border-top:.5px solid var(--bdr);display:flex;
  justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--sur);
  border-radius:0 0 10px 10px}
.x-btn{background:none;border:none;font-size:18px;color:var(--mut);cursor:pointer}

/* ══════ TOAST ══════ */
.toast{position:fixed;bottom:20px;right:20px;background:var(--txt);color:#fff;
  padding:8px 16px;border-radius:6px;font-size:12px;opacity:0;
  transition:opacity .25s;pointer-events:none;z-index:9999}
.toast.show{opacity:1}

/* ══════ MISC ══════ */
.empty{text-align:center;padding:40px 20px;color:var(--hint);font-size:12px}
/* ══ FORM 02 逐题格子 ══ */
.qgrid{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 2px}
/* 连续学生导航条 —— 钉在 modal 顶端，老师不必关掉再找名字 */
.stunav{display:flex;align-items:center;gap:8px;padding:8px 10px;margin:-2px 0 12px;
  background:var(--sur2);border:1px solid var(--bdr);border-radius:8px;position:sticky;top:0;z-index:3}
.stunav-mid{flex:1;text-align:center;font-size:14px;line-height:1.25}
.stunav-mid span{display:block;font-size:11.5px;color:var(--mut);font-weight:400}
.stunav .btn{white-space:nowrap}
.qbtn{width:38px;height:36px;border:1px solid var(--bdr);border-radius:6px;background:var(--sur);
  cursor:pointer;font-size:12px;font-weight:600;color:var(--mut);
  display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit}
.qbtn:hover{border-color:var(--mut)}
.qbtn.q-star{background:#E1F5EE;border-color:var(--ok);color:var(--ok)}
.qbtn.q-dk{background:#FCEBEB;border-color:var(--danger);color:var(--danger)}
.qbtn.q-cl{background:#FFF3CD;border-color:var(--warn);color:var(--warn)}
.qbtn.q-nr{background:#FFF3CD;border-color:var(--warn);color:var(--warn)}
.qbtn.q-sos{background:#E8F0F7;border-color:var(--info);color:var(--info)}
.qbtn.q-blank{background:#FCEBEB;border-color:var(--danger);color:var(--danger);
  background-image:repeating-linear-gradient(45deg,transparent,transparent 3px,rgba(163,45,45,.13) 3px,rgba(163,45,45,.13) 6px)}
/* 题号格必须带文字 —— 颜色不能是唯一编码（手机没有 hover，两分钟後分不出 CL 还是 NR） */
.qbtn{flex-direction:column;line-height:1.05;gap:0}
.qbtn .qn{font-size:12px;font-weight:700}
.qbtn .qm{font-size:8px;font-weight:700;letter-spacing:.02em;opacity:.9}
.qpick{background:var(--sur2);border:2px solid var(--txt);border-radius:8px;padding:10px 12px;margin:2px 0 10px}
.qpick-t{font-size:12px;font-weight:800;color:var(--txt);margin-bottom:6px}
.qbtn.picking{outline:3px solid var(--txt);outline-offset:1px}
.secbox{border:1px solid var(--bdr);border-radius:8px;padding:10px;margin-bottom:10px;background:var(--sur)}
.sechd{font-size:14px;font-weight:800;letter-spacing:0;color:var(--txt);margin:0 0 8px;
  padding-bottom:6px;border-bottom:2px solid var(--txt)}
.sechd .sub{font-size:11px;font-weight:500;color:var(--mut);letter-spacing:0;margin-left:6px}
.secbox{padding:14px}
.tip{font-size:11px;color:var(--mut);margin:8px 0}

/* ══════ ALERT ══════ */
.alert{padding:10px 14px;border-radius:6px;font-size:12px;margin-bottom:10px;
  display:flex;align-items:flex-start;gap:8px}
.alert-info{background:#E8F0F7;color:#236FAD;border-left:3px solid #236FAD}
.alert-warn{background:#FFF3CD;color:var(--warn);border-left:3px solid var(--warn)}
.alert-danger{background:#FCEBEB;color:var(--danger);border-left:3px solid var(--danger)}
.alert-ok{background:#E1F5EE;color:var(--ok);border-left:3px solid var(--ok)}

/* ══════ CHIP ══════ */
.chip{display:inline-block;padding:3px 10px;border-radius:12px;font-size:10px;
  font-weight:500;margin:2px;border:none;font-family:inherit}
.chip-layer{background:rgba(90,100,112,.10);color:var(--layer)}
.chip-ok{background:#E1F5EE;color:var(--ok)}
.chip-warn{background:#FFF3CD;color:var(--warn)}
.chip-danger{background:#FCEBEB;color:var(--danger)}
.chip-info{background:#E8F0F7;color:var(--info)}
.chip-muted{background:var(--sur2);color:var(--mut)}
.chips-row{display:flex;flex-wrap:wrap;gap:4px}
button.chip{cursor:pointer;border:.5px solid transparent}
button.chip.sel{background:var(--layer);color:#fff}
button.chip.sel-w{background:var(--warn);color:#fff}

/* ══════ DOT ══════ */
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:4px}
.dot-ok{background:var(--ok)}.dot-warn{background:var(--warn)}
.dot-danger{background:var(--danger)}.dot-info{background:var(--info)}.dot-muted{background:var(--hint)}

/* ══════ PROGRESS ══════ */
.progress{height:6px;background:var(--bdr);border-radius:3px;overflow:hidden;margin:4px 0}
.progress-fill{height:100%;border-radius:3px;transition:width .3s}
.progress-ok .progress-fill{background:var(--ok)}
.progress-warn .progress-fill{background:var(--warn)}
.progress-danger .progress-fill{background:var(--danger)}
.progress-layer .progress-fill{background:var(--layer)}
.pct{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}

/* ══════ FORM GRID ══════ */
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.form-row{margin-bottom:12px}
.form-label{font-size:11px;color:var(--mut);display:block;margin-bottom:4px}
@media(max-width:480px){.form-grid-2,.form-grid-3{grid-template-columns:1fr}}

/* ══════ STEPPER ══════ */
.stepper{display:flex;align-items:center;gap:0;margin-bottom:16px;overflow-x:auto}
.step{display:flex;align-items:center;gap:6px;padding:8px 14px;font-size:11px;color:var(--mut);white-space:nowrap}
.step-num{width:22px;height:22px;border-radius:50%;background:var(--bdr);color:var(--mut);
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.step.active{color:var(--txt);font-weight:600}
.step.active .step-num{background:var(--layer);color:#fff}
.step.done .step-num{background:var(--ok);color:#fff}
.step-line{width:24px;height:1.5px;background:var(--bdr);flex-shrink:0}
.step-line.done{background:var(--ok)}

/* ══════ TAB PILLS / SEGMENTED ══════ */
.pills{display:inline-flex;border:.5px solid var(--bdr);border-radius:8px;overflow:hidden;background:var(--sur2)}
.pill{padding:6px 14px;font-size:11px;cursor:pointer;border:none;background:transparent;
  color:var(--mut);font-family:inherit;transition:all .15s;min-width:44px}
.pill.on{background:var(--layer);color:#fff;font-weight:600}
.pills-ind .pill.on{background:var(--info);color:#fff}

/* ══════ QUICK ACTIONS ══════ */
.quick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.quick-card{background:var(--sur);border:.5px solid var(--bdr);border-radius:10px;padding:16px;
  text-align:center;cursor:pointer;transition:all .15s}
.quick-card:hover{border-color:var(--layer);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.quick-icon{font-size:24px;margin-bottom:6px}
.quick-label{font-size:11px;color:var(--txt);font-weight:500}

/* ══════ RESPONSIVE ══════ */
@media(max-width:768px){.stat-grid{grid-template-columns:repeat(2,1fr)}.modal{width:100%;margin:10px}}
@media(max-width:480px){.stat-grid{grid-template-columns:1fr}.ntab{padding:10px 10px;font-size:10px}}

/* ══════ PRINT ══════ */
@media print{
  @page{margin:12mm 14mm;size:A4 portrait}
  .nav,.sub-nav,.btn,.btn-nav,.toast,.toolbar,.no-print{display:none!important}
  body{font-size:11pt;background:#fff}
  .card,table{page-break-inside:avoid}
  table.data thead th{background:#333!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.data th,table.data td{border:1px solid #999}
}
</style>
</head>

/* ══ 评量状态 ══ Owner 2026-09-06
   「没有资料」以前同时代表三件事：老师还没做 / 学生缺席 / 证据不足。
   混在一起，管理层就分不出「系统缺口」与「现实状况」。
   🔴 ABSENT 与 NOT_ASSESSED **绝不等於**弱、0 分、未掌握 ——
      它们是「没有资料」的两种已知原因，不是一种表现。
   工作台：三者都算「已处理」，不再催老师。
   报告  ：只有 ASSESSED 算数（DB 端由 v_evalgo_assessed 守着）。 */
const ASTAT={
  ASSESSED     : {lab:'已完成',   short:'✓',  cls:'b-active'},
  ABSENT       : {lab:'缺席',     short:'缺', cls:'b-inactive'},
  NOT_ASSESSED : {lab:'本轮未评', short:'—',  cls:'b-inactive'}
};
function aStat(r){ return (r&&r.assess_status)||'ASSESSED'; }
function isHandled(r){ return !!r && (aStat(r)!=='ASSESSED' || f2State(r)==='done'); }
function setAStat(sid, v){
  const r=f2Draft(sid);
  r.assess_status=v; r.synced=false;
  if(v!=='ASSESSED'){ r.savedAt=new Date().toLocaleString('en-GB'); stampF2(r,sid); }
  saveData(); closeModal(); renderF2(); renderHome();
  toast(v==='ASSESSED'?'✓ 改回已评量':('✓ 记为「'+ASTAT[v].lab+'」'));
  autoPush();
}
/* ══ 连续学生导航 ══ Owner 2026-09-06
   旧流程：填完一位 → 关 modal → 回名单 → 找下一个名字 → 再点。
   一班 18 位就是 18 次「关掉再找」。改成 modal 里直接走。
   「完成并到下一位」只跳还没处理的；缺席／本轮未评的会跳过。 */
/* ══════════════════════════════════════════════════════════════════
   三个状态，永远不准合併（Owner Work Order P0-2 / P0-3）
     ① Operational Resolved  老师今天不用再追这个学生了
     ② Assessment Complete   这个学生这一科的证据齐了
     ③ Report Ready          可以进家长/考前报告
   ABSENT 与 NOT_ASSESSED 只满足 ①。它们不是弱、不是 0 分、不是证据。
   全系统（工作台 / 覆盖追踪 / 报告 / 连续导航）一律消费这三支，不准各写各的。
   ══════════════════════════════════════════════════════════════════ */
function stResolved(sid){ return aStat(S.f2[f2Key(sid)])!=='ASSESSED'; }   /* ① 缺席 / 本轮未评 */
function opResolved(sid,kind){                                            /* ① 已处理 */
  if(stResolved(sid)) return true;
  return kind==='f1' ? f1Complete(sid).length>0
                     : f2State(S.f2[f2Key(sid)])==='done';
}
function assessComplete(sid){                                             /* ② 证据齐 */
  const r=S.f2[f2Key(sid)];
  return aStat(r)==='ASSESSED' && f2State(r)==='done';
}
function reportReady(sid){                                                /* ③ 可进报告 */
  const r=S.f2[f2Key(sid)];
  if(!r) return false;
  if(aStat(r)!=='ASSESSED') return false;      /* 缺席 / 本轮未评 永不进报告 */
  return !!(r.paper_checked && r.tp);          /* 老师亲自核对 + 掌握程度 */
}

function navList(){ return inCls(S.cls); }
function navIdx(sid){ return navList().findIndex(r=>r.sid===sid); }
function navStep(sid,d){ const L=navList(), i=navIdx(sid), j=i+d;
  return (i<0||j<0||j>=L.length)?null:L[j].sid; }
function navResolved(sid){ return stResolved(sid); }        /* 同一支真相 */
function navDone(sid,kind){ return opResolved(sid,kind); }  /* 同一支真相 */
function navTodo(sid,kind){          /* 从当前往後绕一圈，找第一个还没处理的 */
  const L=navList(), i=navIdx(sid);
  for(let k=1;k<=L.length;k++){ const r=L[(i+k)%L.length];
    if(!navDone(r.sid,kind)) return r.sid; }
  return null;
}
function navLeft(kind){ return navList().filter(r=>!navDone(r.sid,kind)).length; }
function navGo(sid,kind){
  if(!sid) return;
  if(saveData(true)===false){ alert(saveFailMsg()); return; }
  if(kind==='f1'){ renderF1(); f1Open(sid); } else { renderF2(); f2Open(sid); }
}
function navBar(sid,kind){
  const L=navList(), i=navIdx(sid), p=navStep(sid,-1), n=navStep(sid,1), left=navLeft(kind);
  return `<div class="stunav">
    <button class="btn btn-sm" ${p?`onclick="navGo('${p}','${kind}')"`:'disabled style="opacity:.35"'}>← 上一位</button>
    <div class="stunav-mid"><b>${esc(nameOf(L[i]))}</b>
      <span>第 ${i+1} / ${L.length} 位${left?` · 还剩 ${left} 位没处理`:' · 全班处理完了'}</span></div>
    <button class="btn btn-sm" ${n?`onclick="navGo('${n}','${kind}')"`:'disabled style="opacity:.35"'}>下一位 →</button>
    <button class="btn btn-sm" style="font-weight:700" title="缺席 / 本轮未评"
      onclick="aStatMenu('${sid}')">⋯</button></div>`;
}

function aStatMenu(sid){
  const cur=aStat(f2Draft(sid)), nm=nameOf(stuOf(sid));
  openModal(esc(nm), `
    <div class="tip" style="margin-top:0">这位学生这一轮要记成什麽？</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
      <button class="btn ${cur==='ABSENT'?'btn-pri':''}" style="padding:12px;text-align:left"
        onclick="setAStat('${sid}','ABSENT')"><b>缺席</b><br>
        <span style="font-size:11.5px;color:var(--mut)">学生那天没有来。不会算成弱或 0 分。</span></button>
      <button class="btn ${cur==='NOT_ASSESSED'?'btn-pri':''}" style="padding:12px;text-align:left"
        onclick="setAStat('${sid}','NOT_ASSESSED')"><b>本轮未评</b><br>
        <span style="font-size:11.5px;color:var(--mut)">学生在，但这一轮没有足够证据可以判断。也不会算成弱。</span></button>
      ${cur!=='ASSESSED'?`<button class="btn" style="padding:12px;text-align:left"
        onclick="setAStat('${sid}','ASSESSED')"><b>改回「要评量」</b><br>
        <span style="font-size:11.5px;color:var(--mut)">回到正常流程，继续填。</span></button>`:''}
    </div>`, `<button class="btn" onclick="closeModal()">取消</button>`);
}

/* ══ weak_manual 的词汇（vocabulary）══ Owner 2026-09-06
   这一栏的内容【依年份不同】，不是单一来源，写死成任何一个都是错的：
     v16 – v19.0  chips 来源是 KPM DSKP 学习领域 → 存的是字典 id（DSKP-ENG-Y2-D1）
     v19.1 起     chips 来源是这份考卷 evalgo_paper_section.topic → 存的是考点原文（文法）
   老师浏览器里此刻可能还留着 v16–v19.0 时期的草稿，v9 上线后会一起送上去。
   所以不推断、不假设：逐值检查它认不认得是字典 id，把结论明写成一栏送上云端。 */
const WEAK_VOCAB={NONE:'NONE',DSKP:'DSKP_DOMAIN',PAPER:'PAPER_TOPIC',MIX:'MIXED'};
function isDictId(x){
  return DSKP_DOM.some(o=>o.id===x) || KSSR.some(o=>o.id===x);
}
function weakVocabOf(r){
  const v=(r&&r.weak_manual)||[];
  if(!v.length) return WEAK_VOCAB.NONE;
  const n=v.filter(isDictId).length;
  if(n===v.length) return WEAK_VOCAB.DSKP;
  if(n>0)          return WEAK_VOCAB.MIX;
  return WEAK_VOCAB.PAPER;
}
function optText(id){
  const d=DSKP_DOM.find(o=>o.id===id); if(d) return d.zh;
  const k=KSSR.find(o=>o.id===id);     if(k) return k.zh;
  /* v19.1 起「较弱项目」直接存这份考卷的考点原文（不是字典 id）——
     认不得就原样送出，绝不吞成空字串。 */
  return String(id||'');
}

/* ══ 这份考卷的考点 ══ Owner 2026-09-06
   v16 这里挂的是 KPM DSKP「学习领域」（Listening / Speaking / Reading / Writing…）。
   Owner 指出那一层跟「这份考卷」没有关系 —— 考卷考的是文法、连接词、写作这些具体考点。
   他说对了：学习领域是「整年教什么」，考卷分析要回答的是「这张卷他弱在哪」。
   唯一诚实的来源是考卷结构里负责人自己填的「文法 / 主题」，不是我另外发明一套分类。
   一个项目可以填多个考点，用 、 ， / ； 分开，这里会拆成多颗。 */
function paperWeakOpts(){
  const out=[], seen={};
  sections().forEach(sec=>{
    const raw=String(sec.topic||'').trim();
    const parts = raw ? raw.split(/[、,，\/／;；]+/).map(x=>x.trim()).filter(Boolean) : [];
    if(!parts.length) parts.push(String(sec.code||'').trim());
    parts.forEach(t=>{ if(!t||seen[t]) return; seen[t]=1; out.push(t); });
  });
  return out;
}

let _saveT=null;
/* ⚠️ Persistence Truth Rule —— saveData 必须回传真假，caller 必须检查。
   v7 以前：写入失败 toast('✕ 储存失败') 之後，caller 仍无条件 toast('✓ Saved')，
   而两句用【同一个 #toast 元素】—— 红的会被绿的盖掉，老师永远看不到失败。
   这是假绿的根，本版修掉。延后写入（debounce）回传 null = 结果未知，
   任何要显示「已保存」的地方一律用 saveData(true)。 */
function saveData(now){
  const go=()=>{
    S.meta.last_updated=new Date().toISOString();
    try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(S)); }
    catch(e){
      S.meta.save_failed=true;
      toast(isAdmin()?'✕ 储存失败，请立刻 Export 备份':'✕ 这一笔没存进去 —— 先别关页面，截图找管理层',7000);
      console.error(e);
      paintCloud(); return false;
    }
    S.meta.save_failed=false;
    const el=document.getElementById('last-saved');
    if(el) el.textContent='Saved '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    paintCloud();
    return true;
  };
  if(now){ clearTimeout(_saveT); return go(); }
  clearTimeout(_saveT); _saveT=setTimeout(go,800);
  return null;
}
/* 存档成功才报喜；失败时不覆盖失败讯息，並把 modal 留着让老师能 Export。 */
function saveThen(okMsg){
  const ok=saveData(true);
  if(ok===false) return false;
  if(okMsg) toast(okMsg);
  return true;
}
/* 老师可能先离线填（examCode 空 → 前缀 NOEXAM），之後才连上云端拿到考试码。
   若不迁移，那些资料会像凭空消失。连线取得 exam 时呼叫一次。
   同时把 v7 以前【完全没有 exam 前缀】的旧资料一并搬进当前考试。 */
/* 🔴 v10 把【所有】没有 exam 前缀的旧资料一律塞进当前考试 —— 那是猜 provenance。
   9 月的旧纪录有机会被算成 10 月这一轮。违反 migration contract：
   「无法证明 provenance 的旧记录 → UNRESOLVED，禁止猜配」。

   v11 只迁移【本次浏览器 session、离线时产生】的资料（有 ses 戳记且等于本次）。
   其余一律不动，计入 unresolved 由管理层处理。 */
const SESSION_ID='ses_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
function stampSes(o){ if(o&&typeof o==='object'&&!o.ses) o.ses=SESSION_ID; return o; }
function migrateExamKeys(toEx){
  if(!toEx) return {moved:0,unresolved:0};
  let moved=0, unresolved=0;
  const move=bag=>{
    Object.keys(bag).forEach(k=>{
      const parts=k.split('|');
      if(parts[0]===toEx) return;                     /* 已经是本轮 */
      const rec=bag[k];
      const provable = parts[0]==='NOEXAM' && rec && rec.ses===SESSION_ID;
      if(!provable){ unresolved++; return; }           /* 不猜 */
      const nk=[toEx].concat(parts.slice(1)).join('|');
      if(bag[nk]) return;
      bag[nk]=rec; delete bag[k];
      rec.exam=toEx; rec.synced=false; moved++;
    });
  };
  move(S.f1); move(S.f2); move(S.wi); move(S.es);
  Object.keys(S.sections||{}).forEach(k=>{
    const parts=k.split('|');
    if(parts[0]===toEx) return;
    if(parts[0]!=='NOEXAM'){ unresolved++; return; }
    const arr=S.sections[k]||[];
    if(!arr.length || !arr.every(x=>x.ses===SESSION_ID)){ unresolved++; return; }
    const nk=[toEx].concat(parts.slice(1)).join('|');
    if(S.sections[nk]) return;
    S.sections[nk]=arr; delete S.sections[k];
    arr.forEach(x=>{ x.synced=false; x.cloud_id=null; });
    moved++;
  });
  S.meta.unresolved=unresolved;
  if(moved||unresolved) saveData(true);
  return {moved,unresolved};
}
function loadData(){
  let raw=null; try{ raw=localStorage.getItem(STORAGE_KEY); }catch(e){}

}

/* ══ Exam scoping ══

/* ⚠️ v9 用 hidden 属性 + inline display —— inline style 会盖掉 hidden，
   所以「满分」栏在选择题时也一直看得到。改成直接控制 display。 */
function bpTypeChg(){
  /* 满分**每一种题型都要填**，不是只有写作文。
     v14 以前只在写作文时显示满分栏，选择题／填写题填了也会被丢掉。 */
  const t=(document.getElementById('bpType')||{}).value||'MCQ';
  const r=document.getElementById('bpRange'), sc=document.getElementById('bpScore');
  if(r)  r.style.display  = (t==='ESSAY')?'none':'inline-flex';
  if(sc) sc.style.display = 'inline-flex';

function addSection(){
  const g=id=>String(((document.getElementById(id)||{}).value)||'').trim();
  const code=g('bpCode'), topic=g('bpTopic'), fmt=g('bpFmt');
  const type=g('bpType')||'MCQ';
  const qf=parseInt(g('bpQf'),10), qt=parseInt(g('bpQt'),10), mx=parseFloat(g('bpMax'));
  if(!code){ toast('✕ 项目不能空'); return; }
  const arr=S.sections[bpKey()]||(S.sections[bpKey()]=[]);
  if(arr.some(x=>x.code===code)){ toast('✕ 这个项目已经有了'); return; }
  if(!(mx>0)){ toast('✕ 请填这个项目共几分'); return; }
  if(type!=='ESSAY'){
    if(!(qf>=1)||!(qt>=qf)){ toast('✕ 题号范围不对（例：1 到 10）'); return; }
    const clash=arr.filter(x=>QTYPES.indexOf(x.type||'MCQ')>=0 && +x.qf>=1)
                   .find(x=>!(qt<(+x.qf)||qf>(+x.qt)));
    if(clash){ toast(`✕ 题号 ${qf}-${qt} 与「${clash.code}」(${clash.qf}-${clash.qt}) 重叠`); return; }
  }
  arr.push({id:uid(),client_uid:uid(),ses:SESSION_ID,code,topic,fmt,type,
    qf:type==='ESSAY'?null:qf, qt:type==='ESSAY'?null:qt,
    max:mx,                       /* 每一种题型都存满分，不再只存写作文 */
    sort:arr.length, by:S.me, synced:false, cloud_id:null});
  ['bpCode','bpTopic','bpFmt','bpQf','bpQt','bpMax'].forEach(i=>{const e=document.getElementById(i);if(e)e.value='';});
  if(saveThen('✓ 已加入')){ renderF1(); autoPush(); }
}
function delSection(id){
  if(!bpGuard('删除项目')) return;
  const arr=S.sections[bpKey()]||[];
  const s=arr.find(x=>x.id===id); if(!s) return;
  const used=Object.values(S.f1).filter(r=>r.subject===S.subject&&r.bahagian===s.code).length;
  const wq=Object.values(S.wi).filter(w=>w.subject===S.subject&&w.sec_code===s.code).length;
  if((used||wq) && !confirm(`已经有 ${used} 笔 FORM 01 观察、${wq} 题 FORM 02 记码用了「${s.code}」。`+
     `删掉项目不会删纪录，但纪录会对不上。确定？`)) return;
  if(s.cloud_id && _sb && CLOUD.exam){
    /* 云端已有这笔 —— 只在本机删会在下次 pull 长回来，必须诚实处理 */
    _sb.from('evalgo_paper_section').delete().eq('id',s.cloud_id).then(res=>{
      if(res.error){
        alert('这个项目已经上传到云端，你的帐号没有删除权限（需要 can_approve）。\n\n'
            + '本机已移除，但下次「从云端拉回」会长回来。请找管理层删除。\n\n'
            + '错误：'+res.error.message);
      }else toast('✓ 云端也已删除');
    });
  }
  S.sections[bpKey()]=arr.filter(x=>x.id!==id);
  if(saveThen('✓ Deleted')){ renderF1(); renderF2(); }
}

   Owner：「让老师只选择属於自己任教的科目与年段，并标记上自己的名字，

function asgKey(tid,cls,subj){ return EXK()+'|'+tid+'|'+cls+'|'+subj; }

function cellKey(cls,subj){ return EXK()+'|'+cls+'|'+subj; }
function clsRoster(cls){ return S.roster.filter(r=>r.cls===cls); }
function cellStat(cls,subj){
  const list=clsRoster(cls), n=list.length;
  const pre=EXK()+'|';
  let obs=0, done=0, prog=0;
  let resolved=0;
  list.forEach(r=>{
    const p=S.f2[pre+r.sid+'|'+subj];
    const st=f2State(p);
    if(st==='absent'||st==='notassessed'){ resolved++; return; }  /* 已处理，不再催 */
    if(f1Complete(r.sid,subj).length) obs++;
    if(st==='done') done++; else if(st==='progress') prog++;
  });
  const secs=(S.sections[EXK()+'|'+subj+'|'+yearOf(cls)]||[]);
  const handled=done+resolved;
  return {n,obs,done,prog,resolved,handled,secs:secs.length,
          state: n&&handled===n ? 'done' : (obs||done||prog||resolved||secs.length ? 'prog' : 'none')};
}
/* ══ 工作台 ══ Owner 2026-09-06
   旧版是「6 班 × 5 科」的 30 格大表 —— 老师只教 1–2 个班科，
   28 格是灰的，纯粹噪音；而且它回答的是院长的问题（谁没做完），
   不是老师的问题（我还剩谁没填）。整张表移除。
   新版只列老师自己勾的班科，一个班科一张卡，卡里直接给「还剩谁」。 */
function cardStat(cls,subj){
  const list=inCls(cls), pre=EXK()+'|';
  const obsLeft=[], papLeft=[];
  let obsDone=0, papDone=0, absent=0, na=0, prog=0;
  list.forEach(r=>{
    const st=f2State(S.f2[pre+r.sid+'|'+subj]);
    /* ① Operational Resolved —— 不再催，但绝不等於有证据（见 reportReady） */
    if(st==='absent'){ absent++; obsDone++; papDone++; return; }
    if(st==='notassessed'){ na++; obsDone++; papDone++; return; }
    if(f1Complete(r.sid,subj).length) obsDone++; else obsLeft.push(r);
    if(st==='done') papDone++; else { papLeft.push(r); if(st==='progress') prog++; }
  });
  return {n:list.length, obsDone, papDone, obsLeft, papLeft, absent, na, prog,
          secs:(S.sections[EXK()+'|'+subj+'|'+yearOf(cls)]||[]).length};
}
/* Owner 2026-09-06：卡片上不列学生名字。
   一班 14 人，两行各印一次名单 = 28 个名字，把「还剩几个」这个唯一重点淹掉了。

/* ══ 考卷结构的归属 ══ Owner 2026-09-06
   「这份卷有几个项目、第几题到第几题、各几分」是一份卷设定一次的事，
   同年级同科全校共用 —— 它属於负责人，不属於每一位科任。
   老师端从此只看到一行状态；改的按钮只有 OWNER/TOP_MGMT/MGMT/ADMIN 看得到。 */
function bpCanEdit(){ return isAdmin(); }

/* ══ Blueprint Freeze ══ Owner Work Order P0-5
   一旦这个 exam + subject + year 的考卷结构底下已经长出证据
   （逐题记码 / 考卷分析 / 作文结果），就不能再随便删项目、改题号范围 ——
   旧证据的 q_no 会跟新结构对不上，整批错题漂移到别的项目去。
   本轮只做最小 freeze：锁「删除」与「改题号」；新增项目不锁（不会动到旧证据）。
   真的要修，走 bpUnlock() 的 controlled correction，必须写明理由。 */
const BP_UNLOCK={};
function bpEvidLocal(){
  const ex=EXK(), su=S.subject, yr=yearOf(S.cls); let n=0;
  Object.keys(S.wi).forEach(k=>{const w=S.wi[k];
    if(w&&w.exam===ex&&w.subject===su&&(+w.year||0)===yr) n++;});
  Object.keys(S.es).forEach(k=>{const e=S.es[k];
    if(e&&e.exam===ex&&e.subject===su&&(+e.year||0)===yr) n++;});
  Object.keys(S.f2).forEach(k=>{const r=S.f2[k];
    if(r&&r.exam===ex&&r.subject===su&&(+r.year||0)===yr&&f2Started(r)) n++;});
  return n;
}
function bpEvidCount(){ const c=CLOUD.bpEvid[bpKey()]; return bpEvidLocal()+(c>0?c:0); }
function bpLocked(){ return bpEvidCount()>0 && !BP_UNLOCK[bpKey()]; }
/* 云端也要看 —— 证据可能是别台电脑、别位老师产生的 */
async function bpProbe(){
  if(!_sb||!CLOUD.exam||!CLOUD.session) return;
  const k=bpKey(), su=S.subject, yr=yearOf(S.cls);
  try{
    const a=await _sb.from('evalgo_wrong_item').select('id',{count:'exact',head:true})
      .eq('exam_id',CLOUD.exam.id).eq('subject',su).eq('year_level',yr);
    const b=await _sb.from('evalgo_paper_analysis').select('id',{count:'exact',head:true})
      .eq('exam_id',CLOUD.exam.id).eq('subject',su).eq('year_level',yr);
    const n=(a.count||0)+(b.count||0);
    if(CLOUD.bpEvid[k]!==n){ CLOUD.bpEvid[k]=n; renderF1(); }
  }catch(e){ console.warn('bpProbe',e); }
}
function bpLockBadge(){
  const n=bpEvidCount();
  if(!n) return '<span class="chip chip-ok">可修改 · 还没有证据挂在上面</span>';
  if(BP_UNLOCK[bpKey()]) return `<span class="chip chip-warn">⚠ 已解锁修正中 · ${n} 笔证据受影响</span>`;
  return `<span class="chip chip-warn">🔒 已锁定 · ${n} 笔证据挂在这份结构上</span>`;
}
function bpUnlock(){
  if(!bpCanEdit()){ toast('✕ 只有管理层可以修改考卷结构'); return; }
  const n=bpEvidCount();
  const why=prompt('⚠ 这份考卷结构底下已经有 '+n+' 笔证据。\n\n'
    +'改题号范围或删项目，会让这些旧证据对应到错的项目 —— 那是资料漂移，不是修正。\n\n'
    +'如果确定要改，请写下原因（会记在这份结构上）：');
  if(!(why||'').trim()) { toast('已取消 — 没有写原因就不解锁'); return; }
  BP_UNLOCK[bpKey()]={by:S.me||'', at:new Date().toISOString(), why:why.trim()};
  console.warn('BLUEPRINT UNLOCK', bpKey(), BP_UNLOCK[bpKey()]);
  toast('⚠ 已解锁 —— 改完请立刻核对受影响的学生',6000);
  renderF1();
}

function f2Key(sid){ return EXK()+'|'+sid+'|'+S.subject; }

/* ══════════════════════════════════════════════════════════════════
   FORM 02 逐题资料层
   老师只点错的题；没点到 = 答对。图 4 的所有数字由此算出，不再手填。
   ══════════════════════════════════════════════════════════════════ */
function hasRange(x){ return +x.qf>=1 && +x.qt>=+x.qf; }
/* ⚠️ 只有「有合法题号范围」的项目才算题。
   v5 以前建立的项目没有 qf/qt —— 若放进来，(0-0+1) 会被当成 1 题，总题数灌水。 */
function qSections(){ return sections().filter(x=>QTYPES.indexOf(x.type||'MCQ')>=0 && hasRange(x)); }
function legacySections(){ return sections().filter(x=>QTYPES.indexOf(x.type||'MCQ')>=0 && !hasRange(x)); }
function setSecRange(id){
  if(!bpGuard('改题号范围')) return;
  const arr=S.sections[bpKey()]||[], sec=arr.find(x=>x.id===id); if(!sec) return;
  const f=parseInt((document.getElementById('rf_'+id)||{}).value,10);
  const t=parseInt((document.getElementById('rt_'+id)||{}).value,10);
  if(!(f>=1)||!(t>=f)){ toast('✕ 题号范围不对'); return; }
  const clash=arr.filter(x=>x.id!==id&&QTYPES.indexOf(x.type||'MCQ')>=0&&hasRange(x))
                 .find(x=>!(t<+x.qf||f>+x.qt));
  if(clash){ toast(`✕ 与「${clash.code}」(${clash.qf}-${clash.qt}) 重叠`); return; }
  sec.qf=f; sec.qt=t; if(!sec.type) sec.type='MCQ';

  if(saveThen('✓ 已补上题号')){ renderF1(); renderF2(); }
}
function essaySections(){ return sections().filter(x=>x.type==='ESSAY'); }
function totalQ(){ return qSections().reduce((a,x)=>a+((+x.qt||0)-(+x.qf||0)+1),0); }
function secOfQ(q){ return qSections().find(x=>q>=+x.qf&&q<=+x.qt)||null; }

function wiKey(sid,q){ return EXK()+'|'+sid+'|'+S.subject+'|'+q; }
function wiGet(sid,q){ return S.wi[wiKey(sid,q)]||null; }
function wiOf(sid){
  const pre=EXK()+'|'+sid+'|'+S.subject+'|';
  return Object.keys(S.wi).filter(k=>k.indexOf(pre)===0).map(k=>S.wi[k]);
}
function wiSet(sid,q,code,diag){
  const k=wiKey(sid,q), cur=S.wi[k];

  else{

function wiDiag(sid,q,v){
  const w=wiGet(sid,q); if(!w) return;
  w.diag=v; w.synced=false; w.savedAt=new Date().toLocaleString('en-GB');
  const r=f2Draft(sid); r.synced=false; saveData();

function markCounts(sid){
  const o={star:0,dk:0,cl:0,nr:0,sos:0,blank:0};
  wiOf(sid).forEach(w=>{ if(o[w.code]!=null) o[w.code]++; });
  o.wrong  = o.dk+o.cl+o.nr+o.sos+o.blank;   /* 漏答本来就没得分，算错 */
  o.marked = o.wrong+o.star;
  o.total  = totalQ();
  o.checked= !!(S.f2[f2Key(sid)]||{}).paper_checked;
  /* ⚠️ 未核对整份考卷之前，没标记的题是 UNKNOWN，不是答对。
     所以答对数与答对率【只有核对後才存在】。这是 Owner 的 Evidence Truth 要求。 */
  o.right = o.checked ? Math.max(0,o.total-o.wrong) : null;
  o.rate  = (o.checked && o.total) ? Math.round(o.right/o.total*100) : null;
  return o;
}
function mainIssue(m){
  const cand=[{k:'dk',lab:'知识缺口'},{k:'cl',lab:'粗心'},{k:'nr',lab:'审题'},
              {k:'sos',lab:'依赖'},{k:'blank',lab:'漏答'}];
  let best=null,bv=0; cand.forEach(c=>{const v=+m[c.k]||0; if(v>bv){bv=v;best=c;}});
  if(!best||!bv) return null;
  return {lab:best.lab,n:bv,tie:cand.filter(c=>(+m[c.k]||0)===bv).length>1};
}
function topicDiag(sid){
  const per={};
  const touch=t=>{ if(!per[t]) per[t]={topic:t,total:0,wrong:0,star:0,dk:0,cl:0,nr:0,sos:0,blank:0}; return per[t]; };
  qSections().forEach(x=>{ touch(x.topic||x.code).total += (+x.qt||0)-(+x.qf||0)+1; });
  wiOf(sid).forEach(w=>{ const t=touch(w.topic||w.sec_code||'—');
    if(w.code==='star') t.star++; else { t.wrong++; if(t[w.code]!=null) t[w.code]++; } });
  const chk=!!(S.f2[f2Key(sid)]||{}).paper_checked;
  return Object.keys(per).map(k=>{const x=per[k];
      x.rate = (chk && x.total)? Math.round((x.total-x.wrong)/x.total*100) : null; return x;})
    .sort((a,b)=>(b.wrong-a.wrong)||((a.rate==null?101:a.rate)-(b.rate==null?101:b.rate)));
}
/* ⚠️ v8 移除「建议 TP」。

   先前 90/80/65/50/35 → TP6..TP1 的映射是 Claude 自行发明，无学术依据，已撤销。
   系统只呈现事实（答对率），不代替老师下判断。 */
function autoWeak(sid){ return topicDiag(sid).filter(t=>t.wrong>0); }
function autoStrong(sid){
  /* 「全对」这个结论只有核对过整份卷才成立 */
  if(!(S.f2[f2Key(sid)]||{}).paper_checked) return [];
  return topicDiag(sid).filter(t=>t.total>0&&t.wrong===0);
}

function renderF2(){

  const secs=sections(), tq=totalQ(), es=essaySections(), lg=legacySections();
  let h=ctxBar()+`<div class="card">

  if(!secs.length){

      ? `还没登记这份考卷的结构。请先到 <b>考前观察</b> 把项目列出来（含<b>题型</b>与<b>题号范围</b>）
         —— 考卷分析要靠它才知道第几题属于哪个项目。`
      : `<b>考卷结构尚未设定，请联系负责人。</b>设定好之后，这里的题号格才会出现。`}</div></div></div>`;
    c.innerHTML=h; return;
  }
  if(lg.length) h+=`<div class="alert alert-warn"><div><b>${lg.length} 个项目还没有题号范围</b>
    —— ${lg.map(x=>esc(x.code)).join('、')}。这些题在下面<b>点不到</b>。请先回<b>考前观察</b>补上。</div></div>`;
  h+=`<div class="alert alert-info"><div><b>只点错的题</b>，没点到的先当「还没看」。
      批完整份卷按一次 <b>✓ 已核对整份</b>，系统才把没点的题算成答对
      —— 所以<b>全对的学生你一题都不用点</b>，只按那一下就完成。</div></div>
    <div class="chips-row" style="margin-top:8px">
      <span class="chip chip-muted">客观 / 理解共 ${tq} 题</span>
      ${es.length?`<span class="chip chip-muted">写作 ${es.length} 篇</span>`:''}
      ${MARKS.map(m=>`<span class="chip ${m.chip}">${m.lab} ${m.zh}</span>`).join('')}
    </div>
    <div class="form-row" style="margin-top:10px"><label class="form-label">日期</label>
      <input type="date" id="f2date" style="max-width:200px" value="${today()}"></div>
  </div>`;
  const list=inCls(S.cls);
  if(!list.length){ c.innerHTML=h+`<div class="card"><div class="empty">这个班没有学生</div></div>`; return; }

  h+=`<div class="card" style="padding:0;overflow:hidden"><div class="tw"><table class="data"><thead><tr>
      <th style="min-width:150px">学生</th><th style="width:78px">状态</th>
      ${MARKS.map(m=>`<th style="width:48px" title="${esc(m.zh)}">${m.lab}</th>`).join('')}
      <th style="width:80px">答对率</th><th style="min-width:110px">主问题</th>
      <th style="min-width:130px">最弱技能</th><th style="width:80px"></th>
    </tr></thead><tbody>`;
  list.forEach(r=>{
    const m=markCounts(r.sid), mi=mainIssue(m), td=autoWeak(r.sid);
    h+=`<tr>
      <td><strong>${esc(r.en)}</strong>${r.cn?` <span style="color:var(--hint);font-size:11px">${esc(r.cn)}</span>`:''}</td>
      <td>${(()=>{const st=f2State(S.f2[f2Key(r.sid)]);
        if(st==='none') return '<span style="color:var(--hint)">未开始</span>';
        const pre = st==='done'?'✓ ' : (st==='progress'?'⚠ ' : '');
        return `<span class="badge ${F2STATE[st].cls}">${pre}${F2STATE[st].lab}</span>`;})()}</td>
      ${MARKS.map(mk=>`<td style="text-align:center">${m[mk.id]?`<strong>${m[mk.id]}</strong>`:'<span style="color:var(--hint)">·</span>'}</td>`).join('')}
      <td>${m.rate==null?'<span style="color:var(--hint)" title="未核对整份卷，没点的题还不能算答对">—</span>':
          `<span class="badge ${m.rate>=75?'b-active':(m.rate>=50?'b-warn':'b-inactive')}">${m.rate}%</span>`}</td>
      <td>${mi?`<span class="chip chip-muted">${esc(mi.lab)}${mi.tie?' ?':''} · ${mi.n}</span>`:'<span style="color:var(--hint)">—</span>'}</td>
      <td>${td.length?`<span class="chip chip-warn">${esc(td[0].topic)} ${td[0].wrong}/${td[0].total||'?'}</span>`:'<span style="color:var(--hint)">—</span>'}</td>
      <td style="white-space:nowrap">${(()=>{const st=f2State(S.f2[f2Key(r.sid)]);
        const resolved = (st==='absent'||st==='notassessed');
        return `<button class="btn btn-sm ${st==='done'||resolved?'':'btn-pri'}"
          ${resolved?'disabled style="opacity:.45"':''}
          onclick="f2Open('${r.sid}')">${st==='done'?'查看':'填写'}</button>
        <button class="btn btn-sm" title="缺席 / 本轮未评"
          style="padding:4px 9px;font-weight:700" onclick="aStatMenu('${r.sid}')">⋯</button>`;})()}
      </td></tr>`;
  });
  h+=`</tbody></table></div></div>`;
  const nDone=list.filter(r=>f2State(S.f2[f2Key(r.sid)])==='done').length;
  const nProg=list.filter(r=>f2State(S.f2[f2Key(r.sid)])==='progress').length;
  const nAbs =list.filter(r=>f2State(S.f2[f2Key(r.sid)])==='absent').length;
  const nNA  =list.filter(r=>f2State(S.f2[f2Key(r.sid)])==='notassessed').length;
  const nHandled=nDone+nAbs+nNA;              /* 老师端看「已处理」 */
  const pct=list.length?Math.round(nHandled/list.length*100):0;
  h+=`<div class="card"><div class="card-hdr">
      <span class="card-title">${esc(S.cls)} · ${esc(S.subject)} 进度</span>
      <span class="tip" style="margin:0"><b>${nHandled} / ${list.length} 已处理</b>${
        nProg?` · <b style="color:var(--warn)">${nProg} 位填一半</b>`:''}</span></div>
    <div class="progress ${pct>=100?'progress-ok':'progress-layer'}"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="tip" style="margin-top:8px">已处理 ${nHandled} = 完成 ${nDone}${
        nAbs?` + 缺席 ${nAbs}`:''}${nNA?` + 本轮未评 ${nNA}`:''}。
      ${(nAbs||nNA)?`<b>缺席与本轮未评不会进报告，也不算弱或 0 分</b> —— 报告只看有证据的 ${nDone} 位。`:''}</div>
    ${nProg?`<div class="alert alert-warn" style="margin-top:10px"><div><b>${nProg} 位学生只填了一半</b>
       —— 追踪只认「已完成」。填一半的不会进报告，请回去按完成。</div></div>`
      :(pct>=100?`<div class="alert alert-ok" style="margin-top:10px"><div><b>这个班全部处理完了 🎉</b>
       要换下一班就按右上角「换班级 / 科目」。</div></div>`:'')}
    <div class="tip">表格里的数字<b>不能手改</b> —— 全部由「填写」里的逐题记码算出来。</div></div>`;
  c.innerHTML=h;
}
function stampF2(r,sid){
  const st=stuOf(sid)||{};
  r.sid=sid; r.subject=S.subject; r.cls=st.cls||S.cls; r.year=st.year||yearOf(r.cls);
  r.class_id=st.class_id||null; r.by=S.me; r.exam=S.examCode;
  r.paper_date=r.paper_date||((document.getElementById('f2date')||{}).value||today());
  if(r.subject===S.subject){
    r.weak_options  = autoWeak(sid).map(t=>t.topic);
    r.strong_topics = autoStrong(sid).map(t=>t.topic);
  }
  r.savedAt=new Date().toLocaleString('en-GB');
}

/* ══════════════════════════════════════════════════════════════════
   细节 modal —— 三型共用；Autosave（点了就存），关闭不会掉资料
   ══════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════
   细节 modal —— 先点题号，再选记码（Owner 指定顺序）
   v8 是反过来的（先选记码再连点）—— 快，但老师看着第 3 题却要先想「这是什么码」，
   而且选定的记码会跟着走，容易整串点错。改成：点题号 → 就地弹出六个记码。
   ══════════════════════════════════════════════════════════════════ */
let PICKQ=null;
function qBtnHTML(sid,q){
  const w=wiGet(sid,q), mk=w?MARKS.find(x=>x.id===w.code):null;
  return `<span class="qn">${q}</span>`+(mk?`<span class="qm">${esc(mk.lab)}</span>`:'');
}
function paintQ(sid,q){
  const el=document.getElementById('q_'+q); if(!el) return;
  const w=wiGet(sid,q);
  el.className='qbtn'+(w?(' q-'+w.code):'')+(PICKQ===q?' picking':'');
  el.title=w?markLab(w.code):'还没点';
  el.innerHTML=qBtnHTML(sid,q);
}
function qClick(sid,q){
  PICKQ = (PICKQ===q ? null : q);
  paintPick(sid);
}
function paintPick(sid){
  document.querySelectorAll('.qpick').forEach(e=>e.remove());
  document.querySelectorAll('.qbtn.picking').forEach(e=>e.classList.remove('picking'));
  if(PICKQ==null) return;
  const btn=document.getElementById('q_'+PICKQ); if(!btn) return;
  btn.classList.add('picking');
  const grid=btn.closest('.qgrid'); if(!grid) return;
  const cur=wiGet(sid,PICKQ), sec=secOfQ(PICKQ)||{};
  const d=document.createElement('div');
  d.className='qpick';
  d.innerHTML=`<div class="qpick-t">第 ${PICKQ} 题${sec.topic?' · '+esc(sec.topic):''} — 这题怎么了？</div>
    <div class="chips-row">${MARKS.map(m=>`<button class="chip ${cur&&cur.code===m.id?'sel':m.chip}"
      onclick="qPick('${sid}',${PICKQ},'${m.id}')">${m.lab} ${m.zh}</button>`).join('')}
      ${cur?`<button class="chip chip-muted" onclick="qPick('${sid}',${PICKQ},null)">✕ 取消这题</button>`
           :`<button class="chip chip-muted" onclick="qPick('${sid}',${PICKQ},'__close')">收起</button>`}</div>`;
  grid.insertAdjacentElement('afterend', d);
}
function qPick(sid,q,code){
  if(code!=='__close') wiSet(sid,q,code);
  PICKQ=null; paintPick(sid); paintQ(sid,q); paintLive(sid); paintTail(sid);
}
/* CL 第二层 —— 点了 CL 才出现，选填。不进主流程。 */
function clSub(sid,q,v){
  const w=wiGet(sid,q); if(!w) return;
  w.cl_subtype = w.cl_subtype===v?null:v;
  w.synced=false; w.savedAt=new Date().toLocaleString('en-GB');
  const r=f2Draft(sid); r.synced=false; saveData(); paintLive(sid);
}

/* ══ 完成状态：三态。追踪只认「已完成」 ══ */
function f2State(p){
  if(!p) return 'none';
  const a=aStat(p);
  if(a==='ABSENT')       return 'absent';
  if(a==='NOT_ASSESSED') return 'notassessed';
  if(p.paper_checked && p.tp) return 'done';
  if(f2Started(p)) return 'progress';
  return 'none';
}
const F2STATE={ none:{lab:'未开始',cls:''}, progress:{lab:'进行中',cls:'b-warn'},
                done:{lab:'已完成',cls:'b-active'},
                absent:{lab:'缺席',cls:'b-inactive'}, notassessed:{lab:'本轮未评',cls:'b-inactive'} };
/* 还差什么 —— 老师要看得到自己离「完成」还有多远，才不会填一半就走 */
function f2Missing(sid){
  const r=f2Draft(sid), out=[];
  if(!r.paper_checked) out.push('先亲自按「整份都看过了」');
  if(!r.tp)            out.push('选掌握程度 TP');
  return out;
}

function f2Open(sid){
  const r=stuOf(sid); if(!r) return;
  if(window._f2cur!==sid) PICKQ=null;
  window._f2cur=sid;
  const rec=f2Draft(sid), y=r.year||yearOf(r.cls);
  const qs=qSections(), es=essaySections(), lg=legacySections();
  let b=navBar(sid,'f2');

  if(!qs.length && !es.length){
    b+=`<div class="alert alert-danger"><div><b>这份考卷还没办法逐题记录。</b><br>
      ${lg.length?`已登记的 ${lg.length} 个项目（${lg.map(x=>esc(x.code)).join('、')}）
        <b>没有填题号范围</b>，系统不知道第几题属於哪个项目。`
       :`这个科目 / 年级还没有登记任何项目。`}<br><br>
      ${bpCanEdit()
        ? `请到<b>考前观察</b>最上方，把每个项目补上「第 __ 到 __ 题」（写作文填满分），回来这里题号格就会出现。`
        : `<b>请联系负责人</b>补上考卷结构。这不是你能改的，也不该由你来猜。`}</div></div>`;
  }
  if(qs.length){
    b+=`<div class="secbox"><div class="sechd">逐题记录
      <span class="sub">点题号 → 选这题怎么了 · 没点的题先当「还没看」</span></div>`;
    qs.forEach(sec=>{
      b+=`<div style="margin-bottom:12px">
        <div style="font-weight:700;margin-bottom:4px">${esc(sec.code)}
          <span class="chip chip-muted">${esc(typeLab(sec.type||'MCQ'))}</span>
          ${sec.topic?`<span class="chip chip-layer">${esc(sec.topic)}</span>`:''}
          ${sec.fmt?`<span class="chip chip-muted">${esc(sec.fmt)}</span>`:''}
          <span style="color:var(--mut);font-size:11px">第 ${sec.qf}–${sec.qt} 题</span></div>
        <div class="qgrid">`;
      for(let q=+sec.qf;q<=+sec.qt;q++){
        const w=wiGet(sid,q);
        b+=`<button class="qbtn${w?(' q-'+w.code):''}" id="q_${q}" title="${w?esc(markLab(w.code)):'还没点'}"
              onclick="qClick('${sid}',${q})">${qBtnHTML(sid,q)}</button>`;
      }
      b+=`</div></div>`;
    });
    b+=`</div>`;
  }

  es.forEach(sec=>{
    const er=esDraft(sid,sec.code), sel=er.weak||[];
    b+=`<div class="secbox"><div class="sechd">写作文 · ${esc(sec.code)}
      <span class="sub">不逐题 · 三个面向 + 得分</span></div>
      <label class="form-label">弱在哪（可多选）</label>
      <div class="chips-row" id="esw_${esc(sec.id)}">
        ${ESSAY_ASPECTS.map(a=>`<button class="chip ${sel.indexOf(a.id)>=0?'sel-w':'chip-warn'}"
          data-asp="${a.id}" onclick="esTog('${sid}','${esc(sec.code)}','${sec.id}','${a.id}')">${esc(a.zh)}</button>`).join('')}
        <button class="chip ${er.star?'sel':'chip-ok'}" id="ess_${esc(sec.id)}"
          onclick="esStar('${sid}','${esc(sec.code)}','${sec.id}')">★ 写得特别好</button></div>
      <div class="form-row" style="margin-top:8px"><label class="form-label">得分</label>
        <div style="display:flex;align-items:center;gap:6px">
          <input type="number" min="0" step="0.5" max="${sec.max}" style="width:90px"
            value="${er.score!=null?er.score:''}"
            oninput="esScore('${sid}','${esc(sec.code)}','${sec.id}',this.value,${sec.max})">
          <span style="color:var(--mut)">/ ${sec.max}</span></div></div></div>`;
  });

  b+=`<div id="f2live"></div><div id="f2tail"></div>`;

  openModal(`${esc(nameOf(r))} · Year ${y} · ${esc(S.subject)}`, b,
    `<span id="f2foot" class="tip" style="margin:0;flex:1"></span>
     <button class="btn btn-sm" onclick="closeModal()">先关掉</button>
     <button class="btn btn-sm" id="f2done1" onclick="f2Finish('${sid}')">只完成</button>
     <button class="btn btn-pri" id="f2done" onclick="f2Finish('${sid}',1)">✓ 完成并到下一位</button>`);
  paintLive(sid); paintTail(sid); paintFoot(sid);
}

/* 系统算出来的 + 已核对整份 —— 点题号即时刷新 */
function paintLive(sid){
  const el=document.getElementById('f2live'); if(!el) return;
  const rec=f2Draft(sid), m=markCounts(sid), td=topicDiag(sid);
  const weak=autoWeak(sid), strong=autoStrong(sid);
  const subjQ=wiOf(sid).filter(w=>w.sec_type==='SUBJ').sort((a,b)=>a.q-b.q);
  const clQ=wiOf(sid).filter(w=>w.code==='cl').sort((a,b)=>a.q-b.q);
  let h='';

  h+=`<div class="secbox" style="border-color:${rec.paper_checked?'var(--ok)':'var(--warn)'};border-width:2px">
    <div class="sechd">整份考卷看完了吗
      <span class="sub">按了这一下，没点的题才算答对</span></div>
    <button class="chip ${rec.paper_checked?'sel':'chip-warn'}" style="font-size:14px;padding:9px 18px"
      onclick="f2Checked('${sid}')">${rec.paper_checked?'✓ 整份都看过了':'○ 按这里：整份都看过了'}</button>
    <div class="tip" style="margin-top:8px">${rec.paper_checked
      ? `没点到的 ${Math.max(0,m.total-m.marked)} 题 = <b>答对</b>。答对率 ${m.rate==null?'—':m.rate+'%'}。`
      : `现在没点到的题算「<b>还没看</b>」，不是答对 —— 所以还没有答对率。
         <b>全对的学生你一题都不用点，直接按上面这一下。</b>`}</div></div>`;

  h+=`<div class="secbox"><div class="sechd">系统算出来的<span class="sub">老师不用填</span></div>
    <div class="chips-row">
      ${MARKS.map(k=>`<span class="chip ${m[k.id]?k.chip:'chip-muted'}">${k.lab} ${m[k.id]}</span>`).join('')}
      <span class="chip chip-muted">${m.checked?`答对 ${m.right} / ${m.total}`:`已点 ${m.marked} / ${m.total} 题`}</span>
      ${m.rate==null?'':`<span class="badge ${m.rate>=75?'b-active':(m.rate>=50?'b-warn':'b-inactive')}">${m.rate}%</span>`}
    </div>`;
  if(td.some(t=>t.wrong||t.star)){
    h+=`<div class="tw" style="margin-top:8px"><table class="data"><thead><tr>
      <th>技能 / 主题</th><th style="width:80px">错 / 共</th><th style="width:56px">不会</th>
      <th style="width:56px">粗心</th><th style="width:56px">漏答</th><th style="width:70px">正确率</th></tr></thead><tbody>`;
    td.forEach(t=>{ h+=`<tr><td><strong>${esc(t.topic)}</strong>${t.star?` <span class="chip chip-ok">★${t.star}</span>`:''}</td>
      <td>${t.wrong} / ${t.total||'?'}</td>
      <td>${t.dk?`<span style="color:var(--danger);font-weight:600">${t.dk}</span>`:'<span style="color:var(--hint)">·</span>'}</td>
      <td>${t.cl?`<span style="color:var(--warn);font-weight:600">${t.cl}</span>`:'<span style="color:var(--hint)">·</span>'}</td>
      <td>${t.blank?`<span style="color:var(--danger);font-weight:600">${t.blank}</span>`:'<span style="color:var(--hint)">·</span>'}</td>
      <td>${t.rate==null?'<span style="color:var(--hint)">—</span>':`<span class="badge ${t.rate>=75?'b-active':(t.rate>=50?'b-warn':'b-inactive')}">${t.rate}%</span>`}</td></tr>`; });
    h+=`</tbody></table></div>`;
  }else h+=`<div class="tip">还没点任何题 — 上面点错的题，这里就会长出真数据。</div>`;
  /* Owner：系统推导只看得到「错在哪一题」，看不到老师现场看到的其他东西 —— 两者并存。 */
  {
    const kw=paperWeakOpts();
    const sel=rec.weak_manual||[];
    h+=`<div style="margin-top:10px">
      <span class="form-label" style="display:inline">老师补充：这份卷他弱在哪
        <span style="color:var(--mut);font-size:10px">选填 · 这份考卷登记的考点</span></span>
      ${kw.length?`<div class="chips-row">${kw.map(t=>`<button class="chip ${sel.indexOf(t)>=0?'sel-w':'chip-warn'}"
        onclick="f2TogL(this,'${sid}','weak_manual')" data-v="${esc(t)}">${esc(t)}</button>`).join('')}</div>`
      :`<div class="tip" style="margin:4px 0 0">这份考卷的项目还没填「文法 / 主题」，所以没有考点可以勾。
         直接写在下面就行；要出现在这里，请负责人在考卷结构里把每个项目的「文法 / 主题」补上
         （一个项目可以填多个，用「、」分开）。</div>`}
      <textarea rows="2" style="margin-top:6px" placeholder="其他（可留空）"
        oninput="f2Field('${sid}','weak_note',this.value)">${esc(rec.weak_note||'')}</textarea></div>`;
  }
  if(weak.length||strong.length){
    h+=`<div style="margin-top:8px">
      ${weak.length?`<div style="margin-bottom:4px"><span class="form-label" style="display:inline">📌 需加强</span>
        ${weak.map(t=>`<span class="chip chip-warn">${esc(t.topic)} ${t.wrong}/${t.total||'?'}</span>`).join('')}</div>`:''}
      ${strong.length?`<div><span class="form-label" style="display:inline">✅ 强项</span>
        ${strong.map(t=>`<span class="chip chip-ok">${esc(t.topic)} 全对</span>`).join('')}</div>`:''}</div>`;
  }
  h+=`</div>`;

  if(clQ.length){
    h+=`<div class="secbox"><div class="sechd">粗心是哪一种<span class="sub">选填 · 算错 / 抄错 / 没写完，教法完全不同</span></div>`;
    clQ.forEach(w=>{ h+=`<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px">
        <span class="chip chip-warn">第 ${w.q} 题</span>
        ${CL_SUB.map(c=>`<button class="chip ${w.cl_subtype===c.v?'sel':'chip-muted'}"
          onclick="clSub('${sid}',${w.q},'${c.v}')">${c.zh}</button>`).join('')}</div>`; });
    h+=`</div>`;
  }
  if(subjQ.length){
    h+=`<div class="secbox"><div class="sechd">理解文 · 老师诊断<span class="sub">写一句就好，这是报告里最有用的一段</span></div>`;

  }

  h+=`<div class="secbox" style="${rec.tp?'':'border-color:var(--warn);border-width:2px'}">

      data-v="${t.v}" onclick="f2TPL(this,'${sid}','${t.v}')">${t.v} ${t.zh}</button>`).join('')}
      ${rec.tp?`<button class="chip chip-muted" onclick="f2TPL(null,'${sid}',null)">✕ 清除</button>`:''}</div></div>`;

  paintFoot(sid);
}

/* 下半部：已做 / 会做 / 订正结果 / 学生的话 / 家长 —— 可独立重画 */
function paintTail(sid){
  const el=document.getElementById('f2tail'); if(!el) return;
  const rec=f2Draft(sid);
  const selD=rec.done_options||[], selN=rec.next_options||[];
  /* NEXT 自动展开的条件：已经有计划，或结果是「还需要练习 / 需要更多帮助」 */
  const nextOpen = needsNext(rec) || selN.length>0 || !!(rec.next_note||'').trim();
  el.innerHTML=`
  <!-- ══ 教学动作链：DID → RESULT → NEXT ══
       Owner 2026-09-06：「老师会感觉『我刚刚已经说做了什么，为什么下面又问一次』。」
       旧版把 done / next 塞在同一个盒子（老师做了什么），再另开一个「FIX 模块」问
       订正结果 —— 老师要同时理解两套概念。现在改成她自然的思考顺序：
         DID   我已经做了什么   （FACT，不可与 PLAN 混）
         RESULT 学生现在怎样    （承接 FIX / 再测证据）
         NEXT  还需要继续做什么 （选填；只有还需要跟进时才自动展开）
       ⚠️ 资料库栏位一栏没动 —— done_* / fix_* / next_* 语义不变。
          这次只减少老师的理解负担，不动 Evidence 语义。 -->
  <div class="secbox"><div class="sechd"><span style="color:var(--mut)">1</span> 我已经做了什么
      <span class="sub">DID · 已经发生的事实</span></div>
    <div class="chips-row" id="chipsDone">${ACTIONS.map(a=>`<button class="chip ${selD.indexOf(a)>=0?'sel':'chip-layer'}"
      data-v="${esc(a)}" onclick="f2TogL(this,'${sid}','done_options')">${esc(a)}</button>`).join('')}</div>
    <textarea rows="2" style="margin-top:6px" placeholder="其他已经做的（可留空）"
      oninput="f2Field('${sid}','done_note',this.value)">${esc(rec.done_note||'')}</textarea>
  </div>

  <div class="secbox"><div class="sechd"><span style="color:var(--mut)">2</span> 学生现在怎样
      <span class="sub">RESULT · 讲解 + 订正后，让他再做一题同类型的 · 选填</span></div>
    <div class="chips-row" id="chipsFix">${FIXOUT.map(f=>`<button class="chip ${rec.fix_outcome===f.v?'sel':f.chip}"
      data-v="${f.v}" onclick="f2FixL(this,'${sid}','${f.v}')">${f.lab}</button>`).join('')}
      ${rec.fix_outcome?`<button class="chip chip-muted" onclick="f2FixL(null,'${sid}',null)">✕ 清除</button>`:''}</div>
    <div id="fixTgt" style="margin-top:8px;${rec.fix_outcome?'':'display:none'}">
      <label class="form-label">针对哪一项？<span style="color:var(--mut);font-size:10px">留空 = 整份卷</span></label>
      <input type="text" placeholder="例：进位加法"
        value="${esc(rec.fix_target||'')}" oninput="f2Field('${sid}','fix_target',this.value)"></div>
  </div>

  <div class="secbox" id="nextBox"><div class="sechd" style="cursor:pointer" onclick="tglNext()">
      <span style="color:var(--mut)">3</span> 还需要继续做什么
      <span class="sub">NEXT · 计划 · 选填 <span id="nextCaret">▸</span></span></div>
    <div id="nextBody" style="display:${nextOpen?'block':'none'}">
      <div class="chips-row" id="chipsNext">${ACTIONS.map(a=>`<button class="chip ${selN.indexOf(a)>=0?'sel':'chip-layer'}"
        data-v="${esc(a)}" onclick="f2TogL(this,'${sid}','next_options')">${esc(a)}</button>`).join('')}</div>
      <textarea rows="2" style="margin-top:6px" placeholder="其他计划（可留空）"
        oninput="f2Field('${sid}','next_note',this.value)">${esc(rec.next_note||'')}</textarea>
    </div>
  </div>

  <div class="secbox"><div class="sechd" style="cursor:pointer" onclick="tglExtra()">补充资料
      <span class="sub">学生的话 · 家长配合 · 全部选填 <span id="extraCaret">${S.ui.extraOpen?'▾':'▸'}</span></span></div>
    <div id="extraBody" style="display:${S.ui.extraOpen?'block':'none'}">
      <label class="form-label">学生自己讲的话<span style="color:var(--mut);font-size:10px"> · 用他的原话</span></label>

            oninput="f2Field('${sid}','reflect_now_know',this.value)">${esc(rec.reflect_now_know||'')}</textarea></div>

/* 底部永远告诉老师「还差什么」—— 防止填一半就走 */
function paintFoot(sid){
  const f=document.getElementById('f2foot'); if(!f) return;
  const miss=f2Missing(sid);
  f.innerHTML = miss.length
    ? `<span style="color:var(--warn);font-weight:700">还差 ${miss.length} 项：</span>
       <span style="color:var(--warn)">${miss.join(' · ')}</span>`
    : `<span style="color:var(--ok);font-weight:700">✓ 都填好了，可以按完成</span>`;
  const btn=document.getElementById('f2done');
  if(btn) btn.textContent = miss.length? `✓ 完成（还差 ${miss.length} 项）` : '✓ 完成并到下一位';
}
function f2Finish(sid,goNext){
  const r=f2Draft(sid);
  /* 🔴 P0-1 Evidence Truth：v19 以前这里会自动补上
       r.paper_checked = true
     —— 老师只按了「完成这个学生」，系统却替她声称「整份考卷我都核对过了」。
     那是系统伪造老师的 attestation。已删除。
     paper_checked 只能由 f2Checked() 里老师亲手那一下产生。 */
  const miss=f2Missing(sid);
  if(miss.length){
    if(saveData(true)===false){ alert(saveFailMsg()); return; }
    paintLive(sid); paintFoot(sid);
    toast('还差：'+miss.join(' · '),4000);
    const tp=document.getElementById('chipsTP');
    if(tp) tp.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  if(saveData(true)===false){ alert(saveFailMsg()); return; }
  const nm=nameOf(stuOf(sid));
  if(goNext){
    const nx=navTodo(sid,'f2');
    if(nx && nx!==sid){ renderF2(); toast('✓ '+nm+' 完成'); autoPush(); f2Open(nx); return; }
  }
  closeModal(); renderF2(); toast('✓ '+nm+' 完成');
  autoPush(); classDoneCheck();
}
/* 整班都完成 → 主动问要不要换下一班（老师教多班多年段） */
function classDoneCheck(){
  const list=inCls(S.cls); if(!list.length) return;

/* ══ 局部更新的 chips —— 不重建 modal，滚动位置不跳 ══ */
function f2TogL(btn,sid,field){
  const r=f2Draft(sid), v=btn.getAttribute('data-v');
  const a=r[field]||(r[field]=[]);
  const i=a.indexOf(v); if(i>=0)a.splice(i,1); else a.push(v);
  btn.classList.toggle('sel'); btn.classList.toggle('chip-layer');
  r.synced=false; stampF2(r,sid); saveData();
}
function f2FixL(btn,sid,v){
  const r=f2Draft(sid);
  r.fix_outcome = (v===null||r.fix_outcome===v)?null:v;
  r.synced=false; stampF2(r,sid); saveData(); paintTail(sid);
}
/* NEXT 预设折叠。只有「还需要练习 / 需要更多帮助」才自动展开 ——
   已经改善的学生不需要再问计划，多一个问题就是多一次犹豫。 */
function needsNext(r){ return r.fix_outcome==='NEEDS_PRACTICE'||r.fix_outcome==='NEED_HELP'; }
function tglNext(){
  const b=document.getElementById('nextBody'), c=document.getElementById('nextCaret');
  if(!b) return; const on=b.style.display==='none';
  b.style.display=on?'block':'none'; if(c) c.textContent=on?'▾':'▸';
}
function tglExtra(){
  S.ui.extraOpen=!S.ui.extraOpen; saveData(true);
  const b=document.getElementById('extraBody'), c=document.getElementById('extraCaret');
  if(b) b.style.display=S.ui.extraOpen?'block':'none';
  if(c) c.textContent=S.ui.extraOpen?'▾':'▸';
}
function f2TPL(btn,sid,v){
  const r=f2Draft(sid);
  r.tp = (v===null||r.tp===v)?null:v;
  r.synced=false; stampF2(r,sid); saveData(); paintLive(sid);
}
function f2Field(sid,field,v){
  const r=f2Draft(sid); r[field]=v; r.synced=false; stampF2(r,sid); saveData();
}
function f2Checked(sid){
  const r=f2Draft(sid);
  r.paper_checked = !r.paper_checked;
  r.paper_checked_at = r.paper_checked ? new Date().toISOString() : null;
  r.synced=false; stampF2(r,sid);
  if(saveData(true)===false){ alert(saveFailMsg()); return; }
  paintLive(sid); renderF2(); autoPush();
  toast(r.paper_checked?'✓ 没点的题算答对了':'已取消 — 没点的题回到「还没看」');
}
function esTog(sid,code,secId,asp){
  const sec=sections().find(x=>x.id===secId);
  const r=esStamp(sid,code,sec), a=r.weak||(r.weak=[]);
  const i=a.indexOf(asp); if(i>=0)a.splice(i,1); else a.push(asp);
  const btn=document.querySelector(`#esw_${secId} [data-asp="${asp}"]`);
  if(btn){ btn.classList.toggle('sel-w'); btn.classList.toggle('chip-warn'); }
  saveData();
}
function esStar(sid,code,secId){
  const sec=sections().find(x=>x.id===secId);
  const r=esStamp(sid,code,sec); r.star=!r.star;
  const btn=document.getElementById('ess_'+secId);
  if(btn) btn.className='chip '+(r.star?'sel':'chip-ok');
  saveData();
}
function esScore(sid,code,secId,v,mx){
  const sec=sections().find(x=>x.id===secId);
  const r=esStamp(sid,code,sec);
  r.score = v===''? null : Math.min(+mx,Math.max(0,parseFloat(v)||0));
  r.max=+mx; saveData();
}

/* ══ 覆蓋追踪 ══ */
function renderCoverage(){
  const c=document.getElementById('c-coverage');
  if(gateOpen()){ c.innerHTML=gateHTML(); return; }
  const myCls=asgMine().filter(a=>a.subject===S.subject).map(a=>a.cls);
  let h=ctxBar()+`<div class="card"><div class="card-hdr"><span class="card-title">轮换覆盖追踪 · ${esc(S.subject)}</span>
      <span class="tip" style="margin:0">${myCls.length?('我教的 '+myCls.join('、')):'（还没登记任教班级 — 显示全部）'}</span></div>
    <div class="alert alert-info">SOP 图6：<b>一直轮换，直到全班都被观察到。</b>这一页只看这台机器上本科目的资料；${
      isAdmin()?'上传后可在云端看到全部科任的合并结果。':'全部科任的合并结果由管理层那边看。'}<br>
      <b>缺席 / 本轮未评 = 已处理，不会再催</b> —— 但它们<b>不是</b>观察证据，也不会进报告。</div></div>`;
  CLASSES.forEach(cl=>{
    const list=inCls(cl); if(!list.length) return;
    /* 🔴 P0-3：旧版只看 f1Complete，於是工作台说「Jason 缺席·已处理」，
       这一页却说「Jason 还没观察」。两页说的话不一样 = 老师不信系统。
       改成消费 opResolved（同一支真相）。 */
    const none=list.filter(r=>!opResolved(r.sid,'f1'));
    const res =list.filter(r=>stResolved(r.sid));
    const pct=Math.round((list.length-none.length)/list.length*100);
    h+=`<div class="card"><div class="card-hdr">
        <span class="card-title">${esc(cl)}${cl===S.cls?' · 我的班':''}</span>
        <span class="tip" style="margin:0">已处理 ${list.length-none.length} / ${list.length}
          ${none.length?`<span class="badge b-warn">还剩 ${none.length} 位</span>`:`<span class="badge b-active">全班都处理完了</span>`}
          ${res.length?`<span class="badge b-inactive">其中 ${res.length} 位缺席 / 本轮未评</span>`:''}</span></div>
      <div class="progress ${pct>=100?'progress-ok':'progress-layer'}"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="chips-row" style="margin-top:10px">`;
    list.forEach(r=>{
      const n=f1Complete(r.sid).length;
      const p=S.f2[f2Key(r.sid)];
      const st=f2State(p);
      if(st==='absent'||st==='notassessed'){
        h+=`<span class="chip chip-muted" style="opacity:.6">${esc(r.en)} · ${
          st==='absent'?'缺席':'本轮未评'}</span>`; return;
      }
      h+=`<span class="chip ${n?'chip-ok':'chip-muted'}">${esc(r.en)}${n?' · '+n:''}${
        st==='done'?' ✓':(st==='progress'?' ⚠':'')}</span>`;
    });
    h+=`</div></div>`;
  });
  c.innerHTML=h;
}

/* ══ 考前報告 ══ */
function renderReport(){

      完整报告要等所有科任上传后由系统合并，这一页只是单科预览。</div>
    <div class="toolbar no-print">

function reportRows(){
  const cl=(document.getElementById('rptCls')||{}).value||S.cls;
  const q=((document.getElementById('rptSearch')||{}).value||'').toLowerCase();
  /* 🔴 P0-2：旧版 gate 是「f2 不是 none 或有观察」——
     那会让「填一半」「缺席」「本轮未评」全部漏进报告。
     报告只认 reportReady()：ASSESSED + 老师亲自核对整份 + TP。 */
  return inCls(cl).filter(r=>!q||(r.en+' '+(r.cn||'')).toLowerCase().includes(q)).map(r=>{
    const p=S.f2[f2Key(r.sid)]||{};
    const obs=f1Complete(r.sid);
    return {r,p,obs};
  }).filter(x=>reportReady(x.r.sid));
}
/* 被挡在报告外的人 —— 必须看得见，否则管理层以为「就这几个」 */
function reportHeld(){
  const cl=(document.getElementById('rptCls')||{}).value||S.cls;
  const out={absent:[],na:[],half:[],none:[]};
  inCls(cl).forEach(r=>{
    if(reportReady(r.sid)) return;
    const st=f2State(S.f2[f2Key(r.sid)]);
    if(st==='absent') out.absent.push(r);
    else if(st==='notassessed') out.na.push(r);
    else if(st==='progress'||st==='done'||f1Complete(r.sid).length) out.half.push(r);
    else out.none.push(r);
  });
  return out;
}
function renderReportBody(){
  const el=document.getElementById('rpt-body'); if(!el) return;
  const rows=reportRows(), held=reportHeld();
  const heldBox=(()=>{
    const n=held.absent.length+held.na.length+held.half.length+held.none.length;
    if(!n) return '';
    const line=(lab,arr,why)=>arr.length?`<div style="margin-top:4px"><b>${lab} ${arr.length} 位</b>
      <span style="color:var(--mut)">${esc(arr.map(r=>r.en).join('、'))}</span>
      <span style="color:var(--mut)">—— ${why}</span></div>`:'';
    return `<div class="card"><div class="alert alert-warn"><div>
      <b>${n} 位不在下面的报告里。</b>报告只收「已评量 + 老师亲自核对整份卷 + 有掌握程度 TP」的学生。
      ${line('缺席',held.absent,'不是弱、不是 0 分，只是没有证据')}
      ${line('本轮未评',held.na,'学生在，但这一轮证据不足')}
      ${line('资料未齐',held.half,'有填但还没按「整份都看过了」或还没选 TP')}
      ${line('还没开始',held.none,'')}

  })();

  let h=heldBox;
  rows.forEach(({r,p,obs})=>{

    const mi=mainIssue(ms);
    /* v6：weak_options 是技能名（系统推导），next_options 是老师行动 —— 两者都已是可读字串 */

    const fo=FIXOUT.find(f=>f.v===p.fix_outcome);
    h+=`<div class="card">
      <div class="card-hdr"><span style="font-size:14px;font-weight:600">${esc(nameOf(r))}</span>
        <span class="badge b-atc">${esc(r.cls)} · ${esc(S.subject)}</span></div>

          <div class="stat-sub">${ms.total?ms.right+' / '+ms.total+' 题':'未填'}</div></div>
        <div class="stat-card"><div class="stat-n" style="font-size:15px">${mi?esc(mi.lab):'—'}</div>
          <div class="stat-l">主问题 · 老师端参考</div><div class="stat-sub">${mi?mi.n+' 题':''}</div></div>
        <div class="stat-card"><div class="stat-n" style="font-size:15px">${fo?fo.lab:'—'}</div>
          <div class="stat-l">FIX 结果</div></div>
        <div class="stat-card"><div class="stat-n" style="font-size:15px">${p.tp?esc(p.tp):'—'}</div>
          <div class="stat-l">掌握程度 TP</div>
          <div class="stat-sub">${p.tp?esc((TPS.find(t=>t.v===p.tp)||{}).zh||''):''}</div></div>
        <div class="stat-card"><div class="stat-n">${obs.length}</div>
          <div class="stat-l">现场观察</div><div class="stat-sub">个 bahagian</div></div>
      </div>
      ${(()=>{ /* 🔴 v10 报告还在读已 deprecated 的 paper_analysis.essay_*，
                    但 v10 的输入端已经改写 evalgo_essay_result（S.es）——
                    老师填了两篇作文，报告却看不到。改读真来源，逐篇列出。 */
        const es=esForRec(p); if(!es.length) return '';
        return `<div style="margin-bottom:8px"><span class="form-label" style="display:inline">写作：</span>`
          + es.map(e=>`<span class="chip chip-muted">${esc(e.sec_code)} ${e.score!=null?e.score:'—'} / ${e.max||'?'}</span>`
            + (e.star?'<span class="chip chip-ok">★</span>':'')
            + (e.weak||[]).map(id=>`<span class="chip chip-warn">${esc((ESSAY_ASPECTS.find(a=>a.id===id)||{}).zh||id)}</span>`).join('')
            ).join(' ') + `</div>`;
      })()}
      ${(p.strong_topics||[]).length?`<div style="margin-bottom:8px">
        <span class="form-label" style="display:inline">✅ 强项：</span>
        ${(p.strong_topics||[]).map(t=>`<span class="chip chip-ok">${esc(t)} 全对</span>`).join('')}</div>`:''}
      ${obs.length?`<div style="margin-bottom:8px"><span class="form-label" style="display:inline">作答过程：</span>
        ${DIMS.map(d=>{const v=obs.map(o=>o[d.id]).filter(Boolean); if(!v.length)return'';
          const bad=v.filter(x=>x==='N'||x==='H').length, mid=v.filter(x=>x==='S'||x==='R').length;
          return `<span class="chip ${bad?'chip-danger':(mid?'chip-warn':'chip-ok')}">${d.zh}</span>`;}).join('')}</div>`:''}
      ${(()=>{
        /* 🔴 P0-6：报告以前只读 weak / fix_outcome / next，漏掉老师亲手填的 DID
           （done_options / done_note）—— 於是「我们做了什么」整段消失，
           报告变成「发现问题 → 下一步」，中间那一节不见了。
           Guardrail：没有 DID evidence 就整节不出现，绝不替老师声称她做过什么。 */
        const wkA=(p.weak_options||[]);                 /* AUTO   系统从错题推导 */
        const wkM=(p.weak_manual||[]).map(optText).filter(Boolean); /* MANUAL 老师手填 */
        const did=(p.done_options||[]); const didN=(p.done_note||'').trim();
        const nxo=(p.next_options||[]); const nxN=(p.next_note||'').trim();
        const fo2=FIXOUT.find(f=>f.v===p.fix_outcome);
        const row=(lab,inner)=>inner?`<div style="display:flex;gap:8px;padding:5px 0;
            border-top:1px solid var(--bdr)"><div style="min-width:104px;color:var(--mut);
            font-size:11.5px;padding-top:2px">${lab}</div><div style="flex:1">${inner}</div></div>`:'';
        const found = [
          wkA.length?`<span class="form-label" style="display:inline;font-size:10px">系统推导</span> `
            +wkA.map(t=>`<span class="chip chip-warn">${esc(t)}</span>`).join(''):'',
          wkM.length?`<span class="form-label" style="display:inline;font-size:10px">老师补充</span> `
            +wkM.map(t=>`<span class="chip chip-layer">${esc(t)}</span>`).join(''):'',
          p.weak_note?`<div style="font-size:12px;color:var(--mut);margin-top:3px">${esc(p.weak_note)}</div>`:''
        ].filter(Boolean).join(' ');
        const didHtml = (did.length||didN)
          ? did.map(t=>`<span class="chip chip-ok">${esc(t)}</span>`).join('')
            +(didN?`<div style="font-size:12px;color:var(--mut);margin-top:3px">${esc(didN)}</div>`:'')
          : '';
        const resHtml = fo2 ? `<span class="chip ${fo2.chip}">${esc(fo2.lab)}</span>`
            +(p.fix_target?` <span class="chip chip-muted">针对：${esc(p.fix_target)}</span>`:'') : '';
        const nextHtml = (nxo.length||nxN)
          ? nxo.map(t=>`<span class="chip chip-layer">${esc(t)}</span>`).join('')
            +(nxN?`<div style="font-size:12px;color:var(--mut);margin-top:3px">${esc(nxN)}</div>`:'')
          : '';
        const body = row('WE FOUND<br>发现什么',found) + row('WE DID<br>我们做了',didHtml)
                   + row('现在怎样<br>RESULT',resHtml) + row('NEXT<br>下一步',nextHtml);
        if(!body) return '';
        return `<div style="margin-top:8px;border:1px solid var(--bdr);border-radius:8px;padding:8px 10px">
          ${body}${(!didHtml&&(resHtml||nextHtml))?`<div class="tip" style="margin:6px 0 0">
            老师没有填「我已经做了什么」—— 报告不会替她声称做过任何补救。</div>`:''}</div>`;
      })()}
    </div>`;
  });
  h+=`<div class="tip">「主问题」目前只在老师端显示 —— 给家长看的措辞尚未定案，不会印进家长报告。</div>`;
  el.innerHTML=h;
}

function dl(name,text,type){
  const b=new Blob([text],{type:type||'application/json;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},400);
}
function exportData(){

        (r.weak_options||[]).join(' '),
        (r.weak_manual||[]).map(optText).filter(Boolean).join(' '),

        r.reflect_was_wrong||'',r.reflect_now_know||'',
        r.parent_support||'',r.client_uid,r.synced?'Y':'N']).map(csvCell).join(','));});
  const L3=[['form','exam','teacher','subject','class','year','student_id','student','q_no','mark_code',
    'cl_subtype','topic','answer_format','diagnosis','client_uid','synced'].map(csvCell).join(',')];
