  if(subjQ.length) inner+=sub('理解文 · 老师诊断','写一句就好，这是报告里最有用的一段',
    subjQ.map(w=>`<div class="form-row" style="margin-bottom:6px">
      <label class="form-label">第 ${w.q} 题 · ${esc(markLab(w.code))}${w.topic?' · '+esc(w.topic):''}</label>
      <input type="text" value="${esc(w.diag||'')}" placeholder="例：抄了不相干的句子 / 只答了一半"
        oninput="wiDiag('${sid}',${w.q},this.value)"></div>`).join(''));

  inner+=sub('这份卷他弱在哪','这份考卷登记的考点',
    (kw.length?`<div class="chips-row">${kw.map(t=>`<button class="chip ${selW.indexOf(t)>=0?'sel':'chip-warn'}"
        onclick="f2TogL(this,'${sid}','weak_manual')" data-v="${esc(t)}">${esc(t)}</button>`).join('')}</div>`
      :`<div class="tip" style="margin:0 0 4px">这份考卷的项目还没填「文法 / 主题」，直接写在下面就行。</div>`)
    +`<textarea rows="2" style="margin-top:6px" placeholder="其他（可留空）"
       oninput="f2Field('${sid}','weak_note',this.value)">${esc(rec.weak_note||'')}</textarea>`);

  inner+=sub('我已经做了什么','已经发生的事实',
    `<div class="chips-row" id="chipsDone">${ACTIONS.map(a=>`<button class="chip ${selD.indexOf(a)>=0?'sel':'chip-layer'}"
       data-v="${esc(a)}" onclick="f2TogL(this,'${sid}','done_options')">${esc(a)}</button>`).join('')}</div>
     <textarea rows="2" style="margin-top:6px" placeholder="其他已经做的（可留空）"
       oninput="f2Field('${sid}','done_note',this.value)">${esc(rec.done_note||'')}</textarea>`);

  inner+=sub('学生现在怎样','讲解 + 订正后，让他再做一题同类型的',
    `<div class="chips-row" id="chipsFix">${FIXOUT.map(f=>`<button class="chip ${rec.fix_outcome===f.v?'sel':f.chip}"
       data-v="${f.v}" onclick="f2FixL(this,'${sid}','${f.v}')">${f.lab}</button>`).join('')}
     ${rec.fix_outcome?`<button class="chip chip-muted" onclick="f2FixL(null,'${sid}',null)">✕ 清除</button>`:''}</div>
     <div id="fixTgt" style="margin-top:8px;${rec.fix_outcome?'':'display:none'}">
       <label class="form-label">针对哪一项？<span style="font-weight:400">留空 = 整份卷</span></label>
       <input type="text" placeholder="例：进位加法" value="${esc(rec.fix_target||'')}"
         oninput="f2Field('${sid}','fix_target',this.value)"></div>`);

  inner+=sub('还需要继续做什么','计划',
    `<div class="chips-row" id="chipsNext">${ACTIONS.map(a=>`<button class="chip ${selN.indexOf(a)>=0?'sel':'chip-layer'}"
       data-v="${esc(a)}" onclick="f2TogL(this,'${sid}','next_options')">${esc(a)}</button>`).join('')}</div>
     <textarea rows="2" style="margin-top:6px" placeholder="其他计划（可留空）"
       oninput="f2Field('${sid}','next_note',this.value)">${esc(rec.next_note||'')}</textarea>`);

  inner+=sub('学生自己讲的话','用他的原话',
    `<div class="form-grid-2">
      <div class="form-row"><label class="form-label">「刚才我会错 ___」</label>
        <textarea rows="2" placeholder="例：我把 3 看成 8"
          oninput="f2Field('${sid}','reflect_was_wrong',this.value)">${esc(rec.reflect_was_wrong||'')}</textarea></div>
      <div class="form-row"><label class="form-label">「现在我知道要 ___」</label>
        <textarea rows="2" placeholder="例：我要先把数字圈起来才算"
          oninput="f2Field('${sid}','reflect_now_know',this.value)">${esc(rec.reflect_now_know||'')}</textarea></div>
    </div>`);

  inner+=sub('考前家长可以配合','',
    `<textarea rows="2" placeholder="例：考前两天让他早点睡，不需要额外加练习。"
       oninput="f2Field('${sid}','parent_support',this.value)">${esc(rec.parent_support||'')}</textarea>`);

  el.innerHTML=`<div class="fold${open?' open':''}" id="f2fold">
    <div class="fold-hd" onclick="tglOpt()">其他
      <span class="sub">全部选填 · 填了会进家长报告</span>
      <span class="car" id="optCaret">${open?'▾':'▸'}</span></div>
    <div class="fold-bd">${inner}</div></div>`;
  paintFoot(sid);
}
function tglOpt(){
  S.ui.optOpen=!S.ui.optOpen; saveData(true);
  const f=document.getElementById('f2fold'), c=document.getElementById('optCaret');
  if(f) f.className='fold'+(S.ui.optOpen?' open':'');
  if(c) c.textContent=S.ui.optOpen?'▾':'▸';
}
/* 底部永远告诉老师「还差什么」—— 防止填一半就走 */
function paintFoot(sid){
  const f=document.getElementById('f2foot'); if(!f) return;
  const miss=f2Missing(sid);
  f.innerHTML = miss.length
    ? `<span style="color:var(--warn);font-weight:700">还差 ${miss.length} 项：</span>
       <span style="color:var(--warn)">${miss.join(' · ')}</span>`
    : `<span style="color:var(--ok);font-weight:700">✓ 都填好了，可以按完成</span>`;
  /* v42：按钮不再写「完成（还差 2 项）」—— 那句话自己打自己嘴巴。
     还差什麽只在左边文字讲一次。 */
}
function f2Finish(sid,goNext){
  const r=f2Draft(sid);
  /* 🔴 P0-1 Evidence Truth：v19 以前这里会自动补上
       r.paper_checked = true
     —— 老师只按了「完成这个学生」，系统却替她声称「整份考卷我都核对过了」。
     那是系统伪造老师的 attestation。已删除。
     paper_checked 只能由 f2Checked() 里老师亲手那一下产生。 */
  const miss=f2Missing(sid);
  if(miss.length){
    if(saveData(true)===false){ alert(saveFailMsg()); return; }
    paintLive(sid); paintFoot(sid);
    toast('还差：'+miss.join(' · '),4000);
    const mb=document.querySelector('#f2must .must')||document.getElementById('chipsTP');
    if(mb) mb.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  if(saveData(true)===false){ alert(saveFailMsg()); return; }
  const nm=nameOf(stuOf(sid));
  if(goNext){
    const nx=navTodo(sid,'f2');
    if(nx && nx!==sid){ renderF2(); toast('✓ '+nm+' 完成'); autoPush(); f2Open(nx); return; }
  }
  closeModal(); renderF2(); toast('✓ '+nm+' 完成');
  autoPush(); classDoneCheck();
}
/* 整班都完成 → 主动问要不要换下一班（老师教多班多年段） */
function classDoneCheck(){
  const list=inCls(S.cls); if(!list.length) return;
  const done=list.filter(r=>f2State(S.f2[f2Key(r.sid)])==='done').length;
  if(done!==list.length) return;
  openModal('这个班完成了 🎉',
    `<div class="alert alert-ok"><div><b>${esc(S.cls)} · ${esc(S.subject)}</b> —— ${done} / ${list.length} 位学生全部完成。</div></div>
     <div class="tip">资料已经自己送上去了，你不用做任何上传动作。接下来要输入哪一班？</div>
     <div class="form-grid-2" style="margin-top:10px">
       <div class="form-row"><label class="form-label">班级</label>
         <div class="dept-row">${CLASSES.map(c=>`<span class="dept-tag${c===S.cls?' on':''}"
           onclick="pickClass('${c}');closeModal();goPage('f2')">${c}</span>`).join('')}</div></div>
       <div class="form-row"><label class="form-label">科目</label>
         <div class="dept-row">${SUBJECTS.map(x=>`<span class="dept-tag${x===S.subject?' on':''}"
           onclick="pickSubject('${x}');closeModal();goPage('f2')">${esc(x)}</span>`).join('')}</div></div>
     </div>`,
    `<button class="btn" onclick="closeModal()">留在这一班</button>
     <button class="btn btn-pri" onclick="closeModal();goPage('home')">← 回工作台</button>`);
}

/* ══ 局部更新的 chips —— 不重建 modal，滚动位置不跳 ══ */
function f2TogL(btn,sid,field){
  const r=f2Draft(sid), v=btn.getAttribute('data-v');
  const a=r[field]||(r[field]=[]);
  const i=a.indexOf(v); if(i>=0)a.splice(i,1); else a.push(v);
  btn.classList.toggle('sel'); btn.classList.toggle('chip-layer');
  r.synced=false; stampF2(r,sid); saveData();
}
function f2FixL(btn,sid,v){
  const r=f2Draft(sid);
  r.fix_outcome = (v===null||r.fix_outcome===v)?null:v;
  r.synced=false; stampF2(r,sid); saveData(); paintTail(sid);
}
/* NEXT 预设折叠。只有「还需要练习 / 需要更多帮助」才自动展开 ——
   已经改善的学生不需要再问计划，多一个问题就是多一次犹豫。 */
function needsNext(r){ return r.fix_outcome==='NEEDS_PRACTICE'||r.fix_outcome==='NEED_HELP'; }
/* v42：NEXT / 补充资料 的两层小折叠拿掉了（折叠里再折叠，老师更找不到），
   现在只有一个【其他】折叠，见 tglOpt()。这两支留成空壳 ——
   旧的 localStorage 里还存著 ui.extraOpen，而 needsNext() 仍被别处引用。 */
function tglNext(){}
function tglExtra(){}
function f2TPL(btn,sid,v){
  const r=f2Draft(sid);
  r.tp = (v===null||r.tp===v)?null:v;
  r.synced=false; stampF2(r,sid); saveData(); paintLive(sid);
}
function f2Field(sid,field,v){
  const r=f2Draft(sid); r[field]=v; r.synced=false; stampF2(r,sid); saveData();
}
function f2Checked(sid){
  const r=f2Draft(sid);
  r.paper_checked = !r.paper_checked;
  r.paper_checked_at = r.paper_checked ? new Date().toISOString() : null;
  r.synced=false; stampF2(r,sid);
  if(saveData(true)===false){ alert(saveFailMsg()); return; }
  paintLive(sid); renderF2(); autoPush();
  toast(r.paper_checked?'✓ 没点的题算答对了':'已取消 — 没点的题回到「还没看」');
}
function esTog(sid,code,secId,asp){
  const sec=sections().find(x=>x.id===secId);
  const r=esStamp(sid,code,sec), a=r.weak||(r.weak=[]);
  const i=a.indexOf(asp); if(i>=0)a.splice(i,1); else a.push(asp);
  const btn=document.querySelector(`#esw_${secId} [data-asp="${asp}"]`);
  if(btn){ btn.classList.toggle('sel-w'); btn.classList.toggle('chip-warn'); }
  saveData();
}
function esStar(sid,code,secId){
  const sec=sections().find(x=>x.id===secId);
  const r=esStamp(sid,code,sec); r.star=!r.star;
  const btn=document.getElementById('ess_'+secId);
  if(btn) btn.className='chip '+(r.star?'sel':'chip-ok');
  saveData();
}
function esScore(sid,code,secId,v,mx){
  const sec=sections().find(x=>x.id===secId);
  const r=esStamp(sid,code,sec);
  r.score = v===''? null : Math.min(+mx,Math.max(0,parseFloat(v)||0));
  r.max=+mx; saveData();
}

/* ══ 覆蓋追踪 ══ */
/* ══════════════════════════════════════════════════════════════════
   v30 · 「进度」页（全团队）与「我的记录」页
   Owner 2026-09-15：
     - 「进度」放全团队进度，「管理」只放系统设定（管理页本次一行未动）
     - 老师的首页最下方什么都不显示 → 「我填过什么」搬到「我的记录」
     - 记录页按 entered_by 过滤，别人的看不见

   ⚠️ 为什么不用 cellStat() / cardStat()：
      那两支用的是不带卷号後缀的 key（`EXK|sid|科目`）。
      一格只有一份卷时正确，有两份就只看得到第一份。
      现在生产上每格刚好一份，所以它们今天没错；但进度页是给院长看「谁没做完」的，
      漏算一份卷就等於叫错人。这一页自己扫前缀，不把那个洞带进来。
      （cellStat / cardStat 本次不动 —— 改它们会动到首页与格内抬头，排 v31 一起修。）
   ══════════════════════════════════════════════════════════════════ */

/* 同一个学生同一科，跨所有卷的考卷分析纪录 */
function f2AllOf(sid,subj){
  const pre=EXK()+'|'+sid+'|'+subj;
  return Object.keys(S.f2||{})
    .filter(k=>k===pre||k.indexOf(pre+'|')===0)
    .map(k=>S.f2[k]).filter(Boolean);
}
/* 跨所有卷，这个学生这一科有没有填过考前观察 */
function f1AnyDone(sid,subj){
  const pre=EXK()+'|'+sid+'|'+subj+'|';
  return Object.keys(S.f1||{}).some(k=>k.indexOf(pre)===0 && S.f1[k] && S.f1[k].savedAt);
}
/* 一格（班级 × 科目）的进度。语意与 cellStat 逐字相同，只差「扫全部卷」。 */
/* ══════════════════════════════════════════════════════════════════
   v41 · Owner 2026-09-15 裁定的三条规矩（ATC3 数学 0 / 17 那件事）
     ① 分母永远是全班人数 —— 17 就是 17，每一位都要交代
     ② 分子永远是「有资料的人数」—— 考前观察、考卷分析同一把尺
     ③ 「完成」单独一行，不准塞进上面那两行
   ------------------------------------------------------------------
   旧版的病：同一句「N / M 位」，考前观察数「有资料」，考卷分析数「完成」。
   ATC3 数学 SQ 老师做了 14 位、逐题全点完，画面印 0 / 17 ——
   跟一位都没动的老师长得一模一样。全校被藏起来的是 3 格、16 位。
   ══════════════════════════════════════════════════════════════════ */
function pgStat(cls,subj){
  const list=inCls(cls);
  let obs=0, started=0, done=0, prog=0, resolved=0;
  list.forEach(r=>{
    const sts=f2AllOf(r.sid,subj).map(f2State);
    const st = sts.indexOf('done')>=0        ? 'done'
             : sts.indexOf('progress')>=0    ? 'progress'
             : sts.indexOf('absent')>=0      ? 'absent'
             : sts.indexOf('notassessed')>=0 ? 'notassessed' : 'none';
    /* 🔴 v41 洞 3：考前观察是**考前**做的，跟考试当天缺席是两件事。
       旧版在这里就 return，缺席的学生就算有考前观察也被画面吃掉。
       现在先数考前观察，再看考卷分析的状态。 */
    if(f1AnyDone(r.sid,subj)) obs++;
    /* 缺席 / 本轮未评：已处理，不再催 —— 但绝不等於有证据 */
    if(st==='absent'||st==='notassessed'){ resolved++; return; }
    /* 规矩②：考卷分析的分子 = 有资料的人数（done + progress），不是只有 done */
    if(st==='done'){ started++; done++; }
    else if(st==='progress'){ started++; prog++; }
  });
  const n=list.length, secs=secsCountFor(subj,yearOf(cls)), handled=done+resolved;
  return {n,obs,started,done,prog,resolved,handled,secs,
    /* Owner 2026-09-15：只登记了考卷项目、一个学生都没填，不算「进行中」。
       之前把 secs 也算进去，格子变黄 —— 管理层以为老师在做，其实只写了题型。 */
    state: (n&&handled===n) ? 'done'
         : (obs||done||prog||resolved) ? 'prog' : 'none'};
}
/* 全部证据扫一遍，算出每一格是谁填的。一次扫完 30 格，不要每格扫一次。 */
function pgWhoAll(){
  const ex=EXK(), out={};
  const bump=(cls,su,by)=>{ if(!by) return;
    const k=cls+'|'+su, c=out[k]||(out[k]={});
    c[by]=(c[by]||0)+1; };
  const feed=store=>{ Object.keys(store||{}).forEach(k=>{ const r=store[k];
    if(!r||r.exam!==ex||!r.sid||!r.subject) return;
    const st=stuOf(r.sid); if(!st) return;
    bump(st.cls,r.subject,r.by); }); };
  feed(S.f1); feed(S.f2); feed(S.wi); feed(S.es);
  /* 考卷项目没有班级，只有 (科目, 年段)。ATC1–6 与 Year 1–6 一对一，直接对回去。 */
  Object.keys(S.sections||{}).forEach(k=>{
    const p=k.split('|'); if(p.length<3||p[0]!==ex) return;
    const su=p[1], yr=+p[2];
    (S.sections[k]||[]).forEach(x=>{ if(!x||!x.by) return;
      CLASSES.forEach(c=>{ if(yearOf(c)===yr) bump(c,su,x.by); }); });
  });
  return out;
}
function pgWhoChips(map){

async function asgApply(cls,subj,want){
  if(!_sb||!CLOUD.exam){ toast('✕ 排任课要先连上云端，现在离线'); return; }
  const cur=asgTeachers(cls,subj);
  const add=want.filter(t=>cur.indexOf(t)<0);
  const del=cur.filter(t=>want.indexOf(t)<0);
  if(!add.length&&!del.length){ closeModal(true); toast('没有改动'); return; }
  let err='';
  try{
    for(const t of del){
      const r=await _sb.from('evalgo_teacher_assign').delete()
        .eq('exam_id',CLOUD.exam.id).eq('teacher_id',t)
        .eq('class_name',cls).eq('subject',subj);
      if(r.error) throw r.error;
      delete S.assign[asgKey(t,cls,subj)];
    }
    for(const t of add){
      const cu=uid();
      const r=await _sb.from('evalgo_teacher_assign')
        .upsert({exam_id:CLOUD.exam.id,teacher_id:t,class_name:cls,subject:subj,
                 created_by:S.me||null,client_uid:cu},{onConflict:'client_uid'})
        .select('id').single();
      if(r.error) throw r.error;
      S.assign[asgKey(t,cls,subj)]={client_uid:cu,exam:EXK(),teacher_id:t,
        teacher_name:teacherLabel(t),cls:cls,subject:subj,
        savedAt:new Date().toLocaleString('en-GB'),synced:true,cloud_id:r.data.id};
    }
  }catch(e){ err=(e&&e.message)?e.message:String(e); }
  saveData(true); closeModal(true);
  if(err){ toast('✕ 存不进云端：'+err, 6000); }
  else toast(`✓ ${cls} · ${subj} 负责老师已更新`);
  if(S._page==='progress') renderProgress();
  else if(S._page==='manage') renderManage();
  else if(S._page==='coverage') renderCoverage();
}

/* ══ 我的记录 ══
   Owner 2026-09-15：「记录」页按 entered_by 过滤，别的老师填的看不见。
   ⚠️ 诚实说清楚：这是**画面层**的过滤。三张证据表的 RLS 只看「有没有 EvalGo 权限码」，
      没有按老师分隔 —— 挡得住误看，挡不住刻意。要真分隔得改 RLS，那会动到 ObsGo，另案。 */
function myCells(){
  const ex=EXK(), me=S.me, out={};
  if(!me) return [];
  const cell=(cls,su)=>{ const k=cls+'|'+su;
    return out[k]||(out[k]={cls:cls,su:su,secs:0,f1:0,f2:0,wi:0,es:0}); };
  const feed=(store,fld,ok)=>{ Object.keys(store||{}).forEach(k=>{ const r=store[k];
    if(!r||r.exam!==ex||r.by!==me||!r.sid||!r.subject) return;
    if(ok&&!ok(r)) return;
    const st=stuOf(r.sid); if(!st) return;
    cell(st.cls,r.subject)[fld]++; }); };
  feed(S.f1,'f1',r=>!!r.savedAt);
  feed(S.f2,'f2',r=>f2Started(r)||f2State(r)!=='none');
  feed(S.wi,'wi',null);
  feed(S.es,'es',null);
  Object.keys(S.sections||{}).forEach(k=>{
    const p=k.split('|'); if(p.length<3||p[0]!==ex) return;
    const su=p[1], yr=+p[2];
    (S.sections[k]||[]).forEach(x=>{ if(!x||x.by!==me) return;
      CLASSES.forEach(c=>{ if(yearOf(c)===yr) cell(c,su).secs++; }); });
  });
  return Object.keys(out).map(k=>out[k])
    .sort((a,b)=> a.cls===b.cls ? (a.su<b.su?-1:1) : (a.cls<b.cls?-1:1));
}
/* 这一格里，【自己】填过的学生有几位（四种证据任一笔都算） */
function myDone(cls,subj){
  const ex=EXK(), me=S.me; if(!me) return 0;
  const set={};
  const feed=(store,ok)=>{ Object.keys(store||{}).forEach(k=>{ const r=store[k];
    if(!r||r.exam!==ex||r.by!==me||!r.sid||r.subject!==subj) return;
    if(ok&&!ok(r)) return;
    const st=stuOf(r.sid); if(!st||st.cls!==cls) return;
    set[r.sid]=1; }); };
  feed(S.f1,r=>!!r.savedAt); feed(S.f2,r=>f2Started(r)||f2State(r)!=='none');
  feed(S.wi,null); feed(S.es,null);
  return Object.keys(set).length;
}
/* ══════════════════════════════════════════════════════════════════
   v37 · 「这一格有哪些考卷」
   Owner 2026-09-15：同班同科可以有多份考卷，不管是不是同一个老师。

/* 卷的建立者。旧卷（LEGACY_SEED）没有建立者 → 回空字串。 */
function paperOwner(p){ return (p && p.created_by) || ''; }
/* 这份卷的考卷项目我能不能动。
   旧卷没有建立者 → 维持旧行为（谁都能动），不动现有资料。 */
function paperMine(p){ const o=paperOwner(p); return !o || o===S.me; }
function paperCur(){ return (S.papers||[]).find(p=>p.id===S.paperInstance)||null; }
/* 盖在卡片上的老师代号 */
function paperStamps(p){
  const o=paperOwner(p);
  if(o) return [o];
  const m=(CLOUD.paperTeachers||{})[p.id]||[];
  return m.slice().sort();
}
/* 这份卷底下有几个考卷项目 */
function paperSecCount(p){
  return ((S.sections||{})[EXK()+'|'+S.subject+'|'+yearOf(S.cls)+piSuf(p.id)]||[]).length;
}
/* 我在这份卷里填过几位学生 */
function paperMyDone(p){
  const ex=EXK(), me=S.me, suf='|'+p.id, set={};
  if(!me) return 0;
  const feed=(store,ok)=>{ Object.keys(store||{}).forEach(k=>{
    if(k.slice(-suf.length)!==suf) return;
    const r=store[k];
    if(!r||r.exam!==ex||r.by!==me||!r.sid||r.subject!==S.subject) return;
    if(ok&&!ok(r)) return;
    set[r.sid]=1; }); };
  feed(S.f1,r=>!!r.savedAt); feed(S.f2,r=>f2Started(r)||f2State(r)!=='none');
  feed(S.wi,null); feed(S.es,null);
  return Object.keys(set).length;
}
/* 这份卷有几位学生填过考前观察（Owner 2026-09-16 裁定「乙」：
   算这份卷【全部老师】的 —— 这是「这份卷做到哪里」，不是「别人填了什么内容」。
   藏起来只会害下一位老师整班重做。内容本身仍然只在「看内容」里，且只给自己的。 */
function paperObsDone(p){
  const ex=EXK(), suf='|'+p.id, set={};
  Object.keys(S.f1||{}).forEach(k=>{
    if(k.slice(-suf.length)!==suf) return;
    const r=S.f1[k];
    if(!r||r.exam!==ex||!r.savedAt||r.subject!==S.subject||!r.sid) return;
    set[r.sid]=1; });
  return inCls(S.cls).filter(x=>set[x.sid]).length;
}
/* v41 规矩②：这份卷有几位学生【有考卷分析资料】（done + progress）。
   旧版只数 done —— 卡片上跟矩阵犯同一个错，老师做了一半看起来像没做。 */
function paperF2Done(p){
  const ex=EXK(); let n=0;
  inCls(S.cls).forEach(x=>{
    const st=f2State(S.f2[ex+'|'+x.sid+'|'+S.subject+'|'+p.id]);
    if(st==='done'||st==='progress') n++; });
  return n;
}
/* v41 规矩③：完成是另一件事，单独数、单独印。 */
function paperF2Full(p){
  const ex=EXK(); let n=0;
  inCls(S.cls).forEach(x=>{
    if(f2State(S.f2[ex+'|'+x.sid+'|'+S.subject+'|'+p.id])==='done') n++; });
  return n;
}

/* 建立新考卷 —— 写三张表：卷本身、适用班级、负责老师。没有改结构。 */
async function newPaper(){
  if(!bpCanEdit()){ toast('✕ 这个帐号没有填写权限'); return; }
  if(!_sb||!CLOUD.exam||!CLOUD.session){ toast('✕ 要连上系统才能建立考卷',2600); return; }
  if(!(S.cls&&S.subject)){ toast('✕ 先选班级和科目'); return; }
  const n=(S.papers||[]).length+1;
  if(!confirm(`要在 ${S.cls} · ${S.subject} 建立「考卷 ${n}」吗？\n\n建立後你可以自己登记这份卷的考卷项目。`)) return;
  try{
    const cid=await classIdOf(S.cls);
    if(!cid){ toast('✕ 找不到这个班级'); return; }
    const cu=uid();
    const ins=await _sb.from('evalgo_paper_instance').insert({
      exam_id:CLOUD.exam.id, subject:S.subject, year_level:yearOf(S.cls),
      label:'考卷 '+n, display_no:n, sort_order:n, status:'active',
      created_by:S.me||null, client_uid:cu }).select('id').single();
    if(ins.error) throw ins.error;
    const pid=ins.data.id;
    const sc=await _sb.from('evalgo_paper_scope').insert({paper_instance_id:pid, class_id:cid});
    if(sc.error) throw sc.error;
    const pt=await _sb.from('evalgo_paper_teacher').insert({
      paper_instance_id:pid, class_id:cid, teacher_id:S.me,
      role:'main', assignment_source:'EXPLICIT', created_by:S.me||null});
    if(pt.error) throw pt.error;
    toast('✓ 已建立考卷 '+n, 2200);
    S._papersScope=null; S.paperInstance=pid; S._enterPage='bp';
    await loadPapers();
  }catch(e){
    const m=(e&&e.message)?e.message:String(e);
    console.warn('newPaper',m);
    alert('建立不成功。\n\n'+m);
  }
}

      const res =list.filter(r=>{

      list.forEach(r=>{

/* 拉完再重画。cloudPull 不会盖掉本机还没上传的资料（它自己有守门）。 */
function rptPull(){
  Promise.resolve(cloudPull(false)).then(()=>renderReport());
}
/* ══════════════════════════════════════════════════════════════════
   跨科报告资料层（v20）
   ------------------------------------------------------------------
   既有的 recStats / paperScore / reportRows 全部读 **当下选到的** S.subject，
   只算得出一科。一份报告要五科合并，所以这一层每个函式都**明写 (sid, subject)**，
   一个环境变数都不碰。不改旧函式 —— 老师端那几页仍照旧走。

   资料来源：S.f1 / S.f2 / S.wi / S.es / S.sections。
   cloudPull() 抓的是整场考试（`.eq('exam_id', …)`，没有科目筛选），
   所以拉一次就有全班全科；报告页按「重新拉资料」就是跑它。
   ══════════════════════════════════════════════════════════════════ */
/* ══ v43 · 报告印不出来的【第一根因】══════════════════════════════
   v26 起本机 key 一律带卷号後缀（见 piSuffix）。但报告层这几支
   自始至终用**不带後缀**的 key 去读：
     S.f2[EXK()+'|'+sid+'|'+su]        ← 多卷上线後永远 undefined
   → rpF2 回 null → rpReady 永远 false → **整份报告空白**。
   这比「算不出分数」更前面：不是分数算错，是资料根本没读到。
   ⚠️ 不可以改成「扫整格跨卷加总」—— 两份卷的项目加起来会把题数灌水
      （secsCountFor 的警告就是这一条）。要选**这位学生的资料在哪一份卷**。 */
function rpPaper(sid,su){
  const pre=EXK()+'|'+sid+'|'+su;
  let best=null;
  Object.keys(S.f2||{}).forEach(k=>{
    if(k!==pre && k.indexOf(pre+'|')!==0) return;
    const r=S.f2[k]; if(!r) return;
    const pid=(k===pre)?'':k.slice(pre.length+1);
    /* 优先选进得了报告的那一份；否则拿有资料的那一份 */
    const sc=(aStat(r)==='ASSESSED'&&r.paper_checked&&r.tp)?2:(f2Started(r)?1:0);
    if(!best||sc>best.sc) best={pid,rec:r,sc};
  });
  return best;
}
function rpPid(sid,su){ const b=rpPaper(sid,su); return b?b.pid:''; }
function rpF2(sid,su){ const b=rpPaper(sid,su); return b?b.rec:null; }
function rpObs(sid,su){ return f1Complete(sid,su); }
function rpWI(sid,su,pid){
  if(pid===undefined) pid=rpPid(sid,su);
  const pre=EXK()+'|'+sid+'|'+su+'|', suf=pid?('|'+pid):'';
  return Object.keys(S.wi).filter(k=>{
    if(k.indexOf(pre)!==0) return false;
    const rest=k.slice(pre.length);
    return pid ? (rest.slice(-suf.length)===suf) : (rest.indexOf('|')<0);
  }).map(k=>S.wi[k]);
}
function rpES(sid,su,code,pid){
  if(pid===undefined) pid=rpPid(sid,su);
  return S.es[EXK()+'|'+sid+'|'+su+'|'+code+(pid?'|'+pid:'')]||null;
}
function rpSecs(su,yr,pid){
  return (S.sections[EXK()+'|'+su+'|'+yr+(pid?'|'+pid:'')]||[]).slice()
         .sort((a,b)=>(+a.sort||0)-(+b.sort||0));
}
/* 进报告的门槛与单科版一致：已评量 + 老师亲自核对整份 + 有掌握程度 TP。
   ⛔ ABSENT / NOT_ASSESSED 永远不进报告，也**不当成弱项**。 */
function rpReady(sid,su){
  const r=rpF2(sid,su);
  return !!(r && aStat(r)==='ASSESSED' && r.paper_checked && r.tp);
}
/* v43：分母改数「格数」，跟老师画面上点的格子一致。
   6a / 6b / 6c 是三格，旧版只算一题 —— 分母比画面少，答对率会虚高。 */
function rpTotalQ(su,yr,pid){
  return rpSecs(su,yr,pid)
    .filter(x=>QTYPES.indexOf(x.type||'MCQ')>=0 && +x.qf>=1 && +x.qt>=+x.qf)
    .reduce((a,x)=>a+qUnits(x).length,0);
}
function rpStats(sid,su,yr){
  const pid=rpPid(sid,su);
  const c={star:0,dk:0,cl:0,nr:0,sos:0,blank:0};
  rpWI(sid,su,pid).forEach(w=>{ if(c[w.code]!=null) c[w.code]++; });
  /* 裁决 3：漏答扣分跟做错一样，但**分开数**，报告要分开讲 ——
     「不会做」补概念，「没时间写完」练速度，两件事。 */
  const missed=c.blank;
  const wrong=c.dk+c.cl+c.nr+c.sos;
  const bad=wrong+missed;
  const total=rpTotalQ(su,yr,pid)||0;
  const p=rpF2(sid,su); const checked=!!(p&&p.paper_checked);
  const right=checked?Math.max(0,total-bad):null;
  return Object.assign(c,{wrong,missed,bad,total,right,checked,pid,
    rate:(checked&&total)?Math.round(right/total*100):null});
}
/* 得分：与 paperScore 同一套规矩 —— 只有声明「每题同分」的项目才算得出，
   写作用老师亲填的实得分。算不满整份就标 *，绝不外推。 */
function rpScore(sid,su,yr){
  if(!rpReady(sid,su)) return null;
  const pid=rpPid(sid,su);
  const wi=rpWI(sid,su,pid), secs=rpSecs(su,yr,pid);
  let got=0,max=0,covered=0; const missing=[];
  secs.forEach(sec=>{
    if((sec.type||'MCQ')==='ESSAY'){
      const er=rpES(sid,su,sec.code,pid);
      if(er && er.score!=null && er.score!=='' && +sec.max>0){
        got+=+er.score; max+=+sec.max; covered++;
      } else missing.push(sec.code+'（写作未填分）');
      return;
    }
    /* v43：跟老师端走同一支核心（含 q_marks：6b 错扣 2 分） */
    const r2=secScoreOf(sec, wi.filter(w=>+w.q>=+sec.qf && +w.q<=+sec.qt));
    if(!r2){ missing.push(sec.code+(sec.even==='N'?'（每题不同分，未填 q_marks）':'（未声明每题几分）')); return; }
    got+=r2.got; max+=r2.max; covered++;
  });
  if(!covered) return {got:null,max:0,covered:0,total:secs.length,missing};
  return {got:Math.round(got*10)/10,max:Math.round(max*10)/10,
          covered,total:secs.length,missing};
}
/* 一位学生的五科总览。没资料的科目回 state，不留空白也不编造。 */
function rpStudent(sid,yr){
  return SUBJECTS.map(su=>{
    const p=rpF2(sid,su);
    const st=f2State(p);
    return {su, p, st, ready:rpReady(sid,su), obs:rpObs(sid,su),
            stats:rpStats(sid,su,yr), score:rpScore(sid,su,yr)};
  });
}
/* 七维度 → 家长看得懂的话。只列老师**真的填过**的，没填的不出现。 */
function rpDimWords(obs){
  const agg={};
  obs.forEach(o=>DIMS.forEach(d=>{ const v=o[d.id]; if(v) (agg[d.id]=agg[d.id]||[]).push(v); }));
  const out=[];
  DIMS.forEach(d=>{
    const vs=agg[d.id]; if(!vs||!vs.length) return;
    const tally={}; vs.forEach(v=>tally[v]=(tally[v]||0)+1);
    const top=Object.keys(tally).sort((a,b)=>tally[b]-tally[a])[0];
    /* IRH 的 t 是「独立 Independent」这种中英并列 —— 那是给老师端看的。
       家长版只给中文，且不重复维度名（维度已经叫「独立」了）。 */
    const PW={Y:'做得到',S:'不稳定',N:'做不到',I:'能独立完成',R:'需要提醒',H:'需要帮助'};
    const opt=(d.scale==='IRH'?IRH:YSN).find(x=>x.v===top);
    out.push({zh:d.zh, word:PW[top]||(opt?opt.t:top)});
  });
  return out;
}
function reportRows(){
  const cl=(document.getElementById('rptCls')||{}).value||S.cls;
  const q=((document.getElementById('rptSearch')||{}).value||'').toLowerCase();
  /* 🔴 P0-2：旧版 gate 是「f2 不是 none 或有观察」——
     那会让「填一半」「缺席」「本轮未评」全部漏进报告。
     报告只认 reportReady()：ASSESSED + 老师亲自核对整份 + TP。 */
  return inCls(cl).filter(r=>!q||(r.en+' '+(r.cn||'')).toLowerCase().includes(q)).map(r=>{
    const p=S.f2[f2Key(r.sid)]||{};
    const obs=f1Complete(r.sid);
    return {r,p,obs};
  }).filter(x=>reportReady(x.r.sid));
}
/* 被挡在报告外的人 —— 必须看得见，否则管理层以为「就这几个」 */
/* 出报告之前先看这张：哪一科、几位学生达到门槛。

function reportHeld(){
  const cl=(document.getElementById('rptCls')||{}).value||S.cls;
  const out={absent:[],na:[],half:[],none:[]};
  inCls(cl).forEach(r=>{

    else if(st==='notassessed') out.na.push(r);
    else if(st==='progress'||st==='done'||f1Complete(r.sid).length) out.half.push(r);
    else out.none.push(r);
  });

}

      </div>
      ${(()=>{ /* 🔴 v10 报告还在读已 deprecated 的 paper_analysis.essay_*，
                    但 v10 的输入端已经改写 evalgo_essay_result（S.es）——
                    老师填了两篇作文，报告却看不到。改读真来源，逐篇列出。 */
        const es=esForRec(p); if(!es.length) return '';
        return `<div style="margin-bottom:8px"><span class="form-label" style="display:inline">写作：</span>`
          + es.map(e=>`<span class="chip chip-muted">${esc(e.sec_code)} ${e.score!=null?e.score:'—'} / ${e.max||'?'}</span>`
            + (e.star?'<span class="chip chip-ok">★</span>':'')
            + (e.weak||[]).map(id=>`<span class="chip chip-warn">${esc((ESSAY_ASPECTS.find(a=>a.id===id)||{}).zh||id)}</span>`).join('')
            ).join(' ') + `</div>`;
      })()}
      ${(p.strong_topics||[]).length?`<div style="margin-bottom:8px">
        <span class="form-label" style="display:inline">✅ 强项：</span>
        ${(p.strong_topics||[]).map(t=>`<span class="chip chip-ok">${esc(t)} 全对</span>`).join('')}</div>`:''}
      ${obs.length?`<div style="margin-bottom:8px"><span class="form-label" style="display:inline">作答过程：</span>
        ${DIMS.map(d=>{const v=obs.map(o=>o[d.id]).filter(Boolean); if(!v.length)return'';
          const bad=v.filter(x=>x==='N'||x==='H').length, mid=v.filter(x=>x==='S'||x==='R').length;
          return `<span class="chip ${bad?'chip-danger':(mid?'chip-warn':'chip-ok')}">${d.zh}</span>`;}).join('')}</div>`:''}
      ${scoreLine(r.sid)}
      ${(()=>{
        /* 🔴 P0-6：报告以前只读 weak / fix_outcome / next，漏掉老师亲手填的 DID
           （done_options / done_note）—— 於是「我们做了什么」整段消失，
           报告变成「发现问题 → 下一步」，中间那一节不见了。
           Guardrail：没有 DID evidence 就整节不出现，绝不替老师声称她做过什么。 */
        const wkA=(p.weak_options||[]);                 /* AUTO   系统从错题推导 */
        const wkM=(p.weak_manual||[]).map(optText).filter(Boolean); /* MANUAL 老师手填 */
        const did=(p.done_options||[]); const didN=(p.done_note||'').trim();
        const nxo=(p.next_options||[]); const nxN=(p.next_note||'').trim();
        const fo2=FIXOUT.find(f=>f.v===p.fix_outcome);
        const row=(lab,inner)=>inner?`<div style="display:flex;gap:8px;padding:5px 0;
            border-top:1px solid var(--bdr)"><div style="min-width:104px;color:var(--mut);
            font-size:11.5px;padding-top:2px">${lab}</div><div style="flex:1">${inner}</div></div>`:'';
        const found = [
          wkA.length?`<span class="form-label" style="display:inline;font-size:10px">系统推导</span> `
            +wkA.map(t=>`<span class="chip chip-warn">${esc(t)}</span>`).join(''):'',
          wkM.length?`<span class="form-label" style="display:inline;font-size:10px">老师补充</span> `
            +wkM.map(t=>`<span class="chip chip-layer">${esc(t)}</span>`).join(''):'',
          p.weak_note?`<div style="font-size:12px;color:var(--mut);margin-top:3px">${esc(p.weak_note)}</div>`:''
        ].filter(Boolean).join(' ');
        const didHtml = (did.length||didN)
          ? did.map(t=>`<span class="chip chip-ok">${esc(t)}</span>`).join('')
            +(didN?`<div style="font-size:12px;color:var(--mut);margin-top:3px">${esc(didN)}</div>`:'')
          : '';
        const resHtml = fo2 ? `<span class="chip ${fo2.chip}">${esc(fo2.lab)}</span>`
            +(p.fix_target?` <span class="chip chip-muted">针对：${esc(p.fix_target)}</span>`:'') : '';
        const nextHtml = (nxo.length||nxN)
          ? nxo.map(t=>`<span class="chip chip-layer">${esc(t)}</span>`).join('')
            +(nxN?`<div style="font-size:12px;color:var(--mut);margin-top:3px">${esc(nxN)}</div>`:'')
          : '';
        const body = row('WE FOUND<br>发现什么',found) + row('WE DID<br>我们做了',didHtml)
                   + row('现在怎样<br>RESULT',resHtml) + row('NEXT<br>下一步',nextHtml);
        if(!body) return '';
        return `<div style="margin-top:8px;border:1px solid var(--bdr);border-radius:8px;padding:8px 10px">
          ${body}${(!didHtml&&(resHtml||nextHtml))?`<div class="tip" style="margin:6px 0 0">
            老师没有填「我已经做了什么」—— 报告不会替她声称做过任何补救。</div>`:''}</div>`;
      })()}
    </div>`;
  });
  h+=`<div class="tip">「主问题」目前只在老师端显示 —— 给家长看的措辞尚未定案，不会印进家长报告。</div>`;
  el.innerHTML=h;
}
/* ══════════════════════════════════════════════════════════════════
   A · 家长版 —— 每生一页 A4
   ⛔ 绝不出现：分数、答对率、题数、错题计数、排名、其他学生。
      Owner 2026-09-08 拍板 D：「家长不看分数，但是内部需要看分数。」
      掌握程度只印中文（「达到水准」），不印 TP3 这种代号 —— 那是给内部的。
   ══════════════════════════════════════════════════════════════════ */
function printParent(){
  const cl=(document.getElementById('rptCls')||{}).value||S.cls;
  const list=inCls(cl);
  if(!list.length){ toast('✕ 这个班没有学生'); return; }
  const pages=[]; let skipped=0;
  list.forEach(r=>{
    const subs=rpStudent(r.sid, r.year).filter(x=>x.ready);
    if(!subs.length){ skipped++; return; }
    let body='';
    subs.forEach(x=>{
      const tp=(TPS.find(t=>t.v===x.p.tp)||{}).zh||'';
      const dims=rpDimWords(x.obs);
      /* 弱项：系统推导 + 老师手填，两个来源分开保留（provenance 不压扁），
         但对家长只印标签本身，不印是谁判的。 */
      const weak=[].concat(x.p.weak_options||[])
                   .concat((x.p.weak_manual||[]).map(optText).filter(Boolean));
      const wnote=(x.p.weak_note||'').trim();
      /* 🔴 家长版**不得**放 next_options —— 那一栏是「老师的行动」
         （个别辅导 / 额外练习题 / 调整教学方式…），家长做不到「个别辅导」。
         把它写进「在家可以这样配合」= 把两种不同主体的行动压成一种，
         违反 Evidence semantics。家长栏只用 parent_support（本来就是为家长设的）
         与老师亲手写的 next_note。两栏都空就整行不出现，不硬凑。 */
      const care=[(x.p.parent_support||'').trim(),
                  (x.p.next_note||'').trim()].filter(Boolean).join('；');
      body+='<div class="sub">'
        +'<div class="sub-h">'+esc(x.su)+(tp?'<span class="tp">'+esc(tp)+'</span>':'')+'</div>'
        +(dims.length?'<div class="row"><span class="lb">考试时的表现</span><span class="vl">'
            +dims.map(d=>esc(d.zh)+'：'+esc(d.word)).join('　·　')+'</span></div>':'')
        +(weak.length?'<div class="row"><span class="lb">这次要加强</span><span class="vl">'
            +weak.map(esc).join('、')+'</span></div>':'')
        +(wnote?'<div class="row"><span class="lb">老师的话</span><span class="vl">'+esc(wnote)+'</span></div>':'')
        +(care?'<div class="row"><span class="lb">在家可以这样配合</span><span class="vl">'+esc(care)+'</span></div>':'')
        +'</div>';
    });
    const miss=SUBJECTS.filter(su=>!subs.some(x=>x.su===su));
    if(miss.length) body+='<div class="note">'+esc(miss.join('、'))
      +'：这一轮还没有完成的评量记录，所以本报告不列。</div>';
    pages.push('<section class="pg">'
      +'<div class="hd"><div class="t1">ATC 部 · 考前学习报告</div>'
      +'<div class="t2">'+esc(S.examLabel||'')+(S.examTerm?' · '+esc(termLabel(S.examTerm)):'')+'</div></div>'
      +'<div class="who"><b>'+esc(nameOf(r))+'</b><span>'+esc(r.cls)+'</span><span>'+today()+'</span></div>'
      +body
      +'<div class="ft"><div>科任签名<div class="ln"></div></div>'
      +'<div>主任审阅<div class="ln"></div></div>'
      +'<div>家长签收<div class="ln"></div></div></div>'
      +'</section>');
  });
  if(!pages.length){ alert('✕ 这个班还没有任何学生达到报告门槛。\n\n'
    +'门槛 = 已评量 + 老师亲自核对整份卷 + 已选掌握程度 TP。'); return; }
  rpOpen('家长版 · '+cl, PARENT_CSS, pages.join(''),
    skipped?('共 '+pages.length+' 位；'+skipped+' 位尚未达门槛，未列印。'):'');
}

/* ══════════════════════════════════════════════════════════════════
   B · 内部版 —— 每班一份，五科各一张表，**有分数**
   给主管 / 老师，不给家长。每一科都印「未列入」名单，缺席与未评分开列。
   ══════════════════════════════════════════════════════════════════ */
function printInternal(){
  const cl=(document.getElementById('rptCls')||{}).value||S.cls;
  const list=inCls(cl);
  if(!list.length){ toast('✕ 这个班没有学生'); return; }
  let body='<div class="hd"><div class="t1">ATC 部 · 考前报告（内部版）</div>'
    +'<div class="t2">'+esc(cl)+' · '+esc(S.examLabel||'')
    +(S.examTerm?' · '+esc(termLabel(S.examTerm)):'')+' · '+today()+'</div></div>';
  SUBJECTS.forEach((su,si)=>{
    const rows=list.filter(r=>rpReady(r.sid,su));
    const held={absent:[],na:[],half:[],none:[]};
    list.forEach(r=>{
      if(rpReady(r.sid,su)) return;
      const st=f2State(rpF2(r.sid,su));
      if(st==='absent') held.absent.push(r);
      else if(st==='notassessed') held.na.push(r);
      else if(st==='progress'||st==='done'||rpObs(r.sid,su).length) held.half.push(r);
      else held.none.push(r);
    });
    body+='<section class="sec'+(si?' brk':'')+'"><h2>'+esc(su)+'</h2>';
    if(!rows.length){ body+='<div class="empty">本科尚无学生达到报告门槛</div>'; }
    else{
      /* v43 · 双指标：答对率（每题等重）与得分率（照每题分数加权）不是同一件事，
         两个都印，老师才看得出「错的是不是重分的题」。
         漏答独立一栏 —— Owner 裁决 3：扣分跟做错一样，但报告分开讲。
         ⚠️ 家长版一个字都没动（2026-09-08 拍板 D 维持）。 */
      body+='<table><thead><tr><th>#</th><th>学生</th><th>得分</th><th>得分率</th><th>答对率</th>'
        +'<th>做错</th><th>漏答</th>'
        +'<th>TP</th><th>主问题</th><th>较弱（系统）</th>'
        +'<th>较弱（老师）</th><th>下一步</th></tr></thead><tbody>';
      rows.forEach((r,i)=>{
        const x=rpF2(r.sid,su), ms=rpStats(r.sid,su,r.year), ps=rpScore(r.sid,su,r.year);
        const mi=mainIssue(ms);
        const sc=!ps?'—':(ps.got==null?'算不出'
                 :(ps.got+' / '+ps.max+(ps.covered===ps.total?'':' *')));
        const scr=(ps&&ps.got!=null&&ps.max>0)?Math.round(ps.got/ps.max*100)+'%':'—';
        body+='<tr><td>'+(i+1)+'</td><td>'+esc(nameOf(r))+'</td><td>'+sc+'</td>'
          +'<td>'+scr+'</td>'
          +'<td>'+(ms.rate==null?'—':ms.rate+'%')+'</td>'
          +'<td>'+(ms.wrong||0)+'</td>'
          +'<td>'+(ms.missed?('<b>'+ms.missed+'</b>'):'0')+'</td>'
          +'<td>'+esc(x.tp||'—')+'</td>'
          +'<td>'+(mi?esc(mi.lab)+' '+mi.n+' 题':'—')+'</td>'
          +'<td>'+esc((x.weak_options||[]).join('、')||'—')+'</td>'
          +'<td>'+esc((x.weak_manual||[]).map(optText).filter(Boolean).join('、')||x.weak_note||'—')+'</td>'
          +'<td>'+esc((x.next_options||[]).join('、')||x.next_note||'—')+'</td></tr>';
      });
      body+='</tbody></table>';
    }
    const ln=(lab,arr,why)=>arr.length?('<div><b>'+lab+' '+arr.length+' 位</b>：'
      +esc(arr.map(r=>nameOf(r)).join('、'))+' —— '+why+'</div>'):'';
    const hb=ln('缺席',held.absent,'不是弱、不是 0 分，只是没有证据')
      +ln('本轮未评',held.na,'学生在，但这一轮证据不足')
      +ln('资料未齐',held.half,'有填但还没按「整份都看过了」或还没选 TP')
      +ln('还没开始',held.none,'');
    if(hb) body+='<div class="held"><b>未列入本科报告：</b>'+hb+'</div>';
    body+='</section>';
  });
  body+='<div class="note">得分栏带 <b>*</b> = 只涵盖部分项目'
    +'（有项目未声明「每题同分」或写作未填分）。'
    +'<b>此页含分数，不得交给家长。</b></div>'
    +'<div class="ft"><div>科任签名<div class="ln"></div></div>'
    +'<div>主任审阅<div class="ln"></div></div>'
    +'<div>日期<div class="ln"></div></div></div>';
  rpOpen('内部版 · '+cl, INTERNAL_CSS, body, '');
}

/* 共用开窗 —— 两版唯一的差别是 CSS 与内容，流程一样。 */
function rpOpen(title, css, body, foot){
  const w=window.open('','_blank','width=900,height=1000');
  if(!w){ alert('✕ 浏览器挡了弹窗。请允许弹窗后重试。'); return; }
  w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>'
    +title+'</title><style>'+css+'</style></head><body>'+body
    +(foot?'<div class="note">'+foot+'</div>':'')
    +'<scr'+'ipt>window.print();window.onafterprint=()=>window.close();</scr'+'ipt>'
    +'</body></html>');
  w.document.close();
}

  rows.forEach(({r,p})=>{
    const ms=recStats(p), rate=ms.rate==null?'—':(ms.rate+'%');
    const mi=mainIssue(ms), fo=FIXOUT.find(f=>f.v===p.fix_outcome);
    const wk=(p.weak_options||[]).join('、');
    const wm=(p.weak_manual||[]).map(optText).filter(Boolean).join('、');
    const dd=(p.done_options||[]).join('、');
    const nx=(p.next_options||[]).join('、');
    const ps=paperScore(r.sid);

    body+=`<tr><td>${esc(nameOf(r))}</td><td>${scoreCell}</td><td>${rate}</td><td>${esc(p.tp||'—')}</td><td>${mi?esc(mi.lab):'—'}</td>

      <td>${esc(nx||p.next_note||'—')}</td></tr>`;
  });
  body+=`</tbody></table>
    <div class="meta" style="margin-top:6px">得分栏带 <b>*</b> = 只涵盖部分项目（有项目未声明「每题同分」或写作未填分）。

  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>ATC 部 考前报告</title><style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI','PingFang SC',Arial,sans-serif;padding:28px 32px;color:#222;font-size:11px}

       padding:5px 8px;border:1px solid #999;text-align:left;background:#eee}

  </style></head><body>${body}

function dl(name,text,type){
  const b=new Blob([text],{type:type||'application/json;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},400);
}
function exportData(){
  const payload={...S, meta:{...S.meta, version:'v'+APP_VERSION, exportTime:new Date().toISOString(),
    itemCount:Object.keys(S.f1).length+Object.keys(S.f2).length
             +Object.keys(S.wi).length+Object.keys(S.es).length}};
  dl(`EvalGo_ATC_${stamp()}.json`, JSON.stringify(payload,null,2));

function csvCell(v){const s=String(v==null?'':v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function exportCSV(){
  const L1=[['form','exam','teacher','subject','class','year','student_id','student','bahagian','obs_date']
    .concat(DIMS.map(d=>d.en)).concat(['issue','client_uid','synced']).map(csvCell).join(',')];
  Object.values(S.f1).forEach(r=>{const st=stuOf(r.sid)||{};
    L1.push(['FORM01',r.exam,r.by,r.subject,r.cls,r.year,r.sid,st.en,r.bahagian,r.obs_date]
      .concat(DIMS.map(d=>r[d.id]||'')).concat([r.issue||'',r.client_uid,r.synced?'Y':'N']).map(csvCell).join(','));});
  const L2=[['form','exam','teacher','subject','class','year','student_id','student','paper_date','total_q']
    .concat(MARKS.map(m=>m.lab))
    .concat(['score_got','score_max','score_covered_sections','score_total_sections',
             'rate','tp','assess_status','paper_checked','paper_checked_at',
             'weak_auto','weak_manual','weak_note','strong_topics',
             'done_actions','done_note','next_actions','next_note','fix_target','fix_outcome',
             'reflect_was_wrong','reflect_now_know','parent_support','client_uid','synced'])
    .map(csvCell).join(',')];
  Object.values(S.f2).forEach(r=>{const st=stuOf(r.sid)||{}; const ms=recStats(r);
    L2.push(['FORM02',r.exam,r.by,r.subject,r.cls,r.year,r.sid,st.en,r.paper_date,ms.total]
      .concat(MARKS.map(m=>ms[m.id]))
      .concat((()=>{const q=paperScore(r.sid)||{};
        return [q.got==null?'':q.got, q.max==null?'':q.max,
                q.covered==null?'':q.covered, q.total==null?'':q.total];})())
      .concat([ms.rate==null?'':ms.rate,r.tp||'',aStat(r),
        r.paper_checked?'Y':'N',r.paper_checked_at||'',
        (r.weak_options||[]).join(' '),
        (r.weak_manual||[]).map(optText).filter(Boolean).join(' '),
        r.weak_note||'',(r.strong_topics||[]).join(' '),
        (r.done_options||[]).join(' '),r.done_note||'',
        (r.next_options||[]).join(' '),r.next_note||'',
        r.fix_target||'',r.fix_outcome||'',
        r.reflect_was_wrong||'',r.reflect_now_know||'',
        r.parent_support||'',r.client_uid,r.synced?'Y':'N']).map(csvCell).join(','));});
  const L3=[['form','exam','teacher','subject','class','year','student_id','student','q_no','mark_code',
    'cl_subtype','topic','answer_format','diagnosis','client_uid','synced'].map(csvCell).join(',')];
  Object.keys(S.wi).sort().forEach(k=>{const w=S.wi[k];const st=stuOf(w.sid)||{};
    L3.push(['WRONG_ITEM',w.exam,w.by,w.subject,w.cls,w.year,w.sid,st.en,w.q,
      String(w.code||'').toUpperCase(),w.cl_subtype||'',w.topic||'',w.fmt||'',w.diag||'',
      w.client_uid,w.synced?'Y':'N'].map(csvCell).join(','));});
  const L4=[['form','exam','teacher','subject','class','year','student_id','student',
    'section_code','score','max_score','weak','is_star','client_uid','synced'].map(csvCell).join(',')];
  Object.keys(S.es).sort().forEach(k=>{const e=S.es[k];const st=stuOf(e.sid)||{};
    L4.push(['ESSAY_RESULT',e.exam,e.by,e.subject,e.cls,e.year,e.sid,st.en,e.sec_code,
      e.score!=null?e.score:'',e.max!=null?e.max:'',(e.weak||[]).join(' '),e.star?'Y':'',
      e.client_uid,e.synced?'Y':'N'].map(csvCell).join(','));});
  dl(`EvalGo_ATC_${stamp()}.csv`,
     '﻿'+L1.join('\n')+'\n\n'+L2.join('\n')+'\n\n'+L3.join('\n')+'\n\n'+L4.join('\n'),
     'text/csv;charset=utf-8');
  toast('✓ Exported CSV');
}
function importData(e){
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const p=JSON.parse(rd.result);
      if(!p||typeof p!=='object'||(!p.f1&&!p.f2&&!p.wi)) { toast('✕ 格式不对，资料未变动'); return; }
      let nw=0,up=0,un=0;
      const scan=(src,dst)=>Object.keys(src||{}).forEach(k=>{
        if(!dst[k]) nw++; else if(JSON.stringify(dst[k])!==JSON.stringify(src[k])) up++; else un++; });
      scan(p.f1,S.f1); scan(p.f2,S.f2); scan(p.wi,S.wi); scan(p.es,S.es);
      if(!confirm(`汇入预览（永远是合并，不会整份取代）：\n新增 ${nw} 笔 · 更新 ${up} 笔 · 不变 ${un} 笔\n\n继续？`)) { toast('✕ 已取消'); return; }
      exportData();  /* 汇入前自动备份 */
      const backup=JSON.parse(JSON.stringify(S));
      try{
        Object.keys(p.f1||{}).forEach(k=>{ if(!S.f1[k]||!S.f1[k].synced) S.f1[k]=p.f1[k]; });
        Object.keys(p.f2||{}).forEach(k=>{ if(!S.f2[k]||!S.f2[k].synced) S.f2[k]=p.f2[k]; });
        Object.keys(p.wi||{}).forEach(k=>{ if(!S.wi[k]||!S.wi[k].synced) S.wi[k]=p.wi[k]; });
        Object.keys(p.es||{}).forEach(k=>{ if(!S.es[k]||!S.es[k].synced) S.es[k]=p.es[k]; });
        if(saveThen('✓ Imported')){ refreshAll(); renderManage(); }
      }catch(err){ S=backup; saveData(true); toast('✕ 汇入失败，已回滚'); }
    }catch(err){ toast('✕ 无法解析，资料未变动'); }
  };
  rd.readAsText(f); e.target.value='';
}

/* ══ CLOUD ══ */
function cloudLibReady(){ return typeof window.supabase!=='undefined' && !!window.supabase.createClient; }
async function cloudInit(silent){
  CLOUD.err=''; CLOUD.checked=false;
  if(!cloudLibReady()){ CLOUD.err='连不到 Supabase 程式库（可能没网路）'; paintCloud(); return false; }
  try{
    if(!_sb) _sb=window.supabase.createClient(SB_URL,SB_KEY);
    const {data:{session},error}=await _sb.auth.getSession();
    if(error) throw error;
    CLOUD.session=session||null;
    if(!session){ CLOUD.err='还没登入'; paintCloud(); return false; }
    try{ sessionStorage.removeItem('evalgo_login_bounce'); }catch(e){}   /* v28：登入成功，解除防回圈 */
    const pr=await _sb.rpc('can_access',{p_system:SYS_CODE});
    if(pr.error) throw pr.error;
    const row=Array.isArray(pr.data)?pr.data[0]:pr.data;
    CLOUD.perm=row||null;
    if(!CLOUD.perm||CLOUD.perm.can_see!==true){ CLOUD.err='这个帐号没有 EvalGo_ATC 权限（权限码 RPT-EvalGo-ATC）——请找院长开通'; paintCloud(); return false; }
    const ex=await _sb.from('evalgo_exam').select('*').eq('department','ATC').eq('is_active',true)
                      .order('report_due',{ascending:true}).limit(1);
    if(ex.error) throw ex.error;
    if(!ex.data||!ex.data.length){ CLOUD.err='资料库没有进行中的考试'; paintCloud(); return false; }
    CLOUD.exam=ex.data[0];
    const prevEx=S.examCode;
    S.examCode=CLOUD.exam.code; S.examLabel=CLOUD.exam.label;
    /* 上下半年由 evalgo_exam.term 决定（MID / FINAL），**不是**从月份猜。
       考试那一列是权威；只有当它没填时，才退而用输入开始的月份推断。 */
    S.examTerm = CLOUD.exam.term || termFromMonth(CLOUD.exam.input_opens);
    /* 老师可能离线先填过（前缀 NOEXAM），或还是 v7 的无前缀旧资料 —— 搬进本轮考试 */
    const mig=migrateExamKeys(S.examCode);
    if(mig.moved) toast(`已把 ${mig.moved} 笔离线资料归入「${S.examLabel}」`,5000);
    if(mig.unresolved) console.warn('UNRESOLVED（无法证明属於哪一轮考试，未迁移）:',mig.unresolved);
    if(prevEx && prevEx!==S.examCode)
      console.warn('exam changed', prevEx, '→', S.examCode);
    const th=await _sb.from('teachers').select('id,name').eq('status','active').order('id');
    if(!th.error&&th.data) CLOUD.teachers=th.data;
    /* 能力探测 —— 前端对 delta 版本向前相容：
       delta v3 未跑 → 逐题资料留本机；delta v4 未跑 → TP / 家长配合留本机。
       两者都不会让上传整批失败。 */
    CLOUD.hasWI = !(await _sb.from('evalgo_wrong_item').select('id').limit(1)).error;
    CLOUD.hasPS = !(await _sb.from('evalgo_paper_section').select('id').limit(1)).error;
    /* delta v12 —— 卷面题号 paper_from/paper_to 与小题 q_sub */
    CLOUD.hasV12 = !(await _sb.from('evalgo_paper_section').select('paper_from').limit(1)).error;
    CLOUD.hasV4 = !(await _sb.from('evalgo_paper_analysis').select('tp').limit(1)).error;
    CLOUD.hasV5 = !(await _sb.from('evalgo_paper_analysis').select('paper_checked').limit(1)).error;
    CLOUD.hasES = !(await _sb.from('evalgo_essay_result').select('id').limit(1)).error;
    CLOUD.hasTA = !(await _sb.from('evalgo_teacher_assign').select('id').limit(1)).error;
    CLOUD.hasV8 = !(await _sb.from('evalgo_paper_analysis').select('assess_status').limit(1)).error;
    CLOUD.hasV9 = !(await _sb.from('evalgo_paper_analysis').select('weak_manual').limit(1)).error;
    CLOUD.hasV10 = !(await _sb.from('evalgo_paper_section').select('even_marks').limit(1)).error;
    /* delta v13 —— 小题结构 q_marks。没跑 DDL 之前老师照样填得下去，
       东西留在这台装置；栏位一加上去就自动补送（见下面的 needV13 重排）。 */
    CLOUD.hasV13 = !(await _sb.from('evalgo_paper_section').select('q_marks').limit(1)).error;
    /* v26 Multi-Paper 能力侦测：Stage A 未跑时表不存在 → hasPI=false → 全程 Legacy 兼容 */
    CLOUD.hasPI = !(await _sb.from('evalgo_paper_instance').select('id').limit(1)).error;
    /* v14 上线後（唯一索引含 q_sub），把扣住的小题纪录重新排队。
       侦测方式：拿一笔明知会撞的资料去试太危险，所以改成「送得出去就是好了」——
       needV14 的纪录每次连线重排一次，成功就不再回来，失败会再被扣住。 */
    { let n=0;
      Object.keys(S.wi||{}).forEach(k=>{ const w=S.wi[k];
        if(w&&w.needV14){ w.needV14=false; w.synced=false; n++; } });
      if(n){ saveData(true); console.info('重排 '+n+' 笔小题纪录'); } }
    /* v13 上线後，把当初因为没栏位而没送出去的小题结构重新排队 —— 老师不必重填 */
    if(CLOUD.hasV13){ let n=0;
      /* ⚠️ 不可以用 allSections() —— 它回的是 Object.assign 出来的【复本】，
         改复本等於没改（回归测试抓到的）。要直接走 S.sections 里的真身。 */
      Object.keys(S.sections||{}).forEach(k=>{
        (S.sections[k]||[]).forEach(x=>{ if(x&&x.needV13){ x.needV13=false; x.synced=false; n++; } }); });
      if(n){ saveData(true); console.info('delta v13 上线，重送 '+n+' 笔小题结构'); }
    }
    /* v9 上线后，把当初因为没栏位而扣住的老师手填弱项重新排队送出 */
    if(CLOUD.hasV9){ let n=0;
      Object.keys(S.f2).forEach(k=>{ const r=S.f2[k];
        if(r&&r.needV9){ r.needV9=false; r.synced=false; n++; } });
      if(n){ saveData(true); console.info('v9 上线，重送 '+n+' 笔老师手填弱项'); }
    }
    await resolveTeacher();
    /* 🔴 v25 R-H2：连线成功 ≠ 这一轮资料读完整。
       任何一个 pull 失败都要留下痕迹，不准让流程默默走完还宣告「已连上」。 */
    CLOUD.readErr='';
    const _rA=await pullAssign();     /* 谁负责哪一格 —— 首页要显示 */
    const _rS=await pullSections();   /* 换装置 / 别的老师已登记过 → 直接带出来 */
    if(!_rA.ok) CLOUD.readErr=_rA.error;
    else if(!_rS.ok) CLOUD.readErr=_rS.error;
    await cloudRoster(true);          /* 名单自动载入，不用老师按 */
    await cloudPull(true);            /* 已经填过的自动带回来（失败会自己写 readErr）*/
    /* ⚠️ 顺序不可颠倒：一定要在 pullSections / cloudPull **之後**才送 ——
       逐题纪录要靠 section 的 cloud_id 才挂得回它所属的项目。 */
    await flushPendingAfterLogin();
    paintNav();
    paintCloud();
    if(!silent) toast(CLOUD.readErr ? ('⚠ 已连上，但有资料没读回来 —— '+CLOUD.readErr) : '✓ 已连上',
                      CLOUD.readErr?7000:undefined);
    refreshAll();
    if(needTeacherBind()) askTeacher();
    return true;
  }catch(e){ CLOUD.err=(e&&e.message)?e.message:String(e); paintCloud(); return false; }
}
/* 老师身份 —— 平台已经认得她是谁
   internal.users_meta.display_name === public.teachers.id（17/17 实测全中）
   public.users_meta 是 security_invoker view，policy users_read_own_meta
   允许每位登入者读自己那一笔 → 前端一句 select 就解析完毕，不必问老师。 */
function authUid(){ return (CLOUD.session&&CLOUD.session.user)?CLOUD.session.user.id:''; }
async function resolveTeacher(){
  const u=authUid(); if(!u) return;
  try{
    const r=await _sb.from('users_meta')
      .select('user_id,display_name,role,is_active').eq('user_id',u).maybeSingle();
    if(r.error) throw r.error;
    const code=r.data && r.data.display_name ? String(r.data.display_name).trim().toUpperCase() : '';
    CLOUD.role = r.data ? (r.data.role||'') : '';
    if(code){
      const hit=(CLOUD.teachers||[]).find(t=>String(t.id).trim().toUpperCase()===code);
      if(hit){ S.me=hit.id; S.meName=hit.name; CLOUD.idFrom='users_meta'; saveData(true); return; }
      CLOUD.idErr='帐号代号「'+code+'」在 teachers 表找不到对应';
    }else{
      CLOUD.idErr='users_meta 读不到 display_name';
    }
  }catch(e){ CLOUD.idErr=(e&&e.message)?e.message:String(e); }
  if(S.teacherByUid && S.teacherByUid[u]) S.me=S.teacherByUid[u];   // 旧资料相容
}
function needTeacherBind(){ return !!authUid() && !S.me; }
function bindTeacher(id){
  if(!id) return;
  S.me=id; const u=authUid(); if(u) S.teacherByUid[u]=id;
  const h=(CLOUD.teachers||[]).find(t=>t.id===id); S.meName=h?h.name:'';
  if(!saveThen('✓ 已记住')) return;
  closeModal(); refreshAll(); renderManage();
}
function askTeacher(){
  const opts=CLOUD.teachers.length
    ? `<select id="tSel" style="width:100%">
         <option value="">— 请选 —</option>
         ${CLOUD.teachers.map(t=>`<option value="${esc(t.id)}"${t.id===S.me?' selected':''}>${esc(t.id)} · ${esc(t.name)}</option>`).join('')}
       </select>`
    : `<input type="text" id="tSel" style="width:100%" value="${esc(S.me)}" placeholder="例：MT">`;
  openModal('认不出你的身份',
    `<div class="alert alert-warn"><div><b>这不该发生。</b>系统本来会自动从平台帐号认出你。
       原因：${esc(CLOUD.idErr||'未知')}<br>请先选一次，并把这个讯息回报给管理层。</div></div>
     <div class="form-row"><label class="form-label">老师</label>${opts}</div>`,
    `<button class="btn btn-pri" onclick="bindTeacher(document.getElementById('tSel').value.trim())">暂时用这个</button>`);
}

/* 把云端的考卷结构合并进本机。回传新带回的笔数。
   规则：本机同 client_uid 且未上传 → 保留本机（老师正在改）；其余以云端为准。 */
/* 拉回全部老师的任教登记 —— 首页要显示每一格该由谁负责 */
/* 🔴 v25 R-H1：读路径不准用 0 兼职表示失败。
   旧版 `return 0` 同时代表「云端真的 0 笔」与「查询失败」，
   呼叫端永远分不出来，于是 cloudInit 照样宣告「✓ 已连上」。
   改成 {ok,n,error}：ok=false 才是失败，n 只讲笔数。 */
async function pullAssign(){
  if(!CLOUD.hasTA||!CLOUD.exam||!_sb) return {ok:true,n:0,skipped:true};
  try{
    const r=await _sb.from('evalgo_teacher_assign').select('*').eq('exam_id',CLOUD.exam.id);
    if(r.error) throw r.error;
    let n=0;
    (r.data||[]).forEach(x=>{
      const k=asgKey(x.teacher_id,x.class_name,x.subject);
      /* ══ v40 · 治根：本机未同步的那一笔，其实云端早就有同一格了。 ══
         v32 这里是 `if(未同步) return;` —— 本机那笔带著自己的 client_uid 活下去，
         upsert(onConflict:'client_uid') 永远对不上，撞唯一索引，
         顶栏「⚠ 1 笔没送出」就永远清不掉。
         改成**认领云端身份**：同一格就是同一笔，从此不再重送。 */
      const cur=S.assign[k];
      if(cur && !cur.synced){
        cur.client_uid=x.client_uid||cur.client_uid;
        cur.cloud_id=x.id; cur.synced=true; n++;
        console.info('v40：任教登记认领云端身份',k); return;
      }
      const t=(CLOUD.teachers||[]).find(y=>y.id===x.teacher_id);
      S.assign[k]={client_uid:x.client_uid||uid(),exam:CLOUD.exam.code,teacher_id:x.teacher_id,
        teacher_name:t?t.name:'',cls:x.class_name,subject:x.subject,
        savedAt:'(云端)',synced:true,cloud_id:x.id}; n++; });
    if(n) saveData(true);
    return {ok:true,n:n};
  }catch(e){ const m=e&&e.message?e.message:String(e);
    console.warn('pullAssign:',m); return {ok:false,n:0,error:'任教登记读不回来：'+m}; }
}
async function pullSections(){
  if(!CLOUD.hasPS||!CLOUD.exam||!_sb) return {ok:true,n:0,skipped:true};
  try{
    const r=await _sb.from('evalgo_paper_section').select('*')
      .eq('exam_id',CLOUD.exam.id).order('sort_order');
    if(r.error) throw r.error;
    let n=0; const seenSec={};
    (r.data||[]).forEach(x=>{
      const k=EXK()+'|'+x.subject+'|'+x.year_level+piSuf(x.paper_instance_id);
      if(x.client_uid) seenSec[x.client_uid]=1; if(x.id) seenSec[x.id]=1;
      const arr=S.sections[k]||(S.sections[k]=[]);
      const mine=arr.find(a=>(a.client_uid&&a.client_uid===x.client_uid)
                          || a.cloud_id===x.id
                          || (a.code===x.code));
      /* ══ v44 · 线上日志实证：09-15 04:41–13:56 这一支 409 了 39 次 ══
         `?on_conflict=client_uid` 撞上自然键
         (exam_id, subject, year_level, code, paper_instance_id)。
         成因跟 v40 治好的 teacher_assign 一模一样：
         本机未同步那笔带著**自己的** client_uid，upsert 对不上 → 当成 INSERT →
         撞自然键 → 409 → 重试一万次都一样，老师的考卷项目永远送不上去。
         治法：**认领云端身份，但保留老师本机还没送出的内容**。
         下一次 upsert 就会变成 UPDATE 到正确那一列，而不是撞车的 INSERT。
         ⚠️ 只搬 client_uid / cloud_id，一个内容栏位都不碰 —— 老师改到一半的东西不能掉。 */
      if(mine&&mine.synced===false){
        let adopted=false;
        if(x.client_uid && mine.client_uid!==x.client_uid){ mine.client_uid=x.client_uid; adopted=true; }
        if(x.id && mine.cloud_id!==x.id){ mine.cloud_id=x.id; adopted=true; }
        if(adopted){ saveData(true); console.info('v44：考卷项目认领云端身份',k,x.code); }
        return;                                     /* 本机有未上传的修改，内容不覆盖 */
      }
      const row={id:(mine&&mine.id)||uid(), client_uid:x.client_uid||uid(),
        code:x.code, topic:x.topic||'', fmt:x.answer_format||'',
        type:x.section_type||'OBJ',
        qf:x.q_from, qt:x.q_to, max:x.max_score,
        pf:(x.paper_from!=null?x.paper_from:(mine?mine.pf:null)),
        /* 云端还没有 q_marks 栏位时 x.q_marks 是 undefined → 保留本机的，不要洗掉 */
        qm:(x.q_marks!==undefined?(x.q_marks||null):(mine?mine.qm:null)),
        needV13:(mine?!!mine.needV13:false),
        sort:x.sort_order||0, by:x.created_by||'',
        synced:true, cloud_id:x.id};
      if(mine) Object.assign(mine,row); else { arr.push(row); n++; }
    });
    if(CLOUD.hasPI && S.paperInstance){
      const arr=S.sections[bpKey()]||[];
      S.sections[bpKey()]=arr.filter(s=> !s.synced || seenSec[s.client_uid] || seenSec[s.cloud_id]);
    }
    if(r.data&&r.data.length) saveData(true);
    return {ok:true,n:n};
  }catch(e){ const m=e&&e.message?e.message:String(e);
    console.warn('pullSections:',m); return {ok:false,n:0,error:'考卷结构读不回来：'+m}; }
}
/* ══ 登入闸门 ══
   v14 的「去平台登入」按钮只长在【管理】页 —— 而管理页对老师是隐藏的。
   结果：没登入的老师看不到任何登入入口，只会看到角落一行小字「未连线」，
   然后对着 5 个示范学生填一整天，资料永远上不了云。
   这是本系统最严重的一个洞，v15 把它挡在最前面。 */
function authGate(){
  const el=document.getElementById('authgate'); if(!el) return;
  const T=document.getElementById('ag-title'), M=document.getElementById('ag-msg'),
        B=document.getElementById('ag-btn'), I=document.getElementById('ag-icon');
  if(!CLOUD.checked){ el.style.display='none'; return; }
  let show=true;
  if(!cloudLibReady()){
    I.textContent='📡'; T.textContent='连不到学校系统';
    M.textContent='可能是网路问题。连上网路后按下面重试。';
    B.textContent='重新连线'; B.onclick=()=>{ CLOUD.checked=false; authGate(); cloudInit(false).then(authGate); };
  }else if(!CLOUD.session){
    if(shouldAutoLogin()){ redirectToPlatformLogin(); return; }   /* v28：照 ObsGo R1，直接跳 */
    I.textContent='🔒'; T.textContent='请先登入平台';
    M.textContent = (navigator.onLine===false)
      ? '目前离线，暂时确认不了你的身分。你可以先不要关掉这一页 —— 已经填过的东西还在这台装置上，连上网路再登入就会送出。'
      : 'EvalGo_ATC 不另外设帐号，用你平常登入学校平台的那一个。按下面会跳去登入，登好会自动回来。';
    B.textContent='去平台登入'; B.onclick=cloudLogin;
  }else if(!CLOUD.perm||CLOUD.perm.can_see!==true){
    I.textContent='🚫'; T.textContent='这个帐号还没有开通';
    M.textContent='你已经登入了，但这个帐号还没有 EvalGo_ATC 的权限（权限码 RPT-EvalGo-ATC）。请找院长开通 —— 不是你的问题。';
    B.textContent='重新检查'; B.onclick=()=>{ cloudInit(false).then(authGate); };
  }else if(!CLOUD.exam){
    I.textContent='📅'; T.textContent='目前没有进行中的考试';
    M.textContent='资料库里没有开放中的 ATC 考试。请找院长确认。';
    B.textContent='重新检查'; B.onclick=()=>{ cloudInit(false).then(authGate); };
  }else show=false;
  el.style.display = show?'flex':'none';
}
/* ══ 学期 ══
   ⚠️ DSKP **本身没有上下半年之分** —— KPM 出的是一整年一份，
   把学习标准切到週次／月份的是 RPT（Rancangan Pengajaran Tahunan），
   那是**校本文件**，本机与网路都没有（见 OPEN-3）。
   所以这里只做两件诚实的事：把这一轮是年中还是年终**显示出来**，
   以及在年中考时提醒老师自行避开还没教到的领域。**不自动过滤** ——
   凭空切一半会造出没有依据的范围，那是假证据。 */
function termFromMonth(d){
  const m = d ? new Date(d).getMonth()+1 : new Date().getMonth()+1;
  return m<=6 ? 'MID' : 'FINAL';
}
function termLabel(t){
  return t==='MID' ? '年中考 · 涵盖上半年'
       : t==='FINAL' ? '年终考 · 涵盖全年' : '';
}
function cloudLogin(){ location.href=PLATFORM+'?returnTo='+encodeURIComponent(location.href); }
/* 名单不该由老师去按。连上就自动载入整个 ATC 名单（不分科目），
   因为班级登记记录表要显示所有班所有科的进度。 */
async function cloudRoster(silent){
  if(!CLOUD.exam){ if(!silent) toast('✕ 还没连上'); return false; }
  try{
    const r=await _sb.from('v_evalgo_coverage')
      .select('student_id,student_name_en,student_name_cn,class_id,class_name,year_level')
      .eq('exam_id',CLOUD.exam.id)
      .order('class_name').order('student_name_en');
    if(r.error) throw r.error;
    if(!r.data||!r.data.length){ if(!silent) toast('✕ 云端没有名单'); return false; }
    const seen={}, byCls={}, out=[];
    r.data.forEach(x=>{ if(seen[x.student_id]) return; seen[x.student_id]=1;
      byCls[x.class_name]=(byCls[x.class_name]||0)+1;

/* ══════════════════════════════════════════════════════════════════

   ------------------------------------------------------------------
   本机有一笔未同步、云端同一个自然键已经有列时：
     云端 entered_by === 我  → **认领**云端 client_uid
                               （换装置 / pull 失败过，自己覆盖自己，无损）
     不是我                  → **不认领、不上传、也不丢弃**，标成撞车
   ⚠️ 这四张证据表的自然键**不含 entered_by** —— 自动认领别人那一列
      等於静默盖掉别的老师。今天的 409 很粗暴，但它确实挡住了互相覆盖；
      拆引信之前必须先决定撞到怎麽办，这就是那个决定。
   ⚠️ teacher_assign（没有内容）与 paper_section（只有开卷者改得了）
      不适用这一条 —— 见 v40 / v44 的理由，那两张直接认领是安全的。
   ⚠️ 不改 onConflict 策略（L-4 一个字不动）、不用 DDL。
   ══════════════════════════════════════════════════════════════════ */
function s9Adopt(rec, x, label){
  if(!rec || rec.synced!==false) return false;         /* 只处理本机未同步的 */
  const mine = !!S.me && (x.entered_by||'')===S.me;
  if(mine){
    let ch=false;
    if(x.client_uid && rec.client_uid!==x.client_uid){ rec.client_uid=x.client_uid; ch=true; }
    if(x.id && rec.cloud_id!==x.id){ rec.cloud_id=x.id; ch=true; }
    if(rec.conflict){ delete rec.conflict; ch=true; }
    if(ch) console.info('v45：'+label+' 认领云端身份（同一个人）');
    return ch;
  }
  const c=rec.conflict||{};
  if(c.cloud_id!==x.id || c.by!==(x.entered_by||'')){
    rec.conflict={by:x.entered_by||'', cloud_id:x.id, cloud_uid:x.client_uid||'',
                  at:new Date().toLocaleString('en-GB'), what:label};
    console.warn('v45：'+label+' 撞车 —— 云端那一列是别人填的，本机这一笔不送出');
    return true;
  }
  return false;
}

     ② 换装置 / 清浏览器资料 → FORM 02 直接打不开（说「还没登记考卷结构」）

function bpKeyOf(subject,year){ return EXK()+'|'+subject+'|'+year+piSuffix(); }
function allSections(){

  Object.keys(S.sections||{}).forEach(k=>{
    const parts=k.split('|');
    if(parts.length<3) return;                     /* v7 旧格式，由 migrateExamKeys 处理 */
    const [ex,subject,yr]=parts;
    if(ex!==EXK()) return;                          /* 别轮考试的结构不参与本轮 */
    /* v27：带上项目自己的完整 key（含卷号后缀）。上传成功後要靠它找回本机那一列标记已同步；
       v26 是用 bpKeyOf() 重拼，而 bpKeyOf 接的是**当下选中的卷**，

    (S.sections[k]||[]).forEach(x=>out.push(Object.assign({_subject:subject,_year:+yr,_key:k},x)));

  if(S.rosterSource!=='cloud')                   return {n, sent:0, left:n, why:'还在用示范名单'};

    /* 🔴 v45 · 铁则 6（送出去的每个栏位，pull 都要抄得回来）被破了一个洞：
       本机 key 是 uKey(q,sub) —— 6a 存成 '6@a'；
       但这里拉回来只用 x.q_no，6a / 6b / 6c 全部落在同一个 key '6' 上，
       **後面的把前面的盖掉** —— v33 的小题纪录过不了一趟来回。
       q_sub 栏位 delta v12 就有了，这里一直没读。 */
    (d.data||[]).forEach(x=>{ const k=CLOUD.exam.code+'|'+x.student_id+'|'+x.subject+'|'
        +uKey(x.q_no, x.q_sub||null)+piSuf(x.paper_instance_id); seenWI[k]=1;
      if(S.wi[k]&&!S.wi[k].synced){ if(s9Adopt(S.wi[k],x,'逐题')) s9dirty=true; return; }
      S.wi[k]={client_uid:x.client_uid||uid(),sid:x.student_id,subject:x.subject,q:x.q_no,
        qsub:x.q_sub||null,
        code:String(x.mark_code||'').toLowerCase(),diag:x.diagnosis||'',
        topic:x.topic||'',fmt:x.answer_format||'',sec_code:'',sec_type:x.diagnosis?'SUBJ':'OBJ',
        cls:clsOfSid(x.student_id),class_id:x.class_id,year:x.year_level,by:x.entered_by,exam:CLOUD.exam.code,
        savedAt:'(云端)',synced:true,cloud_id:x.id}; n3++; });
    let n4=0;
    (e2.data||[]).forEach(x=>{ const k=CLOUD.exam.code+'|'+x.student_id+'|'+x.subject+'|'+x.section_code+piSuf(x.paper_instance_id); seenES[k]=1;
      if(S.es[k]&&!S.es[k].synced){ if(s9Adopt(S.es[k],x,'写作')) s9dirty=true; return; }
      S.es[k]={client_uid:x.client_uid||uid(),sid:x.student_id,subject:x.subject,
        sec_code:x.section_code,sec_cloud_id:x.section_id,score:x.score,max:x.max_score,
        weak:x.weak||[],star:!!x.is_star,cls:clsOfSid(x.student_id),class_id:x.class_id,year:x.year_level,
        by:x.entered_by,exam:CLOUD.exam.code,savedAt:'(云端)',synced:true,cloud_id:x.id}; n4++; });
    /* F5 对账：只在【本次 pull 成功 + 多卷在线 + 已选卷】时执行；
       只删【synced + 当前 exam + 当前卷 namespace + 云端明确没有】的 local row。
       unsynced / pending / failed / 别的卷 / 别的 exam 一律不删。Legacy 完全不进此块。 */
    if(CLOUD.hasPI && S.paperInstance){
      const suf=piSuffix();
      const rec=(store,seen)=>{ Object.keys(store).forEach(k=>{ const rr=store[k];
        if(rr && rr.synced===true && rr.exam===CLOUD.exam.code && k.endsWith(suf) && !seen[k]) delete store[k]; }); };
      rec(S.f1,seenF1); rec(S.f2,seenF2); rec(S.wi,seenWI); rec(S.es,seenES);
    }
    CLOUD.readErr=''; paintReadWarn();
    saveData(true); refreshAll(); renderManage();
    if(silent) return;
    alert(`已拉回 考卷项目 ${nPS} 个 · FORM 01 ${n1} 笔 · FORM 02 ${n2} 笔 · 逐题 ${n3} 笔 · 写作 ${n4} 笔`
      +(CLOUD.hasWI?'':'\n（逐题表尚未建立，跳过）')
      +'\n（本机还没上传的资料不会被盖掉）');
    if(s9dirty){ saveData(true); s9Notify(); }
  }catch(e){ const m=e&&e.message?e.message:String(e);
    CLOUD.readErr='资料读不回来：'+m; paintReadWarn();
    if(silent) console.warn('pull:',m); else alert('拉回失败：'+m); }
}
/* 老师端的撞车讯息。
   ⚠️ Owner 2026-09-15 拍板：**不说是谁填的**。
      老师知道了也处理不了（她没有覆盖权限），只会多一个跟同事争的理由；
      而且说了会踩到「老师只看得见自己填的」那条裁定。名字只在管理层那张清单上。 */
function s9Notify(){
  const n=s9Count(); if(!n) return;
  paintCloud();
  if(isAdmin()) return;                 /* 管理层看清单，不看这个 toast */
  toast('⚠ 有 '+n+' 笔跟云端撞到了 —— 你的资料还在，但没有送出去。请截图找管理层。', 8000);
}
/* 失败讯息必须「老师做得到」。叫老师去按 Export 是假的出口 ——
   那颗按钮在管理页，老师根本看不到。 */
function saveFailMsg(){
  return isAdmin()
    ? '资料没有存进这台电脑（浏览器空间可能满了）。\n\n请先按 Manage → Export 备份，再重试。'
    : '这一笔没有存进这台电脑（浏览器空间可能满了）。\n\n'
    + '请先不要关掉这个页面，也不要重复输入。\n'
    + '截图这个讯息，直接找管理层处理。';
}
function paintCloud(){
  const el=document.getElementById('cloud-state'); if(!el) return;
  const p=pendingCount();
  const online=!!(CLOUD.exam&&CLOUD.session);
  /* v22 · 常驻同步徽章：绿勾只代表「云端已经收到」。
     toast 会消失、console 老师看不到，所以失败必须一直留在顶栏。 */
  if(!online){
    el.textContent='⚠ 未连线 · 资料只在这台电脑';
    el.style.color='var(--warn)';
  }else if(CLOUD.busy || (p>0 && !CLOUD.pushErr)){
    el.textContent='↑ 正在送出 '+p+' 笔…';
    el.style.color='#F9CB42';
  }else if(CLOUD.pushErr || p>0){
    el.textContent='⚠ '+p+' 笔没送出 — 请截图找管理层';
    el.style.color='#FFD0D0';
  }else if(s9Count()){
    /* v45：撞车不是「送不出去」，是**刻意不送**。混进上面那一条，
       老师会一直按重试，而重试永远没用（v32 那个坑）。 */
    el.textContent='⚠ '+s9Count()+' 笔跟云端撞到了 — 请找管理层';
    el.style.color='#FFD0D0';
  }else{
    el.textContent='✓ 已储存到云端';
    el.style.color='#D8FFE9';
  }
  const _chip=document.getElementById('sync-chip'); if(_chip) _chip.style.color=el.style.color;
  el.title = (CLOUD.pushErr||p>0) ? '资料仍留在这台电脑，没有掉；但还没全部进入云端。请截图找管理层。'
           : (CLOUD.err||(CLOUD.exam?('考试 '+CLOUD.exam.code+' · 已同步'):'尚未连线'));
  const btn=document.getElementById('c-push');
  if(btn) btn.textContent = p?('上传 '+p+' 笔'):'全部已上传';
  authGate();
}

/* ══ BOOT ══ */
loadData();
/* v27：把「这一格的卷清单已经查过了」这个标记清掉，强迫开页后第一次进某格时重新向云端查。
   v26 的问题是：老师昨天「这一格没有卷」的结论会被带到今天，而程式只有在班／科**改变**时
   才重查 —— 同一格再点不重查，於是老师卡死。
   ⚠️ 只清标记，**不清 papers / paperInstance** —— 那两个要留著给离线的老师继续填。
   本机的填写资料完全不受影响。 */
S._papersScope=null; S._enterPage=null;
renderHome();
paintCloud();
window.addEventListener('load',()=>{
  cloudInit(true).then(()=>{ CLOUD.checked=true; authGate(); })
                 .catch(()=>{ CLOUD.checked=true; authGate(); });
});
</script>
